name: Provider terminal maintenance regression
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_target_review/terminal_task_delete_gate.py'
      - 'tools/semantic_target_review/test_terminal_task_delete*.py'
      - 'tools/semantic_target_review/execute_terminal_task_cleanup.py'
      - '.github/workflows/provider-terminal-maintenance.yml'
permissions:
  contents: read
jobs:
  terminal-native:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Closed terminal gate boundaries
        run: python3 -B -m unittest discover -v -s tools/semantic_target_review -p test_terminal_task_delete_gate.py
      - name: Inert approval and filesystem wrapper restoration
        run: python3 -B -m unittest discover -v -s tools/semantic_target_review -p test_terminal_task_cleanup_executor.py
      - name: Reviewed disposable Engine and static offline rootfs
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz --output engine.tgz
          printf '%s\n' 'd8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70  engine.tgz' | sha256sum -c -
          mkdir engine-bin
          tar -xzf engine.tgz --strip-components=1 -C engine-bin
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static
      - name: Actual stopped task deletion with container metadata preserved
        run: sudo env OUF_PLUGIN_ENGINE_DIRECTORY="${{ github.workspace }}/engine-bin" /usr/bin/python3 -B tools/semantic_target_review/test_terminal_task_delete_native.py
