name: Storage host containment preparation
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - scripts/prepare-storage-host-containment-20261106.py
      - tests/test_storage_host_containment_preparation.py
      - .github/workflows/storage-host-containment-preparation.yml
permissions:
  contents: read
concurrency:
  group: storage-host-containment-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify preparation privacy, lineage and no service mutation
        run: python3 -B -m unittest discover -s tests -p 'test_storage_host_containment_preparation.py' -v
