version: 1
blockingStages:
- id: compile-unit
  checks:
  - Java 21 compile
  - unit tests
  - static analysis
- id: contract
  checks:
  - OpenAPI lint
  - JSON Schema validation
  - example validation
  - shared contract compatibility
  - identity scenario-neutral tests
  - current starter baseline guard
- id: db
  checks:
  - Flyway validate
  - migrate from zero
  - upgrade-path test
  when: module uses persistence
- id: integration
  checks:
  - PostgreSQL Testcontainers where applicable
  - Gateway/backend stubs
  - failure-path tests
- id: security
  checks:
  - dependency scan
  - container scan
  - secret scan
  - SAST baseline
  - no hard-coded issuer/JWKS/secret
- id: e2e
  checks:
  - module-owned E2E scenarios
  - cross-module contract assertions
- id: performance
  checks:
  - module capacity profile
  - backpressure/timeout behavior
- id: package
  checks:
  - OCI image
  - Helm render
  - SBOM
  - checksums/provenance
  - helm lint
  - helm template/render
- id: deploy-staging
  checks:
  - approved GitOps/pipeline deployment
  - readiness verified
- id: acceptance
  checks:
  - evidence package complete
  - zero blocker/high unresolved findings
rules:
- A CI engine may rename jobs but MUST NOT drop blocking semantics.
- Shared contracts are validated before integration tests.
- Environment bindings are supplied externally and never replaced with hard-coded
  production values.
- A/B/C IAM scenario is never a build-time application branch.
- Target CI MUST provide Helm and fail the package stage if helm lint/template fails.
