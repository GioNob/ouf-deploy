name: Ingestion owner candidate and installation input preparation
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/prepare-ingestion-read-owner-inputs.py', 'tests/test_ingestion_read_owner_inputs_preparation.py', '.github/workflows/ingestion-read-owner-inputs.yml']
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Candidate integrity, input custody, no runtime effects and one preparation claim
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-ingestion401-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo install -d -m 0700 "$fixture/evidence"
          sudo install -m 0600 evidence/installation-route-reconciliation-target-20261019.json "$fixture/evidence/installation-route-reconciliation-target-20261019.json"
          sudo install -d -m 0700 "$fixture/tests"
          sudo install -m 0600 scripts/prepare-ingestion-read-owner-inputs.py "$fixture/tests/read.py"
          sudo install -m 0600 tests/test_ingestion_read_owner_inputs_preparation.py "$fixture/tests/test_read.py"
          sudo python3 -I -B -S "$fixture/tests/test_read.py" -v
