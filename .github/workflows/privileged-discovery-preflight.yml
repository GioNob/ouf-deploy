name: OUF privileged discovery preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ouf-discovery-release
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 3
    steps:
      - name: Read protected discovery metadata through the fixed root helper
        run: sudo -n /usr/local/sbin/ouf-discovery-preflight
