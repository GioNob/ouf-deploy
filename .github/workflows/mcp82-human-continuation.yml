name: MCP82 distinct HUMAN continuation
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['tools/mcp_read_transport_gateway82_continuation/**', 'scripts/*mcp82-human-continuation.py', 'tests/test_mcp82_human_continuation*.py', '.github/workflows/mcp82-human-continuation.yml']
permissions: {contents: read}
jobs:
  signed-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-source-onboarding
          ref: 84828f74ac586bae09a78f0fb197b75b1a3d98d1
          path: .pairwise/legacy
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-source-onboarding
          ref: be388e1462778438a208c2e00e166370fee32189
          path: .pairwise/revision
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-api-gateway
          ref: f831d80d41b5b9687116671899c538dd7024d478
          path: .pairwise/gateway
          persist-credentials: false
      - name: Actual Java owner role constraints
        run: |
          set -euo pipefail
          mvn -B -q -f tests/fixtures/owner-role-roundtrip/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath -Dmdep.outputFile="$GITHUB_WORKSPACE/.owner-roundtrip.classpath"
          mkdir .owner-roundtrip-classes
          javac -cp "$(cat .owner-roundtrip.classpath)" -d .owner-roundtrip-classes \
            .pairwise/revision/authorization-sdk/src/main/java/it/comune/trieste/ouf/authorization/{AuthorizationPolicy,PrincipalContext,ResourceContext}.java \
            tests/fixtures/owner-role-roundtrip/OwnerConstraintRoundTrip.java
      - name: Real signed authority and durable owner journals in isolated root fixture
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-revision-authorization-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          for suite in test_chatbot_cohort_authorization.py test_chatbot_cohort_authorization_observation.py test_source_revision_authorization.py test_ingestion_read_authorization.py test_ingestion_read_governed_owner.py test_ingestion_read_administrative_authority.py test_ingestion_read_administrative_delivery.py test_ingestion_existing_session_preflight.py test_ingestion_existing_session_action.py test_ingestion_publication_repair.py test_mcp_ingestion_read_transport_update.py test_mcp_transport_reauthentication.py test_frozen_human_schema_compatibility.py test_existing_human_window_compatibility.py test_ingestion_read_gateway_update.py test_ingestion_read_gateway_preparation.py test_ingestion_read_gateway_custody_update.py test_ingestion_read_gateway_custody_preparation.py test_mcp_read_transport_gateway82.py test_mcp_read_transport_gateway82_preparation.py test_mcp82_human_continuation.py test_mcp82_human_continuation_preparation.py; do
            sudo env OUF_NATIVE_UIDS=1 OUF_TEST_ROOT="$fixture" \
              OUF_CHATBOT_ONBOARDING_ROOT="$fixture/repository/.pairwise/legacy" \
              OUF_REVISION_ONBOARDING_ROOT="$fixture/repository/.pairwise/revision" \
              OUF_INGESTION_GATEWAY_ROOT="$fixture/repository/.pairwise/gateway" \
              OUF_OWNER_JAVA_CLASSPATH="$fixture/repository/.owner-roundtrip-classes:$(cat .owner-roundtrip.classpath)" \
              python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p "$suite" -v
          done