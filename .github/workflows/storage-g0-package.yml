name: Storage single G0 operator package
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - tools/storage_planning/g0_package.py
      - tools/storage_planning/g0_host.py
      - scripts/package-storage-g0.py
      - tests/test_storage_g0_package.py
      - releases/storage-g0-package-profile-20261105.json
      - docs/OUF_STORAGE_G0_OPERATOR_PACKAGE_20261105.md
      - .github/workflows/storage-g0-package.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: storage-g0-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build exact component package and qualify the new composition
        run: python3 -I -B -S scripts/package-storage-g0.py build "$RUNNER_TEMP/g0-package"
      - name: Prepare empty suppression file
        run: touch empty.trivyignore-g0-package
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: rootfs
          scan-ref: ${{ runner.temp }}/g0-package/package/bin
          format: json
          output: ${{ runner.temp }}/g0-package/evidence/trivy.json
          list-all-pkgs: true
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: empty.trivyignore-g0-package
          exit-code: 0
      - name: Observe a disposable stopped container without starting a provider
        run: python3 -I -B -S scripts/package-storage-g0.py native "$RUNNER_TEMP/g0-package"
      - name: Seal exact operator package and evidence
        if: always()
        run: python3 -I -B -S scripts/package-storage-g0.py seal "$RUNNER_TEMP/g0-package"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        if: success()
        with:
          subject-path: ${{ runner.temp }}/g0-package/evidence/operator-package.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-g0-package-${{ github.run_id }}
          path: ${{ runner.temp }}/g0-package/evidence/
          retention-days: 90
          if-no-files-found: error
