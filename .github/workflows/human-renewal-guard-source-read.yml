name: Frozen HUMAN renewal public guard source read
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/read-human-renewal-guard-source.py', 'tests/test_human_renewal_guard_source_read.py', '.github/workflows/human-renewal-guard-source-read.yml']
permissions: {contents: read}
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -B -m unittest discover -s tests -p test_human_renewal_guard_source_read.py -v
