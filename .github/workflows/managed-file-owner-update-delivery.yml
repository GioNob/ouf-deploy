name: Protected single-Onboarding36to38 maintenance delivery
on:
  push:
    paths: ['tools/build_managed_file_owner_update_delivery.py','releases/apply-managed-file-owner-v38-20261028.sh','releases/managed-file-owner-v38-update-delivery-pins-20261028.json','tests/qualify_managed_file_owner_update_delivery.py','.github/workflows/managed-file-owner-update-delivery.yml']
  pull_request:
    paths: ['tools/build_managed_file_owner_update_delivery.py','releases/apply-managed-file-owner-v38-20261028.sh','releases/managed-file-owner-v38-update-delivery-pins-20261028.json','tests/qualify_managed_file_owner_update_delivery.py','.github/workflows/managed-file-owner-update-delivery.yml']
permissions: {contents: read}
jobs:
  exact-protected-main-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Reproduce immutable source closure,checksum and delivery without effects
        run: |
          python3 -I -S -B tools/build_managed_file_owner_update_delivery.py
          git diff --exit-code -- releases/apply-managed-file-owner-v38-20261028.sh releases/managed-file-owner-v38-update-delivery-pins-20261028.json
      - run: bash -n releases/apply-managed-file-owner-v38-20261028.sh
      - run: sudo /usr/bin/python3 -I -S -B tests/qualify_managed_file_owner_update_delivery.py
