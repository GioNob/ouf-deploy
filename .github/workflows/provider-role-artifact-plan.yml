name: Provider role artifact plan
on:
  push:
    branches: [main]
    paths:
      - 'scripts/provider-role-artifact-plan.py'
      - '.github/workflows/provider-role-artifact-plan.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, ouf-vps-test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read exact existing archives without Docker import or lifecycle operation
        run: /usr/bin/python3 -I -B scripts/provider-role-artifact-plan.py
