name: V11 ambiguous import Engine read only
on:
  push:
    branches: [main]
    paths:
      - scripts/read-v11-image-import-engine.py
      - .github/workflows/v11-image-import-engine-read.yml
permissions:
  contents: read
concurrency:
  group: ouf-v11-image-engine-read
  cancel-in-progress: false
jobs:
  read:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -B scripts/read-v11-image-import-engine.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-image-engine-read-${{ github.run_id }}
          path: v11-image-engine-read.json
          if-no-files-found: error
          retention-days: 30
