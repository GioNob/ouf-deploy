# Qualificazione storica (2026-10-22): solo manuale, D-055
name: Stage8 exact production delivery reproduction
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  exact-production-caches:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Reproduce every pinned production case capsule and cached launcher
        run: python3 -I -B -S -m unittest discover -s tests -p test_readiness_patch_stage8_governance.py -k every_exact -v
