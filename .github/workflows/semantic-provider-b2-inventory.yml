name: Semantic provider B2 inventory
on:
  pull_request:
    paths:
      - scripts/read-semantic-provider-b2-inputs.py
      - tests/test_semantic_provider_b2_inventory.py
      - ops/vps/b2-read.sh
      - .github/workflows/semantic-provider-b2-inventory.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  b2-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Reader fixture, sentinel and runbook pin
        run: /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_provider_b2_inventory.py -v
      - name: Runbook syntax and ShellCheck
        run: |
          bash -n ops/vps/b2-read.sh
          shellcheck -S warning ops/vps/b2-read.sh
