name: Governed module installation
on:
  workflow_dispatch:
    inputs:
      module:
        description: Modulo con sezione install nel profilo privato
        required: true
        type: string
      resume_plan:
        description: Digest originale per riprendere una creazione interrotta
        type: string
      return_plan:
        description: Digest originale per isolare il CID installato
        type: string
permissions: {}
concurrency:
  group: ouf-vps-privileged-operations
  cancel-in-progress: false
env:
  MODULE: ${{ inputs.module }}
  RESUME_PLAN: ${{ inputs.resume_plan }}
  RETURN_PLAN: ${{ inputs.return_plan }}
jobs:
  intent:
    if: github.ref_protected && github.run_attempt == '1' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.intent.outputs.digest }}
    steps:
      - id: intent
        run: |
          /usr/bin/python3 -I - <<'PY'
          import hashlib, json, os, re
          e = os.environ
          module, resume, rollback = (e[k] for k in ("MODULE", "RESUME_PLAN", "RETURN_PLAN"))
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,100}", module):
              raise SystemExit("INVALID_MODULE")
          if (resume and rollback) or any(not re.fullmatch("[0-9a-f]{64}", v) for v in (resume, rollback) if v):
              raise SystemExit("INVALID_PLAN")
          scope = dict(run=e["GITHUB_RUN_ID"], attempt=e["GITHUB_RUN_ATTEMPT"], commit=e["GITHUB_SHA"],
                       operation="module-install", schema="ouf.module-install.v1", module=module)
          if resume:
              scope["resumePlan"] = resume
          stamp = rollback or hashlib.sha256(json.dumps(scope, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          if rollback:
              review = f"Isolare il CID del modulo {module} associato al piano {stamp}. Lo store in bind resta conservato."
              print("::notice title=Da approvare: rollback::" + review)
              with open(e["GITHUB_STEP_SUMMARY"], "a") as out:
                  print(review, file=out)
          with open(e["GITHUB_OUTPUT"], "a") as out:
              print("digest=" + stamp, file=out)
          PY
  plan:
    if: inputs.return_plan == ''
    needs: intent
    name: plan ${{ needs.intent.outputs.digest }}
    runs-on: &vps [self-hosted, Linux, X64, ouf-vps-test]
    permissions: &permissions {contents: read, actions: read, deployments: read}
    timeout-minutes: 40
    env:
      PHASE: plan
      DIGEST: ${{ needs.intent.outputs.digest }}
    outputs:
      digest: ${{ steps.call.outputs.digest }}
    steps:
      - &client
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - &invoke
        id: call
        env:
          REVIEW_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import json, os, re, subprocess, sys
          sys.path.insert(0, ".github/scripts")
          from release_review import approval
          e = os.environ
          req = dict(run=e["GITHUB_RUN_ID"], attempt=e["GITHUB_RUN_ATTEMPT"], commit=e["GITHUB_SHA"],
                     operation="module-install", schema="ouf.module-install.v1", module=e["MODULE"],
                     phase=e["PHASE"], digest=e["DIGEST"])
          if e["RESUME_PLAN"]:
              req["resumePlan"] = e["RESUME_PLAN"]
          wire = json.dumps({"request": req, "token": e.pop("REVIEW_TOKEN")}).encode()
          out = subprocess.run(["/usr/bin/sudo", "-n", "--", "/usr/local/sbin/ouf-a2"],
                               input=wire, stdout=subprocess.PIPE, check=True)
          result = json.loads(out.stdout)
          stamp = result["digest"]
          expected = {"plan": "PLANNED", "apply": "READY", "rollback": "ROLLED_BACK"}
          if not re.fullmatch("[0-9a-f]{64}", stamp) or expected[req["phase"]] != result["status"]:
              raise SystemExit("INVALID_EXECUTOR_RESPONSE")
          with open(e["GITHUB_STEP_SUMMARY"], "a") as summary:
              if req["phase"] == "plan":
                  facts = [f"{k} = {json.dumps(v, ensure_ascii=True)}" for k, v in result["installReview"].items()]
                  approval(summary, "apply", stamp, facts)
              else:
                  print(json.dumps(result["receipt"]), file=summary)
          with open(e["GITHUB_OUTPUT"], "a") as out:
              print("digest=" + stamp, file=out)
          PY
  apply:
    needs: plan
    name: apply ${{ needs.plan.outputs.digest }}
    runs-on: *vps
    permissions: *permissions
    environment: ouf-vps-privileged
    timeout-minutes: 40
    env:
      PHASE: apply
      DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - *client
      - *invoke
  rollback:
    if: inputs.return_plan != ''
    needs: intent
    name: rollback ${{ needs.intent.outputs.digest }}
    runs-on: *vps
    permissions: *permissions
    environment: ouf-vps-privileged
    timeout-minutes: 40
    env:
      PHASE: rollback
      DIGEST: ${{ needs.intent.outputs.digest }}
    steps:
      - *client
      - *invoke
