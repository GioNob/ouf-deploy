name: Semantic provider preparation A2 (simulated Docker)
on:
  pull_request:
    paths:
      - scripts/prepare-semantic-provider-a2-20261113.py
      - scripts/deliver-semantic-provider-a2-20261113.sh
      - scripts/cutover-semantic-provider-20261111.py
      - scripts/upgrade-semantic-application-20261108.py
      - scripts/recreate-southbound-successor-20261113.py
      - scripts/prepare-semantic-provider-installation.py
      - tests/test_semantic_provider_a2.py
      - .github/workflows/semantic-provider-a2.yml
      - docs/OUF_SEMANTIC_PROVIDER_A2_20261113.md
permissions: {contents: read}
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Synthetic lineage and compatibility with unmodified P
        run: sudo -n "$(command -v python3)" -I -B -m unittest discover -s tests -p test_semantic_provider_a2.py -v
      - name: Launcher syntax
        run: bash -n scripts/deliver-semantic-provider-a2-20261113.sh
