name: MCP ingestion route stop read
on:
  push:
    paths:
      - 'scripts/read-mcp-ingestion-route-stop.py'
      - 'tests/test_mcp_ingestion_route_stop_read.py'
      - '.github/workflows/mcp-ingestion-route-stop-read.yml'
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s tests -p test_mcp_ingestion_route_stop_read.py -v
