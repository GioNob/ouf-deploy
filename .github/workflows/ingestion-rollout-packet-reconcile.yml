name: Ingestion retained rollout packet reconciliation qualification
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/reconcile-ingestion-rollout-packet-20261020.py', 'scripts/launch-ingestion-rollout-packet-reconcile-20261020.sh', 'tests/test_ingestion_rollout_packet_reconcile*.py', '.github/workflows/ingestion-rollout-packet-reconcile.yml']
permissions: {contents: read, actions: read}
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Authenticate original artifact for disposable retained-file fixture only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/GioNob/ouf-deploy/actions/artifacts/12245228551/zip > "$RUNNER_TEMP/ouf-candidate.zip"
          printf '%s  %s\n' '02974a024e66d2f3adb9933f654954868598f6dfcec8899bf76daced9a1aeb02' "$RUNNER_TEMP/ouf-candidate.zip" | sha256sum -c -
      - name: Exact root and historical reader metadata, no-clobber and STOP preservation
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-packet-reconcile-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env OUF_TEST_ROOT="$fixture" python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_ingestion_rollout_packet_reconcile.py -v
          sudo env OUF_TEST_ROOT="$fixture" OUF_CANDIDATE_ZIP="$RUNNER_TEMP/ouf-candidate.zip" python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_ingestion_rollout_packet_reconcile_native.py -v
