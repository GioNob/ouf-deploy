name: Custody source revision IAM reconciliation and resume qualification
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/*source-revision-custody-iam*', 'tests/test_source_revision_custody_iam.py', '.github/workflows/source-revision-custody-iam.yml']
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact retained files, one IAM login, native handoff and root custody
        run: |
          set -euo pipefail
          fixture="/root/ouf-human-history-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo env OUF_TEST_ROOT="$fixture" python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p 'test_source_revision_custody_iam.py' -v
