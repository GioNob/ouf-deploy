name: Existing HUMAN child STOP read qualification
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/read-ingestion-existing-session-stop.py', 'tests/test_ingestion_existing_session_stop_read.py', '.github/workflows/ingestion-existing-session-stop-read.yml']
permissions: {contents: read}
jobs:
  readonly-child-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact bootstrap prefix and independent denial of side effects
        run: |
          set -euo pipefail
          fixture="/root/ouf-ingestion-child-stop-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env OUF_TEST_ROOT="$fixture" python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p 'test_ingestion_existing_session_stop_read.py' -v
