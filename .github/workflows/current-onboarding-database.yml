name: Current Onboarding owner database snapshot
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths:
      - scripts/read-current-onboarding-database-20261024.py
      - tools/ingestion_readiness_patch_execution/tests/test_current_onboarding_database.py
      - .github/workflows/current-onboarding-database.yml
  pull_request:
    paths:
      - scripts/read-current-onboarding-database-20261024.py
      - tools/ingestion_readiness_patch_execution/tests/test_current_onboarding_database.py
      - .github/workflows/current-onboarding-database.yml
permissions:
  contents: read
concurrency:
  group: current-onboarding-database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  protected-native-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Root-custodied disposable fixtures
        run: |
          sudo install -d -m 0700 /root/ouf-current-database-tests
          sudo cp -a . /root/ouf-current-database-tests/repository
          sudo chown -R root:root /root/ouf-current-database-tests
      - name: Current owner history and real PostgreSQL17 read-only snapshot
        run: |
          sudo env OUF_NATIVE_ONBOARDING_DATABASE=1 /usr/bin/python3 -I -B -S -m unittest discover \
            -s /root/ouf-current-database-tests/repository/tools/ingestion_readiness_patch_execution/tests \
            -p 'test_current_onboarding_database.py' -v
