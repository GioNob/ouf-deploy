name: Resolution owner policy metadata readonly qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['scripts/read-resolution-owner-policy-metadata-20261017.py', 'tests/resolution_owner_policy_read/**', '.github/workflows/resolution-owner-policy-read.yml']
permissions: {contents: read}
jobs:
  readonly-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Actual PostgreSQL17 read-only metadata transaction
        run: OUF_NATIVE_SQL=1 python3 -I -B -m unittest discover -s tests/resolution_owner_policy_read -v
