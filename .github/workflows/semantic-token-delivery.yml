# Qualificazione storica (2026-10-16): solo manuale, D-055
name: Sealed semantic token session delivery
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Root-owned disposable launcher qualification
        run: |
          set -euo pipefail
          OUF_DELIVERY_ROOT="/var/lib/ouf-token-delivery-${GITHUB_RUN_ID}"
          sudo mkdir -m 700 "$OUF_DELIVERY_ROOT"
          sudo cp -R . "$OUF_DELIVERY_ROOT/repository"
          sudo chown -R root:root "$OUF_DELIVERY_ROOT"
          for suite in test_semantic_token_launcher.py test_semantic_token_interruption_reader.py; do
            sudo env OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$OUF_DELIVERY_ROOT/repository/tests" -p "$suite" -v
          done
