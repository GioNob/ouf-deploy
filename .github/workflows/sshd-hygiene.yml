name: SSHD hygiene qualification
on:
  push:
    paths:
      - 'scripts/apply-sshd-hygiene-20261115.py'
      - 'tests/test_sshd_hygiene_20261115.py'
      - '.github/workflows/sshd-hygiene.yml'
  pull_request:
    paths:
      - 'scripts/apply-sshd-hygiene-20261115.py'
      - 'tests/test_sshd_hygiene_20261115.py'
      - '.github/workflows/sshd-hygiene.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Portable tests
        run: python3 -B -m unittest discover -s tests -p test_sshd_hygiene_20261115.py -v
      - name: Install real sshd when missing
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi
          sudo install -d -m 0755 /run/sshd
      - name: Native isolated fixture roundtrip (no daemon operations)
        run: sudo env OUF_SSHD_HYGIENE_NATIVE=1 /usr/bin/python3 -B -m unittest discover -s tests -p test_sshd_hygiene_20261115.py -v
