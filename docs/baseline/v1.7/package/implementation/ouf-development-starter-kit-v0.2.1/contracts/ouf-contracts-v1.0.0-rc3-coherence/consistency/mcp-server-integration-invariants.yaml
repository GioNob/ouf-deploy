version: '0.10'
status: mcp-integration-check
scope: Compatibility of OUF Common Technical Contracts v0.9 with MCP Server v1.1;
  check only, no MCP Server modification.
mcpBaseline: OUF MCP Server v1.1
repositoryBaseline: ouf-contracts v0.9
invariants:
- id: MCP-X01
  area: Gateway mediation
  rule: Every external MCP call enters through Urban API Gateway and every OUF capability
    execution returns through a governed Gateway binding; MCP never constructs backend
    URLs.
- id: MCP-X02
  area: Capability identity
  rule: MCP capabilityId must equal the canonical owner capabilityId; aliases are
    exceptional, versioned and contract-tested.
- id: MCP-X03
  area: Manifest projection
  rule: Gateway/common capability metadata and MCP canonical descriptor are separate
    projections of the same capability and must be deterministically cross-checkable.
- id: MCP-X04
  area: Tool eligibility
  rule: toolEligible=false prevents registration/exposure; toolEligible=true does
    not grant authorization.
- id: MCP-X05
  area: Actor boundary
  rule: actorType is trusted identity context; HUMAN_REQUIRED cannot be satisfied
    by AI_AGENT, MCP_SERVER or SERVICE_IDENTITY.
- id: MCP-X06
  area: Authorization
  rule: tools/list visibility is not authorization; every tools/call is server-side
    authorized and backend owner applies fine-grained authorization.
- id: MCP-X07
  area: Policy evidence
  rule: policyVersion/authorization context propagated through Gateway remains audit
    metadata; backend authorization remains authoritative.
- id: MCP-X08
  area: Errors
  rule: Gateway/backend ProblemDetails, Retry-After, capability mismatch and budget
    errors are preserved without semantic redirect.
- id: MCP-X09
  area: Query governance
  rule: MCP orchestration budget is distinct from UDP Query Complexity Governor; a
    Gateway/MCP allow does not imply workload admissibility.
- id: MCP-X10
  area: Durable ACK
  rule: MCP and Gateway do not synthesize or reinterpret Ingestion Durable ACK/watermark
    semantics.
- id: MCP-X11
  area: Semantic pinning
  rule: MCP resolves exact SemanticReference/PublicationSet and never invents fallback
    semantics for stale/unresolvable references.
- id: MCP-X12
  area: Semantic authority
  rule: MCP descriptors may carry semantic hints/references but do not duplicate TBox/domain/range
    as a second authority.
- id: MCP-X13
  area: Trusted human boundary
  rule: MCP may create/link ApprovalChallenge and return opaque trustedApprovalRef,
    but confirm/approve/activate/publish never passes via tools/call.
- id: MCP-X14
  area: Protected operations
  rule: Protected Human Operations/log data are absent from MCP tools/resources/prompts/remediation/results
    and have no MCP/Gateway tool binding.
- id: MCP-X15
  area: Principal protection
  rule: MCP does not persist privileged human tokens; delegatedVia/trustedApprovalRef
    does not transfer HUMAN_USER authority.
- id: MCP-X16
  area: Source access
  rule: MCP never performs direct southbound fetch to vertical/provider endpoints;
    such access uses governed Gateway/owner capabilities.
- id: MCP-X17
  area: Historical behavior
  rule: Historical explanation/replay preserves exact bundle/schema/semantic version
    references and never substitutes current ACTIVE implicitly.
- id: MCP-X18
  area: Scope control
  rule: No agent/model runtime, analytics engine, graph DB, vector DB, broker or direct
    DB access is introduced by contract alignment.
descriptorProjection:
  note: MCP Server v1.1 freezes a richer MCP-specific Canonical Capability Manifest
    than the Gateway common CapabilityManifest. This is not a semantic contradiction,
    but the repository does not yet contain the machine-readable MCP descriptor schema.
  mappings:
  - gateway: CapabilityManifest.capabilityId
    mcp: capabilityId
    rule: EXACT
  - gateway: CapabilityManifest.version
    mcp: capabilityVersion
    rule: EXACT
  - gateway: CapabilityManifest.owner
    mcp: owner
    rule: NORMALIZED_EXACT
  - gateway: CapabilityManifest.operationType
    mcp: operationClass
    rule: NORMALIZED_ENUM
  - gateway: CapabilityManifest.mcp.toolEligible
    mcp: toolEligible
    rule: EXACT
  - gateway: CapabilityManifest.authorization.backendCapabilityId OR capabilityId
    mcp: requiredAuthorizationCapability
    rule: EXACT_RESOLUTION
  - gateway: CapabilityManifest.input.schemaRef
    mcp: inputSchemaRef
    rule: SAME_CONTRACT
  - gateway: CapabilityManifest.output.schemaRef
    mcp: outputSchemaRef
    rule: SAME_CONTRACT
  - gateway: RouteBinding/capability binding
    mcp: gatewayBindingRef
    rule: GOVERNED_LOGICAL_REF
  - gateway: CapabilityManifest.mcp purpose/useWhen/doNotUseWhen/preferredAlternatives
    mcp: descriptor cognitive metadata
    rule: SAME_MEANING_WHEN_PRESENT
  mcpOnlyFields:
  - toolName
  - mcpClass
  - publicationState
  - actorTypes
  - baseCostEnvelope
  - conditionalOutcomeCost
explicitlyExcluded:
- Modification of OUF MCP Server v1.1
- Creation of a new MCP runtime or agent host
- MCP protocol redesign
- THS Protected Operations contracts
- Supplier vertical API contracts
- Query Governor implementation
- Analytics engine
