{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
  {{- range .Values.networkPolicy.allowedIngress }}
    - from:
        - namespaceSelector:
            matchLabels:
{{ toYaml .namespaceSelector.matchLabels | indent 14 }}
      ports:
      {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
      {{- end }}
  {{- end }}
  egress:
  {{- range .Values.networkPolicy.allowedEgress }}
    - to:
        - namespaceSelector:
            matchLabels:
{{ toYaml .namespaceSelector.matchLabels | indent 14 }}
      ports:
      {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
      {{- end }}
  {{- end }}
{{- end }}
