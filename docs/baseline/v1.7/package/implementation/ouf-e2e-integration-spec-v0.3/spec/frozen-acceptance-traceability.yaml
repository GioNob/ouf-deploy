rules:
- OUF-E2E-001..016 are the executable scenario definitions for frozen XMA E2E-X01..X16.
- MCP-A01..A55 and THS-A01..A12 remain mandatory supplemental module acceptance suites;
  OUF-E2E scenarios do not erase their individual criteria.
- Every PASS requires scenario-specific evidence, not a generic result record.
