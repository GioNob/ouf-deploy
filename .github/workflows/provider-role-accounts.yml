name: Provider role account binding
on:
  push:
    paths:
      - 'scripts/provider-role-accounts.py'
      - 'scripts/test-provider-role-accounts.py'
      - '.github/workflows/provider-role-accounts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -I -B scripts/test-provider-role-accounts.py
  inspect:
    needs: validate
    runs-on: [self-hosted, linux, x64, ouf-vps-test]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: /usr/bin/python3 -I -B scripts/provider-role-accounts.py
