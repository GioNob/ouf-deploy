name: MCP Ingestion503 immutable DNS diagnostic delivery
on:
  push:
    paths:
      - 'scripts/launch-mcp-ingestion503-dns-read-20261019.sh'
      - 'tests/test_mcp_ingestion503_dns_delivery.py'
      - '.github/workflows/mcp-ingestion503-dns-delivery.yml'
permissions: {contents: read}
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: bash -n scripts/launch-mcp-ingestion503-dns-read-20261019.sh
      - run: python3 -m unittest discover -s tests -p test_mcp_ingestion503_dns_delivery.py -v
