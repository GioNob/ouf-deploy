name: M2 original retained semantic source and exact MinIO descriptor
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths: ['scripts/preserve-m2-retained-semantic-origin-20261101.py','scripts/read-m2-retained-minio-selected-20261101.py','.github/workflows/m2-retained-semantic-origin.yml']
permissions: {contents: read, actions: read}
jobs:
  original-semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Download the exact original complete archive using existing CI identity
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 300s gh api repos/GioNob/ouf-deploy/actions/artifacts/11907557440/zip > original.zip
          fixture="/var/lib/ouf-retained-semantic-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture/repository"
          sudo cp -a scripts tools evidence "$fixture/repository/"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo python3 -I -B -S "$fixture/repository/scripts/preserve-m2-retained-semantic-origin-20261101.py" "$GITHUB_WORKSPACE/original.zip" "$fixture/output"
          sudo cp -a "$fixture/output/preserved" preserved
          sudo chown -R "$(id -u):$(id -g)" preserved
      - uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        with: {cosign-release: v3.1.3}
      - name: Verify original publisher against unchanged signed checksum subject
        run: |
          set -euo pipefail
          cosign verify-blob preserved/origin/COHORT_SHA256SUMS \
            --bundle preserved/origin/COHORT_SHA256SUMS.sigstore.json \
            --certificate-identity 'https://github.com/GioNob/ouf-deploy/.github/workflows/semantic-proposal-candidate-package.yml@refs/heads/codex/complete-file-cohort-package-20261014' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository GioNob/ouf-deploy \
            --certificate-github-workflow-sha 8bff54a52a0ce15daccaf2aee932004f106dd178 \
            > preserved/original-publisher-verification.stdout.txt 2> preserved/original-publisher-verification.stderr.txt
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          p=Path('preserved/semantic-origin-match.json');d=json.loads(p.read_text())
          d['originalSignatureVerified']=True
          d['signatureVerificationScope']='ORIGINAL_WHOLE_COHORT_CHECKSUM_SUBJECT_AND_EXACT_PUBLISHER_WORKFLOW_SOURCE'
          p.write_text(json.dumps(d,sort_keys=True,indent=2)+'\n')
          print(json.dumps({k:d[k] for k in ('moduleSourceCommit','configurationDigest','configurationAndRootfsContentIdentityMatchesRetained','retainedNativeDigestDocumentPresent','originalSignatureVerified','runtimeAuthorityIssued')}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-retained-semantic-original-${{ github.run_id }}
          path: preserved/
          if-no-files-found: error
          retention-days: 30
  original-minio-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -I -B -S scripts/read-m2-retained-minio-selected-20261101.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-retained-minio-selected-${{ github.run_id }}
          path: minio-selected-descriptor/
          if-no-files-found: error
          retention-days: 30
