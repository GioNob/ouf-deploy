name: Offline retained HUMAN timing reconciliation
on:
  pull_request:
    paths:
      - 'tools/ingestion_rollout_preparation/human_timing.py'
      - 'tools/ingestion_rollout_preparation/timing_delivery.py'
      - 'tests/test_ingestion_human_timing.py'
      - 'releases/ingestion-human-timing-case-20261020.json'
      - 'scripts/ingestion-human-timing-inspection-20261020.py'
      - 'scripts/launch-ingestion-human-timing-20261020.sh'
      - '.github/workflows/ingestion-human-timing.yml'
permissions: {contents: read}
jobs:
  retained-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Retained root custody, expired history and isolated delivery
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-human-timing-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env GITHUB_ACTIONS=true OUF_NATIVE_UIDS=1 OUF_TEST_ROOT="$fixture" "$pythonLocation/bin/python3" -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_ingestion_human_timing.py -v
