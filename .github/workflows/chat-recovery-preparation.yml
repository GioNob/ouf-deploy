name: Qualify private recovery preparation
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/prepare-chat-recovery-inputs-20261018.py', 'tests/test_chat_recovery_preparation.py', '.github/workflows/chat-recovery-preparation.yml']
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Qualify migration gates and private custody
        run: sudo /usr/bin/python3 -I -S -B tests/test_chat_recovery_preparation.py
