name: MCP analysis startup preflight reader
on:
  pull_request:
    paths:
      - scripts/read-mcp-analysis-preflight-20261108.py
      - tests/test_mcp_analysis_preflight.py
      - .github/workflows/mcp-analysis-preflight.yml
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: synthetic-ci, POSTGRES_DB: fixture}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d fixture" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OUF_NATIVE_PREFLIGHT: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci
      PGDATABASE: fixture
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s tests -p test_mcp_analysis_preflight.py -v
      - run: python3 -m unittest discover -s tests -p test_discovery_contract_read.py -v
