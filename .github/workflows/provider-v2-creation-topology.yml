name: Provider v2 creation topology
on:
  push:
    branches: [main]
    paths:
      - 'scripts/provider-v2-creation-topology.py'
      - '.github/workflows/provider-v2-creation-topology.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, ouf-vps-test]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read stopped legacy role and selected network metadata only
        run: /usr/bin/python3 -I -B scripts/provider-v2-creation-topology.py
