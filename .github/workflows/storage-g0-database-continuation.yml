name: Storage G0 database draft continuation
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - scripts/continue-storage-g0-databases-20261106.py
      - tests/test_storage_g0_database_continuation.py
      - .github/workflows/storage-g0-database-continuation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-g0-database-continuation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify original validators and private draft continuation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/db-continuation"
          sudo -n env GITHUB_ACTIONS=true python3 -B -m unittest discover -s tests -p test_storage_g0_database_continuation.py -v 2>&1 | tee "$RUNNER_TEMP/db-continuation/tests.log"
          sha256sum scripts/continue-storage-g0-databases-20261106.py scripts/review-storage-g0-datasource-20261106.py tools/chatbot_file_cohort/preparation.py tests/test_storage_g0_database_continuation.py > "$RUNNER_TEMP/db-continuation/sources.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-g0-db-continuation-${{ github.run_id }}
          path: ${{ runner.temp }}/db-continuation/
          retention-days: 90
          if-no-files-found: error
