name: Existing descriptor draft exact native lookup
on:
  push:
    paths:
      - scripts/lookup-existing-descriptor-draft-20261025.py
      - releases/lookup-existing-descriptor-draft-20261025.sh
      - tests/test_existing_descriptor_draft_lookup.py
      - tests/qualify_existing_descriptor_lookup_native.py
      - tests/fixtures/onboarding-V*-*.sql
      - .github/workflows/existing-descriptor-draft-lookup.yml
  pull_request:
    paths:
      - scripts/lookup-existing-descriptor-draft-20261025.py
      - releases/lookup-existing-descriptor-draft-20261025.sh
      - tests/test_existing_descriptor_draft_lookup.py
      - tests/qualify_existing_descriptor_lookup_native.py
      - tests/fixtures/onboarding-V*-*.sql
      - .github/workflows/existing-descriptor-draft-lookup.yml
permissions: {contents: read}
jobs:
  native-readonly-existing-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: bash -n releases/lookup-existing-descriptor-draft-20261025.sh
      - run: sudo mkdir -m 0700 /var/lib/ouf-draft-lookup-ci
      - run: sudo env LOOKUP_TEST_ROOT=/var/lib/ouf-draft-lookup-ci /usr/bin/python3 -I -S -B -m unittest discover -s tests -p test_existing_descriptor_draft_lookup.py -v
      - run: sudo env LOOKUP_TEST_ROOT=/var/lib/ouf-draft-lookup-ci /usr/bin/python3 -I -S -B tests/qualify_existing_descriptor_lookup_native.py
