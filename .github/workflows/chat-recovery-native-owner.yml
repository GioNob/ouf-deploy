name: Chat recovery native owner qualification
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['tools/chat_recovery_update/**', 'tests/test_chat_recovery_*.py', '.github/workflows/chat-recovery-native-owner.yml']
permissions: {contents: read}
jobs:
  native-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Isolated root fixtures and existing dual-role signatures
        run: |
          sudo install -d -m 0700 /root/ouf-chat-recovery-tests
          sudo cp -a . /root/ouf-chat-recovery-tests/repo
          sudo chown -R root:root /root/ouf-chat-recovery-tests
          sudo chmod -R go-w /root/ouf-chat-recovery-tests
          sudo sh -c 'cd /root/ouf-chat-recovery-tests/repo && OUF_NATIVE_UIDS=1 OUF_TEST_ROOT=/root/ouf-chat-recovery-tests python3 -B -m unittest discover -s tests -p "test_chat_recovery_*.py" -v'
