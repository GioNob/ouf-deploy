name: M2 unselected original runtime OS repair candidates
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths: ['scripts/prepare-m2-runtime-os-repair.py','releases/m2-original-runtime-os-repair-case-20261101.json','tests/test_m2_runtime_os_repair.py','.github/workflows/m2-runtime-os-repair.yml']
permissions: {contents: read, actions: read}
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {role: [ingestion, udp]}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Reject unrelated package changes and invalid overlay or package databases
        run: python3 -I -B -S -m unittest discover -s tests -p test_m2_runtime_os_repair.py -v
      - name: Stage the exact existing image without a source or application rebuild
        env: {GH_TOKEN: '${{ github.token }}', OUF_ORIGIN_ROLE: '${{ matrix.role }}'}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json,os,resource,subprocess
          case=json.load(open('releases/m2-current-core-artifact-origins-20261101.json'))['roles'][os.environ['OUF_ORIGIN_ROLE']]
          def bounded_zip(): resource.setrlimit(resource.RLIMIT_FSIZE,(case['zipBytes'],case['zipBytes']))
          with open('original.zip','wb') as destination:
              subprocess.run(['gh','api','repos/'+case['repository']+'/actions/artifacts/'+str(case['artifactId'])+'/zip'],
                  stdout=destination,check=True,timeout=300,preexec_fn=bounded_zip)
          PYCODE
          python3 -I -B -S scripts/stage-m2-current-core-origin.py '${{ matrix.role }}' original.zip prepared
      - name: Use official Docker 29.8.1 in an isolated disposable data root
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz -o /tmp/ouf-docker-29.8.1.tgz
          printf '%s  %s\n' d8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70 /tmp/ouf-docker-29.8.1.tgz | sha256sum --check --strict
          sudo install -d -m 755 /opt/ouf-docker-29
          sudo tar -xzf /tmp/ouf-docker-29.8.1.tgz --strip-components=1 -C /opt/ouf-docker-29
          sudo chown -R root:root /opt/ouf-docker-29
          /opt/ouf-docker-29/dockerd --version
          sudo systemctl stop docker.service docker.socket
          sudo systemctl start containerd.service
          sudo install -d -m 700 /var/lib/ouf-docker-29
          printf '%s\n' '{"features":{"containerd-snapshotter":true},"exec-opts":["native.cgroupdriver=systemd"]}' > /tmp/ouf-docker-29.json
          sudo systemd-run --unit=ouf-docker-contract-daemon --property=Restart=no \
            --setenv=PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            /opt/ouf-docker-29/dockerd --config-file=/tmp/ouf-docker-29.json \
            --host=unix:///var/run/docker.sock --data-root=/var/lib/ouf-docker-29 \
            --exec-root=/run/docker --pidfile=/run/ouf-docker-29.pid \
            --containerd=/run/containerd/containerd.sock
          for OUF_DOCKER_POLL in $(seq 1 60); do
            if sudo docker info > /tmp/ouf-docker-29-info.txt 2>/dev/null; then break; fi
            sleep 1
          done
          test "$(sudo docker version --format '{{.Server.Version}}')" = 29.8.1
          test "$(sudo docker info --format '{{.Driver}}')" = overlayfs
          test "$(sudo docker info --format '{{.CgroupDriver}}')" = systemd
      - name: Build an isolated candidate with only the three signed pinned APK updates
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-runtime-repair-${GITHUB_RUN_ID}-${{ matrix.role }}"
          sudo install -d -m 0700 "$fixture/repository"
          sudo cp -a scripts tools releases "$fixture/repository/"
          sudo cp -a prepared "$fixture/original"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env GITHUB_ACTIONS=true PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            python3 -I -B -S "$fixture/repository/scripts/prepare-m2-runtime-os-repair.py" '${{ matrix.role }}' \
            "$fixture/original" "$fixture/candidate"
          mkdir candidate
          sudo cp "$fixture/candidate/image.docker.tar" "$fixture/candidate/repair-candidate.json" \
            "$fixture/candidate/build/Dockerfile" candidate/
          cp releases/m2-original-runtime-os-repair-case-20261101.json candidate/
          sudo chown -R "$(id -u):$(id -g)" candidate
      - name: Scan the corrected exact archive including unfixed vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: image
          input: candidate/image.docker.tar
          format: json
          output: candidate/trivy-image.json
          list-all-pkgs: true
          scanners: vuln
          severity: HIGH,CRITICAL,UNKNOWN
          ignore-unfixed: false
          exit-code: 1
      - name: Bind the passing scan without selecting or installing the candidate
        run: |
          python3 -I -B -S scripts/prepare-m2-runtime-os-repair.py '${{ matrix.role }}' prepared candidate \
            --scan candidate/trivy-image.json
          cd candidate
          sha256sum image.docker.tar repair-candidate.json Dockerfile trivy-image.json \
            m2-original-runtime-os-repair-case-20261101.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-runtime-repair-${{ matrix.role }}-${{ github.run_id }}
          path: candidate/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
      - name: Preserve a held candidate diagnosis without allowing its selection
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-runtime-repair-held-${{ matrix.role }}-${{ github.run_id }}
          path: |
            prepared/origin-facts.json
            candidate/repair-candidate.json
            candidate/trivy-image.json
          compression-level: 6
          retention-days: 30
          if-no-files-found: ignore
