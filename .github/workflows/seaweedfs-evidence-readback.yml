name: SeaweedFS independent producer evidence readback
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - '.github/workflows/seaweedfs-evidence-readback.yml'
      - 'scripts/read-seaweedfs-lab-artifact-20261102.py'
      - 'scripts/verify-seaweedfs-evidence-20261102.py'
      - 'tools/storage_migration/inventory_bootstrap.py'
      - 'tests/test_storage_inventory_bootstrap.py'
      - 'scripts/test-storage-inventory-bootstrap-20261102.py'
      - 'scripts/build-storage-inventory-bootstrap-20261102.py'
      - 'scripts/verify-published-storage-inventory-20261102.py'
      - 'releases/seaweedfs-inventory-delivery-20261102/run-inventory.py'
permissions: {contents: read, attestations: read}
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Read and hash every original member and all source Git blobs and modes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 -I -B -S scripts/read-seaweedfs-lab-artifact-20261102.py
      - name: Qualify root installation of exact delivery and reject unsafe alternatives
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS python3 -I -B -S -m unittest discover -s tests -p test_storage_inventory_bootstrap.py -v
          sudo --preserve-env=GITHUB_ACTIONS python3 -I -B -S scripts/test-storage-inventory-bootstrap-20261102.py sw-readback/original.zip sw-readback/root-install-fixture.json
      - name: Read back all immutable delivery bytes and inspect exact bound launcher
        run: python3 -I -B -S scripts/verify-published-storage-inventory-20261102.py
      - name: Verify exact original publisher workflow source and hosted runner
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz -o gh297.tar.gz
          printf '%s  %s\n' a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112 gh297.tar.gz | sha256sum --check --strict
          mkdir gh297
          tar -xzf gh297.tar.gz --strip-components=1 -C gh297
          gh297/bin/gh attestation verify sw-readback/SHA256SUMS --repo GioNob/ouf-deploy \
            --signer-workflow GioNob/ouf-deploy/.github/workflows/seaweedfs-evaluation.yml \
            --source-digest 6cddeee707b67bd27568aa7a3890e28ebecf274f \
            --source-ref refs/heads/feat/m2-discovery-complete-profile-20261029 \
            --deny-self-hosted-runners --bundle sw-readback/provenance.json --format json > sw-readback/publisher-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seaweedfs-independent-readback-${{ github.run_id }}
          path: |
            sw-readback/*.json
            sw-readback/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
