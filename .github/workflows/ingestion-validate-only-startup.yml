name: Ingestion validate-only startup and compatibility qualification
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['tools/ingestion_startup_profile/**', 'tests/test_ingestion_startup_profile.py', 'tests/fixtures/ingestion-startup/**', '.github/workflows/ingestion-validate-only-startup.yml', 'scripts/read-ingestion-db-postboot-preflight-20261020.py', 'scripts/launch-ingestion-db-postboot-preflight-20261020.sh', 'tests/test_ingestion_db_postboot_preflight.py', 'tools/ingestion_db_preflight/**', 'tests/test_ingestion_db_preflight.py', 'tests/test_ingestion_db_preflight_native.py', 'tests/fixtures/ingestion-db-preflight/**', 'releases/ingestion-db-read-manifest-20261020.json', '.github/workflows/ingestion-db-postboot-preflight.yml']
permissions: {contents: read}
jobs:
  postgres17-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-ingestion-runtime
          ref: 0fe0de60c6d980fe97610acf195d4bfd46d3777f
          path: .pairwise/ingestion
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Exact candidate BOM and native Flyway fixture
        run: |
          set -euo pipefail
          mvn -B -ntp -q -f tests/fixtures/ingestion-db-preflight/pom.xml compile org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath -Dmdep.outputFile="$GITHUB_WORKSPACE/.ingestion-db.classpath"
      - name: Compile exact owner application and native context probe
        run: |
          set -euo pipefail
          mvn -B -ntp -q -f .pairwise/ingestion/vendor/authorization-sdk/pom.xml -DskipTests install
          mvn -B -ntp -q -f .pairwise/ingestion/pom.xml -DskipTests package org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath -Dmdep.includeScope=runtime -Dmdep.outputFile="$GITHUB_WORKSPACE/.startup.classpath"
          mkdir -p tests/fixtures/ingestion-startup/classes
          javac -cp ".pairwise/ingestion/target/classes:$(cat .startup.classpath)" -d tests/fixtures/ingestion-startup/classes tests/fixtures/ingestion-startup/StartupProfileProbe.java
      - name: Root-custodied bounded reader, actual PG17 and exact18 SQL
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-db-preflight-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env OUF_TEST_ROOT="$fixture" \
            OUF_FIXTURE_JAVA="$JAVA_HOME/bin/java" \
            OUF_INGESTION_SQL_ROOT="$fixture/repository/.pairwise/ingestion/src/main/resources/db/migration" \
            OUF_STARTUP_CLASSPATH="$fixture/repository/tests/fixtures/ingestion-startup/classes:$fixture/repository/.pairwise/ingestion/target/classes:$(cat .startup.classpath)" \
            OUF_FLYWAY_CLASSPATH="$fixture/repository/tests/fixtures/ingestion-db-preflight/target/classes:$(cat .ingestion-db.classpath)" \
            python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p 'test_ingestion_startup_profile.py' -v
