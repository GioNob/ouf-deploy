name: OUF retained source continuity
on:
  push:
    branches: [main]
    paths:
      - scripts/check-source-continuity.py
      - tests/test_source_continuity.py
      - releases/file-loop-retained-source-baseline-20261010.json
      - .github/workflows/source-continuity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject schema regression and loss of retained source features
        run: python3 -m unittest discover -s tests -p 'test_source_continuity.py' -v
