name: Managed profile single descriptor HUMAN publication
on:
  push:
    paths: ['scripts/publish-managed-profile-descriptor-20261028.py','releases/publish-managed-profile-descriptor-20261028.sh','tests/*managed_profile_descriptor*','tests/fixtures/ManagedProfileDescriptorOwnerTest.java','.github/workflows/managed-profile-descriptor-publication.yml']
  pull_request:
    paths: ['scripts/publish-managed-profile-descriptor-20261028.py','releases/publish-managed-profile-descriptor-20261028.sh','tests/*managed_profile_descriptor*','tests/fixtures/ManagedProfileDescriptorOwnerTest.java','.github/workflows/managed-profile-descriptor-publication.yml']
permissions: {contents: read}
jobs:
  actual-protocol-and-tty:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -I -S -B -m unittest discover -s tests -p test_managed_profile_descriptor_publication.py -v
      - run: python3 -m py_compile scripts/publish-managed-profile-descriptor-20261028.py
  deployed-owner-java21-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_DB: ouf_onboarding, POSTGRES_USER: ouf_onboarding, POSTGRES_PASSWORD: ci-only-password}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ouf_onboarding -d ouf_onboarding" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OUF_ONB_DB_URL: jdbc:postgresql://127.0.0.1:5432/ouf_onboarding
      OUF_ONB_DB_USER: ouf_onboarding
      OUF_ONB_DB_PASSWORD: ci-only-password
      MAVEN_OPTS: -Dmaven.wagon.http.connectionTimeout=10000 -Dmaven.wagon.http.readTimeout=30000 -Djava.net.preferIPv4Stack=true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-source-onboarding
          ref: 9890b31868641e5be43c949a56f4ef69dd23bdfd
          path: qualified-owner
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Install native owner SDK
        working-directory: qualified-owner
        run: bash scripts/install-authorization-sdk.sh
      - name: Run exact installed owner with new single-descriptor Python publisher
        run: |
          cp tests/fixtures/ManagedProfileDescriptorOwnerTest.java qualified-owner/src/test/java/it/comune/trieste/ouf/onboarding/
          export OUF_DEPLOY_ROOT="$PWD"
          cd qualified-owner
          timeout --signal=TERM --kill-after=20s 15m mvn -B -ntp -Dtest=ManagedProfileDescriptorOwnerTest test

