name: Ingestion DB retained selection reconciliation
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/reconcile-ingestion-db-selection-20261020.py', 'scripts/launch-ingestion-db-selection-reconcile-20261020.sh', 'tests/test_ingestion_db_selection_reconcile.py', '.github/workflows/ingestion-db-selection-reconcile.yml']
permissions: {contents: read}
jobs:
  files-only-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -I -B -S -m unittest discover -s tests -p test_ingestion_db_selection_reconcile.py -v
