name: Source revision read-only target generation inventory
# Fresh application generations after native host recovery journal-sandbox-_jz3lj9r; read only.
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['.github/workflows/source-revision-runtime-inventory.yml', 'scripts/read-source-revision-current-inventory.py']
permissions: {contents: read}
concurrency: {group: ouf-source-revision-read, cancel-in-progress: false}
jobs:
  inventory:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -I -B -S scripts/read-source-revision-current-inventory.py
