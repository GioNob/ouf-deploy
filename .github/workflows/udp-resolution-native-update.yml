name: Single UDP Resolution native update qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['tools/udp_resolution_update/**', 'scripts/execute-udp-resolution-update-20261017.py', 'releases/udp-resolution-update-selection-20261017.json', 'tests/test_udp_resolution_update_*.py', '.github/workflows/udp-resolution-native-update.yml']
permissions: {contents: read}
jobs:
  native-scoped-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Closed graph with effects disabled and pure request invariants
        run: |
          python3 -I -B -m unittest discover -s tests -p 'test_udp_resolution_update_bootstrap.py' -v
          python3 -I -B -m unittest discover -s tests -p 'test_udp_resolution_update_plan.py' -v
      - name: Real root custody, two-role signatures, Docker replacement and retained namespace routes
        run: |
          OUF_UDP_ROOT="/var/lib/ouf-udp-native-${{ github.run_id }}"
          sudo mkdir -m700 "$OUF_UDP_ROOT"
          sudo cp -R . "$OUF_UDP_ROOT/repository"
          sudo chown -R root:root "$OUF_UDP_ROOT"
          sudo env OUF_NATIVE_UIDS=1 OUF_TEST_ROOT=/root OUF_READINESS_DOCKER_NATIVE=1 python3 -I -B -m unittest discover -s "$OUF_UDP_ROOT/repository/tests" -p 'test_udp_resolution_update_*.py' -v
