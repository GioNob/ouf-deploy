name: Operational execute routes qualification
on:
  push:
    branches: [sprint-01/task-04b-operational-execute-routes]
    paths:
      - scripts/apply-operational-execute-routes-20261111.py
      - releases/operational-execute-assets-20261111.json
      - tests/test_operational_execute_routes.py
      - tests/qualify_operational_execute_routes_native.py
      - .github/workflows/operational-execute-routes.yml
  pull_request:
    paths:
      - scripts/apply-operational-execute-routes-20261111.py
      - releases/operational-execute-assets-20261111.json
      - tests/test_operational_execute_routes.py
      - tests/qualify_operational_execute_routes_native.py
      - .github/workflows/operational-execute-routes.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Checkout exact gateway reference for byte and materializer equivalence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-api-gateway
          ref: 8383cfe7946199badc5fcbb1bb3ac25160567541
          path: .gateway-reference
          persist-credentials: false
      - name: Unit tests and required gateway equivalence
        env:
          OUF_OPERATIONAL_GATEWAY_SOURCE: ${{ github.workspace }}/.gateway-reference
        run: |
          test "$(git -C .gateway-reference rev-parse HEAD)" = 8383cfe7946199badc5fcbb1bb3ac25160567541
          python3 -I -B -m unittest discover -s tests -p test_operational_execute_routes.py -v
      - name: Actual APISIX with etcd, production namespace transport and six writes
        run: sudo "$(command -v python3)" -I -B tests/qualify_operational_execute_routes_native.py -v
