name: Exact durable V11 package startup and current-state recovery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/durable-v11-configtree.yml
      - tests/durable_v11_configtree_fixture.py
      - scripts/verify-durable-v11-package.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: durable-v11-hosted-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download immutable producer ZIP, verify original bytes and complete source/JAR closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/GioNob/ouf-semantic-registry/actions/artifacts/11710556577/zip > semantic.zip
          python3 scripts/verify-durable-v11-package.py --module semantic --zip semantic.zip --output durable-v11-package-verification.json
          python3 - <<'PY'
          import pathlib,shutil,zipfile
          root=pathlib.Path('package');root.mkdir()
          with zipfile.ZipFile('semantic.zip') as z:
              for name,limit in [('application.jar',536870912),('image.docker.tar',2147483648),
                                 ('provenance.json',16777216),('migration-continuity.json',1048576),
                                 ('source.tar',536870912),('source-inventory.json',16777216),
                                 ('package-record.json',1048576),('trivy-image.json',67108864),('Dockerfile.resolved',1048576)]:
                  rows=[i for i in z.infolist() if pathlib.PurePosixPath(i.filename).name==name]
                  assert len(rows)==1 and 0<rows[0].file_size<=limit
                  with z.open(rows[0]) as src,(root/name).open('xb') as dst:shutil.copyfileobj(src,dst,1048576)
          PY
      - name: Verify original GitHub publisher for all eight signed subjects before hosted image load
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in image.docker.tar source.tar source-inventory.json application.jar package-record.json migration-continuity.json trivy-image.json Dockerfile.resolved; do
            gh attestation verify "package/$file" --repo GioNob/ouf-semantic-registry \
              --signer-workflow GioNob/ouf-semantic-registry/.github/workflows/discovery-durable-candidate.yml \
              --source-digest 3ec99277b8383e496913b9fd3bb05c877825abf5 \
              --source-ref refs/heads/codex/discovery-durable-resilience-20261011 \
              --deny-self-hosted-runners --bundle package/provenance.json --format json > "package/$file.current-verification.json"
          done
          docker load --input package/image.docker.tar
          python3 - <<'PY'
          import json,subprocess
          image='sha256:83635be46d1fe61dea08597ea4488980b4349e5f6e0ed8bbd3ab6f5e2686370e'
          row=json.loads(subprocess.check_output(['docker','image','inspect',image]))[0]
          assert row['Id']==image and row['Config']['User']=='10001:10001'
          assert row['Config']['Labels']['org.opencontainers.image.revision']=='8a2e84b32d4ce2bdc3bc529b56afb5663ab133e3'
          PY
      - name: Retrieve retained installed JAR; no VPS read or effect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/GioNob/ouf-deploy/actions/artifacts/11663175548/zip > installed.zip
          python3 - <<'PY'
          import hashlib,pathlib,zipfile
          assert hashlib.sha256(pathlib.Path('installed.zip').read_bytes()).hexdigest()=='effce27861d4d3a8154c747b012412c58777a2a8ee8df6a11431d1674d49bf12'
          root=pathlib.Path('old-application-package');root.mkdir()
          with zipfile.ZipFile('installed.zip') as z:
              for name,limit in [('application.jar',536870912),('capture-receipt.json',1048576)]:
                  rows=[i for i in z.infolist() if pathlib.PurePosixPath(i.filename).name==name]
                  assert len(rows)==1 and 0<rows[0].file_size<=limit
                  (root/name).write_bytes(z.read(rows[0]))
          PY
      - name: Enforced resource startup, V1-V11, preserved budgets/restart/current restore and installed JAR
        run: python3 tests/durable_v11_configtree_fixture.py --bounded-container --installed-application
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-v11-configtree-${{ github.run_id }}
          path: |
            durable-v11-configtree-receipt.json
            durable-v11-package-verification.json
            package/*.current-verification.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove disposable hosted fixtures
        if: always()
        run: docker rm -f ouf-discovery-spring-ci ouf-semantic-resource-ci 2>/dev/null || true
