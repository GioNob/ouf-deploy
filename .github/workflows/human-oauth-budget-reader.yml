name: Retained HUMAN OAuth budget projection
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths:
      - scripts/read-chatbot-human-oauth-budget-20261017.py
      - tests/test_chatbot_human_oauth_budget_reader.py
      - .github/workflows/human-oauth-budget-reader.yml
permissions: {contents: read}
jobs:
  native-private-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Bounded OAuth counters, credential canaries, actual custody, locks and CLI
        run: sudo env OUF_NATIVE_UIDS=1 python3 -I -B -S -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_chatbot_human_oauth_budget_reader.py -v
