name: Registry retained postboot stop read
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths:
      - scripts/read-registry-postboot-stop-20261023.py
      - tools/semantic_registry_recovery_execution/tests/test_postboot_stop_read.py
      - releases/semantic-registry-postboot-stop-read-20261023.sh
      - .github/workflows/registry-postboot-stop-read.yml
  pull_request:
    paths:
      - scripts/read-registry-postboot-stop-20261023.py
      - tools/semantic_registry_recovery_execution/tests/test_postboot_stop_read.py
      - releases/semantic-registry-postboot-stop-read-20261023.sh
      - .github/workflows/registry-postboot-stop-read.yml
permissions:
  contents: read
concurrency:
  group: registry-postboot-stop-read-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  retained-stop-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Root-owned disposable source and read-only probe tests
        run: |
          ouf_probe_python="$(command -v python)"
          sudo install -d -m 0700 /root/ouf-stop-probe-tests
          sudo cp -a . /root/ouf-stop-probe-tests/repository
          sudo chown -R root:root /root/ouf-stop-probe-tests
          sudo "$ouf_probe_python" -I -B -S -m unittest discover \
            -s /root/ouf-stop-probe-tests/repository/tools/semantic_registry_recovery_execution/tests \
            -p test_postboot_stop_read.py -v
