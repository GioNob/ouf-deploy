name: Completed source revision protected read qualification
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/read-source-revision-completed-20261019.py', 'scripts/launch-source-revision-completed-read-20261019.sh', 'tests/test_source_revision_completed_read.py', '.github/workflows/source-revision-completed-read.yml']
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact frozen sources, completed history, socket GET and readonly SQL fences
        run: |
          set -euo pipefail
          bash -n scripts/launch-source-revision-completed-read-20261019.sh
          fixture="/root/ouf-source-completed-read-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo env OUF_TEST_ROOT="$fixture" python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p 'test_source_revision_completed_read.py' -v
