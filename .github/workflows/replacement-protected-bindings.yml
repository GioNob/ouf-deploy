name: OUF protected replacement binding read qualification
on:
  push:
    branches: [main]
    paths:
      - scripts/read-replacement-protected-bindings.py
      - tests/test_replacement_protected_bindings.py
      - .github/workflows/replacement-protected-bindings.yml
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tests/test_replacement_protected_bindings.py
