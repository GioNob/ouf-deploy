name: Storage SDK lifecycle regression
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - '.github/workflows/storage-sdk-lifecycle.yml'
      - 'scripts/assess-storage-sdk-lifecycle.py'
      - 'tests/test_storage_sdk_lifecycle.py'
      - 'patches/seaweedfs/4.52-listing-remove-sdk-v1.patch'
      - 'evidence/artifacts/storage-runtime-image-readback-41527990598.zip'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify lifecycle evidence handling and the exact 4.51 denial
        run: python3 -I -B -S -m unittest discover -s tests -p test_storage_sdk_lifecycle.py -v
  listing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seaweedfs/seaweedfs
          ref: 984eac6a790be89e2a11de175a7413e1e3e32dd3
          path: seaweedfs
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Apply the exact listing patch and compare the dependency graphs
        working-directory: seaweedfs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 984eac6a790be89e2a11de175a7413e1e3e32dd3
          go list -mod=readonly -deps ./weed > "$RUNNER_TEMP/seaweedfs-baseline-deps"
          git apply --check ../patches/seaweedfs/4.52-listing-remove-sdk-v1.patch
          git apply ../patches/seaweedfs/4.52-listing-remove-sdk-v1.patch
          test "$(git diff --name-only)" = weed/s3api/s3api_object_handlers_list.go
          if grep -F '"github.com/aws/aws-sdk-go/' weed/s3api/s3api_object_handlers_list.go; then
            exit 1
          fi
          go list -mod=readonly -deps ./weed > "$RUNNER_TEMP/seaweedfs-listing-deps"
          cmp "$RUNNER_TEMP/seaweedfs-baseline-deps" "$RUNNER_TEMP/seaweedfs-listing-deps"
          test "$(grep -c '^github.com/aws/aws-sdk-go/' "$RUNNER_TEMP/seaweedfs-listing-deps")" = 55
      - name: Run SeaweedFS listing, pagination and versioned-listing regressions
        working-directory: seaweedfs
        run: >-
          go test -mod=readonly -count 1 -timeout 2m -v ./weed/s3api
          -run 'Test.*(ListObjects|NextMarker|ListWithMarker|ContinuationToken|EncodeList|VersionedList|EmptyDirectoryHidden|PhantomMarker)'
