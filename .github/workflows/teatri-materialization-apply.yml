name: Teatri exact permission publication and single UDP update qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['tools/teatri_materialization_apply/**', 'scripts/execute-teatri-materialization-update-20261017.py', 'releases/teatri-materialization-apply-selection-20261017.json', 'tests/test_teatri_apply*.py', '.github/workflows/teatri-materialization-apply.yml']
permissions: {contents: read}
jobs:
  native-signatures-source-closure-owner-and-oauth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact grants, ambiguous claims, Ed25519 decisions and loopback OAuth
        run: sudo env OUF_NATIVE_UIDS=1 OUF_TEST_ROOT=/root python3 -B -m unittest discover -s tests -p 'test_teatri_apply*.py' -v
