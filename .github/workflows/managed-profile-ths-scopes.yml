name: Managed profile THS scope request capture
on:
  push:
    paths: ['scripts/read-managed-profile-ths-scopes-20261028.py','tools/managed_profile_ths_scopes/**','tests/*managed_profile_ths_scope*','releases/read-managed-profile-ths-scopes-20261028.sh','.github/workflows/managed-profile-ths-scopes.yml']
  pull_request:
    paths: ['scripts/read-managed-profile-ths-scopes-20261028.py','tools/managed_profile_ths_scopes/**','tests/*managed_profile_ths_scope*','releases/read-managed-profile-ths-scopes-20261028.sh','.github/workflows/managed-profile-ths-scopes.yml']
permissions: {contents: read}
jobs:
  retained-history-and-additive-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -I -S -B -m unittest discover -s tests -p test_managed_profile_ths_scopes.py -v
      - run: sudo /usr/bin/python3 -I -S -B tests/qualify_managed_profile_ths_scope_unix.py
