name: Provider locked switch regression
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_transaction_profiles/authenticated_runtime_switch.py'
      - 'tools/semantic_target_review/test_execute_approved_provider_transaction.py'
      - 'tools/semantic_target_review/execute_post_signature_recovery.py'
      - 'tools/semantic_target_review/test_post_signature_recovery.py'
      - 'tools/semantic_target_review/execute_bundle_context_recovery.py'
      - 'tools/semantic_target_review/execute_broker_source_recovery.py'
      - 'tools/semantic_target_review/test_broker_source_recovery.py'
      - 'tools/semantic_target_review/test_bundle_context_recovery.py'
      - 'tools/semantic_target_review/test_r3_launch_fail_closed.py'
      - 'tools/semantic_target_review/test_r4_launch_fail_closed.py'
      - 'releases/provider-v2-bundle-context-recovery-20261009.sh'
      - 'releases/provider-v2-post-signature-recovery-20261009.sh'
      - '.github/workflows/provider-v2-locked-switch-regression.yml'
permissions:
  contents: read
jobs:
  connected-locked-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Actual signature publication and five locked checkpoints
        run: |
          sudo install -d -m 0700 /root/ouf-locked-switch-ci
          sudo env OUF_TRANSACTION_TEST_ROOT=/root/ouf-locked-switch-ci /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_target_review -p test_execute_approved_provider_transaction.py
      - name: Explicit recovery gates and imported sealed consumer wiring
        run: /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_target_review -p test_post_signature_recovery.py
      - name: Exact changed-context recovery with fresh real signatures
        run: |
          sudo env OUF_TRANSACTION_TEST_ROOT=/root/ouf-locked-switch-ci /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_target_review -p test_bundle_context_recovery.py
      - name: Failed transfer or digest never reaches sudo
        run: /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_target_review -p test_r3_launch_fail_closed.py

      - name: R4 failed transfer or digest never reaches sudo
        run: /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_target_review -p test_r4_launch_fail_closed.py

      - name: Revised source closure, eight fresh signatures and isolated publication
        run: sudo env OUF_TRANSACTION_TEST_ROOT=/root/ouf-locked-switch-ci /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_target_review -p test_broker_source_recovery.py
