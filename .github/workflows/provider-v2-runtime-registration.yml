name: Provider v2 runtime registration tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/register-provider-v2-runtime.py'
      - 'scripts/test-runtime-registration.py'
      - 'scripts/test-runtime-registration-native.py'
      - 'scripts/bootstrap-provider-v2-runtime-registration.sh'
      - 'releases/provider-v2-runtime-registration-sources.json'
      - '.github/workflows/provider-v2-runtime-registration.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-api-gateway
          ref: ace683b1019f79adaace86796b67e463b93ec12e
          path: gateway-fixture
          persist-credentials: false
      - name: Prepare actual sealed sources in a root-private fixture
        run: |
          python3 -m py_compile scripts/register-provider-v2-runtime.py scripts/test-runtime-registration.py scripts/test-runtime-registration-native.py
          sudo install -d -m 700 /root/ouf-registration-fixture/source/scripts /root/ouf-registration-fixture/source/tools
          sudo install -m 600 scripts/register-provider-v2-runtime.py scripts/test-runtime-registration.py scripts/test-runtime-registration-native.py /root/ouf-registration-fixture/
          sudo install -m 600 releases/provider-v2-runtime-registration-sources.json /root/ouf-registration-fixture/sources.json
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('releases/provider-v2-runtime-registration-sources.json').read_bytes())
          for p in m['sourceHashes']:
              subprocess.run(['sudo','install','-m','600','gateway-fixture/'+p,'/root/ouf-registration-fixture/source/'+p],check=True)
          PY
      - name: Check owned publication, failure retention and unchanged defaults
        run: sudo /usr/bin/python3 -I -B /root/ouf-registration-fixture/test-runtime-registration.py
      - name: Real isolated Docker reload, unchanged running fixture and empty admission allowlist
        run: sudo /usr/bin/python3 -I -B /root/ouf-registration-fixture/test-runtime-registration-native.py
      - name: Check bootstrap syntax when present
        run: |
          if test -f scripts/bootstrap-provider-v2-runtime-registration.sh; then bash -n scripts/bootstrap-provider-v2-runtime-registration.sh; fi
