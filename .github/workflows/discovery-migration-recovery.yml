name: OUF discovery migration recovery CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/discovery-migration-recovery.yml, tests/test_discovery_migration_recovery.py]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-semantic-registry
          ref: 403531a9df1cbc877078f8126fd1fc4ff18acea9
          path: semantic-source
          persist-credentials: false
      - name: Exercise historical data, V10, legacy jobs and actual fixture restore
        run: python3 tests/test_discovery_migration_recovery.py
