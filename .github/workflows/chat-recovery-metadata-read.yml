name: Verify retained MCP public metadata mount
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['.github/workflows/chat-recovery-metadata-read.yml']
permissions: {contents: read}
jobs:
  read:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 2
    steps:
      - name: Read only selected mount metadata, no file contents
        run: |
          python3 -I -B -S - <<'PY'
          import json,subprocess
          from pathlib import PurePosixPath
          r=subprocess.run(['/usr/bin/docker','inspect','--type','container','79e87c79c34bffb9ae20ccd0fc429455740d2829574120dbd6b120e97312e9b6'],capture_output=True,timeout=10,env={'PATH':'/usr/bin:/bin','DOCKER_HOST':'unix:///var/run/docker.sock','DOCKER_API_VERSION':'1.44'})
          assert r.returncode==0 and len(r.stdout)<1048576
          a=json.loads(r.stdout);assert len(a)==1
          a=a[0]
          assert a['Id']=='79e87c79c34bffb9ae20ccd0fc429455740d2829574120dbd6b120e97312e9b6' and a['State']['Running'] is True
          mounts=[m for m in a['Mounts'] if m['Destination']=='/run/ouf-mcp-reprocessing']
          assert len(mounts)==1
          m=mounts[0];p=PurePosixPath(m['Source'])
          result={'schema':'ouf.chat-recovery-retained-metadata-read.v1','runtimeMutations':0,'credentialFilesRead':0,'credentialValuesPrinted':False,'mountTarget':m['Destination'],'readOnly':m['RW'] is False,'mountType':m['Type'],'sourcePath':str(p),'expectedHistoricalContextShape':p.name=='public' and p.parent.name.startswith('semantic-mcp-update-execution-') and str(p.parent.parent)=='/etc/ouf/deploy-snapshots'}
          print(json.dumps(result,sort_keys=True))
          assert result['expectedHistoricalContextShape'] and result['readOnly'] and result['mountType']=='bind'
          PY
