name: Storage native PostgreSQL physical WAL recovery fixture

on:
  workflow_dispatch:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - .github/workflows/storage-postgres-physical-pitr.yml
      - tests/run_storage_postgres_pitr.py
      - tests/storage_pitr_archive.py
      - tests/test_storage_postgres_pitr.py

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: storage-postgres-physical-pitr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-physical-pitr:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check archive custody and recovery input boundaries
        run: python3 -I -B -S -m unittest discover -s tests -p test_storage_postgres_pitr.py -v
      - name: Build the pinned PostgreSQL 17.11 fixture tools
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/pg-pitr"
          mkdir -p "$base/build-evidence"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential bison flex
          cd "$base"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 \
            https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.bz2 \
            --output postgresql-17.11.tar.bz2
          printf '%s\n' 'dd27f2b3c59e73ed14aa3324901242bf69a032a6347805f274e6260322d42979  postgresql-17.11.tar.bz2' > build-evidence/source.sha256
          sha256sum --strict --check build-evidence/source.sha256
          tar -xjf postgresql-17.11.tar.bz2
          cd postgresql-17.11
          timeout 600 ./configure --prefix="$base/install" --without-readline --without-zlib --without-icu \
            > ../build-evidence/configure.log 2>&1
          timeout 600 make -j2 > ../build-evidence/make.log 2>&1
          timeout 120 make install > ../build-evidence/install.log 2>&1
          sha256sum "$base/install/bin/"{postgres,initdb,pg_ctl,psql,pg_basebackup,pg_verifybackup,pg_waldump} > ../build-evidence/binary-sha256.txt
      - name: Recover the exact physical basebackup through a post-base WAL target
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/pg-pitr"
          python3 -I -B -S tests/run_storage_postgres_pitr.py \
            --pg-bin "$base/install/bin" --output "$base/lab"
      - name: Bind exact source and preserve positive and negative evidence
        if: always()
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/pg-pitr"
          mkdir -p "$base/build-evidence" "$base/lab/evidence"
          sha256sum .github/workflows/storage-postgres-physical-pitr.yml \
            tests/run_storage_postgres_pitr.py tests/storage_pitr_archive.py tests/test_storage_postgres_pitr.py \
            tests/run_storage_postgres_fixture_native.py \
            tools/storage_recovery/{coordinated,manifest,postgres_fixture,profile}.py \
            profiles/seaweedfs-452-lab/profile.json \
            > "$base/build-evidence/repository-source-sha256.txt"
          git rev-parse HEAD > "$base/build-evidence/repository-commit.txt"
          cd "$base"
          find build-evidence lab/evidence -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --strict --check SHA256SUMS
      - name: Attest the evidence manifest
        if: success()
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ runner.temp }}/pg-pitr/SHA256SUMS
      - name: Retain native evidence including original synthetic basebackup and WAL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-postgres-physical-pitr-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pg-pitr/SHA256SUMS
            ${{ runner.temp }}/pg-pitr/build-evidence/
            ${{ runner.temp }}/pg-pitr/lab/evidence/
          if-no-files-found: error
          retention-days: 90
