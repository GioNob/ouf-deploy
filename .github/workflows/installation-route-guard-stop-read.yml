name: Exact frozen HUMAN guard stop read
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/read-installation-route-preparation-guard-stop.py', 'tests/test_installation_route_preparation_guard_stop.py', '.github/workflows/installation-route-guard-stop-read.yml']
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Authenticated source read, format normalization, no execution, tamper denial
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-guard-stop-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo install -m 0600 scripts/read-installation-route-preparation-guard-stop.py "$fixture/read.py"
          sudo install -m 0600 tests/test_installation_route_preparation_guard_stop.py "$fixture/test_read.py"
          sudo python3 -I -B -S "$fixture/test_read.py" -v
