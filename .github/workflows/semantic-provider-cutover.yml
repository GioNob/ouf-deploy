name: Semantic provider cutover rehearsal
on:
  pull_request:
    paths:
      - scripts/cutover-semantic-provider-20261111.py
      - tests/test_semantic_provider_cutover.py
      - .github/workflows/semantic-provider-cutover.yml
permissions: {contents: read}
jobs:
  restoration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Stage reviewed dependencies
        run: |
          cp tools/acquisition_read_native/retained_mac.py scripts/
          cp tools/m2_discovery_installation_profile/{audit,public_truststore}.py scripts/
      - name: Exercise restoration on a disposable network
        run: |
          dind_dir=$(mktemp -d)
          docker run --privileged -d --name ouf-cutover-dind \
            -e DOCKER_TLS_CERTDIR= -v "$dind_dir:/ouf-ci" docker:29.8.1-dind \
            --host=unix:///ouf-ci/docker.sock
          trap 'docker -H unix:///run/docker.sock rm -f -v ouf-cutover-dind' EXIT
          export DOCKER_HOST="unix://$dind_dir/docker.sock"
          for i in {1..30}; do
            if docker info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker version
          docker pull busybox:1.37.0
          python3 -I -B -m unittest discover -s tests -p test_semantic_provider_cutover.py -v
