name: MCP existing window compatibility delivery
on:
  push:
    paths:
      - 'scripts/launch-mcp-existing-window-compatibility-20261019.sh'
      - 'tests/test_mcp_existing_window_compatibility_delivery.py'
      - '.github/workflows/mcp-existing-window-compatibility-delivery.yml'
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: bash -n scripts/launch-mcp-existing-window-compatibility-20261019.sh
      - run: python3 -m unittest discover -s tests -p test_mcp_existing_window_compatibility_delivery.py -v
