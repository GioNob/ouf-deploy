name: Teatri native review owner-schema qualification
on:
  push:
    branches: [main]
    paths:
      - tools/prepare_teatri_native_proposal.py
      - tests/test_teatri_native_proposal.py
      - tests/qualify_teatri_native_owner_sql.py
      - releases/teatri-native-semantic-proposal-20261013.json
      - .github/workflows/teatri-native-review.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  disposable-native-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: review, POSTGRES_PASSWORD: fixture, POSTGRES_DB: review}
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U review -d review' --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: review
      PGPASSWORD: fixture
      PGDATABASE: review
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-semantic-registry
          ref: 8a2e84b32d4ce2bdc3bc529b56afb5663ab133e3
          path: .owner-fixture
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_teatri_native_proposal.py -v
      - name: Exact native owner V1-V5 schema in disposable PostgreSQL only
        run: |
          set -euo pipefail
          for version in 1 2 3 4 5; do
            for file in .owner-fixture/src/main/resources/db/migration/V"$version"__*.sql; do
              psql --no-psqlrc -X -v ON_ERROR_STOP=1 -f "$file" >/dev/null
            done
          done
          OUF_DISPOSABLE_POSTGRES=1 python3 tests/qualify_teatri_native_owner_sql.py
      - name: Reproduce exact review bytes without owner requests
        run: |
          python3 tools/prepare_teatri_native_proposal.py --profile evidence/teatri-authorized-profile-20261011.json --owner-ref b93d8cf6-cd14-4ee6-91d7-84cd76c4f500 --authority-ref ouf-lab-netcup-01 --output /tmp/teatri-review-reproduced.json
          cmp releases/teatri-native-semantic-proposal-20261013.json /tmp/teatri-review-reproduced.json
