name: OUF signed Semantic full Spring startup recovery CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/discovery-spring-startup-recovery.yml
      - tests/semantic_spring_startup_fixture.py
      - scripts/capture-installed-semantic-application.py
permissions:
  contents: read
  actions: read
jobs:
  capture-installed:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read exact installed JAR without DB, keys, lifecycle or common lock
        run: python3 scripts/capture-installed-semantic-application.py
      - uses: actions/upload-artifact@v4
        with:
          name: installed-application-${{ github.run_id }}
          path: old-application-package/
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: capture-installed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: installed-application-${{ github.run_id }}
          path: old-application-package
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          repository: GioNob/ouf-semantic-registry
          run-id: 37995955667
          name: signed-semantic-discovery-candidate-37995955667
          github-token: ${{ github.token }}
          path: signed-package
      - name: Extract Java package from exact previously verified signed image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          archive=Path("signed-package/semantic.image.tar.gz")
          h=hashlib.sha256()
          with archive.open("rb") as stream:
              for chunk in iter(lambda:stream.read(1048576),b""):h.update(chunk)
          assert h.hexdigest()=="e1a62b7f53497ed471e6539d90ab02efbb4ee68c9f90f3904bcce42618ceaff6"
          image=json.loads(Path("signed-package/build-image.json").read_bytes())[0]
          assert image["Id"]=="sha256:b1a7956a673f88b5ee65d174c2eda7b9e448153e101348c06fdd53c0640e700b"
          print("OUF_EXACT_SIGNED_ARCHIVE_BYTES=PASS")
          PY
          docker load --input signed-package/semantic.image.tar.gz
          test "$(docker image inspect sha256:b1a7956a673f88b5ee65d174c2eda7b9e448153e101348c06fdd53c0640e700b --format '{{.Id}}')" = sha256:b1a7956a673f88b5ee65d174c2eda7b9e448153e101348c06fdd53c0640e700b
          docker create --name ouf-flyway-package sha256:b1a7956a673f88b5ee65d174c2eda7b9e448153e101348c06fdd53c0640e700b
          mkdir package
          docker cp ouf-flyway-package:/app/application.jar package/application.jar
          docker rm ouf-flyway-package
      - name: Boot exact signed application, migrate and restore with IAM enabled
        run: python3 tests/semantic_spring_startup_fixture.py --installed-application
      - uses: actions/upload-artifact@v4
        with:
          name: spring-startup-receipt-${{ github.run_id }}
          path: spring-startup-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable hosted fixtures
        if: always()
        run: docker rm -f ouf-flyway-package ouf-discovery-spring-ci 2>/dev/null || true
