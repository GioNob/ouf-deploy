name: Semantic provider B1 wrapper restore
on:
  pull_request:
    paths:
      - scripts/restore-semantic-provider-b1-wrapper.py
      - scripts/deliver-restore-semantic-provider-b1-wrapper.sh
      - tests/test_restore_semantic_provider_b1_wrapper.py
      - tools/semantic_transaction_profiles/**
      - .github/workflows/semantic-provider-b1-restore.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Native restore under root custody, real flock and unchanged switch primitive
        run: >-
          sudo -n env OUF_B1_RESTORE_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_restore_semantic_provider_b1_wrapper.py -v
      - name: Delivery syntax
        run: bash -n scripts/deliver-restore-semantic-provider-b1-wrapper.sh
