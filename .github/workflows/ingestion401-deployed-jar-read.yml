name: Ingestion401 deployed JAR bounded read
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/read-ingestion401-deployed-jar.py', 'tests/test_ingestion401_deployed_jar_read.py', '.github/workflows/ingestion401-deployed-jar-read.yml']
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact history, bounded archive and class metadata, no Java or process dispatch
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-ingestion401-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo install -d -m 0700 "$fixture/evidence"
          sudo install -m 0600 evidence/installation-route-reconciliation-target-20261019.json "$fixture/evidence/installation-route-reconciliation-target-20261019.json"
          sudo install -d -m 0700 "$fixture/tests"
          sudo install -m 0600 scripts/read-ingestion401-deployed-jar.py "$fixture/tests/read.py"
          sudo install -m 0600 tests/test_ingestion401_deployed_jar_read.py "$fixture/tests/test_read.py"
          sudo python3 -I -B -S "$fixture/tests/test_read.py" -v
