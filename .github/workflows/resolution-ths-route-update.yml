name: Resolution THS three-route native qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['tools/resolution_ths_update/**', 'scripts/execute-resolution-ths-routes-20261017.py', 'releases/resolution-ths-route-selection-20261017.json', 'tests/test_resolution_routes_*.py', '.github/workflows/resolution-ths-route-update.yml']
permissions: {contents: read}
jobs:
  signed-namespace-route-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Closed isolated bootstrap with effects disabled
        run: python3 -I -B -m unittest discover -s tests -p 'test_resolution_routes_bootstrap.py' -v
      - name: Root custody, actual signatures and Docker namespace Admin transport
        run: |
          OUF_ROUTES_ROOT="/var/lib/ouf-resolution-routes-${{ github.run_id }}"
          sudo mkdir -m700 "$OUF_ROUTES_ROOT"
          sudo cp -R . "$OUF_ROUTES_ROOT/repository"
          sudo chown -R root:root "$OUF_ROUTES_ROOT"
          sudo env OUF_NATIVE_UIDS=1 OUF_TEST_ROOT=/root OUF_READINESS_DOCKER_NATIVE=1 python3 -I -B -m unittest discover -s "$OUF_ROUTES_ROOT/repository/tests" -p 'test_resolution_routes_*.py' -v
