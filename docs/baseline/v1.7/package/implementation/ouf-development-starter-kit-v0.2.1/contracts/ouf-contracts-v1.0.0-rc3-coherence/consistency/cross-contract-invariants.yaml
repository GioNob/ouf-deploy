version: '0.5'
status: draft-core-consistency-checked
scope: CanonicalDataEnvelope v1 -> HandoffPayload v1 -> LineageRecord v1 only
contracts:
  CanonicalDataEnvelope: ingestion/canonical-data-envelope-v1.json
  HandoffPayload: ingestion/handoff-payload-v1.json
  LineageRecord: ingestion/lineage-record-v1.json
identityMappings:
- id: CC-01
  from: CanonicalDataEnvelope.ingestionId
  to:
  - HandoffPayload.ingestionId
  - LineageRecord.ingestionId
  rule: MUST_EQUAL
  rationale: Same acquired record identity across processing, handoff and lineage.
- id: CC-02
  from: CanonicalDataEnvelope.runId
  to:
  - HandoffPayload.ingestionRunId
  - LineageRecord.ingestionRunId
  rule: MUST_EQUAL
  rationale: runId and ingestionRunId are naming variants for the same run identity
    across these contracts.
- id: CC-03
  from: CanonicalDataEnvelope.sourceId
  to:
  - HandoffPayload.sourceIdentity.sourceId
  - LineageRecord.source.sourceId
  rule: MUST_EQUAL
- id: CC-04
  from: CanonicalDataEnvelope.typeCode
  to:
  - HandoffPayload.sourceIdentity.typeCode
  - LineageRecord.source.typeCode
  rule: MUST_EQUAL_WHEN_PRESENT
- id: CC-05
  from: CanonicalDataEnvelope.sourceObjectId
  to:
  - HandoffPayload.sourceIdentity.sourceObjectId
  - LineageRecord.source.sourceObjectId
  rule: MUST_EQUAL_WHEN_PRESENT
contractReferenceMappings:
- id: CC-06
  from:
  - CanonicalDataEnvelope.sourceSchemaId
  - CanonicalDataEnvelope.sourceSchemaVersion
  to:
  - HandoffPayload.contractRefs.sourceSchemaRef
  - LineageRecord.contracts.sourceSchemaRef
  rule: MUST_RESOLVE_SAME_SCHEMA_VERSION
  note: Envelope uses split id/version; downstream contracts use opaque versioned
    ref.
- id: CC-07
  from:
  - CanonicalDataEnvelope.configurationBundleId
  - CanonicalDataEnvelope.configurationBundleVersion
  to:
  - HandoffPayload.contractRefs.bundleRef
  - LineageRecord.contracts.bundleRef
  rule: MUST_RESOLVE_SAME_BUNDLE_VERSION
  note: Envelope uses split id/version; downstream contracts use opaque versioned
    ref.
- id: CC-08
  from: HandoffPayload.contractRefs.semanticPublicationSetRef
  to: LineageRecord.contracts.semanticPublicationSetRef
  rule: MUST_EQUAL
- id: CC-09
  from: HandoffPayload.contractRefs.adapterProfileRef
  to: LineageRecord.contracts.adapterProfileRef
  rule: MUST_EQUAL
- id: CC-10
  from: HandoffPayload.contractRefs.mappingRefs
  to: LineageRecord.contracts.mappingRefs
  rule: MUST_EQUAL_AS_SET_WHEN_PRESENT
timeAndTraceMappings:
- id: CC-11
  from: CanonicalDataEnvelope.acquiredAt
  to:
  - HandoffPayload.acquiredAt
  - LineageRecord.times.acquiredAt
  rule: MUST_EQUAL
- id: CC-12
  from: CanonicalDataEnvelope.observedAt
  to:
  - HandoffPayload.sourceIdentity.observedAt
  - LineageRecord.source.sourceObservedAt
  rule: MUST_EQUAL_WHEN_PROPAGATED
- id: CC-13
  from: CanonicalDataEnvelope.provenance.correlationId
  to:
  - HandoffPayload.correlationId
  - LineageRecord.trace.correlationId
  rule: MUST_EQUAL_WHEN_PRESENT
operationAndLineageMappings:
- id: CC-14
  from: CanonicalDataEnvelope.operation
  to: HandoffPayload.operation
  rule: MUST_PRESERVE_SEMANTICS
  note: SNAPSHOT_RECORD may be normalized to UPSERT by processing before handoff;
    DELETE/TOMBSTONE semantics must not be lost.
- id: CC-15
  from: HandoffPayload.lineageId
  to: LineageRecord.lineageId
  rule: MUST_EQUAL
- id: CC-16
  from: HandoffPayload.handoffId
  to: LineageRecord.handoffId
  rule: MUST_EQUAL
- id: CC-17
  from: HandoffPayload.contentHash
  to: LineageRecord.data.outputHash
  rule: MUST_MATCH_DELIVERED_LOGICAL_OUTPUT_WHEN_OUTPUT_HASH_IS_PRESENT
  note: rawHash/normalizedHash remain separate evidence and are not aliases of handoff
    contentHash.
compatibilityInvariants:
- id: CC-18
  rule: MAJOR_COMPATIBILITY
  detail: Breaking semantic changes require new major; additive optional fields are
    allowed within supported major.
- id: CC-19
  rule: HISTORICAL_RESOLUTION
  detail: Pinned schema/bundle/semantic/adapter refs remain resolvable for retention/replay.
- id: CC-20
  rule: NO_SILENT_REINTERPRETATION
  detail: Consumers must not substitute current ACTIVE contracts for pinned historical
    refs.
scopeGuard:
- No new DTO introduced.
- No changes to source-provider API contracts.
- No changes to UDP materialization/serving DTOs.
- No new replay, quarantine or receipt schema.
- No new infrastructure or runtime component.
