name: Existing HUMAN ingestion preflight qualification
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/diagnose-ingestion-administrative-preflight.py', 'tests/test_ingestion_existing_session_preflight.py', '.github/workflows/ingestion-existing-session-preflight.yml']
permissions: {contents: read}
jobs:
  finite-native-read-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Existing window, cumulative counters and owner/IAM write denial
        run: |
          set -euo pipefail
          fixture="/root/ouf-existing-human-preflight-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p 'test_ingestion_existing_session_preflight.py' -v
