name: Scoped MCP authority and exact private plan
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths:
      - tools/semantic_mcp_update/**
      - scripts/execute-semantic-mcp-scoped-20261017.py
      - tests/test_mcp_update_plan.py
      - tests/test_mcp_scoped_authority.py
      - tests/test_mcp_reprocessing_permit_issuance.py
      - .github/workflows/mcp-scoped-authority.yml
permissions: {contents: read}
jobs:
  exact-action-and-existing-roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Real stdlib custody and existing-key role signatures with fixture HUMAN boundary
        run: |
          sudo env OUF_TEST_ROOT=/root OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_mcp_scoped_authority.py -v
          sudo env OUF_TEST_ROOT=/root OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_mcp_reprocessing_permit_issuance.py -v
          python3 -I -B -m unittest discover -s tests -p test_mcp_update_plan.py -v
