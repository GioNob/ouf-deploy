name: Registry bound owner lineage
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths:
      - scripts/read-registry-bound-owner-lineage-20261023.py
      - tests/test_registry_bound_owner_lineage.py
      - .github/workflows/registry-bound-owner-lineage.yml
  pull_request:
    paths:
      - scripts/read-registry-bound-owner-lineage-20261023.py
      - tests/test_registry_bound_owner_lineage.py
      - .github/workflows/registry-bound-owner-lineage.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bound-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Disposable protected metadata and lineage regression tests
        run: |
          sudo install -d -m 0700 /root/ouf-bound-owner-lineage
          sudo cp -a . /root/ouf-bound-owner-lineage/repository
          sudo chown -R root:root /root/ouf-bound-owner-lineage
          sudo python3 -I -B -S -m unittest discover -s /root/ouf-bound-owner-lineage/repository/tests -p test_registry_bound_owner_lineage.py -v
