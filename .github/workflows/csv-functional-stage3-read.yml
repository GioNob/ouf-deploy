name: CSV stage 3 row-ledger qualification and retained target read
on:
  push:
    branches: [fix/csv-functional-stage3-ledger-20261017]
    paths: ['scripts/read-teatri-post-resolution-materialization-20261017.py', 'tests/teatri_post_resolution_read/**', '.github/workflows/csv-functional-stage3-read.yml']
permissions: {contents: read}
concurrency:
  group: csv-functional-stage3-retained-read
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Validate retained delivery shell
        run: bash -n scripts/launch-teatri-post-resolution-materialization-read-20261017.sh
      - name: Verify actual PostgreSQL row ledger, redaction and counterexamples
        run: OUF_NATIVE_SQL=1 python3 -I -B -m unittest discover -s tests/teatri_post_resolution_read -v
  target-read:
    # Run39072364964 proved sudo requires a password; no automatic repeat.
    if: ${{ false }}
    needs: qualification
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Read pinned retained target using existing non-interactive sudo
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # No permission changes, alternative identities, credentials or container escalation.
          sudo -n /usr/bin/python3 -u -I -B -S - scripts/read-teatri-post-resolution-materialization-20261017.py <<'PY'
          import hashlib,os,stat,sys
          assert os.geteuid()==os.getegid()==0 and sys.flags.isolated and sys.flags.no_site and sys.dont_write_bytecode
          fd=os.open(sys.argv[1],os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
          try:
           before=os.fstat(fd);assert stat.S_ISREG(before.st_mode) and before.st_nlink==1 and 0<before.st_size<=131072
           raw=os.read(fd,131073);after=os.fstat(fd)
           pin=lambda s:(s.st_dev,s.st_ino,s.st_uid,s.st_gid,s.st_mode,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
           assert len(raw)==before.st_size and pin(before)==pin(after)
           assert hashlib.sha256(raw).hexdigest()=='ff9f1f593e8c831e2192bc8483431de2b226f7408da28744ad7f5b9490fdcc6e'
          finally:os.close(fd)
          exec(compile(raw,'<verified-stage3-row-ledger-reader>','exec'),{'__name__':'__main__'})
          PY
