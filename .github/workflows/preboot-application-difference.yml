name: Protected application difference qualification
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/read-preboot-application-difference.py','tests/test_preboot_application_difference.py','scripts/launch-preboot-application-difference-20261018.sh','.github/workflows/preboot-application-difference.yml']
permissions: {contents: read}
jobs:
  protected-root-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          fixture="/root/ouf-application-difference-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a tools scripts tests releases "$fixture/"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo python3 -I -B -S -m unittest discover -s "$fixture/tests" -p test_preboot_application_difference.py -v
          if test -f scripts/launch-preboot-application-difference-20261018.sh; then bash -n scripts/launch-preboot-application-difference-20261018.sh; fi
