name: Ingestion rollout checkpoint pure reader
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/read-ingestion-rollout-checkpoint-20261019.py', 'tests/test_ingestion_rollout_checkpoint_read.py', '.github/workflows/ingestion-rollout-checkpoint-read.yml']
permissions: {contents: read}
jobs:
  read-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Root-owned private filesystem and actual Unix HTTP read boundary
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-checkpoint-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env OUF_TEST_ROOT="$fixture" python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_ingestion_rollout_checkpoint_read.py -v
