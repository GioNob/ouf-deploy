name: Source revision authorization owner
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['tools/chatbot_file_cohort/authorization.py', 'tests/test_source_revision_authorization.py', 'tests/test_ingestion_read_authorization.py', 'tools/ingestion_read_authorization/**', 'scripts/*ingestion-read-authorization*', 'tests/test_ingestion_read_*', '.github/workflows/source-revision-authorization.yml']
permissions: {contents: read}
jobs:
  signed-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-source-onboarding
          ref: 84828f74ac586bae09a78f0fb197b75b1a3d98d1
          path: .pairwise/legacy
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-source-onboarding
          ref: be388e1462778438a208c2e00e166370fee32189
          path: .pairwise/revision
          persist-credentials: false
      - name: Actual Java owner role constraints
        run: |
          set -euo pipefail
          mvn -B -q -f tests/fixtures/owner-role-roundtrip/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath -Dmdep.outputFile="$GITHUB_WORKSPACE/.owner-roundtrip.classpath"
          mkdir .owner-roundtrip-classes
          javac -cp "$(cat .owner-roundtrip.classpath)" -d .owner-roundtrip-classes \
            .pairwise/revision/authorization-sdk/src/main/java/it/comune/trieste/ouf/authorization/{AuthorizationPolicy,PrincipalContext,ResourceContext}.java \
            tests/fixtures/owner-role-roundtrip/OwnerConstraintRoundTrip.java
      - name: Real signed authority and durable owner journals in isolated root fixture
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-revision-authorization-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          for suite in test_chatbot_cohort_authorization.py test_chatbot_cohort_authorization_observation.py test_source_revision_authorization.py test_ingestion_read_authorization.py test_ingestion_read_governed_owner.py test_ingestion_read_administrative_authority.py test_ingestion_read_administrative_delivery.py; do
            sudo env OUF_NATIVE_UIDS=1 OUF_TEST_ROOT="$fixture" \
              OUF_CHATBOT_ONBOARDING_ROOT="$fixture/repository/.pairwise/legacy" \
              OUF_REVISION_ONBOARDING_ROOT="$fixture/repository/.pairwise/revision" \
              OUF_OWNER_JAVA_CLASSPATH="$fixture/repository/.owner-roundtrip-classes:$(cat .owner-roundtrip.classpath)" \
              python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p "$suite" -v
          done


  stage-ingestion-administrative-code:
    needs: signed-owner
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Stage qualified standalone code only
        env:
          OUF_CODE_DIRECTORY: ${{ runner.workspace }}/ouf-ingestion-read-administrative-code-${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B -S scripts/stage-ingestion-read-authorization.py "$GITHUB_WORKSPACE" "$OUF_CODE_DIRECTORY" "$GITHUB_SHA"
