name: OUF proposal seven-mount frame and native custody fixture
on:
  workflow_dispatch:
  push:
    branches: [main, codex/semantic-proposal-frame-20261014]
    paths:
      - tests/native_proposal_seven_mount_v11_execution.py
      - tools/semantic_application_cutover/semantic_proposal_frame_observation.py
      - tools/semantic_frame_compiler/compile_semantic_proposal_frame_policy.py
      - tools/semantic_frame_compiler/test_compile_semantic_proposal_frame_policy.py
      - tools/semantic_application_cutover/six_mount_frame_observation.py
      - tools/semantic_application_cutover/paused_node_observation.py
      - tools/semantic_policy_token_owner/mount_observation.py
      - tools/semantic_application_cutover/configtree_mount_observation.py
      - tools/semantic_application_cutover/projected_frame_observation.py
      - tools/semantic_application_cutover/paused_attestation_adapter.py
      - tests/test_projected_frame_custody.py
      - tools/semantic_application_cutover/gated_process_observation.py
      - tools/semantic_application_cutover/gated_release_adapter.py
      - .github/workflows/semantic-proposal-seven-mount.yml
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  original-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Original signed artifact into disposable trusted fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz --output engine.tgz
          printf '%s\n' 'd8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70  engine.tgz' | sha256sum -c -
          mkdir engine-bin
          tar -xzf engine.tgz --strip-components=1 -C engine-bin
          gh api repos/GioNob/ouf-semantic-registry/actions/artifacts/11710556577/zip > semantic.zip
          OUF_FIXTURE_ROOT="/var/lib/ouf-gated-v11-${GITHUB_RUN_ID}"
          sudo mkdir -m 700 "$OUF_FIXTURE_ROOT"
          sudo cp -R . "$OUF_FIXTURE_ROOT/repository"
          sudo chown -R root:root "$OUF_FIXTURE_ROOT"
          sudo mkdir -m 700 "$OUF_FIXTURE_ROOT/engine"
          printf '%s\n' '{"features":{"containerd-snapshotter":true}}' > "$RUNNER_TEMP/ouf-gated-v11-daemon-${GITHUB_RUN_ID}.json"
          sudo install -o root -g root -m 600 "$RUNNER_TEMP/ouf-gated-v11-daemon-${GITHUB_RUN_ID}.json" "$OUF_FIXTURE_ROOT/engine/daemon.json"
          sudo env PATH="$OUF_FIXTURE_ROOT/repository/engine-bin:/usr/sbin:/usr/bin:/sbin:/bin" "$OUF_FIXTURE_ROOT/repository/engine-bin/dockerd" --config-file "$OUF_FIXTURE_ROOT/engine/daemon.json" --data-root "$OUF_FIXTURE_ROOT/engine/data" \
            --exec-root "$OUF_FIXTURE_ROOT/engine/exec" --pidfile "$OUF_FIXTURE_ROOT/engine/docker.pid" \
            --host "unix://$OUF_FIXTURE_ROOT/engine/docker.sock" --bridge=none --iptables=false --ip6tables=false \
            --ip-masq=false > "$RUNNER_TEMP/ouf-gated-v11-engine-${GITHUB_RUN_ID}.log" 2>&1 &
          OUF_DAEMON_PID=$!
          trap 'sudo kill "$OUF_DAEMON_PID" 2>/dev/null || true' EXIT
          OUF_READY=false
          for OUF_PROBE in {1..30}; do
            if sudo docker --host "unix://$OUF_FIXTURE_ROOT/engine/docker.sock" version --format '{{.Server.Version}}' > /dev/null 2>&1; then OUF_READY=true; break; fi
            sleep 1
          done
          if [ "$OUF_READY" != true ]; then echo OUF_FIXTURE_ENGINE_NOT_READY; exit 1; fi
          sudo --preserve-env=GH_TOKEN env PATH="$OUF_FIXTURE_ROOT/repository/engine-bin:/usr/sbin:/usr/bin:/sbin:/bin" OUF_CUSTODY_SOCKET="$OUF_FIXTURE_ROOT/engine/docker.sock" \
            bash -c 'set -euo pipefail; cd "$1/repository"; python3 -m unittest discover -s tests -p test_projected_frame_custody.py -v; python3 -m unittest discover -s tools/semantic_frame_compiler -p test_compile_semantic_proposal_frame_policy.py -v; python3 tests/native_proposal_seven_mount_v11_execution.py; python3 tests/native_six_mount_v11_execution.py' _ "$OUF_FIXTURE_ROOT"
