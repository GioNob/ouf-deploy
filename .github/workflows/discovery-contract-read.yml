name: Discovery contract read qualification
on:
  push:
    branches: [docs/storage-functional-reset-20261107]
    paths: ['scripts/read-discovery-contract-20261108.py', 'tests/test_discovery_contract_read.py', '.github/workflows/discovery-contract-read.yml']
  pull_request:
    paths: ['scripts/read-discovery-contract-20261108.py', 'tests/test_discovery_contract_read.py', '.github/workflows/discovery-contract-read.yml']
permissions: {contents: read}
jobs:
  readonly-postgres-and-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Fixed read-only SQL, isolated PostgreSQL, route redaction and mounted metadata
        run: OUF_CONTRACT_NATIVE=1 python3 -I -B -m unittest discover -s tests -p test_discovery_contract_read.py -v
