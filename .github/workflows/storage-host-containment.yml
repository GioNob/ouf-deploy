name: Storage host writer containment
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - scripts/storage-host-containment-20261106.py
      - tests/test_storage_host_containment.py
      - tests/qualify_storage_host_containment_native.py
      - .github/workflows/storage-host-containment.yml
permissions:
  contents: read
concurrency:
  group: storage-host-containment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Typed stop hooks and command boundaries
        run: python3 -B -m unittest discover -s tests -p test_storage_host_containment.py -v
      - name: Real systemd host containment and natural writer completion
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -I -B -S tests/qualify_storage_host_containment_native.py
