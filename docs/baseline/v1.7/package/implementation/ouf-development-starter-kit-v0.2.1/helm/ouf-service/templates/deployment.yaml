apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ouf-service.fullname" . | default .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: OUF_IDENTITY_PROFILE_REF
              value: {{ .Values.environmentBindings.identityProfileRef | quote }}
            - name: OUF_OTLP_ENDPOINT_REF
              value: {{ .Values.environmentBindings.otlpEndpointRef | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startupPath }}
              port: http
          resources:
{{ toYaml .Values.resources | indent 12 }}
