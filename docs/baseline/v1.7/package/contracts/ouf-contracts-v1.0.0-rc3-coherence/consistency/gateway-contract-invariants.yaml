version: '0.9'
scope: Urban API Gateway common/runtime contracts and immediate cross-contract consistency
contracts:
- ProblemDetails
- CapabilityManifest
- SourceRuntimeProfile
- ExtractionRuntimeProfile
- RouteBinding
- SourceSchemaBinding
- ClientCredentialBinding
- HealthState
- GatewayConnectorHandoff
- GatewayAuthorizationContext
- GatewayPublicationManifest
invariants:
- id: GW-X01
  rule: Every consumer-facing route resolves to a registered versioned Capability
    Manifest.
- id: GW-X02
  rule: Capability manifest coarse scope/audience protects the boundary but does not
    replace backend fine-grained authorization.
- id: GW-X03
  rule: toolEligible=true is exposure metadata, not ALLOW; toolEligible=false blocks
    MCP exposure.
- id: GW-X04
  rule: RouteBinding capabilityId matches Capability Manifest capabilityId exactly;
    no wildcard/fallback between semantically different capabilities.
- id: GW-X05
  rule: Route sourceId resolves to same SourceRuntimeProfile sourceId.
- id: GW-X06
  rule: Active PULL route resolves exact ExtractionRuntimeProfile id/version.
- id: GW-X07
  rule: Source schema binding/version used at Gateway edge matches handoff schema
    name/version.
- id: GW-X08
  rule: credential values are references only; no secret material is copied into manifests.
- id: GW-X09
  rule: GatewayConnectorHandoff correlationId/sourceId/capabilityId align with route
    and authorization context.
- id: GW-X10
  rule: Gateway hands native payload/reference to Connector; Connector creates CanonicalDataEnvelope.
- id: GW-X11
  rule: Gateway 202 acceptance is not Durable ACK and cannot advance Ingestion committed
    watermark.
- id: GW-X12
  rule: Gateway propagates Problem Details/code/Retry-After from backend/Governor
    without semantic reinterpretation or unauthorized retry.
- id: GW-X13
  rule: Gateway preserves schemaVersion/fingerprint/ETag indicators but does not classify
    schema drift or alter ACTIVE bundle.
- id: GW-X14
  rule: Gateway propagates correlationId/principal/actorType/capabilityId; backend
    re-evaluates fine-grained authorization.
- id: GW-X15
  rule: No token or full sensitive payload is placed in audit/log metadata.
- id: GW-X16
  rule: Southbound upstream is registry/endpointRef bound; client input cannot invent
    host/port.
- id: GW-X17
  rule: Southbound network egress is default-deny independently of route configuration.
- id: GW-X18
  rule: Git/config change is not ACTIVE; controlled publication must validate/compile/apply/verify
    before ACTIVE.
- id: GW-X19
  rule: Control-plane degradation blocks new ACTIVE publication; verified last-known-good
    data plane may continue serving.
- id: GW-X20
  rule: Gateway rate limiting/timeout/request limits do not implement or bypass UDP
    Query Complexity Governor.
- id: GW-X21
  rule: Gateway does not interpret DataAccessLabel, semantic mapping, object resolution
    or lineage.
explicitlyExcluded:
- Query Complexity Governor state/budget
- fine-grained resource authorization policy
- DurableHandoffReceipt/ACK
- schema-drift classification
- ETL/semantic processing
- UDP storage/materialization/query planning
- MCP Server implementation
- THS protected/human confirmation operations
- supplier vertical API contracts
