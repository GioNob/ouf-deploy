name: Owner7 projection authenticated delivery
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['releases/ingestion-profile-publication-bundle-20261019.json', 'scripts/launch-ingestion-profile-publication-20261019.sh', 'tests/test_ingestion_profile_publication_delivery.py', '.github/workflows/ingestion-profile-publication-delivery.yml']
permissions: {contents: read}
jobs:
  immutable-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact qualified sources, immutable Git blob, two SHA checks and root-wrapper syntax
        run: python3 -I -B -S -m unittest discover -s tests -p test_ingestion_profile_publication_delivery.py -v
