name: Acquisition descriptor retained mode continuation
on:
  push:
    paths:
      - releases/read-acquisition-permission-descriptors-20261025.sh
      - releases/resume-acquisition-descriptor-read-mode-20261025.sh
      - tests/test_acquisition_descriptor_mode_continuation.py
      - tests/fixtures/acquisition-descriptor-retained-wrapper-077065.sh
      - .github/workflows/acquisition-descriptor-mode-continuation.yml
  pull_request:
    paths:
      - releases/read-acquisition-permission-descriptors-20261025.sh
      - releases/resume-acquisition-descriptor-read-mode-20261025.sh
      - tests/test_acquisition_descriptor_mode_continuation.py
      - tests/fixtures/acquisition-descriptor-retained-wrapper-077065.sh
      - .github/workflows/acquisition-descriptor-mode-continuation.yml
permissions: {contents: read}
jobs:
  native-filesystem-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo /usr/bin/python3 -I -S -B -m unittest discover -s tests -p test_acquisition_descriptor_mode_continuation.py -v
  retained-delivery-first-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Synthetic retained history with real root umask077 and real operator denial
        run: |
          sudo /usr/bin/python3 -I -S -B - "$PWD" "$(id -u)" <<'PY'
          import hashlib, os, pathlib, sys
          repo, owner = pathlib.Path(sys.argv[1]), int(sys.argv[2])
          home = pathlib.Path('/home/oufadmin')
          boot = home / 'ouf-descriptor-bootstrap.mIZy6zES'
          delivery = home / 'ouf-acquisition-descriptor-read-delivery.XdyYVHv1'
          for path in (home, boot, delivery):
              os.mkdir(path, 0o700)
              os.chown(path, owner, owner)
          code = (repo/'scripts/read-acquisition-permission-descriptors-20261025.py').read_bytes()
          wrapper = (repo/'tests/fixtures/acquisition-descriptor-retained-wrapper-077065.sh').read_bytes()
          assert hashlib.sha256(code).hexdigest() == '062b1e201904b9fd7a10efcad371de17d4c0fbc3411710c310186aa7381c5cad'
          assert hashlib.sha256(wrapper).hexdigest() == '5af3e992228a0fe57adf6db4a568d61624543ea00429e7f2463b5b2836276314'
          for path, raw in ((boot/'run.sh', wrapper), (delivery/'read.py', code)):
              path.write_bytes(raw)
              path.chmod(0o600)
              os.chown(path, owner, owner)
          directory = pathlib.Path('/usr/local/lib/ouf-acquisition-permission-descriptor-read-062b1e201904b9fd')
          os.mkdir(directory, 0o755)
          os.umask(0o077)
          fd = os.open(directory/'read.py', os.O_WRONLY|os.O_CREAT|os.O_EXCL, 0o444)
          os.write(fd, code)
          os.fsync(fd)
          os.close(fd)
          directory.chmod(0o555)
          log = delivery/'bootstrap.log'
          log.write_text('ProtectedCode='+str(directory/'read.py')+'\n'+str(directory/'read.py')+': FAILED open or read\nDeliveryExit=1\nDeliveryDirectory='+str(delivery)+'\n')
          log.chmod(0o600)
          os.chown(log, owner, owner)
          PY
          code=/usr/local/lib/ouf-acquisition-permission-descriptor-read-062b1e201904b9fd/read.py
          test "$(stat -c '%u:%a' "$code")" = '0:400'
          set +e
          sha256sum "$code"
          denied=$?
          set -e
          test "$denied" = 1
          echo 'Actual unprivileged read denied for root0400 under real umask077'
      - name: Exact continuation preserves old logs; first read stops before login without TTY
        shell: bash
        run: |
          old=/home/oufadmin/ouf-acquisition-descriptor-read-delivery.XdyYVHv1/bootstrap.log
          before=$(sha256sum "$old")
          set +e
          bash releases/resume-acquisition-descriptor-read-mode-20261025.sh > mode-continuation.log 2>&1
          observed=$?
          set -e
          cat mode-continuation.log
          test "$observed" = 2
          grep -F '"state":"APPLIED"' mode-continuation.log
          grep -F 'INTERACTIVE_OPERATOR_TERMINAL_REQUIRED' mode-continuation.log
          test "$before" = "$(sha256sum "$old")"
          test ! -e /home/oufadmin/ouf-acquisition-permission-descriptor-read-20261025
          code=/usr/local/lib/ouf-acquisition-permission-descriptor-read-062b1e201904b9fd/read.py
          test "$(stat -c '%u:%a' "$code")" = '0:444'
          printf '%s  %s\n' 062b1e201904b9fd7a10efcad371de17d4c0fbc3411710c310186aa7381c5cad "$code" | sha256sum -c -
          set +e
          bash releases/resume-acquisition-descriptor-read-mode-20261025.sh >> mode-continuation.log 2>&1
          repeated=$?
          set -e
          test "$repeated" != 0
          sudo /usr/bin/python3 -I -S -B -c 'import json; p=json.load(open("/usr/local/lib/ouf-acquisition-permission-descriptor-read-062b1e201904b9fd/permission-mode-v1.json")); assert p["state"] == "APPLIED" and p["chmodOperations"] == 1 and p["iamRequests"] == p["ownerRequests"] == 0'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: retained-mode-continuation, path: mode-continuation.log, retention-days: 30}
  future-copy-restrictive-umask:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exact fixed copier under root umask077, then real nonroot checksum
        run: |
          install -m 0600 scripts/read-acquisition-permission-descriptors-20261025.py "$RUNNER_TEMP/public-read.py"
          sudo /usr/bin/python3 -I -S -B - "$PWD" "$RUNNER_TEMP/public-read.py" "$(id -u)" <<'PY'
          import os, pathlib, sys
          repo, public_source, owner = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          text = (repo/'releases/read-acquisition-permission-descriptors-20261025.sh').read_text()
          source = text[text.index('import hashlib, os, re, stat, sys'):text.index('\nPY\n')]
          sys.argv = ['exact-fixed-copier', public_source, '062b1e201904b9fd7a10efcad371de17d4c0fbc3411710c310186aa7381c5cad', owner]
          os.umask(0o077)
          exec(compile(source, 'exact-fixed-copier', 'exec'), {'__name__':'__main__'})
          PY
          code=/usr/local/lib/ouf-acquisition-permission-descriptor-read-062b1e201904b9fd/read.py
          test "$(stat -c '%u:%a' "$code")" = '0:444'
          printf '%s  %s\n' 062b1e201904b9fd7a10efcad371de17d4c0fbc3411710c310186aa7381c5cad "$code" | sha256sum -c -
