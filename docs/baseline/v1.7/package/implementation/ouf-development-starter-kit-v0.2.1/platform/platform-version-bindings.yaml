version: 1
status: TO_BE_BOUND_BY_PLATFORM
runtime:
  java: "21"
  springBoot: null
  flyway: null
  testcontainers: null
  jackson: SPRING_BOM
  opentelemetry: PLATFORM_BOM
database:
  postgresqlMajor: "17"
deployment:
  kubernetesProfileRef: env://platform/kubernetes-profile
gitops:
  controllerRef: env://platform/gitops-controller
rules:
  - Exact patch/minor versions are platform bindings, not module-local architecture decisions.
  - A module repository MUST NOT pin a conflicting Spring Boot platform line.
  - A platform pin change requires compatibility CI before rollout.
