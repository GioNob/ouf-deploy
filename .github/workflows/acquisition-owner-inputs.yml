name: Acquisition owner read current inputs
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths:
      - scripts/read-acquisition-owner-inputs-20261025.py
      - tests/test_acquisition_owner_inputs.py
      - .github/workflows/acquisition-owner-inputs.yml
  pull_request:
    paths:
      - scripts/read-acquisition-owner-inputs-20261025.py
      - tests/test_acquisition_owner_inputs.py
      - .github/workflows/acquisition-owner-inputs.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  root-unix-and-native-docker-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify bytecode compilation
        run: python3 -m py_compile scripts/read-acquisition-owner-inputs-20261025.py tests/test_acquisition_owner_inputs.py
      - name: Root Unix peer, real Docker1.44 GETs, process pins, private outputs, replay/drift rejection
        run: |
          sudo -E env OUF_CAPTURE_TEST_PARENT=/run OUF_NATIVE_ENGINE=1 \
            python3 -m unittest discover -s tests -p test_acquisition_owner_inputs.py -v
