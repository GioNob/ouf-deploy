name: Governed platform restart
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/platform-restart.yml'
      - 'contracts/platform-restart-profile-v1.schema.json'
      - 'ops/vps/platform-restart*.sh'
      - 'ops/vps/systemd/ouf-platform-start.service'
      - 'scripts/platform-restart.py'
      - 'tests/test_platform_restart*.py'
      - 'tools/platform_restart/**'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Portable governance tests
        run: python -m unittest discover -s tests -p 'test_platform_restart.py' -v
      - name: Local Docker lifecycle
        env:
          OUF_PLATFORM_RESTART_NATIVE: '1'
        run: python -m unittest discover -s tests -p 'test_platform_restart_native.py' -v
