name: Fresh retained package crypto and security
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retained-package-current-security.yml
      - scripts/verify-current-retained-security.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reverify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: semantic
            artifact: 11676412613
            publisher: 11676214297
          - module: ingestion
            artifact: 11676720102
            publisher: 11676991790
          - module: udp
            artifact: 11676625220
            publisher: 11676389122
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve unchanged original ZIP and existing publisher proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/GioNob/ouf-deploy/actions/artifacts/${{ matrix.artifact }}/zip > candidate.zip
          gh api repos/GioNob/ouf-deploy/actions/artifacts/${{ matrix.publisher }}/zip > publisher.zip
      - uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        with:
          cosign-release: v3.1.3
      - name: Reverify exact original bytes and original publisher identity without signing
        run: python3 scripts/verify-current-retained-security.py verify '${{ matrix.module }}'
      - name: Scan exact offline archive against current vulnerability databases
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          input: image.docker.tar
          scan-type: image
          scanners: vuln
          format: json
          output: fresh-evidence/trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0' # The following image-bound policy step rejects HIGH/CRITICAL/UNKNOWN; retain lower severities.
          cache: false
          timeout: 10m
      - name: Retain image identity, current coverage and denial counts
        if: always()
        run: |
          if [ -f fresh-evidence/trivy.json ]; then
            python3 scripts/verify-current-retained-security.py scan '${{ matrix.module }}'
          else
            echo OUF_FRESH_SCAN_UNPROVEN
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-retained-security-${{ matrix.module }}-${{ github.run_id }}
          path: fresh-evidence/
          retention-days: 30
          if-no-files-found: error
