name: Installation binding apply authenticated ten-file delivery
on:
  push:
    paths:
      - 'scripts/launch-installation-binding-apply-20261019.sh'
      - 'tests/test_installation_binding_apply_delivery.py'
      - 'evidence/installation-binding-apply-delivery-pins-20261019.json'
      - '.github/workflows/installation-binding-apply-delivery.yml'
permissions: {contents: read}
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Portable authenticated gh exact ten pins tamper and missing-client denials
        run: python3 -I -B -S -m unittest discover -s tests -p test_installation_binding_apply_delivery.py -v
