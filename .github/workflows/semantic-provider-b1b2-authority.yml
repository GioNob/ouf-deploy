name: Semantic provider B1 B2 authority
on:
  pull_request:
    paths:
      - tools/semantic_b1b2_authority/__init__.py
      - tools/semantic_b1b2_authority/authority.py
      - scripts/prepare-semantic-provider-b1b2-trust-policy.py
      - scripts/deliver-semantic-provider-b1b2-trust-policy.sh
      - tests/test_semantic_b1b2_authority.py
      - .github/workflows/semantic-provider-b1b2-authority.yml
      - docs/OUF_SEMANTIC_PROVIDER_B1B2_TRUST_POLICY_20261112.md
permissions: {contents: read}
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify B1 B2 signatures and root custody natively
        run: sudo -n env OUF_B1B2_NATIVE=1 /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_b1b2_authority.py -v
      - name: Check delivery launcher syntax
        run: bash -n scripts/deliver-semantic-provider-b1b2-trust-policy.sh
