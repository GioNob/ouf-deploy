name: Explicit finite technical OAuth budget without login
on:
  pull_request:
    paths:
      - 'tools/ingestion_rollout_preparation/oauth_budget*.py'
      - 'tests/test_technical_oauth_budget*.py'
      - 'releases/technical-oauth-budget-extension-case-20261021.json'
      - 'scripts/*technical-oauth-budget-extension-20261021*'
      - '.github/workflows/technical-oauth-budget-extension.yml'
permissions: {contents: read}
jobs:
  separate-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Root custody, real controlling PTY, concurrent grants, crash fencing and sealed process
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-budget-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          bash -n scripts/launch-technical-oauth-budget-extension-20261021.sh
          sudo env GITHUB_ACTIONS=true OUF_TEST_ROOT="$fixture" "$pythonLocation/bin/python3" -I -B -S -m unittest discover -s "$fixture/repository/tests" -p 'test_technical_oauth_budget*.py' -v
