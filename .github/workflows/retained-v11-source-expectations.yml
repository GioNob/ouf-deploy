name: OUF retained V11 private source expectations qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/prepare-retained-v11-source-expectations.py
      - releases/retained-v11-source-expectations-20261012.sh
      - tests/test_retained_v11_source_expectations.py
      - tests/test_retained_v11_expectations_delivery.py
      - .github/workflows/retained-v11-source-expectations.yml
permissions:
  contents: read
jobs:
  source-expectations-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Sealed delivery and two-source root recheck
        run: python3 -m unittest discover -s tests -p test_retained_v11_expectations_delivery.py -v
      - name: Native root custody, 10001 identities and atomic private publication
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-retained-expectations-${GITHUB_RUN_ID}"
          sudo mkdir -m 700 "$OUF_FIXTURE_ROOT"
          sudo cp -R . "$OUF_FIXTURE_ROOT/repository"
          sudo chown -R root:root "$OUF_FIXTURE_ROOT"
          sudo env OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_retained_v11_source_expectations.py -v
