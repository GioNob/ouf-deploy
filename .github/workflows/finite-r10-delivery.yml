name: R10 immutable operator delivery
on:
  push:
    branches: [main]
    paths:
      - 'releases/provider-finite-r10-approved-20261010.sh'
      - 'tools/semantic_lease_recovery/test_r10_delivery.py'
      - '.github/workflows/finite-r10-delivery.yml'
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Seven pinned downloads, tamper denial and isolated root bootstrap
        run: python3 -B -m unittest discover -v -s tools/semantic_lease_recovery -p 'test_r10_delivery.py'
