name: OUF read-only Semantic database cutover metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/read-semantic-database-cutover-metadata.py
      - .github/workflows/semantic-database-cutover-metadata.yml
permissions:
  contents: read
concurrency:
  group: ouf-semantic-db-cutover-metadata
  cancel-in-progress: false
jobs:
  read:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read only catalog and session aggregates with stable bindings
        run: python3 scripts/read-semantic-database-cutover-metadata.py
