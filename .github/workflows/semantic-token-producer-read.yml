name: OUF semantic token producer read-only source qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/read-semantic-token-producer.py
      - releases/semantic-token-producer-read-20261012.sh
      - tests/test_semantic_token_producer.py
      - tests/test_semantic_token_producer_delivery.py
      - .github/workflows/semantic-token-producer-read.yml
permissions:
  contents: read
jobs:
  inspect-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Three-source sealed delivery and root rechecks
        run: python3 -m unittest discover -s tests -p test_semantic_token_producer_delivery.py -v
      - name: Native root custody, no-follow credential exclusion and AST value redaction
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-token-producer-read-${GITHUB_RUN_ID}"
          sudo mkdir -m 700 "$OUF_FIXTURE_ROOT"
          sudo cp -R . "$OUF_FIXTURE_ROOT/repository"
          sudo chown -R root:root "$OUF_FIXTURE_ROOT"
          sudo env OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_semantic_token_producer.py -v
