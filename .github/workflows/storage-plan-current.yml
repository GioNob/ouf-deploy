  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: storage-plan-current-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-current-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate the additive current qualification view
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/storage-plan-current-evidence"
          mkdir -p "$evidence"
          python3 -I -B -S -m unittest discover \
            -s tests -p test_minio_seaweedfs_plan_current.py -v 2>&1 |
            tee "$evidence/test.log"
          python3 -I -B -S scripts/verify-minio-seaweedfs-plan-current.py \
            --output "$evidence/verification.json"

      - name: Bind all current inputs and verify the manifest
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/storage-plan-current-evidence"
          sha256sum \
            releases/minio-seaweedfs-plan-20261102.json \
            releases/seaweedfs-452-candidate-lock-20261103.json \
            evidence/seaweedfs-452-cohort-readback-hosted-20261103.json \
            evidence/seaweedfs-sdk-v1-basic-tests-local-20261103.json \
            evidence/seaweedfs-sdk-v1-multipart-tool-local-20261103.json \
            evidence/seaweedfs-sdk-v1-volume-grpc-test-local-20261103.json \
            evidence/seaweedfs-sdk-v1-s3tables-signer-local-20261103.json \
            evidence/seaweedfs-sdk-v1-sse-tests-local-20261103.json \
            evidence/seaweedfs-sdk-v1-iam-sts-signer-local-20261103.json \
            evidence/seaweedfs-sdk27-hosted-20261103.json \
            evidence/sdk27-artifacts/*/* \
            evidence/seaweedfs-ouf-standard-module-closure-hosted-20261103.json \
            evidence/storage-ouf-standard-41691297148/* \
            evidence/seaweedfs-452-cold-recovery-mime-failed-20261103.json \
            evidence/seaweedfs-452-cold-recovery-hosted-20261103.json \
            evidence/seaweedfs-452-cold-recovery-hosted-20261103/* \
            evidence/seaweedfs-452-generation29-image-hosted-20261103.json \
            releases/seaweedfs-452-generation29-build-manifest-20261103.json \
            patches/seaweedfs/4.52-ouf-standard-optional-closure.patch \
            patches/seaweedfs/4.52-bucket-policy-tests-sdk-v2.patch \
            patches/seaweedfs/4.52-normal-tests-sdk-v2.patch \
            patches/seaweedfs/4.52-iam-service-account-sdk-v2.patch \
            patches/seaweedfs/4.52-kafka-test-module-remove-sdk-v1.patch \
            patches/seaweedfs/4.52-root-iam-tests-sdk-v2.patch \
            patches/seaweedfs/4.52-iam-module-sdk-v2.patch \
            scripts/verify-minio-seaweedfs-plan-current.py \
            tests/test_minio_seaweedfs_plan_current.py \
            .github/workflows/storage-plan-current.yml \
            > "$evidence/input-sha256.txt"
          python3 -I -B -S - <<'PYCODE' >> "$evidence/input-sha256.txt"
          import hashlib, json, os
          from pathlib import Path
          plan = json.loads(Path('releases/minio-seaweedfs-plan-20261102.json').read_bytes())
          paths = {'scripts/verify-minio-seaweedfs-plan-generation31.py'}
          for current in (plan['currentQualification'], plan['historicalQualification31'], plan['historicalQualification29']):
              generation = current['generation']
              cohort = json.loads(Path(current['cohortReceipt']).read_bytes())
              runtime = json.loads(Path(current['runtimeReceipt']).read_bytes())
              manifest_path = f'releases/seaweedfs-452-generation{generation}-build-manifest-20261103.json'
              manifest = json.loads(Path(manifest_path).read_bytes())
              paths.update((current['candidateLock'], current['imageReceipt'], current['cohortReceipt'], current['runtimeReceipt'], manifest_path))
              if generation == 32:
                  lock = json.loads(Path(current['candidateLock']).read_bytes())
                  paths.add('scripts/verify-minio-seaweedfs-plan-generation32.py')
                  paths.update(runtime['sourceHashesVerified'])
                  paths.update(item['path'] for item in manifest['orderedPatches'])
                  paths.update((cohort['artifact']['path'], runtime['artifact']['path']))
                  paths.update(lock[key]['path'] for key in (
                      'buildEvidenceArtifact', 'independentReadback', 'licenceRebinding', 'mongoV2LegalDelta'))
                  continue
              jobs = runtime.get('hostedJobMetadata', runtime.get('workflowJobsEvidence'))
              paths.add(jobs['path'])
              paths.update(cohort['retainedRawEvidence'])
              paths.update(item['path'] for item in runtime['rawEvidence']['files'])
              paths.update(runtime['sourceHashesVerified'])
              paths.update(item['path'] for item in manifest['orderedPatches'])
              if generation == 31:
                  image = json.loads(Path(current['imageReceipt']).read_bytes())
                  paths.update(image['preservedFiles'])
                  paths.add(image['buildEvidenceArtifact']['path'])
                  paths.add(image['independentReadback']['path'])
                  paths.add(cohort['artifact']['path'])
          lifecycle = plan['historicalQualification29']['dependencyLifecycle']['widerInventoryAssessment']
          paths.add(lifecycle['inventoryReceipt'])
          paths.update(str(path) for path in Path('evidence/lifecycle262').rglob('*') if path.is_file())
          existing = Path(os.environ['RUNNER_TEMP']) / 'storage-plan-current-evidence/input-sha256.txt'
          paths.difference_update(line.split('  ', 1)[1] for line in existing.read_text().splitlines())
          for name in sorted(paths):
              print(hashlib.sha256(Path(name).read_bytes()).hexdigest() + '  ' + name)
          PYCODE
          cd "$evidence"
          sha256sum input-sha256.txt test.log verification.json | LC_ALL=C sort > SHA256SUMS
          sha256sum --strict --check SHA256SUMS

      - name: Attest the bounded evidence manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ runner.temp }}/storage-plan-current-evidence/SHA256SUMS

      - name: Retain the bounded evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-plan-current-${{ github.run_id }}
          path: ${{ runner.temp }}/storage-plan-current-evidence/
          if-no-files-found: error
          retention-days: 90
