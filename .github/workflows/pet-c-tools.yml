name: PET C tools
on:
  pull_request:
    paths:
      - 'tools/pet_c/**'
      - 'config/pet-c/**'
      - 'tests/test_pet_c_*.py'
      - '.github/workflows/pet-c-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -B -m unittest discover -s tests -p 'test_pet_c_*.py' -v
