name: Storage root IAM tests on maintained SDK

on:
  push:
    branches:
      - feat/m2-discovery-complete-profile-20261029
    paths:
      - .github/workflows/storage-root-iam-tests-sdk-v2.yml
      - patches/seaweedfs/4.52-root-iam-tests-sdk-v2.patch
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: storage-root-iam-tests-sdk-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-root-iam-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seaweedfs/seaweedfs
          ref: 984eac6a790be89e2a11de175a7413e1e3e32dd3
          path: seaweedfs
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false

      - name: Apply the exact patch sequence and bind the remaining source scope
        working-directory: seaweedfs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 984eac6a790be89e2a11de175a7413e1e3e32dd3
          for patch in \
            ../patches/seaweedfs/4.52-listing-remove-sdk-v1.patch \
            ../patches/seaweedfs/4.52-bucket-xml-response-remove-sdk-v1.patch \
            ../patches/seaweedfs/4.52-master-follower-remove-sdk-v1.patch \
            ../patches/seaweedfs/4.52-iam-wire-remove-sdk-v1.patch \
            ../patches/seaweedfs/4.52-s3-wire-remove-sdk-v1.patch \
            ../patches/seaweedfs/4.52-sqs-sdk-v2.patch \
            ../patches/seaweedfs/4.52-kms-sdk-v2.patch \
            ../patches/seaweedfs/4.52-s3sink-sdk-v2.patch \
            ../patches/seaweedfs/4.52-s3backend-sdk-v2.patch \
            ../patches/seaweedfs/4.52-remote-storage-s3-sdk-v2.patch \
            ../patches/seaweedfs/4.52-s3-wire-parser-remove-sdk-v1.patch \
            ../patches/seaweedfs/4.52-test-fixtures-remove-sdk-v1.patch \
            ../patches/seaweedfs/4.52-storage-test-tools-sdk-v2.patch \
            ../patches/seaweedfs/4.52-remote-cache-tests-sdk-v2.patch \
            ../patches/seaweedfs/4.52-go-network-security-fixes.patch \
            ../patches/seaweedfs/4.52-basic-tests-sdk-v2.patch \
            ../patches/seaweedfs/4.52-multipart-tool-sdk-v2.patch \
            ../patches/seaweedfs/4.52-volume-grpc-s3-test-sdk-v2.patch \
            ../patches/seaweedfs/4.52-s3tables-signer-sdk-v2.patch \
            ../patches/seaweedfs/4.52-sse-tests-sdk-v2.patch \
            ../patches/seaweedfs/4.52-iam-sts-signer-sdk-v2.patch \
            ../patches/seaweedfs/4.52-bucket-policy-tests-sdk-v2.patch \
            ../patches/seaweedfs/4.52-normal-tests-sdk-v2.patch \
            ../patches/seaweedfs/4.52-iam-service-account-sdk-v2.patch \
            ../patches/seaweedfs/4.52-kafka-test-module-remove-sdk-v1.patch \
            ../patches/seaweedfs/4.52-root-iam-tests-sdk-v2.patch \
            ../patches/seaweedfs/4.52-iam-module-sdk-v2.patch
          do
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check
          mkdir -p "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence"
          (grep -RIl --include='*.go' -F '"github.com/aws/aws-sdk-go/' . || test "$?" -eq 1) |
            sed 's|^./||' | LC_ALL=C sort > "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/remaining-direct-importers.txt"
          test "$(wc -l < "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/remaining-direct-importers.txt")" -eq 0
          if grep -R --include='*.go' -F '"github.com/aws/aws-sdk-go/' test/s3/policy test/s3/normal; then
            exit 1
          fi
          go list -mod=readonly -deps -test ./test/s3/policy ./test/s3/normal |
            LC_ALL=C sort -u > "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/root-iam-test-deps.txt"
          if grep -Eq '^github.com/aws/(aws-sdk-go|aws-sdk-go-v2/feature/s3/manager)(/|$)' "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/root-iam-test-deps.txt"; then
            exit 1
          fi
          go list -m -json github.com/aws/aws-sdk-go-v2/service/iam > "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/iam-module.json"
          test "$(go list -m -f '{{.Version}}' github.com/aws/aws-sdk-go-v2/service/iam)" = v1.64.6
          printf '%s\n' 984eac6a790be89e2a11de175a7413e1e3e32dd3 > "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/upstream-source-sha.txt"
          sha256sum ../patches/seaweedfs/4.52-root-iam-tests-sdk-v2.patch > "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/patch-sha256.txt"
          git diff --stat > "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/patch-stat.txt"

      - name: Compile the integration package and run the bounded regression
        working-directory: seaweedfs
        run: |
          set -euo pipefail
          go test -mod=readonly -v -run '^$' ./test/s3/policy ./test/s3/normal |
            tee "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/compile.log"
          go test -mod=readonly -v -run '^Test(PolicyIAMSDKV2|NormalIAMSDKV2|BucketPolicySDKV2|NormalSDKV2)' -count=1 -timeout=60s ./test/s3/policy ./test/s3/normal |
            tee "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/test.log"

      - name: Prove the production graph and binary remain the qualified candidate
        working-directory: seaweedfs
        run: |
          set -euo pipefail
          go list -mod=readonly -deps ./weed | LC_ALL=C sort -u > "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/production-deps.txt"
          echo "cb2536b10d73bc04e587c257a75a622c6b3cf855f1d232f26dba246b43b03f4a  $RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/production-deps.txt" | sha256sum -c -
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/root-iam-weed" ./weed
          echo "85fa52c68a783f3cf4d54ae6064e7b46d022982c1bef4460616dd76cdc609033  $RUNNER_TEMP/root-iam-weed" | sha256sum -c -
          go version -m "$RUNNER_TEMP/root-iam-weed" > "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/build-info.txt"
          sha256sum "$RUNNER_TEMP/root-iam-weed" > "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence/binary-sha256.txt"
          cd "$RUNNER_TEMP/storage-root-iam-sdk-v2-evidence"
          sha256sum ./* | LC_ALL=C sort > SHA256SUMS
          sha256sum --strict --check SHA256SUMS

      - name: Attest the bounded evidence manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ runner.temp }}/storage-root-iam-sdk-v2-evidence/SHA256SUMS

      - name: Retain the bounded evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-root-iam-sdk-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/storage-root-iam-sdk-v2-evidence/
          if-no-files-found: error
          retention-days: 90
