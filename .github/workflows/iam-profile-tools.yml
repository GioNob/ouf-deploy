name: IAM profile tools

on:
  pull_request:
    paths:
      - 'tools/iam_profile/**'
      - 'config/iam-profile/**'
      - 'tests/test_iam_profile_*.py'
      - '.github/workflows/iam-profile-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -B -m unittest discover -s tests -p 'test_iam_profile_*.py' -v
