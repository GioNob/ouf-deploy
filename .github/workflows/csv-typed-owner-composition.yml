name: CSV typed owner contract composition
on:
  pull_request:
    paths: ['tests/fixtures/csv-typed-owner-composition/**', '.github/workflows/csv-typed-owner-composition.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  typed-owner-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env: {POSTGRES_DB: csv_ing, POSTGRES_USER: ouf, POSTGRES_PASSWORD: ci-only-password}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ouf -d csv_ing" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OUF_CSV_DB_USER: ouf
      OUF_CSV_DB_PASSWORD: ci-only-password
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-source-onboarding
          ref: 17a68aea8dccb603405ec4761cb9f52666692a32
          path: .pairwise/onboarding
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-ingestion-runtime
          ref: bcc13544afdea6f5d331292f93eef86726587e2b
          path: .pairwise/ingestion
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-udp-object-resolution
          ref: df1f4c38d31da8a8ac63d5a5cb2532f633778979
          path: .pairwise/udp
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Build the three exact qualified module candidates
        run: |
          set -euo pipefail
          for module in onboarding ingestion udp; do
            (
              cd ".pairwise/$module"
              bash scripts/install-authorization-sdk.sh
              mvn -B -ntp -DskipTests package dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=target/csv-composition.classpath
            )
          done
      - name: Compile explicit owner composition fixtures
        run: |
          set -euo pipefail
          for module in onboarding ingestion udp; do
            case "$module" in
              onboarding) phase=OnboardingPhase ;;
              ingestion) phase=IngestionPhase ;;
              udp) phase=UdpPhase ;;
            esac
            mkdir -p "target/csv-owner-classes/$module"
            cp_value=".pairwise/$module/target/classes:$(cat ".pairwise/$module/target/csv-composition.classpath")"
            javac --release 21 -cp "$cp_value" -d "target/csv-owner-classes/$module" "tests/fixtures/csv-typed-owner-composition/$phase.java"
          done
      - name: Compose proposal, two new acquisitions and canonical persisted readback
        run: |
          set -euo pipefail
          psql --host=127.0.0.1 --port=5432 --username=ouf --dbname=csv_ing --set=ON_ERROR_STOP=1 --command='CREATE DATABASE csv_udp'
          cp_onboarding="target/csv-owner-classes/onboarding:.pairwise/onboarding/target/classes:$(cat .pairwise/onboarding/target/csv-composition.classpath)"
          cp_ingestion="target/csv-owner-classes/ingestion:.pairwise/ingestion/target/classes:$(cat .pairwise/ingestion/target/csv-composition.classpath)"
          cp_udp="target/csv-owner-classes/udp:.pairwise/udp/target/classes:$(cat .pairwise/udp/target/csv-composition.classpath)"
          java -cp "$cp_onboarding" ouf.fixture.OnboardingPhase target/csv-owner-proposal.json
          OUF_CSV_DB_URL=jdbc:postgresql://127.0.0.1:5432/csv_ing java -cp "$cp_ingestion" it.comune.trieste.ouf.ingestion.IngestionPhase target/csv-owner-proposal.json target/csv-owner-handoffs.json "$GITHUB_WORKSPACE/.pairwise/ingestion/src/main/resources/db/migration"
          OUF_CSV_DB_URL=jdbc:postgresql://127.0.0.1:5432/csv_udp java -cp "$cp_udp" ouf.fixture.UdpPhase target/csv-owner-handoffs.json target/csv-owner-proof.json "$GITHUB_WORKSPACE/.pairwise/udp/src/main/resources/db/migration"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: csv-typed-owner-proof-${{ github.run_id }}
          path: target/csv-owner-proof.json
          retention-days: 30
