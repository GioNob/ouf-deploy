name: Retained file-loop package publisher provenance
on:
  push:
    branches: [codex/file-loop-package-provenance-20261010]
    paths:
      - .github/workflows/file-loop-package-provenance.yml
      - scripts/verify-retained-file-loop-package.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  attest-retained-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: semantic
            artifact: 11676412613
          - module: ingestion
            artifact: 11676720102
          - module: udp
            artifact: 11676625220
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download original producer ZIP without rebuilding or repacking
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir retained
          gh api 'repos/GioNob/ouf-deploy/actions/artifacts/${{ matrix.artifact }}/zip' > retained/${{ matrix.module }}.zip
      - name: Verify producer digest, member hashes, exact source image and scan
        run: |
          python3 scripts/verify-retained-file-loop-package.py --module '${{ matrix.module }}' \
            --zip retained/${{ matrix.module }}.zip --output retained/continuity.json
          python3 - <<'PY'
          import hashlib,pathlib
          root=pathlib.Path('retained')
          files=sorted(root.glob('*'))
          with (root/'subjects.sha256').open('w') as output:
              for path in files:
                  with path.open('rb') as source: value=hashlib.file_digest(source,'sha256').hexdigest()
                  output.write(value+'  '+str(path)+'\n')
          PY
      - name: Install checksum-verified keyless publisher signer
        uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        with:
          cosign-release: v3.1.3
      - name: Sign retained bytes with hosted OIDC and verify exact identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          cp retained/continuity.json retained/subjects.sha256 evidence/
          IDENTITY="https://github.com/GioNob/ouf-deploy/.github/workflows/file-loop-package-provenance.yml@$GITHUB_REF"
          for file in retained/${{ matrix.module }}.zip retained/continuity.json; do
            BUNDLE="evidence/$(basename "$file").sigstore.json"
            cosign sign-blob --yes --bundle "$BUNDLE" "$file"
            cosign verify-blob "$file" --bundle "$BUNDLE" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository GioNob/ouf-deploy \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              > "evidence/$(basename "$file").verification.txt" 2>&1
          done
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('evidence/publisher.json').write_text(json.dumps({
              'schema':'ouf.retained-package-keyless-publisher.v1',
              'publisherWorkflow':'GioNob/ouf-deploy/.github/workflows/file-loop-package-provenance.yml',
              'publisherSourceCommit':os.environ['GITHUB_SHA'],
              'publisherSourceRef':os.environ['GITHUB_REF'],
              'issuer':'https://token.actions.githubusercontent.com',
              'signer':'COSIGN_3_1_3_KEYLESS_FULCIO_REKOR',
              'githubAttestationApiUsed':False,
              'installationAuthorityAccepted':False,
              'targetApplyAuthorized':False,'notReleaseAcceptance':True},indent=2)+chr(10))
          PY
          echo OUF_RETAINED_PACKAGE_PUBLISHER_CRYPTO=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: file-loop-publisher-provenance-${{ matrix.module }}-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
