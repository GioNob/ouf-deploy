name: Readiness patch private input reader
on:
  push:
    branches: [feat/csv-e2e-owner-composition-20261020]
    paths:
      - tools/readiness_patch_inputs/**
      - releases/ingestion-readiness-patch-input-case-20261021.json
      - .github/workflows/readiness-patch-inputs.yml
  pull_request:
    paths:
      - tools/readiness_patch_inputs/**
      - releases/ingestion-readiness-patch-input-case-20261021.json
      - .github/workflows/readiness-patch-inputs.yml
permissions: {contents: read}
jobs:
  finite-input-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.12', '3.13.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify custody, exact runtime identity and no-replay boundaries
        run: python -m unittest discover -s tools/readiness_patch_inputs/tests -v
