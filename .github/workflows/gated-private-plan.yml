name: OUF gated private plan no-apply qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/prepare-gated-v11-private-plan.py
      - releases/gated-v11-private-plan-20261012.sh
      - tests/test_gated_private_plan.py
      - tests/test_gated_private_plan_delivery.py
      - .github/workflows/gated-private-plan.yml
permissions:
  contents: read
jobs:
  prepare-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Every download and digest failure stops before sudo
        run: python3 -m unittest discover -s tests -p test_gated_private_plan_delivery.py -v
      - name: Actual root private publication and no secret-content reads
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-gated-plan-${GITHUB_RUN_ID}"
          sudo mkdir -m 700 "$OUF_FIXTURE_ROOT"
          sudo cp -R . "$OUF_FIXTURE_ROOT/repository"
          sudo chown -R root:root "$OUF_FIXTURE_ROOT"
          sudo bash -c 'set -euo pipefail; cd "$1/repository"; python3 -m unittest discover -s tests -p test_gated_private_plan.py -v' _ "$OUF_FIXTURE_ROOT"
