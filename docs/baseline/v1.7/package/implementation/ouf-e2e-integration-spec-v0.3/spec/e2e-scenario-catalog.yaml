scenarios:
- id: OUF-E2E-001
  title: Schema drift breaking
  legacyTrace: XMA E2E-X01
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X01; Gateway/Onboarding/Ingestion PET boundaries
  actors:
  - SERVICE_IDENTITY
  - HUMAN_USER
  modules:
  - Gateway
  - Ingestion
  - Onboarding
  purpose: Verify a breaking source-schema change is stopped before unsafe processing, requires a new approved configuration
    bundle, and resumes only from the committed watermark.
  preconditions:
  - An ACTIVE PublishedConfigurationBundle A and SourceSchemaBinding A exist for the affected type.
  - A successful ingestion checkpoint/watermark W0 is committed.
  - Gateway can perform technical preflight and preserve source schema indicators without classifying drift.
  steps:
  - Run preflight against schema/fingerprint A and record the technical indicators.
  - Change the source fixture with a BREAKING schema change and repeat preflight through Gateway.
  - Verify Ingestion/Onboarding classifies the affected type as breaking and blocks further processing for that
    type before canonical materialization.
  - Create a new OnboardingVersion with the required corrected schema/mapping configuration and publish immutable
    bundle B through the HUMAN_USER approval path.
  - Resume ingestion using bundle B from committed watermark W0 and complete downstream handoff/materialization.
  assertions:
  - Gateway only transports technical indicators and does not classify drift or mutate the bundle.
  - The affected type does not continue under bundle A after the BREAKING classification.
  - Committed watermark does not advance while the affected type is blocked.
  - The resumed run pins bundle B and exact schema/semantic references; no implicit current/ACTIVE substitution
    occurs.
  evidence:
  - preflight evidence A/B
  - drift classification record
  - bundle A/B IDs, versions and checksums
  - watermark before/block/resume
  - resumed run + lineage evidence
- id: OUF-E2E-002
  title: Durable ACK failure
  legacyTrace: XMA E2E-X02
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X02; Ingestion v1.2 Durable ACK semantics
  actors:
  - SERVICE_IDENTITY
  modules:
  - Gateway
  - Ingestion
  - UDP
  purpose: Verify transport/Gateway acceptance never advances the committed watermark before UDP durable evidence
    and that retry is idempotent.
  preconditions:
  - A governed ingestion route exists.
  - A committed watermark W0 is recorded before the test.
  - The downstream durable-write failure can be injected deterministically.
  steps:
  - Submit a valid ingestion item through the governed Gateway/Ingestion path and record the technical acceptance.
  - Inject a crash/failure before UDP durable persistence/ACK.
  - Verify the committed watermark remains W0 and the same handoff is eligible for retry/recovery.
  - Retry/recover using the same handoff identity/idempotency context and allow UDP durable persistence to complete.
  - Verify the watermark advances only after durable evidence.
  assertions:
  - Gateway/transport 202 or equivalent acceptance is never interpreted as Durable ACK.
  - No data gap or duplicate canonical effect is produced by retry.
  - Handoff/lineage identity remains stable across recovery.
  - Watermark advancement is causally linked to durable downstream evidence.
  evidence:
  - Gateway/transport response
  - handoff/outbox record
  - watermark before/failure/after
  - UDP durable evidence
  - retry/recovery trace
- id: OUF-E2E-003
  title: Full snapshot unchanged
  legacyTrace: XMA E2E-X03
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X03
  actors:
  - SERVICE_IDENTITY
  modules:
  - Ingestion
  - UDP
  purpose: Verify an unchanged FULL_SNAPSHOT produces coherent handoff/evidence without creating an unnecessary
    Canonical Revision.
  preconditions:
  - A prior successful FULL_SNAPSHOT for source/type exists with fingerprint/content evidence F and canonical revision
    R.
  - The new source fixture is logically unchanged and produces the same configured fingerprint/content identity.
  steps:
  - Start a new FULL_SNAPSHOT run using the same pinned configuration/schema/semantic references.
  - Acquire and canonicalize the unchanged records and emit the normal handoff/lineage evidence.
  - UDP performs canonical change detection against the current canonical state/revision R.
  - Complete the run and record the unchanged/change-detection outcome.
  assertions:
  - The snapshot fingerprint/change evidence is recognized as unchanged according to the frozen change-detection
    semantics.
  - No new Canonical Revision is created solely because a new ingestion run occurred.
  - Handoff and lineage remain complete and reference the new run while preserving the same logical content outcome.
  - Any checkpoint/watermark update is operational evidence only and does not imply a canonical data change.
  evidence:
  - previous/current fingerprint evidence
  - HandoffPayload
  - LineageRecord
  - UDP change-detection decision
  - canonical revision count/identity before and after
- id: OUF-E2E-004
  title: Delta patch deterministic recovery
  legacyTrace: XMA E2E-X04
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X04
  actors:
  - SERVICE_IDENTITY
  modules:
  - Onboarding
  - Ingestion
  - UDP
  purpose: Verify DELTA_PATCH execution preserves patch evidence, applies only the approved logical mapping, and
    recovers deterministically from checkpoint.
  preconditions:
  - An ACTIVE bundle declares DELTA_PATCH for the source/type.
  - The referenced DeltaPatchContract is present and valid.
  - A baseline object/state and committed checkpoint C0 exist.
  steps:
  - Submit a source delta that maps through the approved DeltaPatchContract.
  - Ingestion preserves the patch/change evidence and emits handoff/lineage with the exact bundle/contract references.
  - UDP applies the delta to the canonical object.
  - Inject a restart/failure after processing at a controlled recovery point.
  - Recover from checkpoint C0/current durable state and replay the delta path as required.
  assertions:
  - DELTA_PATCH cannot run without the approved DeltaPatchContract.
  - Only approved sourcePath/targetProperty mappings are applied.
  - Recovery does not double-apply the logical change or lose it.
  - Checkpoint, handoff and lineage evidence make the recovered outcome deterministic and auditable.
  evidence:
  - bundle + DeltaPatchContract refs
  - patch/change evidence
  - checkpoint before/after
  - UDP canonical before/after
  - recovery/replay trace
- id: OUF-E2E-005
  title: Conversational WFS onboarding
  legacyTrace: XMA E2E-X05
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X05; MCP v1.1 human-governance boundary
  actors:
  - AI_AGENT
  - HUMAN_USER
  - SERVICE_IDENTITY
  modules:
  - MCP
  - Gateway
  - Onboarding
  - Semantic Registry
  - THS
  - Ingestion
  - UDP
  purpose: Verify the governed WFS onboarding chain from URL discovery through mapping/CRS/identity/temporality
    proposal, human approval, immutable bundle publication, first ingestion and UDP materialization.
  preconditions:
  - A WFS test endpoint is available only through the governed Gateway southbound path.
  - Relevant semantic artifacts/publication set are available for exact reference.
  - The HUMAN_USER can review/approve the proposal in the Trusted Approval Workspace.
  steps:
  - An external client/agent initiates a source-onboarding proposal with the WFS URL through an eligible MCP proposal
    capability.
  - MCP/Gateway invokes the governed Onboarding discovery path; Onboarding inspects WFS capabilities/schema/CRS
    without exposing arbitrary direct fetch from the client.
  - Onboarding prepares technical extraction plus semantic mapping, source-object identity and temporal mapping
    proposals using exact SemanticReference values.
  - MCP may create/link an ApprovalChallenge and return trustedApprovalRef; the HUMAN_USER reviews exact diff/hash/version
    and approves/activates directly in THS via Gateway/backend.
  - Onboarding compiles and publishes the immutable PublishedConfigurationBundle and Gateway technical runtime projections.
  - Ingestion performs the first run through Gateway, builds canonical envelopes/handoff/lineage, and UDP materializes
    the resulting urban data.
  assertions:
  - No HUMAN approval/activation occurs through MCP tools/call.
  - Gateway receives only technical runtime projections and does not absorb semantic mapping/classification.
  - Published bundle pins exact schema/config/semantic references and is sufficient for runtime execution without
    reconstructing Onboarding tables.
  - Source identity/temporality remain Onboarding/Ingestion provenance semantics; UrbanObjectId is assigned only
    by UDP.
  evidence:
  - WFS discovery/preflight trace
  - mapping/CRS/identity/temporal proposal
  - trustedApprovalRef + THS approval audit
  - PublishedConfigurationBundle + runtime projection checksums
  - first ingestion/handoff/lineage
  - UDP materialization evidence
- id: OUF-E2E-006
  title: Multi-source same Urban Object
  legacyTrace: XMA E2E-X06
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X06
  actors:
  - SERVICE_IDENTITY
  modules:
  - Onboarding
  - Ingestion
  - UDP
  purpose: Verify two independently ingested source records representing the same real-world object can resolve
    to one UrbanObjectId while retaining multiple SourceBindings and per-property authority/provenance.
  preconditions:
  - Two source configurations (e.g. SUO and Tributi fixtures) are ACTIVE with stable sourceObjectId policies.
  - The fixtures contain evidence sufficient for the configured UDP resolution policy to produce MATCH.
  - Authority metadata for overlapping properties is present in the published configuration/provenance chain.
  steps:
  - Ingest the first source record and materialize its canonical candidate/object with source provenance.
  - Ingest the second source record representing the same real-world object under its distinct source identity.
  - UDP resolution creates/evaluates the candidate relationship according to its frozen resolution rules and reaches
    MATCH for the deterministic fixture.
  - UDP materializes one canonical UrbanObjectId with multiple SourceBindings and resolves overlapping property
    values using the configured authority/provenance policy.
  - Read object/history/lineage evidence through governed backend capability.
  assertions:
  - Onboarding and Ingestion never equate sourceObjectId with UrbanObjectId.
  - The resulting canonical object has one UrbanObjectId and preserves both source bindings/provenance chains.
  - Authority/conflict resolution is applied by UDP, not Gateway/Ingestion/Registry.
  - History/lineage can explain which source/evidence contributed to each governed property.
  evidence:
  - two source configuration/bundle refs
  - two CanonicalDataEnvelope/Lineage chains
  - UDP candidate/resolution decision
  - canonical UrbanObjectId + SourceBindings
  - property authority/provenance evidence
- id: OUF-E2E-007
  title: Future personal-data inclusion
  legacyTrace: XMA E2E-X07
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X07; MCP-A03
  actors:
  - HUMAN_USER
  - AI_AGENT
  - SERVICE_IDENTITY
  modules:
  - Onboarding
  - Authorization
  - UDP
  - MCP
  purpose: Verify a newly approved INCLUDE configuration with DataAccessLabel is enforced server-side so MCP receives
    only authorized/minimized data.
  preconditions:
  - Version A excludes the test personal-data property.
  - A new OnboardingVersion B proposes INCLUDE plus the required DataAccessLabel/access policy metadata.
  - 'Two principals are available: one authorized for the protected property and one not authorized.'
  steps:
  - Approve/activate OnboardingVersion B through the HUMAN_USER path and publish the new immutable bundle.
  - Ingest/materialize the protected property with its access classification/provenance.
  - Invoke the relevant read capability through MCP/Gateway using the unauthorized principal.
  - Repeat the backend read with an appropriately authorized principal outside any protected-log path as permitted
    by the capability policy.
  - Capture backend AuthorizationDecision/PolicyEvaluationEvidence before serialization.
  assertions:
  - The property is not returned to the unauthorized MCP caller and never reaches MCP for post-filtering.
  - Gateway does not interpret DataAccessLabel; backend/UDP fine-grained authorization performs enforcement.
  - Authorized access, where policy permits, is still minimized to the capability/result scope.
  - PolicyVersion/contentHash and correlation evidence identify the exact authorization snapshot used.
  evidence:
  - OnboardingVersion A/B + bundle refs
  - DataAccessLabel/access-policy evidence
  - AuthorizationDecision for denied/allowed principals
  - UDP serialized result scopes
  - MCP result showing absence of denied data
- id: OUF-E2E-008
  title: Wrong graph tool remediation
  legacyTrace: XMA E2E-X08
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X08; MCP-A05/A06
  actors:
  - AI_AGENT
  modules:
  - MCP
  - Gateway
  - UDP
  purpose: Verify a capability mismatch produces explicit machine-readable remediation and never an automatic server-side
    redirect to another tool.
  preconditions:
  - graph.traverse and one appropriate alternative capability (e.g. related search/spatial) are published with distinct
    capabilityIds.
  - A request fixture requires a cross-domain pattern not supported by graph.traverse.
  steps:
  - Call graph.traverse with the cross-domain fixture through MCP.
  - Backend/MCP validation returns QUERY_CAPABILITY_MISMATCH (or frozen equivalent) with bounded remediation/preferred-alternative
    metadata.
  - Verify no alternative capability was invoked automatically and no hidden backend query was performed under another
    capabilityId.
  - Make a second explicit client tools/call using the suggested eligible alternative.
  - Capture separate authorization and budget evidence for the second call.
  assertions:
  - Capability mismatch is machine-readable and preserves the original capabilityId/correlation context.
  - No auto-redirect or implicit tool substitution occurs.
  - The alternative call is a new explicit invocation with its own validation, authorization and budget admission.
  - Client-visible remediation does not invent a capability that is not published.
  evidence:
  - first tools/call request/response
  - QUERY_CAPABILITY_MISMATCH ProblemDetails/remediation
  - backend invocation count by capabilityId
  - second explicit tools/call
  - authorization/budget evidence
- id: OUF-E2E-009
  title: Aggressive equivalent retry guard
  legacyTrace: XMA E2E-X09
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X09; MCP-A07/A21
  actors:
  - AI_AGENT
  modules:
  - MCP
  purpose: Verify cosmetic variations of an invalid DTO remain semantically equivalent retries and eventually produce
    TOOL_SELECTION_STALLED at the frozen threshold.
  preconditions:
  - RetryLoopGuard is enabled with an approved equivalence fingerprint/key window.
  - A deterministic invalid tool-input fixture can be varied cosmetically without changing its semantic error.
  steps:
  - Submit the first invalid tools/call and record the validation/mismatch outcome.
  - Repeat the attempt with cosmetic-only changes that preserve semantic equivalence.
  - Continue equivalent attempts until the configured threshold is reached.
  - Submit one additional equivalent retry attempt.
  assertions:
  - Cosmetic DTO changes do not reset the semantic retry fingerprint/window.
  - Equivalent retry count increases according to the same principal/tenant/policy context.
  - At the threshold the MCP returns TOOL_SELECTION_STALLED and stops further backend dispatch for the equivalent
    loop.
  - No automatic alternative capability is invoked.
  evidence:
  - attempt/fingerprint records
  - retry-equivalence decisions
  - budget/attempt counters
  - TOOL_SELECTION_STALLED response
  - backend dispatch count
- id: OUF-E2E-010
  title: Multi-Pod MCP cumulative budget
  legacyTrace: XMA E2E-X10
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X10; MCP-A08/A31/A32
  actors:
  - AI_AGENT
  modules:
  - MCP
  purpose: Verify cumulative orchestration budget is shared across MCP pods/sessions/correlation IDs for the same
    server-defined principal/tenant/policy window and survives pod restart.
  preconditions:
  - At least two MCP server pods share the same PostgreSQL budget store.
  - Requests use the same logical principal/tenant/policy budget window but different sessions/correlationIds.
  steps:
  - Admit and execute budget-consuming calls concurrently through pod A and pod B.
  - Read the resulting shared budget/attempt state.
  - Restart one MCP pod without altering the PostgreSQL budget state.
  - Continue calls through the restarted pod and the other pod until the shared cap is approached/reached.
  assertions:
  - All calls consume one shared server-generated budget window rather than pod-local/session-local counters.
  - Pod restart does not reset cumulative consumption.
  - Concurrent reservations cannot exceed hard maxima through races.
  - Budget evidence remains attributable to principal/tenant/policy/window.
  evidence:
  - pod routing/request traces
  - budget_window/attempt rows
  - pre/post restart counters
  - reservation/admission decisions
  - cap rejection evidence
- id: OUF-E2E-011
  title: Budget contention and pool protection
  legacyTrace: XMA E2E-X11
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X11; MCP-A22
  actors:
  - AI_AGENT
  modules:
  - MCP
  purpose: Verify an agent-call storm is bounded by budget-store bulkhead/timeout behavior and fails fast without
    exhausting the JDBC/Hikari connection pool.
  preconditions:
  - MCP uses the shared PostgreSQL budget store and bounded executor/connection-pool settings.
  - A load fixture can create concurrent budget admissions beyond normal contention.
  steps:
  - Generate a controlled burst of concurrent budget-consuming requests.
  - Observe budget reservation latency, timeout/bulkhead behavior and JDBC pool metrics.
  - Continue until contention protection activates without exceeding the configured safe pool boundary.
  - Verify rejected/bounded requests do not dispatch ungoverned backend work.
  assertions:
  - Budget-store contention fails fast/bounded according to MCP failure semantics.
  - The JDBC/Hikari pool remains available for health/reconciliation/other bounded work rather than being exhausted.
  - No request bypasses budget admission because the store is slow/unavailable.
  - Failure responses are structured and correlated.
  evidence:
  - load profile
  - budget admission latency/timeouts
  - Hikari active/pending/timeout metrics
  - backend dispatch count
  - structured failure responses
- id: OUF-E2E-012
  title: Adaptive exploration
  legacyTrace: XMA E2E-X12
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X12; MCP-A09/A10
  actors:
  - AI_AGENT
  modules:
  - MCP
  - UDP
  purpose: Verify bounded one-hop exploration followed by client-side pruning and a second explicit hop preserves
    cumulative MCP budget and backend graph limits.
  preconditions:
  - A bounded neighbors/graph capability is published with hard maxNodes/maxEdges/result bytes.
  - The fixture has enough neighbors to allow client pruning before the next hop.
  steps:
  - Call the bounded one-hop neighbors capability through MCP.
  - Return the authorized/minimized one-hop result and record budget consumption.
  - The external agent/client selects a subset of returned objects; MCP does not perform hidden recursive traversal.
  - Submit a second explicit one-hop call for the selected subset.
  - Capture cumulative MCP budget plus UDP query-governor evidence for both calls.
  assertions:
  - Each hop is an explicit typed capability invocation with independent authorization.
  - The second hop is limited to the client-selected subset; no blind server-side recursive exploration occurs.
  - Cumulative MCP budget includes both calls and is not reset by changed correlation/session context within the
    same budget window.
  - UDP graph/query limits remain independently enforced.
  evidence:
  - first/second capability requests
  - authorized one-hop results
  - selected subset evidence
  - MCP cumulative budget rows
  - UDP Query Governor decisions
- id: OUF-E2E-013
  title: Analytical boundary
  legacyTrace: XMA E2E-X13
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X13; MCP-A25
  actors:
  - AI_AGENT
  modules:
  - MCP
  - Gateway
  - UDP
  purpose: Verify a broad non-operational analytical request does not cause blind graph traversal, invented SQL/capabilities
    or an implicit analytics engine inside OUF.
  preconditions:
  - No urban.analysis.* capability is published in the test manifest.
  - The request fixture is intentionally broad/non-operational and cannot be satisfied safely by one bounded operational
    capability.
  steps:
  - Attempt to express the broad request through the available MCP capability surface.
  - Capability selection/validation determines that no published bounded operational capability matches the requested
    analytical workload.
  - Return a guided rejection/mismatch that identifies the boundary without invoking graph traversal or creating
    a synthetic capability.
  - Verify no backend SQL/query was executed for an invented analytical capability.
  assertions:
  - OUF does not invent or auto-publish an analytical capability.
  - No SQL, arbitrary predicate language or blind traversal is generated by MCP.
  - Rejection/remediation is machine-readable and may direct the external client to perform analytics outside OUF
    or use a separately published capability if one exists in another deployment.
  - No internal analytics engine is introduced.
  evidence:
  - manifest/tool registry snapshot
  - rejected request + remediation
  - backend invocation/query audit
  - capabilityId registry proof
- id: OUF-E2E-014
  title: Human merge
  legacyTrace: XMA E2E-X14
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X14; MCP-A04/A12/A20/A27/A28; THS-A02/A09/A11
  actors:
  - AI_AGENT
  - HUMAN_USER
  modules:
  - MCP
  - Gateway
  - THS
  - Authorization
  - UDP
  purpose: Verify merge plan/impact may be prepared through MCP, but authoritative merge confirmation occurs only
    in the Trusted Approval Workspace and UDP commits only after fresh backend validation.
  preconditions:
  - A merge candidate/plan exists with exact target IDs, diff/impact, hash/ETag/state and required HUMAN_USER capability.
  - MCP may expose the proposal/prepare capability but the confirm capability is TRUSTED_HUMAN_ONLY/toolEligible=false.
  steps:
  - Use MCP to request/prepare the merge plan and impact; create/link an ApprovalChallenge and return an opaque
    trustedApprovalRef.
  - Attempt merge confirmation through MCP tools/call and verify it is not exposed/denied without dispatch.
  - HUMAN_USER opens the Trusted Approval Workspace and sees the exact diff/hash/version/risk context.
  - THS invokes the direct user-bound Gateway/backend owner confirmation.
  - UDP revalidates hash/ETag/state/policy and commits the merge, preserving aliases/history and audit.
  assertions:
  - trustedApprovalRef is not a bearer credential and cannot transfer HUMAN_USER authority.
  - MCP never confirms the merge or persists/reuses a privileged human token.
  - Stale hash/ETag/state would invalidate the approval rather than commit silently.
  - Audit distinguishes proposal actor/delegated context from HUMAN_USER confirmer and records UDP alias/history
    outcome.
  evidence:
  - MCP manifest/tools list
  - ApprovalChallenge/trustedApprovalRef
  - denied MCP confirm attempt
  - THS direct-path trace
  - AuthorizationDecision + backend revalidation
  - UDP merge/alias/history audit
- id: OUF-E2E-015
  title: Historical replay
  legacyTrace: XMA E2E-X15
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X15; Semantic PublicationSet pinning/historical replay
  actors:
  - SERVICE_IDENTITY
  - HUMAN_USER
  modules:
  - Ingestion
  - Onboarding
  - Semantic Registry
  - UDP
  - Authorization
  purpose: Verify REPRODUCE/historical replay resolves the original bundle/schema/semantic chain and reconstructs
    snapshot+delta evidence without silently applying current ACTIVE artifacts.
  preconditions:
  - A historical run has LineageRecord/evidence with exact configuration bundle, source schema and SemanticPublicationSet
    references.
  - Newer ACTIVE configuration/semantic versions exist to prove that current artifacts differ.
  - The replay requester is currently authorized to initiate the governed replay operation.
  steps:
  - Request the governed historical replay/reproduce operation.
  - Resolve the exact historical bundle/schema/semantic references recorded by lineage.
  - Reprocess snapshot/delta evidence using that original contract chain.
  - Persist replay lineage/evidence and compare the reconstructed outcome/reference chain with the historical execution.
  - Run a negative variant with one historical reference intentionally unavailable.
  assertions:
  - No newer ACTIVE bundle/schema/SemanticPublicationSet is substituted implicitly.
  - Replay execution evidence identifies the original contract chain plus the new replay execution identity.
  - Unavailable required historical reference fails explicitly rather than falling back to current configuration.
  - Current authorization governs whether replay may be requested, while historical data-processing semantics remain
    pinned to the original chain.
  evidence:
  - historical LineageRecord
  - resolved exact bundle/schema/semantic refs
  - replay run/handoff evidence
  - comparison to original snapshot+delta evidence
  - missing-reference failure
- id: OUF-E2E-016
  title: Protected logs boundary
  legacyTrace: XMA E2E-X16
  sourceTrace: Cross-Module Alignment Matrix v1.2 Table 14 E2E-X16; MCP-A53..A55; THS-A03..A08/A12
  actors:
  - AI_AGENT
  - HUMAN_USER
  modules:
  - MCP
  - Gateway
  - THS
  - Authorization
  purpose: Verify protected-log search/read/filter/aggregate/correlate/export/download remain THS-only, absent from
    MCP surfaces, and never return protected log payload/result references to AI/MCP.
  preconditions:
  - THS Protected Operations Workspace and its internal typed log services are deployed in the control-plane module.
  - The test log store contains controlled PII-bearing fixture records accessible only to an authorized HUMAN_USER.
  - MCP registry/startup guards are enabled.
  steps:
  - Inspect MCP tools/list, resources and prompts for protected-log operations.
  - Attempt tools/call using protected-log-equivalent names and confirm rejection without downstream dispatch.
  - Use an authorized HUMAN_USER session in THS to perform typed log.search/read and a governed aggregate/correlate
    operation.
  - Create/read/download a governed export through the THS-only flow using fresh authorization and expiry controls.
  - Inspect MCP responses, remediation, audit metadata and result references from the same correlation window.
  assertions:
  - No protected-log operation appears in MCP tools/resources/prompts and no equivalent call dispatches downstream.
  - No MCP response/remediation/audit/resultRef contains PII log payload or Protected Operations download reference.
  - THS applies authorization, minimization/redaction and typed filters before serialization to the HUMAN_USER browser.
  - Export/download records actor, scope/purpose where required, checksum/expiry and rejects stale/unauthorized
    download.
  - MCP has no endpoint/credential/binding that can use THS as a protected-data proxy.
  evidence:
  - MCP registry dump + rejected calls
  - network/backend dispatch audit
  - THS typed query/authorization/redaction evidence
  - export manifest/checksum/expiry + download audit
  - MCP response/resultRef inspection
- id: OUF-E2E-017
  title: Source configuration activation to first successful ingestion
  purpose: Verify the approved immutable Onboarding runtime configuration is consumed through Gateway and Ingestion
    without runtime reconstruction.
  actors:
  - HUMAN_USER
  - SERVICE_IDENTITY
  modules:
  - Onboarding
  - Gateway
  - Ingestion
  - UDP
  preconditions:
  - PublishedConfigurationBundle is APPROVED/ACTIVE and historically resolvable.
  - SourceRuntimeProfile, ExtractionProfile and RouteBinding resolve exact pinned versions.
  - Scenario-neutral M2M identity profile is ACTIVE for the environment.
  steps:
  - Activate/publish the approved configuration through the authorized human path.
  - Gateway consumes the technical runtime projection only.
  - Ingestion starts a run using the exact bundle/schema/profile references.
  - Connector/Adapter builds CanonicalDataEnvelope.
  - Ingestion emits HandoffPayload and LineageRecord using the same run/source/contract identities.
  - UDP persists/materializes according to its own authority and object-resolution rules.
  assertions:
  - No runtime consumer reconstructs the bundle from Onboarding internal tables.
  - sourceId and pinned contract references are preserved end-to-end.
  - correlationId is preserved.
  - Gateway does not perform semantic mapping.
  - UrbanObjectId is not assigned by Onboarding.
