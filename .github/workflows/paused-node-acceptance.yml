name: OUF paused node acceptance crypto boundary
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/semantic_application_cutover/paused_node_acceptance.py
      - tests/test_paused_node_acceptance_native.py
      - .github/workflows/paused-node-acceptance.yml
permissions:
  contents: read
jobs:
  signature-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Actual scoped signatures in root-private fixtures
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-paused-node-${GITHUB_RUN_ID}"
          sudo mkdir -m 700 "$OUF_FIXTURE_ROOT"
          sudo cp -R . "$OUF_FIXTURE_ROOT/repository"
          sudo chown -R root:root "$OUF_FIXTURE_ROOT"
          sudo bash -c 'cd "$1/repository"; python3 -m unittest discover -s tests -p test_paused_node_acceptance_native.py -v' _ "$OUF_FIXTURE_ROOT"
