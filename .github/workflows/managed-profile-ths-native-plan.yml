name: Conditional same-image THS owner request plan
on:
  push:
    paths: ['scripts/prepare-managed-profile-ths-native-plan-20261028.py','tools/build_managed_profile_ths_native_plan.py','tools/managed_profile_ths_scopes/native_plan.py','tests/*managed_profile_ths_native_plan*','releases/prepare-managed-profile-ths-native-plan-20261028.sh','.github/workflows/managed-profile-ths-native-plan.yml']
  pull_request:
    paths: ['scripts/prepare-managed-profile-ths-native-plan-20261028.py','tools/build_managed_profile_ths_native_plan.py','tools/managed_profile_ths_scopes/native_plan.py','tests/*managed_profile_ths_native_plan*','releases/prepare-managed-profile-ths-native-plan-20261028.sh','.github/workflows/managed-profile-ths-native-plan.yml']
permissions: {contents: read}
jobs:
  retained-protocol-and-physical-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Reproduce sealed source from tracked helpers and consumed receipt
        run: |
          sha256sum scripts/prepare-managed-profile-ths-native-plan-20261028.py > /tmp/ths-native-plan.sha256
          python3 -I -S -B tools/build_managed_profile_ths_native_plan.py
          sha256sum --check /tmp/ths-native-plan.sha256
      - run: python3 -I -S -B -m unittest discover -s tests -p 'test_managed_profile_ths*.py'
      - run: sudo /usr/bin/python3 -I -S -B tests/qualify_managed_profile_ths_native_plan_unix.py
