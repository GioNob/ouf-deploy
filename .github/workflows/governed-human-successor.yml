name: Explicit HUMAN successor finite qualification
on:
  pull_request:
    paths:
      - 'tools/governed_human_successor/**'
      - 'tests/test_governed_human_successor.py'
      - 'scripts/read-human-successor-candidate-20261020.py'
      - 'scripts/launch-human-successor-read-20261020.sh'
      - '.github/workflows/governed-human-successor.yml'
permissions: {contents: read}
jobs:
  explicit-successor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Root custody, actual TLS fixture and finite foreground steps
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-successor-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo "$pythonLocation/bin/python3" -I -B -S -c 'from pathlib import Path; assert Path("/proc/sys/kernel/random/boot_id").is_file()'
          sudo env OUF_TEST_ROOT="$fixture" "$pythonLocation/bin/python3" -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_governed_human_successor.py -v
          sudo env OUF_TEST_ROOT="$fixture" "$pythonLocation/bin/python3" -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_ingestion_rollout_human_reader.py -v
