name: Onboarding Engine metadata reconciliation
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths:
      - scripts/reconcile-onboarding-engine-metadata-20261024.py
      - tools/ingestion_readiness_patch_execution/tests/test_onboarding_engine_metadata.py
      - .github/workflows/onboarding-engine-metadata.yml
  pull_request:
    paths:
      - scripts/reconcile-onboarding-engine-metadata-20261024.py
      - tools/ingestion_readiness_patch_execution/tests/test_onboarding_engine_metadata.py
      - .github/workflows/onboarding-engine-metadata.yml
permissions:
  contents: read
concurrency:
  group: onboarding-engine-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  protected-native-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Root-custodied disposable fixtures
        run: |
          sudo install -d -m 0700 /root/ouf-engine-metadata-tests
          sudo cp -a . /root/ouf-engine-metadata-tests/repository
          sudo chown -R root:root /root/ouf-engine-metadata-tests
      - name: Actual Unix metadata and proc without Engine SQL or subprocess dispatch
        run: |
          sudo env OUF_NATIVE_ENGINE_METADATA=1 /usr/bin/python3 -I -B -S -m unittest discover \
            -s /root/ouf-engine-metadata-tests/repository/tools/ingestion_readiness_patch_execution/tests \
            -p 'test_onboarding_engine_metadata.py' -v
