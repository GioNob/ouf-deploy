name: Cloud admission and capability metadata diagnosis
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths:
      - .github/workflows/cloud-admission-policy-diagnosis.yml
      - scripts/read-cloud-admission-policy-20261019.py
      - tests/cloud_admission_policy/**
permissions: {contents: read}
concurrency:
  group: ouf-cloud-admission-policy-diagnosis
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: fixture, POSTGRES_PASSWORD: fixture, POSTGRES_DB: fixture}
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U fixture -d fixture' --health-interval 5s --health-timeout 5s --health-retries 10
    env: {PGHOST: localhost, PGPORT: '5432', PGUSER: fixture, PGPASSWORD: fixture, PGDATABASE: fixture, OUF_NATIVE_METADATA_SQL: '1'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -I -B -m unittest discover -s tests/cloud_admission_policy -v
  target-metadata:
    needs: qualify
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Read only bounded MCP budget and capability metadata using existing runner access
        run: python3 -I -S -B scripts/read-cloud-admission-policy-20261019.py
