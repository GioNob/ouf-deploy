name: Registry postboot prefix and credential composition fixtures
on:
  push:
    branches:
      - fix/registry-bound-owner-lineage-20261023
    paths:
      - tools/semantic_registry_recovery_execution/**
      - tools/semantic_registry_postboot_owner/**
      - .github/workflows/semantic-registry-postbootqualified.yml
  pull_request:
    paths:
      - tools/semantic_registry_recovery_execution/**
      - tools/semantic_registry_postboot_owner/**
      - .github/workflows/semantic-registry-postbootqualified.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-postbootqualified-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sealed-loader-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Isolated interpreter loader, exact stdlib layouts and full source preload
        run: |
          sudo "$(command -v python)" -I -B -S -m unittest discover \
            -s tools/semantic_registry_recovery_execution/tests -p test_postboot_delivery.py -v
  bounded-owner-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Root-controlled disposable source custody
        run: |
          sudo install -d -m 0700 /root/ouf-postboot-tests
          sudo cp -a . /root/ouf-postboot-tests/repository
          sudo chown -R root:root /root/ouf-postboot-tests
      - name: Disposable TLS and JWT fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-cryptography
      - name: Postboot owner counters, current boot and crash refusal
        run: |
          sudo env OUF_NATIVE_UIDS=1 bash -eu -c '
          cd /root/ouf-postboot-tests/repository
          python3 -B -m unittest discover -s tools/semantic_registry_postboot_owner/tests -v
          python3 -B -m unittest discover -s tools/semantic_registry_recovery_execution/tests -p test_bootstrap.py -v
          python3 -B -m unittest discover -s tools/semantic_registry_recovery_execution/tests -p test_controller.py -v
          python3 -B -m unittest discover -s tools/semantic_registry_recovery_execution/tests -p "test_postboot_*.py" -v
          python3 -B -m unittest discover -s tools/semantic_registry_recovery_execution/tests -p test_caller_configuration.py -v
          python3 -B -m unittest discover -s tools/semantic_registry_recovery_execution/tests -p test_semantic_request.py -v
          python3 -B -m unittest discover -s tools/semantic_registry_recovery_execution/tests -p test_jvm_fixture_inputs.py -v
          python3 -B -m unittest discover -s tools/semantic_registry_recovery_execution/tests -p test_jvm_fixture_servers.py -v
          '
  native-postboot-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Root-controlled disposable source custody
        run: |
          sudo install -d -m 0700 /root/ouf-postboot-tests
          sudo cp -a . /root/ouf-postboot-tests/repository
          sudo chown -R root:root /root/ouf-postboot-tests
      - name: Disposable TLS fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-cryptography
      - name: Actual Docker, Gateway namespace, Ed25519, paused gate and TLS token owner
        run: |
          sudo env OUF_NATIVE_UIDS=1 bash -eu -c '
          cd /root/ouf-postboot-tests/repository
          python3 -B tools/semantic_registry_recovery_execution/tests/native_postbootqualified.py -v
          '
  native-jvm-postboot-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-semantic-registry
          ref: eccef11a97367f20e278db40b9ed6f45dd980c37
          path: registry-fixture-source
          persist-credentials: false
      - name: Build actual pinned Registry JVM for disposable qualification only
        run: |
          docker build --label org.opencontainers.image.revision=eccef11a97367f20e278db40b9ed6f45dd980c37 \
            --tag ouf-postboot-registry-base:eccef11a registry-fixture-source
          docker save --output registry-fixture-image.tar ouf-postboot-registry-base:eccef11a
      - name: Load exact independent-baseline Engine binaries for isolated fixture
        run: |
          curl --fail --location --connect-timeout 15 --max-time 180 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz --output engine.tgz
          printf '%s\n' 'd8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70  engine.tgz' | sha256sum -c -
          mkdir engine-bin
          tar -xzf engine.tgz --strip-components=1 -C engine-bin
          sudo install -d -m 0700 /root/ouf-postboot-tests
          sudo cp -a . /root/ouf-postboot-tests/repository
          sudo chown -R root:root /root/ouf-postboot-tests
          sudo apt-get update -qq
          sudo apt-get install -y python3-cryptography iproute2
      - name: Actual JVM, TLS policy, PostgreSQL, full native seal and same SERVICE GET
        run: |
          sudo env GITHUB_ACTIONS=true OUF_NATIVE_UIDS=1 \
            OUF_JVM_FIXTURE_IMAGE_ARCHIVE=/root/ouf-postboot-tests/repository/registry-fixture-image.tar \
            OUF_JVM_FIXTURE_IMAGE=ouf-postboot-registry-base:eccef11a \
            PATH=/root/ouf-postboot-tests/repository/engine-bin:/usr/sbin:/usr/bin:/sbin:/bin \
            bash -eu -c '
          cd /root/ouf-postboot-tests/repository
          /usr/bin/python3 -B tools/semantic_registry_recovery_execution/tests/native_jvm_postboot.py -v
          '

  original-service-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Root-controlled disposable TLS source custody
        run: |
          sudo install -d -m 0700 /root/ouf-postboot-tls-tests
          sudo cp -a . /root/ouf-postboot-tls-tests/repository
          sudo chown -R root:root /root/ouf-postboot-tls-tests
      - name: Verified PKI without HTTP, large CA, name rejection and consumed claims
        run: |
          sudo "$(command -v python)" -I -B -S -m unittest discover \
            -s /root/ouf-postboot-tls-tests/repository/tools/semantic_registry_recovery_execution/tests \
            -p test_postboot_tls.py -v
