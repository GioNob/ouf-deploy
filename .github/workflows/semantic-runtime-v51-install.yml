name: Semantic runtime v5.1 installation
on:
  pull_request:
    paths:
      - scripts/install-semantic-runtime-v51.py
      - scripts/restore-semantic-runtime-v51-wrapper.py
      - tools/semantic_runtime_v51_install/**
      - tools/semantic_runtime_v51/**
      - tools/semantic_runtime_v5/**
      - tools/semantic_authority_mandates/**
      - tools/semantic_b1_acceptance/**
      - tools/semantic_transaction_profiles/**
      - tests/test_semantic_runtime_v51_install.py
      - ops/vps/runtime-v51-install.sh
      - ops/vps/runtime-v51-restore.sh
      - docs/OUF_SEMANTIC_RUNTIME_V51_INSTALL_20261114.md
      - .github/workflows/semantic-runtime-v51-install.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  runtime-v51-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: v5.1 install and restore natively (root custody, flock, OpenSSL, mandate ledger)
        run: >-
          sudo -n env OUF_RUNTIME_V51_INSTALL_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_runtime_v51_install.py -v
      - name: Non-regression, B1 install closure pinned by bytes
        run: >-
          sudo -n env OUF_B1_INSTALL_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_provider_b1_install.py -v
      - name: Non-regression, B1 restore (task-26)
        run: >-
          sudo -n env OUF_B1_RESTORE_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_restore_semantic_provider_b1_wrapper.py -v
      - name: Non-regression, v5.1 runtime contract
        run: >-
          sudo -n env OUF_RUNTIME_V51_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_runtime_v51_arming.py -v
      - name: Unchanged low-level switch regression
        run: >-
          sudo -n env OUF_TRANSACTION_TEST_ROOT=/run /usr/bin/python3 -I -B
          -m unittest discover -s tools/semantic_transaction_profiles
          -p test_guarded_runtime_switch.py -v
      - name: Runbook syntax and ShellCheck
        run: |
          bash -n ops/vps/runtime-v51-install.sh
          bash -n ops/vps/runtime-v51-restore.sh
          shellcheck -S warning ops/vps/runtime-v51-install.sh ops/vps/runtime-v51-restore.sh
