name: Running Registry token mount qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['tests/test_running_registry_mount.py', '.github/workflows/chatbot-running-registry-mount.yml']
permissions: {contents: read}
jobs:
  native-running-mount:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Root-owned isolated fixture
        run: |
          set -euo pipefail
          sudo mkdir -m 700 /var/lib/ouf-running-registry-test
          sudo cp -R . /var/lib/ouf-running-registry-test/repository
          sudo chown -R root:root /var/lib/ouf-running-registry-test
      - name: Actual running process, private mount and current TLS owner
        run: |
          set -euo pipefail
          sudo env OUF_NATIVE_UIDS=1 OUF_NATIVE_MOUNTS=1 python3 -I -B -c '
          import sys,unittest
          sys.path.insert(0,"/var/lib/ouf-running-registry-test/repository/tests")
          import test_running_registry_mount as m
          suite=unittest.defaultTestLoader.loadTestsFromTestCase(m.RunningMount)
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped and result.testsRun==4 else 1)'
