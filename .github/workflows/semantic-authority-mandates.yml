name: Semantic authority mandates
on:
  pull_request:
    paths:
      - tools/semantic_authority_mandates/**
      - tools/semantic_runtime_v51/**
      - tests/test_semantic_authority_mandates.py
      - tests/test_runtime_v51_arming.py
      - docs/OUF_SEMANTIC_AUTHORITY_MANDATES_20261114.md
      - .github/workflows/semantic-authority-mandates.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mandates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Mandate ledger, anchors and detached signatures natively
        run: sudo -n env OUF_MANDATES_NATIVE=1 /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_authority_mandates.py -v
      - name: Runtime v5.1 arming with anchor and mandate ledger
        run: sudo -n env OUF_RUNTIME_V51_NATIVE=1 /usr/bin/python3 -I -B -m unittest discover -s tests -p test_runtime_v51_arming.py -v
      - name: Non-regression, runtime v5 arming
        run: sudo -n env OUF_RUNTIME_V5_NATIVE=1 /usr/bin/python3 -I -B -m unittest discover -s tests -p test_runtime_v5_arming.py -v
      - name: Non-regression, B1 B2 authority
        run: sudo -n env OUF_B1B2_NATIVE=1 /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_b1b2_authority.py -v
      - name: Non-regression, B1 closure pinned by bytes
        run: sudo -n env OUF_B1_INSTALL_NATIVE=1 /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_provider_b1_install.py -v
