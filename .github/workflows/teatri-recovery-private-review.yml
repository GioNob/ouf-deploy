name: Teatri native retry private review qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['tools/teatri_recovery_review/**', 'scripts/prepare-teatri-recovery-review-20261017.py', 'releases/teatri-recovery-private-review-selection-20261017.json', 'tests/test_teatri_retry_review*.py', '.github/workflows/teatri-recovery-private-review.yml']
permissions: {contents: read}
jobs:
  closed-source-and-readonly-prerequisites:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Closed entry, exact exhausted history compiler and safe read-only metadata
        run: sudo env OUF_TEST_ROOT=/root python3 -B -m unittest discover -s tests -p 'test_teatri_retry_review*.py' -v
