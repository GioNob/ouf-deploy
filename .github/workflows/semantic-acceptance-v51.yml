name: Semantic acceptance v5.1
on:
  pull_request:
    paths:
      - scripts/issue-semantic-provider-acceptance-v51.py
      - tools/semantic_acceptance_v51/**
      - tests/test_semantic_acceptance_v51.py
      - ops/vps/acceptance-v51.sh
      - docs/OUF_SEMANTIC_ACCEPTANCE_V51_20261114.md
      - .github/workflows/semantic-acceptance-v51.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acceptance-v51:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Acceptance v5.1 issuance natively (root custody, OpenSSL, mandate ledger)
        run: sudo -n env OUF_ACCEPTANCE_V51_NATIVE=1 /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_acceptance_v51.py -v
      - name: Non-regression, B1 closure pinned by bytes
        run: sudo -n env OUF_B1_INSTALL_NATIVE=1 /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_provider_b1_install.py -v
      - name: Runbook syntax and ShellCheck
        run: |
          bash -n ops/vps/acceptance-v51.sh
          shellcheck -S warning ops/vps/acceptance-v51.sh
