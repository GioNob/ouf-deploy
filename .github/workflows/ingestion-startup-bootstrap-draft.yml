name: Ingestion private startup bootstrap draft qualification
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/prepare-ingestion-startup-bootstrap-draft-20261020.py', 'scripts/launch-ingestion-startup-bootstrap-draft-20261020.sh', 'tests/test_ingestion_startup_bootstrap_draft.py', '.github/workflows/ingestion-startup-bootstrap-draft.yml']
permissions: {contents: read}
jobs:
  private-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Root-custodied synthetic draft and immutable delivery
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-startup-draft-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env OUF_TEST_ROOT="$fixture" python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_ingestion_startup_bootstrap_draft.py -v
