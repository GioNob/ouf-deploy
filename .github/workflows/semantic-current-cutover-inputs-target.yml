name: Prepare current protected Semantic cutover inputs on target
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/semantic-current-cutover-inputs-target.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ouf-semantic-protected-cutover-input-preparation
  cancel-in-progress: false
jobs:
  prepare-or-identify-required-operator:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 527710b438fc777428cb9f5e5a6b98c62852231e
          persist-credentials: false
      - name: Attempt exact qualified isolated preparation with existing noninteractive sudo permission
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          OUF_ROOT_READ="$GITHUB_WORKSPACE/scripts/prepare-current-semantic-cutover-inputs.py"
          OUF_CUSTODY="$GITHUB_WORKSPACE/tools/semantic_target_review/prepare_application_runtime_inputs.py"
          printf '%s  %s\n' '9aca6a4cc2429e5ca4f8f84dc4e7ca98f8e1d4030e8669399b83d86333a683e6' "$OUF_ROOT_READ" 'cb9ff64684243d563da79d327eb7d7e325dbea6a3922c91a0b7791a3ceec9baf' "$OUF_CUSTODY" | sha256sum -c -
          if sudo -n /usr/bin/python3 -I -B -c '
          import hashlib,pathlib,sys
          expected=("9aca6a4cc2429e5ca4f8f84dc4e7ca98f8e1d4030e8669399b83d86333a683e6","cb9ff64684243d563da79d327eb7d7e325dbea6a3922c91a0b7791a3ceec9baf")
          if len(sys.argv)!=3:raise SystemExit("EXACT_SOURCE_SET_REQUIRED")
          sources=[]
          for path,digest in zip(sys.argv[1:],expected):
              with pathlib.Path(path).open("rb") as stream:raw=stream.read(131073)
              if len(raw)>131072 or hashlib.sha256(raw).hexdigest()!=digest:raise SystemExit("SOURCE_HASH_MISMATCH")
              sources.append(raw)
          p=sys.argv[1];sys.argv=[p]
          exec(compile(sources[0],p,"exec"),{"__name__":"__main__","__file__":p,"__custody_source__":sources[1]})
          ' "$OUF_ROOT_READ" "$OUF_CUSTODY" > "$RUNNER_TEMP/current-cutover-inputs-result.txt" 2> "$RUNNER_TEMP/current-cutover-inputs-stderr.txt"; then
            cat "$RUNNER_TEMP/current-cutover-inputs-result.txt"
            echo OUF_CURRENT_INPUT_TARGET_EXIT=0
          else
            OUF_CODE=$?
            if grep -q '^OUF_CURRENT_CUTOVER_INPUTS=' "$RUNNER_TEMP/current-cutover-inputs-result.txt"; then
              cat "$RUNNER_TEMP/current-cutover-inputs-result.txt"
              echo "OUF_CURRENT_INPUT_TARGET_EXIT=$OUF_CODE"
              exit "$OUF_CODE"
            fi
            echo OUF_PROTECTED_PREPARATION=UNATTENDED_ROOT_PERMISSION_UNPROVEN_OPERATOR_REQUIRED
            echo "OUF_ROOT_ATTEMPT_EXIT=$OUF_CODE"
            sha256sum "$RUNNER_TEMP/current-cutover-inputs-stderr.txt"
          fi
