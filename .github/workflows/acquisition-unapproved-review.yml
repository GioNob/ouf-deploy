name: Acquisition unapproved review offline reconciliation
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths: ['scripts/read-acquisition-unapproved-review-20261025.py','tests/test_acquisition_unapproved_review.py','.github/workflows/acquisition-unapproved-review.yml']
  pull_request:
    paths: ['scripts/read-acquisition-unapproved-review-20261025.py','tests/test_acquisition_unapproved_review.py','.github/workflows/acquisition-unapproved-review.yml']
permissions: {contents: read}
jobs:
  offline-root-filesystem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Retained only root custody counts no replay and no runtime ports
        shell: bash
        run: sudo env OUF_UNAPPROVED_ROOT_FIXTURE=1 python3 -I -S -B -m unittest discover -s "$PWD/tests" -p test_acquisition_unapproved_review.py -v
