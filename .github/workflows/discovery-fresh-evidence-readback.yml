name: Discovery fresh signed evidence independent readback
on:
  push:
    paths:
      - '.github/workflows/discovery-fresh-evidence-readback.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-six-signed-existing-subjects:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and checksum the already scanned public sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/GioNob/ouf-semantic-registry/actions/artifacts/11647165935/zip > "$RUNNER_TEMP/fresh-subjects.zip"
          echo 'f6bdc6f911e4e4b935817a4c3a7a5c21c27b4488852d59386b7a0e62003d58ee  '"$RUNNER_TEMP/fresh-subjects.zip" | sha256sum -c -
          python3 -I -B - "$RUNNER_TEMP/fresh-subjects.zip" <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path('generated/discovery-fresh-evidence-readback');out.mkdir(parents=True)
          with zipfile.ZipFile(sys.argv[1]) as archive:
              members=archive.infolist()
              assert len(members)<=64 and sum(i.file_size for i in members)<=134217728
              for item in members:
                  assert pathlib.Path(item.filename).name==item.filename and item.file_size<=67108864
                  (out/item.filename).write_bytes(archive.read(item))
          PY
      - name: Verify six actual published Sigstore subjects without rescanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in inventory.json database-pin.json semantic.syft.json mcp.syft.json semantic.grype.json mcp.grype.json; do
            gh attestation verify "generated/discovery-fresh-evidence-readback/$file" --repo GioNob/ouf-semantic-registry --signer-workflow GioNob/ouf-semantic-registry/.github/workflows/discovery-unchanged-sbom-refresh.yml --source-digest 38d19c527fbec82849d6a3cf2628173411f5e2d8 --source-ref refs/heads/codex/discovery-fresh-evidence-20261009 --deny-self-hosted-runners --format json > "generated/discovery-fresh-evidence-readback/$file.verification.json"
          done
      - name: Retain actual shared bundle and hash-bound readback
        run: |
          python3 -I -B - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('generated/discovery-fresh-evidence-readback')
          files=('inventory.json','database-pin.json','semantic.syft.json','mcp.syft.json','semantic.grype.json','mcp.grype.json')
          bundles=[];subjects={}
          canonical=lambda v:json.dumps(v,sort_keys=True,separators=(',',':')).encode()
          for name in files:
              digest=hashlib.sha256((root/name).read_bytes()).hexdigest();subjects[name]=digest
              rows=json.loads((root/(name+'.verification.json')).read_bytes())
              matching=[row for row in rows if any(s.get('digest',{}).get('sha256')==digest for s in row['verificationResult']['statement']['subject'])]
              assert matching
              bundles.append(matching[0]['attestation']['bundle'])
          assert len({hashlib.sha256(canonical(b)).hexdigest() for b in bundles})==1
          (root/'provenance.json').write_bytes(canonical(bundles[0]))
          receipt={'schema':'ouf.discovery-fresh-existing-sbom-readback.v1','sourceCommit':'38d19c527fbec82849d6a3cf2628173411f5e2d8','sourceRunId':37995215112,'sourceArtifactId':11647165935,'sourceArtifactSha256':'f6bdc6f911e4e4b935817a4c3a7a5c21c27b4488852d59386b7a0e62003d58ee','actualSubjectsVerified':subjects,'actualSignaturesVerified':6,'bundleSha256':hashlib.sha256((root/'provenance.json').read_bytes()).hexdigest(),'targetOperations':0,'acceptanceGranted':False,'startAuthorized':False,'notReleaseAcceptance':True}
          (root/'readback-receipt.json').write_bytes(canonical(receipt))
          print('OUF_FRESH_EVIDENCE_READBACK='+json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-fresh-verified-readback-${{ github.run_id }}
          path: generated/discovery-fresh-evidence-readback/
          if-no-files-found: warn
          retention-days: 30
