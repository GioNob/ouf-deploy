name: Provider v2 frame compiler tests
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_frame_compiler/**'
      - '.github/workflows/provider-v2-frame-compiler.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [containerd-overlayfs]
        role: [adapter, southbound]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-semantic-registry
          ref: 72310a0f4b0d649854d3abc010509d6724617e4e
          path: owner-fixture
          persist-credentials: false
      - name: Load exact owner reviewer into isolated compiler fixture
        run: |
          cp owner-fixture/tools/review_semantic_oci_policy.py tools/semantic_frame_compiler/
          cp owner-fixture/tools/semantic_oci_shape_schema.json tools/semantic_frame_compiler/
          python3 -B -m unittest discover -v -s tools/semantic_frame_compiler -p test_compile_creation_frame_policy.py
          python3 -B -m unittest discover -v -s tools/semantic_frame_compiler -p test_build_role_frame_template.py
          python3 -B -m unittest discover -v -s tools/semantic_frame_compiler -p test_prepare_provider_v2_launch_inputs.py
          python3 -B -m unittest discover -v -s tools/semantic_frame_compiler -p test_prepare_provider_v2_frame_policies.py
          python3 -B -m unittest discover -v -s tools/semantic_frame_compiler -p test_diagnose_provider_v2_launch_inputs.py
          python3 -B -m unittest discover -v -s owner-fixture/tests -p test_semantic_creation_frame.py
          python3 -B -m unittest discover -v -s owner-fixture/tests -p test_semantic_creation_frame_observer.py
          cmp owner-fixture/tools/semantic_creation_frame_observer.py tools/semantic_frame_compiler/frame-observer.py
      - name: Load target-version Engine only in disposable hosted CI
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz --output engine.tgz
          printf '%s\n' 'd8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70  engine.tgz' | sha256sum -c -
          mkdir engine-bin
          tar -xzf engine.tgz --strip-components=1 -C engine-bin
          ./engine-bin/docker --version
          ./engine-bin/dockerd --version
      - name: Real isolated Docker frame shape and refusing capture runtime
        run: |
          sudo install -d -m 700 /root/ouf-frame-compiler-fixture
          sudo install -m 600 tools/semantic_frame_compiler/*.py tools/semantic_frame_compiler/semantic_oci_shape_schema.json /root/ouf-frame-compiler-fixture/
          sudo env PATH="${{ github.workspace }}/engine-bin:/usr/sbin:/usr/bin:/sbin:/bin" OUF_FRAME_COMPILER_ENGINE_VERSION=29.8.1 OUF_FRAME_COMPILER_MOUNT_ORDER=depth-path OUF_FRAME_COMPILER_EXPORT_DIRECTORY="${{ github.workspace }}/frame-baselines" OUF_FRAME_COMPILER_ROLE=${{ matrix.role }} OUF_FRAME_COMPILER_NETWORK=bridge OUF_FRAME_COMPILER_BACKEND=${{ matrix.backend }} /usr/bin/python3 -I -B /root/ouf-frame-compiler-fixture/test_compile_creation_frame_policy_native.py
      - name: Retain synthetic Engine baseline for independent role template review
        uses: actions/upload-artifact@v4
        with:
          name: frame-baseline-${{ matrix.backend }}-${{ matrix.role }}
          path: frame-baselines/*.json
          if-no-files-found: error
          retention-days: 7
