name: Stage qualified source revision package on existing runner
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['.github/workflows/source-revision-delivery.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: ouf-source-revision-package-staging
  cancel-in-progress: false
jobs:
  stage-only:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reserve a persistent private runner staging directory
        env:
          OUF_PACKAGE_DIRECTORY: ${{ runner.workspace }}/ouf-source-revision-${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$OUF_PACKAGE_DIRECTORY"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-revision-candidates-39085780635
          run-id: 39085780635
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: GioNob/ouf-deploy
          path: ${{ runner.workspace }}/ouf-source-revision-${{ github.run_id }}
      - uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        with: {cosign-release: v3.1.3}
      - name: Verify publisher and exact packaged sources without root or runtime access
        env:
          OUF_PACKAGE_DIRECTORY: ${{ runner.workspace }}/ouf-source-revision-${{ github.run_id }}
        run: |
          set -euo pipefail
          cosign verify-blob "$OUF_PACKAGE_DIRECTORY/SHA256SUMS" --bundle "$OUF_PACKAGE_DIRECTORY/SHA256SUMS.sigstore.json" --certificate-identity "https://github.com/GioNob/ouf-deploy/.github/workflows/source-revision-candidates.yml@refs/heads/feat/chat-only-recovery-package-20261018" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository GioNob/ouf-deploy --certificate-github-workflow-sha ccfbd3eb48c2141ce855fb8f9098546f44af56b9
          python3 - <<'PY'
          import hashlib,json,os,runpy
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUF_PACKAGE_DIRECTORY'])
          assert root.is_dir() and not root.is_symlink()
          entries={}
          for line in (root/'SHA256SUMS').read_text().splitlines():
              wanted,name=line.split('  ',1);relative=PurePosixPath(name)
              assert len(wanted)==64 and all(c in '0123456789abcdef' for c in wanted)
              assert str(relative)==name and not relative.is_absolute() and '..' not in relative.parts and name not in entries
              path=root/name
              assert all(not p.is_symlink() for p in [path,*path.parents]) and path.is_file()
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda:stream.read(1048576),b''):h.update(block)
              assert h.hexdigest()==wanted
              entries[name]=wanted
          assert set(entries)=={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}-{'SHA256SUMS','SHA256SUMS.sigstore.json'}
          lock=json.loads((root/'source-lock.json').read_text())
          expected={'onboarding':'be388e1462778438a208c2e00e166370fee32189','mcp':'a79b139c7a26d64a584b0a432ebb8df8c32a52ed','gateway':'dd8553da90d7a6cfc1083e1cf4d9075c09ee389b'}
          assert {m['module']:m['commit'] for m in lock['modules']}==expected
          assert lock['targetApplyAuthorized'] is False and lock['runtimeAuthorityIssued'] is False
          for module,commit in expected.items():
              part=root/'parts'/('source-revision-part-'+module+'-39085780635')
              manifest=json.loads((part/'candidate-manifest.json').read_text())
              assert manifest['sourceCommit']==commit and manifest['module']==module
              assert manifest['sourceLockSha256']==hashlib.sha256((root/'source-lock.json').read_bytes()).hexdigest()
              assert manifest['scanGate']=='PASS_HIGH_CRITICAL_UNKNOWN_INCLUDING_UNFIXED'
              assert manifest['targetApplyAuthorized'] is False
          print(json.dumps({'schema':'ouf.source-revision-runner-staging.v1','packageVerified':True,'sourceCommits':expected,'packageDirectory':str(root),'privilegedCommands':0,'runtimeMutations':0,'targetApplyAuthorized':False,'rootCustodyProven':False,'installationReady':False,'completedTechnicalPhases':8,'functionalMilestonesProven':4},sort_keys=True))
          manifest_sha=hashlib.sha256((root/'SHA256SUMS').read_bytes()).hexdigest()
          print(json.dumps({'manifestSha256':manifest_sha,'sourceLockSha256':hashlib.sha256((root/'source-lock.json').read_bytes()).hexdigest()}))
          auditor=runpy.run_path('scripts/audit-source-revision-images.py')
          auditor['main'](root,root.parent/('ouf-source-revision-image-review-'+os.environ['GITHUB_RUN_ID']),manifest_sha,'39085780635')
          PY
