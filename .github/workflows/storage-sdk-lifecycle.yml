name: Storage SDK lifecycle regression
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - '.github/workflows/storage-sdk-lifecycle.yml'
      - 'scripts/assess-storage-sdk-lifecycle.py'
      - 'tests/test_storage_sdk_lifecycle.py'
      - 'patches/seaweedfs/4.52-listing-remove-sdk-v1.patch'
      - 'patches/seaweedfs/4.52-bucket-xml-response-remove-sdk-v1.patch'
      - 'patches/seaweedfs/4.52-master-follower-remove-sdk-v1.patch'
      - 'patches/seaweedfs/4.52-iam-wire-remove-sdk-v1.patch'
      - 'patches/seaweedfs/4.52-s3-wire-remove-sdk-v1.patch'
      - 'patches/seaweedfs/4.52-sqs-sdk-v2.patch'
      - 'patches/seaweedfs/4.52-sqs-sdk-v2-added-packages.txt'
      - 'patches/seaweedfs/4.52-kms-sdk-v2.patch'
      - 'patches/seaweedfs/4.52-kms-sdk-v2-added-packages.txt'
      - 'patches/seaweedfs/4.52-s3sink-sdk-v2.patch'
      - 'patches/seaweedfs/4.52-s3sink-sdk-v2-added-packages.txt'
      - 'patches/seaweedfs/4.52-s3backend-sdk-v2.patch'
      - 'patches/seaweedfs/4.52-remote-storage-s3-sdk-v2.patch'
      - 'patches/seaweedfs/4.52-remote-storage-s3-sdk-v2-removed-packages.txt'
      - 'patches/seaweedfs/4.52-s3-wire-parser-remove-sdk-v1.patch'
      - 'patches/seaweedfs/4.52-s3-wire-parser-remove-sdk-v1-removed-packages.txt'
      - 'patches/seaweedfs/4.52-test-fixtures-remove-sdk-v1.patch'
      - 'patches/seaweedfs/4.52-storage-test-tools-sdk-v2.patch'
      - 'evidence/seaweedfs-sdk-v1-test-closure-local-20261103.json'
      - 'evidence/artifacts/storage-runtime-image-readback-41527990598.zip'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify lifecycle evidence handling and the exact 4.51 denial
        run: python3 -I -B -S -m unittest discover -s tests -p test_storage_sdk_lifecycle.py -v
  seaweedfs_patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seaweedfs/seaweedfs
          ref: 984eac6a790be89e2a11de175a7413e1e3e32dd3
          path: seaweedfs
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Apply the exact patches and compare the dependency graphs
        working-directory: seaweedfs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 984eac6a790be89e2a11de175a7413e1e3e32dd3
          go list -mod=readonly -deps ./weed | LC_ALL=C sort > "$RUNNER_TEMP/seaweedfs-baseline-deps"
          git apply --check ../patches/seaweedfs/4.52-listing-remove-sdk-v1.patch
          git apply ../patches/seaweedfs/4.52-listing-remove-sdk-v1.patch
          git apply --check ../patches/seaweedfs/4.52-bucket-xml-response-remove-sdk-v1.patch
          git apply ../patches/seaweedfs/4.52-bucket-xml-response-remove-sdk-v1.patch
          git apply --check ../patches/seaweedfs/4.52-master-follower-remove-sdk-v1.patch
          git apply ../patches/seaweedfs/4.52-master-follower-remove-sdk-v1.patch
          git apply --check ../patches/seaweedfs/4.52-iam-wire-remove-sdk-v1.patch
          git apply ../patches/seaweedfs/4.52-iam-wire-remove-sdk-v1.patch
          git apply --check ../patches/seaweedfs/4.52-s3-wire-remove-sdk-v1.patch
          git apply ../patches/seaweedfs/4.52-s3-wire-remove-sdk-v1.patch
          git apply --check ../patches/seaweedfs/4.52-sqs-sdk-v2.patch
          git apply ../patches/seaweedfs/4.52-sqs-sdk-v2.patch
          git apply --check ../patches/seaweedfs/4.52-kms-sdk-v2.patch
          git apply ../patches/seaweedfs/4.52-kms-sdk-v2.patch
          git apply --check ../patches/seaweedfs/4.52-s3sink-sdk-v2.patch
          git apply ../patches/seaweedfs/4.52-s3sink-sdk-v2.patch
          git apply --check ../patches/seaweedfs/4.52-s3backend-sdk-v2.patch
          git apply ../patches/seaweedfs/4.52-s3backend-sdk-v2.patch
          git apply --check ../patches/seaweedfs/4.52-remote-storage-s3-sdk-v2.patch
          git apply ../patches/seaweedfs/4.52-remote-storage-s3-sdk-v2.patch
          git apply --check ../patches/seaweedfs/4.52-s3-wire-parser-remove-sdk-v1.patch
          git apply ../patches/seaweedfs/4.52-s3-wire-parser-remove-sdk-v1.patch
          git apply --check ../patches/seaweedfs/4.52-test-fixtures-remove-sdk-v1.patch
          git apply ../patches/seaweedfs/4.52-test-fixtures-remove-sdk-v1.patch
          git apply --check ../patches/seaweedfs/4.52-storage-test-tools-sdk-v2.patch
          git apply ../patches/seaweedfs/4.52-storage-test-tools-sdk-v2.patch
          git diff --check
          if grep -R --include='*.go' --exclude='*_test.go' -F '"github.com/aws/aws-sdk-go/' weed; then
            exit 1
          fi
          if grep -R --include='*.go' -F '"github.com/aws/aws-sdk-go/' weed; then
            exit 1
          fi
          go list -mod=readonly -deps -test ./weed/command ./weed/iam/... ./weed/iamapi ./weed/s3api ./weed/s3api/s3_constants ./weed/s3api/wire ./weed/s3api/s3err ./weed/notification/aws_sqs ./weed/replication/sub ./weed/kms/... ./weed/replication/sink/s3sink ./weed/storage/backend/s3_backend ./weed/remote_storage/s3 | LC_ALL=C sort -u > "$RUNNER_TEMP/seaweedfs-qualified-test-deps"
          if grep -q '^github.com/aws/aws-sdk-go/' "$RUNNER_TEMP/seaweedfs-qualified-test-deps"; then
            exit 1
          fi
          if grep -F '"github.com/aws/aws-sdk-go/' weed/s3api/s3api_object_handlers_list.go; then
            exit 1
          fi
          go list -mod=readonly -f '{{join .Imports "\n"}}' ./weed/s3api/s3err > "$RUNNER_TEMP/seaweedfs-s3err-imports"
          if grep -q '^github.com/aws/aws-sdk-go/' "$RUNNER_TEMP/seaweedfs-s3err-imports"; then
            exit 1
          fi
          go list -mod=readonly -f '{{join .Imports "\n"}}' ./weed/command > "$RUNNER_TEMP/seaweedfs-command-imports"
          if grep -q '^github.com/aws/aws-sdk-go/' "$RUNNER_TEMP/seaweedfs-command-imports"; then
            exit 1
          fi
          go list -mod=readonly -deps ./weed | LC_ALL=C sort > "$RUNNER_TEMP/seaweedfs-patched-deps"
          sed 's|^github.com/aws/aws-sdk-go/service/iam$|github.com/seaweedfs/seaweedfs/weed/iam/wire|' "$RUNNER_TEMP/seaweedfs-baseline-deps" | LC_ALL=C sort > "$RUNNER_TEMP/seaweedfs-expected-deps"
          echo github.com/seaweedfs/seaweedfs/weed/s3api/wire >> "$RUNNER_TEMP/seaweedfs-expected-deps"
          sed -i '\|^github.com/aws/aws-sdk-go/service/sqs$|d' "$RUNNER_TEMP/seaweedfs-expected-deps"
          cat ../patches/seaweedfs/4.52-sqs-sdk-v2-added-packages.txt >> "$RUNNER_TEMP/seaweedfs-expected-deps"
          sed -i '\|^github.com/aws/aws-sdk-go/service/kms$|d' "$RUNNER_TEMP/seaweedfs-expected-deps"
          cat ../patches/seaweedfs/4.52-kms-sdk-v2-added-packages.txt >> "$RUNNER_TEMP/seaweedfs-expected-deps"
          cat ../patches/seaweedfs/4.52-s3sink-sdk-v2-added-packages.txt >> "$RUNNER_TEMP/seaweedfs-expected-deps"
          grep -Fvx -f ../patches/seaweedfs/4.52-remote-storage-s3-sdk-v2-removed-packages.txt "$RUNNER_TEMP/seaweedfs-expected-deps" > "$RUNNER_TEMP/seaweedfs-expected-deps-next"
          mv "$RUNNER_TEMP/seaweedfs-expected-deps-next" "$RUNNER_TEMP/seaweedfs-expected-deps"
          grep -Fvx -f ../patches/seaweedfs/4.52-s3-wire-parser-remove-sdk-v1-removed-packages.txt "$RUNNER_TEMP/seaweedfs-expected-deps" > "$RUNNER_TEMP/seaweedfs-expected-deps-next"
          mv "$RUNNER_TEMP/seaweedfs-expected-deps-next" "$RUNNER_TEMP/seaweedfs-expected-deps"
          LC_ALL=C sort -o "$RUNNER_TEMP/seaweedfs-expected-deps" "$RUNNER_TEMP/seaweedfs-expected-deps"
          go list -mod=readonly -f '{{join .Imports "\n"}}' ./weed/notification/aws_sqs ./weed/replication/sub > "$RUNNER_TEMP/seaweedfs-sqs-imports"
          if grep -q '^github.com/aws/aws-sdk-go/' "$RUNNER_TEMP/seaweedfs-sqs-imports"; then
            exit 1
          fi
          go list -mod=readonly -f '{{join .Imports "\n"}}' ./weed/kms/aws > "$RUNNER_TEMP/seaweedfs-kms-imports"
          if grep -q '^github.com/aws/aws-sdk-go/' "$RUNNER_TEMP/seaweedfs-kms-imports"; then
            exit 1
          fi
          go list -mod=readonly -f '{{join .Imports "\n"}}' ./weed/replication/sink/s3sink > "$RUNNER_TEMP/seaweedfs-s3sink-imports"
          if grep -q '^github.com/aws/aws-sdk-go/' "$RUNNER_TEMP/seaweedfs-s3sink-imports"; then
            exit 1
          fi
          go list -mod=readonly -f '{{join .Imports "\n"}}' ./weed/storage/backend/s3_backend > "$RUNNER_TEMP/seaweedfs-s3backend-imports"
          if grep -q '^github.com/aws/aws-sdk-go/' "$RUNNER_TEMP/seaweedfs-s3backend-imports"; then
            exit 1
          fi
          go list -mod=readonly -f '{{join .Imports "\n"}}' ./weed/remote_storage/s3 > "$RUNNER_TEMP/seaweedfs-remote-s3-imports"
          if grep -q '^github.com/aws/aws-sdk-go/' "$RUNNER_TEMP/seaweedfs-remote-s3-imports"; then
            exit 1
          fi
          if grep -q '^github.com/aws/aws-sdk-go-v2/feature/s3/manager' "$RUNNER_TEMP/seaweedfs-patched-deps"; then
            exit 1
          fi
          go list -mod=readonly -f '{{join .Imports "\n"}}' ./weed/s3api/s3_constants > "$RUNNER_TEMP/seaweedfs-constants-imports"
          if grep -q '^github.com/aws/aws-sdk-go/' "$RUNNER_TEMP/seaweedfs-constants-imports"; then
            exit 1
          fi
          cmp "$RUNNER_TEMP/seaweedfs-expected-deps" "$RUNNER_TEMP/seaweedfs-patched-deps"
          if grep -q '^github.com/aws/aws-sdk-go/' "$RUNNER_TEMP/seaweedfs-patched-deps"; then
            exit 1
          fi
      - name: Run command, IAM, S3, ACL, SQS, KMS, S3 sink, tier backend and remote S3 regressions
        working-directory: seaweedfs
        run: |
          set -euo pipefail
          go test -mod=readonly -count 1 -timeout 3m -json ./weed/command ./weed/iam/... ./weed/iamapi ./weed/s3api ./weed/s3api/s3_constants ./weed/s3api/wire ./weed/s3api/s3err ./weed/notification/aws_sqs ./weed/replication/sub ./weed/kms/... ./weed/replication/sink/s3sink ./weed/storage/backend/s3_backend ./weed/remote_storage/s3 | tee "$RUNNER_TEMP/seaweedfs-regressions.jsonl"
          go list -mod=readonly -deps -test ./unmaintained/s3/presigned_put ./test/s3/remote_cache/utils | LC_ALL=C sort -u > "$RUNNER_TEMP/seaweedfs-storage-tool-test-deps"
          if grep -Eq '^github[.]com/aws/(aws-sdk-go|aws-sdk-go-v2/feature/s3/manager)(/|$)' "$RUNNER_TEMP/seaweedfs-storage-tool-test-deps"; then
            exit 1
          fi
          go test -mod=readonly -count 1 -timeout 30s -json ./unmaintained/s3/presigned_put ./test/s3/remote_cache/utils | tee "$RUNNER_TEMP/seaweedfs-storage-tools.jsonl"
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/weed-lab" ./weed
          go version -m "$RUNNER_TEMP/weed-lab" > "$RUNNER_TEMP/seaweedfs-build-info.txt"
          if grep -Eq '^[[:space:]]*dep[[:space:]]+github[.]com/aws/aws-sdk-go[[:space:]]' "$RUNNER_TEMP/seaweedfs-build-info.txt"; then
            exit 1
          fi
          sha256sum "$RUNNER_TEMP/weed-lab" > "$RUNNER_TEMP/seaweedfs-binary-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seaweedfs-sdk-lifecycle-evidence
          path: |
            ${{ runner.temp }}/seaweedfs-*-deps
            ${{ runner.temp }}/seaweedfs-*-imports
            ${{ runner.temp }}/seaweedfs-regressions.jsonl
            ${{ runner.temp }}/seaweedfs-storage-tools.jsonl
            ${{ runner.temp }}/seaweedfs-build-info.txt
            ${{ runner.temp }}/seaweedfs-binary-sha256.txt
          if-no-files-found: error
          retention-days: 90
