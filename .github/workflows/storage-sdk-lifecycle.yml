name: Storage SDK lifecycle regression
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - '.github/workflows/storage-sdk-lifecycle.yml'
      - 'scripts/assess-storage-sdk-lifecycle.py'
      - 'tests/test_storage_sdk_lifecycle.py'
      - 'evidence/artifacts/storage-runtime-image-readback-41527990598.zip'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify lifecycle evidence handling and the exact 4.51 denial
        run: python3 -I -B -S -m unittest discover -s tests -p test_storage_sdk_lifecycle.py -v
