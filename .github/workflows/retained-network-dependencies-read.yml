name: Retained endpoint dependency read
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  redaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -I -B -S -m unittest discover -s tests -p test_retained_network_dependencies_read.py -v
  target-read:
    needs: redaction
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: timeout -s KILL 60 python3 -I -B -S scripts/read-retained-network-dependencies.py
