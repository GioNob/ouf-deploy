name: Composed provider lease transport
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_lease_transport/**'
      - 'tools/semantic_cohort_admission/cohort-draft/**'
      - '.github/workflows/provider-v2-composed-lease-transport.yml'
permissions:
  contents: read
jobs:
  composed-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject unbound or shared-bridge guard delegation
        run: python3 -B -m unittest discover -v -s tools/semantic_lease_transport -p test_composed_lease_guard.py
      - name: Install disposable packet dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 nftables
      - name: Two isolated roles and real expiring TCP transport
        run: sudo unshare --net /usr/bin/python3 -B tools/semantic_lease_transport/test_composed_lease_guard_native.py
