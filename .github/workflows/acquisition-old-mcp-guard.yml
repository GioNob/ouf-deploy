name: Acquisition retained old MCP guard diagnosis
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths: ['scripts/read-acquisition-old-mcp-guard-20261025.py','tests/test_acquisition_old_mcp_guard.py','.github/workflows/acquisition-old-mcp-guard.yml']
  pull_request:
    paths: ['scripts/read-acquisition-old-mcp-guard-20261025.py','tests/test_acquisition_old_mcp_guard.py','.github/workflows/acquisition-old-mcp-guard.yml']
permissions: {contents: read}
jobs:
  retained-root-filesystem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Retained field classification root custody journal snapshot counters and no runtime ports
        shell: bash
        run: sudo env OUF_OLD_MCP_GUARD_ROOT_FIXTURE=1 python3 -I -S -B -m unittest discover -s "$PWD/tests" -p test_acquisition_old_mcp_guard.py -v
