name: Storage generation33 quiesced joint cut and fenced restore

on:
  workflow_dispatch:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - .github/workflows/storage-generation33-common-cut.yml
      - scripts/run-storage-coordinated33-lab.py
      - tests/test_storage_coordinated33_lab.py
      - tests/test_storage_coordinated33_crash.py
      - tests/test_storage_coordinated33_response_loss.py
      - tests/storage_response_loss.py
      - tests/fixtures/storage-recovery/writer-fence.sql
      - tests/run_storage_postgres_writer_fence.py
      - tests/run_storage_postgres_logical_restore.py
      - tests/run_storage_postgres_fixture_native.py

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: storage-generation33-common-cut-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quiesced-joint-cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test common cut integrity and historical publication fence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cut33/build-evidence"
          python3 -I -B -S -m unittest discover -s tests -p 'test_storage_coordinated33*.py' -v 2>&1 | tee "$RUNNER_TEMP/cut33/build-evidence/offline-tests.log"
          python3 -I -B -S -m unittest discover -s tests -p test_storage_postgres_writer_fence.py -v
          python3 -I -B -S -m unittest discover -s tests -p test_storage_postgres_logical_restore_contract.py -v
      - name: Build the pinned PostgreSQL 17.11 fixture tools
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/cut33"
          mkdir -p "$base/build-evidence"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential bison flex
          cd "$base"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 \
            https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.bz2 \
            --output postgresql-17.11.tar.bz2
          printf '%s\n' 'dd27f2b3c59e73ed14aa3324901242bf69a032a6347805f274e6260322d42979  postgresql-17.11.tar.bz2' > build-evidence/source.sha256
          sha256sum --strict --check build-evidence/source.sha256
          tar -xjf postgresql-17.11.tar.bz2
          cd postgresql-17.11
          timeout 600 ./configure --prefix="$base/install" --without-readline --without-zlib --without-icu \
            > ../build-evidence/configure.log 2>&1
          timeout 600 make -j2 > ../build-evidence/make.log 2>&1
          timeout 120 make install > ../build-evidence/install.log 2>&1
          sha256sum "$base/install/bin/"{postgres,initdb,pg_ctl,psql,pg_dump,pg_restore} > ../build-evidence/binary-sha256.txt
      - name: Fetch and bind the exact successful generation33 cohort and image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B -S - <<'PYCODE'
          import hashlib, importlib.util, json, os, pathlib, subprocess
          p=pathlib.Path('scripts/run-storage-coordinated33-lab.py')
          spec=importlib.util.spec_from_file_location('rotation',p)
          rotation=importlib.util.module_from_spec(spec);spec.loader.exec_module(rotation)
          bound=rotation.labs.binding_api.load(pathlib.Path.cwd(),rotation.LOCK_SHA)
          inputs=pathlib.Path(os.environ['RUNNER_TEMP'])/'cut33-inputs';inputs.mkdir()
          def fetch(artifact_id,filename,expected_size,expected_sha):
              dest=inputs/filename
              url='https://api.github.com/repos/GioNob/ouf-deploy/actions/artifacts/'+str(artifact_id)+'/zip'
              subprocess.run(['curl','--fail','--location','--silent','--show-error','--proto','=https',
                              '--tlsv1.2','--retry','2','--connect-timeout','15','--max-time','180',
                              '--max-filesize',str(expected_size),'-H','Authorization: Bearer '+os.environ['GH_TOKEN'],
                              '-H','Accept: application/vnd.github+json',url,'--output',str(dest)],check=True)
              assert dest.stat().st_size==expected_size
              with dest.open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==expected_sha
              return dest
          cohort=fetch(rotation.COHORT_ARTIFACT_ID,'cohort.zip',rotation.COHORT_ARCHIVE_BYTES,rotation.COHORT_ARCHIVE_SHA)
          receipt=rotation.labs.bind_cohort_artifact(cohort,inputs/'bound-cohort',bound,
                                                    rotation.COHORT_ARCHIVE_SHA,rotation.COHORT_SHA)
          rotation.binding(receipt)
          image=bound['lock']['producerArtifact']
          fetch(image['id'],'image.zip',image['bytes'],image['digest'].removeprefix('sha256:'))
          PYCODE

      - name: Verify the successful cohort publisher with its exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 90 \
            https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz -o gh297.tar.gz
          printf '%s  %s\n' a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112 gh297.tar.gz | sha256sum --check --strict
          mkdir gh297
          tar --no-same-owner -xzf gh297.tar.gz --strip-components=1 -C gh297 gh_2.97.0_linux_amd64/bin/gh
          gh297/bin/gh attestation verify "$RUNNER_TEMP/cut33-inputs/bound-cohort/SHA256SUMS" \
            --repo GioNob/ouf-deploy \
            --signer-workflow GioNob/ouf-deploy/.github/workflows/storage-452-generation33-cohort.yml \
            --source-digest 7a00b8bfaf8a2cefdc2aff278be62fd5b7f28791 \
            --source-ref refs/heads/feat/m2-discovery-complete-profile-20261029 \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/cut33-inputs/cohort-publisher-verification.json"
          test -s "$RUNNER_TEMP/cut33-inputs/cohort-publisher-verification.json"

      - name: Freeze, reconcile and restore the exact generation33 fixture
        run: |
          set -euo pipefail
          python3 -I -B -S scripts/run-storage-coordinated33-lab.py run \
            --pg-bin "$RUNNER_TEMP/cut33/install/bin" \
            --image "$RUNNER_TEMP/cut33-inputs/image.zip" \
            --cohort-receipt "$RUNNER_TEMP/cut33-inputs/bound-cohort/cohort-receipt.json" \
            --work "$RUNNER_TEMP/cut33/lab"
      - name: Kill a post-PUT worker, crash-restart PostgreSQL and recover without resend
        run: |
          set -euo pipefail
          python3 -I -B -S scripts/run-storage-coordinated33-lab.py run \
            --pg-bin "$RUNNER_TEMP/cut33/install/bin" \
            --image "$RUNNER_TEMP/cut33-inputs/image.zip" \
            --cohort-receipt "$RUNNER_TEMP/cut33-inputs/bound-cohort/cohort-receipt.json" \
            --work "$RUNNER_TEMP/cut33/crash-lab" --crash-after-put
      - name: Lose the successful S3 PUT response and reconcile without resend
        run: |
          set -euo pipefail
          python3 -I -B -S scripts/run-storage-coordinated33-lab.py run \
            --pg-bin "$RUNNER_TEMP/cut33/install/bin" \
            --image "$RUNNER_TEMP/cut33-inputs/image.zip" \
            --cohort-receipt "$RUNNER_TEMP/cut33-inputs/bound-cohort/cohort-receipt.json" \
            --work "$RUNNER_TEMP/cut33/response-loss-lab" --lose-put-response
      - name: Bind exact source and preserve successful or failed evidence
        if: always()
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/cut33"
          mkdir -p "$base/build-evidence" "$base/lab/evidence" "$base/crash-lab/evidence" "$base/response-loss-lab/evidence"
          for name in cohort-publisher-verification.json bound-cohort/cohort-receipt.json; do
            if test -f "$RUNNER_TEMP/cut33-inputs/$name"; then
              cp "$RUNNER_TEMP/cut33-inputs/$name" "$base/build-evidence/$(basename "$name")"
            fi
          done
          sha256sum .github/workflows/storage-generation33-common-cut.yml \
            scripts/run-storage-coordinated33-lab.py tests/test_storage_coordinated33_lab.py tests/test_storage_coordinated33_crash.py \
            tests/storage_response_loss.py tests/test_storage_coordinated33_response_loss.py \
            scripts/{run-seaweedfs-452-generation33-labs,run-seaweedfs-452-cold-recovery,run-seaweedfs-452-identity-tls,storage-generation33-lab-binding,readback-seaweedfs-452-generation33-image,qualify-seaweedfs-452-generation33-image}.py \
            tests/{run_storage_postgres_fixture_native,run_storage_postgres_logical_restore,run_storage_postgres_writer_fence}.py \
            tests/fixtures/storage-recovery/writer-fence.sql \
            evidence/artifacts/storage-common-cut33-failed-41803868175.zip \
            tools/storage_recovery/{coordinated,manifest,postgres_fixture,profile}.py \
            tools/storage_security/{generation_image_v4,generation_readback_v1}.py \
            profiles/seaweedfs-452-lab/profile.json \
            releases/seaweedfs-452-generation33-{candidate-lock,vendor-build-manifest}-20261104.json \
            > "$base/build-evidence/repository-source-sha256.txt"
          git rev-parse HEAD > "$base/build-evidence/repository-commit.txt"
          cd "$base"
          find build-evidence lab/evidence crash-lab/evidence response-loss-lab/evidence -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --strict --check SHA256SUMS
      - name: Attest successful synthetic evidence
        if: success()
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ runner.temp }}/cut33/SHA256SUMS
      - name: Retain bounded fixture evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-common-cut33-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cut33/SHA256SUMS
            ${{ runner.temp }}/cut33/build-evidence/
            ${{ runner.temp }}/cut33/lab/evidence/
            ${{ runner.temp }}/cut33/crash-lab/evidence/
            ${{ runner.temp }}/cut33/response-loss-lab/evidence/
          if-no-files-found: error
          retention-days: 90
