name: OUF composed fenced backup executor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/semantic_application_cutover/fenced_backup_adapter.py
      - tools/semantic_application_cutover/database_channel_scope.py
      - tests/test_fenced_backup_adapter.py
      - tests/native_fenced_backup_executor.py
      - .github/workflows/native-fenced-backup-executor.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: New composition boundaries
        run: python3 -m unittest discover -s tests -p test_fenced_backup_adapter.py -v
      - name: Actual PG17 backup and controller process death
        run: python3 tests/native_fenced_backup_executor.py
