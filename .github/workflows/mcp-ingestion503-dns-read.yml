name: MCP Ingestion503 bounded DNS and approved profile read
on:
  push:
    paths:
      - 'scripts/read-mcp-ingestion503-dns.py'
      - 'tests/test_mcp_ingestion503_dns_read.py'
      - '.github/workflows/mcp-ingestion503-dns-read.yml'
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Native root custody namespace restore and bounded DNS projection
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-ingestion503-read-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env OUF_TEST_ROOT="$fixture" python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_mcp_ingestion503_dns_read.py -v
