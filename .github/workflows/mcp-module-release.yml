name: Governed MCP release
on:
  workflow_dispatch:
    inputs:
      return_plan:
        description: SHA-256 del plan READY da ritirare (vuoto per il rilascio)
        type: string
        required: false
permissions: {}
concurrency:
  group: ouf-vps-privileged-operations
  cancel-in-progress: false

env:
  MODULE: mcp

jobs:
  intent:
    if: github.ref_protected && github.run_attempt == '1' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.intent.outputs.digest }}
    steps:
      - id: intent
        env:
          RETURN_PLAN: ${{ inputs.return_plan }}
        shell: bash
        run: |
          /usr/bin/python3 -I - <<'PY'
          import hashlib, json, os, re
          e = os.environ
          scope = dict(run=e["GITHUB_RUN_ID"], attempt=e["GITHUB_RUN_ATTEMPT"], commit=e["GITHUB_SHA"],
                       operation="module-release", module=e["MODULE"])
          digest = hashlib.sha256(json.dumps(scope, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          phase = "plan"
          if e["RETURN_PLAN"]:
              digest = e["RETURN_PLAN"]
              if not re.fullmatch("[0-9a-f]{64}", digest):
                  raise SystemExit("INVALID_RETURN_PLAN")
              phase = "rollback"
          with open(e["GITHUB_STEP_SUMMARY"], "a") as f:
              print(f"Job `{phase} {digest}`", file=f)
              if phase == "rollback":
                  print("Approvare il job (nessun commento richiesto)", file=f)
          with open(e["GITHUB_OUTPUT"], "a") as f:
              print("digest=" + digest, file=f)
          PY

  plan:
    name: plan ${{ needs.intent.outputs.digest }}
    needs: intent
    if: inputs.return_plan == ''
    runs-on: &vps [self-hosted, Linux, X64, ouf-vps-test]
    permissions: {contents: read, actions: read, deployments: read}
    timeout-minutes: 40
    env:
      PHASE: plan
      DIGEST: ${{ needs.intent.outputs.digest }}
    outputs:
      digest: ${{ steps.call.outputs.digest }}
    steps:
      - &invoke
        id: call
        env:
          REVIEW_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          /usr/bin/python3 -I - <<'PY'
          import json, os, re, subprocess
          e = os.environ
          req = dict(run=e["GITHUB_RUN_ID"], attempt=e["GITHUB_RUN_ATTEMPT"], commit=e["GITHUB_SHA"],
                     operation="module-release", module=e["MODULE"], phase=e["PHASE"], digest=e["DIGEST"])
          wire = json.dumps({"request": req, "token": e.pop("REVIEW_TOKEN")}).encode()
          out = subprocess.run(["/usr/bin/sudo", "-n", "--", "/usr/local/sbin/ouf-a2"],
                               input=wire, stdout=subprocess.PIPE)
          if out.returncode:
              raise SystemExit(out.returncode)
          result = json.loads(out.stdout)
          stamp = result["digest"]
          if not re.fullmatch("[0-9a-f]{64}", stamp):
              raise SystemExit("Risposta esecutore non valida")
          status = result["status"]
          next_phase = {"PLANNED": "apply", "GATED": "migrate", "READY": None, "ROLLED_BACK": None}[status]
          with open(e["GITHUB_STEP_SUMMARY"], "a") as f:
              print("MCP", status, file=f)
              if "databaseReview" in result:
                  print(chr(96) * 3 + "json", json.dumps(result["databaseReview"], indent=2),
                        chr(96) * 3, sep=chr(10), file=f)
              if next_phase:
                  print(f"Job `{next_phase} {stamp}`", file=f)
                  print("Approvare il job (nessun commento richiesto)", file=f)
          with open(e["GITHUB_OUTPUT"], "a") as f:
              print("digest=" + stamp, "status=" + status, sep=chr(10), file=f)
          PY

  apply:
    name: apply ${{ needs.plan.outputs.digest }}
    needs: plan
    runs-on: *vps
    environment: ouf-vps-privileged
    permissions: {contents: read, actions: read, deployments: read}
    timeout-minutes: 40
    env:
      PHASE: apply
      DIGEST: ${{ needs.plan.outputs.digest }}
    outputs:
      status: ${{ steps.call.outputs.status }}
      digest: ${{ steps.call.outputs.digest }}
    steps:
      - *invoke

  migrate:
    if: needs.apply.outputs.status == 'GATED'
    name: migrate ${{ needs.apply.outputs.digest }}
    needs: apply
    runs-on: *vps
    environment: ouf-vps-privileged
    permissions: {contents: read, actions: read, deployments: read}
    timeout-minutes: 40
    env:
      PHASE: migrate
      DIGEST: ${{ needs.apply.outputs.digest }}
    steps:
      - *invoke

  rollback:
    name: rollback ${{ needs.intent.outputs.digest }}
    needs: intent
    if: inputs.return_plan != ''
    runs-on: *vps
    environment: ouf-vps-privileged
    permissions: {contents: read, actions: read, deployments: read}
    timeout-minutes: 40
    env:
      PHASE: rollback
      DIGEST: ${{ needs.intent.outputs.digest }}
    steps:
      - *invoke
