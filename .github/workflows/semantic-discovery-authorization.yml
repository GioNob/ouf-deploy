permissions: {contents: read}
jobs:
  signed-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-source-onboarding
          ref: 84828f74ac586bae09a78f0fb197b75b1a3d98d1
          path: .pairwise/legacy
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-source-onboarding
          ref: be388e1462778438a208c2e00e166370fee32189
          path: .pairwise/revision
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Actual Java owner role constraints
        run: |
          set -euo pipefail
          mvn -B -q -f tests/fixtures/owner-role-roundtrip/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath -Dmdep.outputFile="$GITHUB_WORKSPACE/.owner-roundtrip.classpath"
          mkdir .owner-roundtrip-classes
          javac -cp "$(cat .owner-roundtrip.classpath)" -d .owner-roundtrip-classes \
            .pairwise/revision/authorization-sdk/src/main/java/it/comune/trieste/ouf/authorization/{AuthorizationPolicy,PrincipalContext,ResourceContext}.java \
            tests/fixtures/owner-role-roundtrip/OwnerConstraintRoundTrip.java
      - name: Real signed authority and durable owner journals in isolated root fixture
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-revision-authorization-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          for suite in test_chatbot_cohort_authorization.py test_chatbot_cohort_authorization_observation.py test_source_revision_authorization.py test_ingestion_read_authorization.py test_semantic_discovery_authorization.py test_m2_discovery_installation_audit.py test_m2_discovery_native_profile.py test_m2_discovery_frame_observation.py test_m2_discovery_node_owner.py test_m2_discovery_application.py test_m2_discovery_installation_application.py test_m2_discovery_lease_materialization.py test_m2_discovery_cohort_images.py test_m2_discovery_gateway_runtime.py test_m2_selected_image_preparation.py test_m2_discovery_mcp_runtime.py test_m2_discovery_selected_runtime.py test_m2_discovery_executor.py test_cutover_executor.py test_file_only_cutover.py test_m2_discovery_paused_attestation.py test_m2_discovery_transport_owner.py test_m2_discovery_installed_lease_guard.py test_m2_discovery_installed_lease_session.py test_m2_discovery_lease_service.py test_m2_discovery_lease_capsule.py test_m2_discovery_lease_unit.py test_m2_discovery_nft_backend.py test_m2_discovery_parent_authority.py test_m2_discovery_paused_binding.py test_m2_discovery_gate_peer_window.py test_m2_provider_installation_template.py test_m2_provider_creation.py test_m2_provider_profiles.py test_m2_provider_profile_publication.py test_m2_provider_materialized_admission.py test_m2_provider_runtime_installation.py test_m2_provider_installation_phase.py test_m2_discovery_lease_installation_template.py test_m2_discovery_lease_start_owner.py test_m2_discovery_lease_file_installation.py test_m2_discovery_lease_attestation.py test_m2_discovery_lease_registration.py test_m2_discovery_lease_installation_phase.py test_m2_discovery_custody_capture.py test_m2_discovery_projections.py test_m2_discovery_material_preparation.py test_m2_discovery_material_capsule.py test_m2_discovery_material_roles.py test_m2_discovery_material_role_capsule.py; do
            sudo env JAVA_HOME="$JAVA_HOME" PATH="$JAVA_HOME/bin:/usr/sbin:/usr/bin:/sbin:/bin" OUF_NATIVE_UIDS=1 OUF_NATIVE_SOCKETS=1 OUF_TEST_ROOT="$fixture" \
              OUF_CHATBOT_ONBOARDING_ROOT="$fixture/repository/.pairwise/legacy" \
              OUF_REVISION_ONBOARDING_ROOT="$fixture/repository/.pairwise/revision" \
              OUF_OWNER_JAVA_CLASSPATH="$fixture/repository/.owner-roundtrip-classes:$(cat .owner-roundtrip.classpath)" \
              python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p "$suite" -v
          done
