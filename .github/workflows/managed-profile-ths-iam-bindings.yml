name: Managed profile THS IAM bindings and additive configuration profile
on:
  push:
    paths: ['scripts/read-managed-profile-ths-iam-bindings-20261028.py','tools/managed_profile_ths_scopes/**','tests/*managed_profile_ths_iam*','releases/read-managed-profile-ths-iam-bindings-20261028.sh','.github/workflows/managed-profile-ths-iam-bindings.yml']
  pull_request:
    paths: ['scripts/read-managed-profile-ths-iam-bindings-20261028.py','tools/managed_profile_ths_scopes/**','tests/*managed_profile_ths_iam*','releases/read-managed-profile-ths-iam-bindings-20261028.sh','.github/workflows/managed-profile-ths-iam-bindings.yml']
permissions: {contents: read}
jobs:
  reusable-compiler-resilience-and-real-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -I -S -B -m unittest discover -s tests -p test_managed_profile_ths_iam_bindings.py -v
      - run: python3 -I -S -B -m unittest discover -s tests -p test_managed_profile_ths_scopes.py -v
      - run: python3 -I -S -B -m unittest discover -s tests -p test_managed_profile_ths_client.py -v
      - run: sudo env GITHUB_ACTIONS=true /usr/bin/python3 -I -S -B tests/qualify_managed_profile_ths_iam_physical.py
  actual-protected-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: bash -n releases/read-managed-profile-ths-iam-bindings-20261028.sh
      - run: sudo /usr/bin/python3 -I -S -B tests/qualify_managed_profile_ths_iam_delivery.py
