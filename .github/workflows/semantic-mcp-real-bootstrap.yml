name: Real MCP bootstrap after finite single update
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths:
      - tools/semantic_mcp_update/**
      - tests/test_semantic_mcp_single_update_owner.py
      - scripts/qualify-semantic-mcp-real-bootstrap.py
      - .github/workflows/semantic-mcp-real-bootstrap.yml
  pull_request:
    paths:
      - tools/semantic_mcp_update/**
      - tests/test_semantic_mcp_single_update_owner.py
      - scripts/qualify-semantic-mcp-real-bootstrap.py
      - .github/workflows/semantic-mcp-real-bootstrap.yml
permissions: {contents: read, actions: read}
jobs:
  signed-owner-and-native-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38938286063
          name: semantic-reprocessing-unsigned-mcp-38938286063
          path: atomic-package
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-mcp-server
          ref: f249b3dcc58c2a96742092d90fa09fd90b705bd0
          path: baseline-source
          persist-credentials: false
      - name: Existing role signatures, CAS, bounded outage and cancellation fixtures
        run: >-
          sudo env OUF_TEST_ROOT=/root python3 -I -B -m unittest discover
          -s "$GITHUB_WORKSPACE/tests" -p test_semantic_mcp_single_update_owner.py -v
      - name: Actual Docker adapters, PostgreSQL 17, backup and atomic native migrator
        run: >-
          sudo env OUF_NATIVE_MCP_UPDATE_FIXTURE=EPHEMERAL_RUNNER_ONLY
          MCP_ATOMIC_PACKAGE_DIRECTORY="$GITHUB_WORKSPACE/atomic-package"
          MCP_BASELINE_SOURCE_DIRECTORY="$GITHUB_WORKSPACE/baseline-source"
          python3 -I -B scripts/qualify-semantic-mcp-real-bootstrap.py
