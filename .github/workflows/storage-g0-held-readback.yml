name: Storage G0 held attempt readback
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - scripts/readback-storage-g0-held-20261106.py
      - tests/test_storage_g0_held_readback.py
      - .github/workflows/storage-g0-held-readback.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-g0-held-readback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  directories:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify held receipts and local metadata without provider calls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/held-readback"
          sudo -n env GITHUB_ACTIONS=true python3 -B -m unittest discover -s tests -p test_storage_g0_held_readback.py -v 2>&1 | tee "$RUNNER_TEMP/held-readback/tests.log"
          sha256sum scripts/readback-storage-g0-held-20261106.py tests/test_storage_g0_held_readback.py tools/storage_planning/g0_package.py tools/storage_planning/g0_database.py > "$RUNNER_TEMP/held-readback/sources.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-g0-held-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/held-readback/
          retention-days: 90
          if-no-files-found: error
