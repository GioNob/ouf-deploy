name: MCP archived analysis application upgrade
on:
  pull_request:
    paths:
      - scripts/upgrade-mcp-analysis-20261108.py
      - tests/test_mcp_analysis_upgrade_native.py
      - tests/test_mcp_analysis_upgrade.py
      - tools/mcp_analysis_20261108/fixture_export_test.go
      - .github/workflows/mcp-analysis-upgrade.yml
permissions: {contents: read, actions: read}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        store: [classic, containerd]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-mcp-server
          ref: 907ace32100d44a0fcf1fcbda5d713ee7bd8fd94
          path: mcp-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with: {go-version: '1.27.3'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: GioNob/ouf-mcp-server
          name: acquisition-mcp-image-42420569963
          run-id: 42420569963
          github-token: ${{ github.token }}
          path: mcp-candidate
      - name: Verify archived payload, prepare only disposable signed fixture
        run: |
          (cd mcp-candidate && sha256sum -c SHA256SUMS)
          echo '5ea15eeff97021e90eedfc74ea0b3fc53bb29dbf5a14f4f21ada564d40e88d02  mcp-candidate/image.tar.gz' | sha256sum -c -
          test "$(cat mcp-candidate/source-commit.txt)" = e2a474ea09bf9c3cb130103ca142f1a128942a80
          mkdir mcp-fixture
          cp tools/mcp_analysis_20261108/fixture_export_test.go mcp-source/internal/reprocessing/rollout_fixture_test.go
          cd mcp-source
          OUF_ROLLOUT_FIXTURE="$GITHUB_WORKSPACE/mcp-fixture" go test ./internal/reprocessing -run '^TestExportExpiredRolloutFixture$' -count=1 -v
      - name: Exact request, schema/history guards and log redaction
        run: python3 -m unittest discover -s tests -p test_mcp_analysis_upgrade.py -v
      - name: Existing strict MAC negative matrix
        run: python3 -m unittest discover -s tests -p test_retained_mac_transition.py -v
      - name: Reuse exact historical Docker29.8.1 in isolated hosted data root
        env: {SELECTED_STORE: '${{ matrix.store }}'}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz -o /tmp/ouf-docker-29.8.1.tgz
          printf '%s  %s\n' d8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70 /tmp/ouf-docker-29.8.1.tgz | sha256sum --check -
          sudo install -d -m 755 /opt/ouf-docker-29
          sudo tar -xzf /tmp/ouf-docker-29.8.1.tgz --strip-components=1 -C /opt/ouf-docker-29
          sudo chown -R root:root /opt/ouf-docker-29
          sudo systemctl stop docker.service docker.socket
          sudo systemctl start containerd.service
          sudo install -d -m 700 /var/lib/ouf-docker-29
          python3 - <<'PY_CONFIG'
          import json,os
          from pathlib import Path
          Path('/tmp/ouf-docker-29.json').write_text(json.dumps({'features':{'containerd-snapshotter':os.environ['SELECTED_STORE']=='containerd'},'exec-opts':['native.cgroupdriver=systemd']}))
          PY_CONFIG
          sudo systemd-run --unit=ouf-docker-mac-daemon --property=Restart=no \
            --setenv=PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            /opt/ouf-docker-29/dockerd --config-file=/tmp/ouf-docker-29.json \
            --host=unix:///var/run/docker.sock --data-root=/var/lib/ouf-docker-29 \
            --exec-root=/run/docker --pidfile=/run/ouf-docker-29.pid \
            --containerd=/run/containerd/containerd.sock
          for OUF_MAC_ENGINE_POLL in $(seq 1 60); do
            if sudo docker info > /tmp/ouf-docker-29-info.txt 2>/dev/null; then break; fi
            sleep 1
          done
          test "$(sudo docker version --format '{{.Server.Version}}')" = 29.8.1
      - name: Archived binary, ordinary migration14, signed expired permit and native replacement
        run: sudo python3 -I -B tests/test_mcp_analysis_upgrade_native.py
