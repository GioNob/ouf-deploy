name: MCP diagnostic update new authority protocol
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths: ['tools/mcp_diagnostic_update/**','scripts/apply-mcp-diagnostic-update-20261026.py','releases/apply-mcp-diagnostic-update-20261026.sh','tests/qualify_mcp_diagnostic_update_delivery.py','tests/fixtures/mcp_update_terminal_probe.py','tests/qualify_mcp_update_terminal_pipeline.py','tests/qualify_mcp_diagnostic_update_engine.py','tests/test_mcp_diagnostic_update_protocol.py','.github/workflows/mcp-diagnostic-update.yml']
  pull_request:
    paths: ['tools/mcp_diagnostic_update/**','scripts/apply-mcp-diagnostic-update-20261026.py','releases/apply-mcp-diagnostic-update-20261026.sh','tests/qualify_mcp_diagnostic_update_delivery.py','tests/fixtures/mcp_update_terminal_probe.py','tests/qualify_mcp_update_terminal_pipeline.py','tests/qualify_mcp_diagnostic_update_engine.py','tests/test_mcp_diagnostic_update_protocol.py','.github/workflows/mcp-diagnostic-update.yml']
permissions: {contents: read}
jobs:
  root-crypto-and-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: New MCP-only real CI Ed25519 roles and fenced journal (no production approval)
        run: |
          sudo install -d -m 700 /var/lib/ouf-mcp-update-protocol-ci
          sudo env OUF_MCP_UPDATE_TEST_ROOT=/var/lib/ouf-mcp-update-protocol-ci python3 -B -m unittest discover -s tests -p test_mcp_diagnostic_update_protocol.py -v
          python3 -B -m unittest discover -s tests -p test_retained_mac_transition.py -v
  new-executor-native-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        store: [classic, containerd]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Reuse exact historical Docker29.8.1 in isolated hosted data root
        env: {SELECTED_STORE: '${{ matrix.store }}'}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz -o /tmp/ouf-docker-29.8.1.tgz
          printf '%s  %s\n' d8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70 /tmp/ouf-docker-29.8.1.tgz | sha256sum --check -
          sudo install -d -m 755 /opt/ouf-docker-29
          sudo tar -xzf /tmp/ouf-docker-29.8.1.tgz --strip-components=1 -C /opt/ouf-docker-29
          sudo chown -R root:root /opt/ouf-docker-29
          sudo systemctl stop docker.service docker.socket
          sudo systemctl start containerd.service
          sudo install -d -m 700 /var/lib/ouf-docker-29
          python3 - <<'PY_CONFIG'
          import json,os
          from pathlib import Path
          Path('/tmp/ouf-docker-29.json').write_text(json.dumps({'features':{'containerd-snapshotter':os.environ['SELECTED_STORE']=='containerd'},'exec-opts':['native.cgroupdriver=systemd']}))
          PY_CONFIG
          sudo systemd-run --unit=ouf-docker-mac-daemon --property=Restart=no \
            --setenv=PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            /opt/ouf-docker-29/dockerd --config-file=/tmp/ouf-docker-29.json \
            --host=unix:///var/run/docker.sock --data-root=/var/lib/ouf-docker-29 \
            --exec-root=/run/docker --pidfile=/run/ouf-docker-29.pid \
            --containerd=/run/containerd/containerd.sock
          for OUF_MAC_ENGINE_POLL in $(seq 1 60); do
            if sudo docker info > /tmp/ouf-docker-29-info.txt 2>/dev/null; then break; fi
            sleep 1
          done
          test "$(sudo docker version --format '{{.Server.Version}}')" = 29.8.1
      - name: Exact new signed controller and actual watchdog loss on synthetic MCP workloads
        env: {EXPECTED_STORE: '${{ matrix.store }}'}
        run: |
          sudo install -d -m 700 /var/lib/ouf-mcp-update-native-ci
          sudo env OUF_MCP_UPDATE_TEST_ROOT=/var/lib/ouf-mcp-update-native-ci EXPECTED_STORE="$EXPECTED_STORE" python3 -I -S -B tests/qualify_mcp_diagnostic_update_engine.py
  actual-new-review-sudo-terminal:
    strategy:
      fail-fast: false
      matrix:
        sudo_pty: [use_pty, '!use_pty']
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: {CI_SUDO_PTY: '${{ matrix.sudo_pty }}'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Configure isolated CI sudo transport variant
        env:
          CI_SUDO_PTY: ${{ matrix.sudo_pty }}
        run: |
          sudo /usr/bin/python3 -I -S -B - "$(id -un)" "$CI_SUDO_PTY" <<'PY'
          import os,re,sys
          user,mode=sys.argv[1:]
          assert re.fullmatch('[a-z_][a-z0-9_-]*',user) and mode in ('use_pty','!use_pty')
          fd=os.open('/etc/sudoers.d/ouf-ci-terminal-test',os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o440)
          os.fchmod(fd,0o440)
          with os.fdopen(fd,'w') as out:
              out.write('Defaults:'+user+' '+mode+'\n');out.flush();os.fsync(out.fileno())
          PY
      - name: Exact new MCP prompt/logger with synthetic review and real canonical line editing
        run: python3 -I -S -B tests/qualify_mcp_update_terminal_pipeline.py
  actual-sealed-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact curl-only wrapper root code closure and real protected interactive main
        run: |
          bash -n releases/apply-mcp-diagnostic-update-20261026.sh
          sudo python3 -I -S -B tests/qualify_mcp_diagnostic_update_delivery.py
