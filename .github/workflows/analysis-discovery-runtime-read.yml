name: Analysis discovery runtime read qualification
on:
  push:
    branches: [docs/storage-functional-reset-20261107]
    paths: ['scripts/read-analysis-discovery-runtime-20261107.py', 'tests/test_analysis_discovery_runtime_read.py', 'scripts/read-discovery-lifecycle-20261109.py', 'tests/test_discovery_lifecycle.py', '.github/workflows/analysis-discovery-runtime-read.yml']
  pull_request:
    paths: ['scripts/read-analysis-discovery-runtime-20261107.py', 'tests/test_analysis_discovery_runtime_read.py', 'scripts/read-discovery-lifecycle-20261109.py', 'tests/test_discovery_lifecycle.py', '.github/workflows/analysis-discovery-runtime-read.yml']
permissions: {contents: read}
jobs:
  readonly-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Retained identities, MAC shapes, configuration redaction and read stability
        run: python3 -I -B -m unittest discover -s tests -p test_analysis_discovery_runtime_read.py -v
      - name: Current provider lifecycle and false-absence regressions
        run: python3 -I -B -m unittest discover -s tests -p test_discovery_lifecycle.py -v
