name: Explicit successor HUMAN and bounded worker session
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths:
      - tools/semantic_mcp_update/session.py
      - tools/chatbot_file_cohort/continued_owner.py
      - tools/semantic_policy_token_owner/installed_owner.py
      - tests/test_mcp_update_successor_session.py
      - .github/workflows/mcp-successor-session.yml
permissions: {contents: read}
jobs:
  actual-custody-and-signatures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Native root fixture and exact existing Ed25519 role framing
        run: sudo env OUF_TEST_ROOT=/root python3 -I -B -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_mcp_update_successor_session.py -v
      - name: Existing finite scope regression
        run: python3 -I -B -m unittest discover -s tests -p test_governed_semantic_session_contract.py -v
