name: CSV last row composed native recovery qualification
on:
  push:
    branches: [fix/csv-functional-stage3-ledger-20261017]
    paths: ['tools/csv_last_row_recovery/**', 'tests/csv_last_row_recovery/**', 'scripts/execute-csv-last-row-recovery-20261018.py', 'scripts/launch-csv-last-row-recovery-20261018.sh', 'releases/csv-last-row-recovery-*.json', '.github/workflows/csv-last-row-recovery.yml']
permissions: {contents: read}
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Validate full retained delivery shell
        run: bash -n scripts/launch-csv-last-row-recovery-20261018.sh
      - name: Actual isolated source closure, bounded owner protocol and PostgreSQL17
        run: OUF_NATIVE_SQL=1 python3 -I -B -S tests/csv_last_row_recovery/test_recovery.py
