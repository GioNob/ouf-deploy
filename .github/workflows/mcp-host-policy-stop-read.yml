name: MCP host policy retained stop read
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths: ['scripts/read-mcp-host-policy-stop-20261026.py','tests/test_mcp_host_policy_stop_read.py','.github/workflows/mcp-host-policy-stop-read.yml']
  pull_request:
    paths: ['scripts/read-mcp-host-policy-stop-20261026.py','tests/test_mcp_host_policy_stop_read.py','.github/workflows/mcp-host-policy-stop-read.yml']
permissions: {contents: read}
jobs:
  root-retained-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: sudo python3 -B -m unittest discover -s tests -p test_mcp_host_policy_stop_read.py -v
