name: OUF dependency repair details
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/dependency-repair-details.yml]
permissions:
  contents: read
  actions: read
jobs:
  details:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-mcp-server
          ref: 9c6e76b115f723b28de5da2f51622518cc3e37a9
          path: mcp-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache: false
      - name: Resolve the new module graph with authenticated checksums
        working-directory: mcp-source
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
        run: |
          go mod tidy
          python3 - <<'PY'
          import json
          from pathlib import Path
          print("OUF_GO_TIDIED_FILES="+json.dumps({name:Path(name).read_text() for name in ("go.mod","go.sum")},sort_keys=True))
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37662913414
          name: oss-semantic-candidate-37662913414
          path: semantic-package
      - name: Summarize remaining Critical and High packages
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("semantic-package/semantic.grype.json").read_bytes())
          rows=[]
          for match in report["matches"]:
              vuln=match["vulnerability"]
              if vuln["severity"] in ("Critical","High"):
                  item=match["artifact"]
                  rows.append({"package":item["name"],"version":item["version"],"type":item["type"],"id":vuln["id"],"severity":vuln["severity"],"fix":vuln.get("fix",{})})
          print("OUF_OSS_REMAINING_FINDINGS="+json.dumps(rows,sort_keys=True))
          PY
