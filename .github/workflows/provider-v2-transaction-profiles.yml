name: Provider transaction profile assembly
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_transaction_profiles/**'
      - 'tools/semantic_frame_compiler/compile_creation_frame_policy.py'
      - 'tools/semantic_target_review/execute_post_terminal_admission_recovery.py'
      - 'tools/semantic_target_review/test_post_terminal_admission_recovery.py'
      - '.github/workflows/provider-v2-transaction-profiles.yml'
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Profile scope and seal substitution rejection
        run: python3 -B -m unittest discover -v -s tools/semantic_transaction_profiles -p 'test_*profiles.py'
      - name: Partial creation never grants admission
        run: python3 -B -m unittest discover -v -s tools/semantic_transaction_profiles -p test_peer_creation_window.py
      - name: Authenticate complete input set with real Ed25519 signatures
        run: |
          sudo install -d -m 0700 /root/ouf-transaction-ci
          sudo env OUF_TRANSACTION_TEST_ROOT=/root/ouf-transaction-ci /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_transaction_profiles -p test_authenticated_transaction.py
      - name: Broker lock contention, bounded wait and private denial evidence
        run: sudo env OUF_TRANSACTION_TEST_ROOT=/root/ouf-transaction-ci /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_transaction_profiles -p test_broker_source_repair.py
      - name: Fresh post-terminal admission scope and real signatures
        run: sudo env OUF_TRANSACTION_TEST_ROOT=/root/ouf-transaction-ci /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_target_review -p test_post_terminal_admission_recovery.py
      - name: Atomic runtime switch filesystem and guard lock failure handling
        run: sudo env OUF_TRANSACTION_TEST_ROOT=/root/ouf-transaction-ci /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_transaction_profiles -p test_guarded_runtime_switch.py
      - name: Borrowed native guard descriptor custody
        run: sudo env OUF_TRANSACTION_TEST_ROOT=/root/ouf-transaction-ci /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_transaction_profiles -p test_transaction_guard_observation.py

  native-frame-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: deploy
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-api-gateway
          ref: ace683b1019f79adaace86796b67e463b93ec12e
          persist-credentials: false
          path: gateway
      - name: Prepare reviewed sources and CI-only fixture
        run: |
          cp deploy/tools/semantic_cohort_admission/cohort-draft/tools/*.py gateway/tools/
          cp deploy/tools/semantic_cohort_admission/cohort-draft/scripts/*.py gateway/scripts/
          cp deploy/tools/semantic_frame_compiler/containerd-overlayfs-adapter.json deploy/tools/semantic_frame_compiler/frame-observer.py deploy/tools/semantic_transaction_profiles/
      - name: Install disposable native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static iproute2 nftables runc
      - name: Assemble and consume actual node v4 and broker profiles
        working-directory: gateway
        run: sudo /usr/bin/python3 -B ../deploy/tools/semantic_transaction_profiles/test_assembled_frame_profiles_native.py
      - name: Observe real empty nft guard under the already held flock
        run: sudo /usr/bin/unshare --net --fork /usr/bin/python3 -B deploy/tools/semantic_transaction_profiles/test_transaction_guard_observation_native.py

  native-docker-creation-window:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load exact reviewed Engine into disposable CI only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz --output engine.tgz
          printf '%s\n' 'd8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70  engine.tgz' | sha256sum -c -
          mkdir engine-bin
          tar -xzf engine.tgz --strip-components=1 -C engine-bin
      - name: Observe both real Docker creation windows before application release
        run: sudo env OUF_DOCKER_WINDOW_ENGINE_DIRECTORY="${{ github.workspace }}/engine-bin" /usr/bin/python3 -B tools/semantic_transaction_profiles/test_docker_creation_window_native.py


  native-authenticated-docker-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: deploy
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-api-gateway
          ref: ace683b1019f79adaace86796b67e463b93ec12e
          persist-credentials: false
          path: gateway
      - name: Load reviewed production runtime and explicit CI Engine
        run: |
          cp deploy/tools/semantic_cohort_admission/cohort-draft/tools/*.py gateway/tools/
          cp deploy/tools/semantic_cohort_admission/cohort-draft/scripts/*.py gateway/scripts/
          cp deploy/tools/semantic_frame_compiler/containerd-overlayfs-adapter.json deploy/tools/semantic_frame_compiler/frame-observer.py deploy/tools/semantic_transaction_profiles/
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static iproute2 nftables
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz --output engine.tgz
          printf '%s\n' 'd8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70  engine.tgz' | sha256sum -c -
          mkdir engine-bin
          tar -xzf engine.tgz --strip-components=1 -C engine-bin
      - name: Admit two full-frame peers through actual concurrent Docker requests
        working-directory: gateway
        run: sudo env OUF_DOCKER_WINDOW_ENGINE_DIRECTORY="${{ github.workspace }}/engine-bin" /usr/bin/python3 -B ../deploy/tools/semantic_transaction_profiles/test_authenticated_docker_cohort_native.py
      - name: Publish signed records and admit peers through direct production broker
        working-directory: gateway
        run: sudo env OUF_CI_AUTHENTICATED_PUBLICATION=1 OUF_DOCKER_WINDOW_ENGINE_DIRECTORY="${{ github.workspace }}/engine-bin" /usr/bin/python3 -B ../deploy/tools/semantic_transaction_profiles/test_authenticated_docker_cohort_native.py
