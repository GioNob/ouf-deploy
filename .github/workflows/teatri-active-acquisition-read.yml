name: Teatri active acquisition metadata SQL qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['scripts/read-teatri-active-acquisition-20261017.py', 'tests/acquisition_read_sql/**', '.github/workflows/teatri-active-acquisition-read.yml']
permissions: {contents: read}
jobs:
  postgres-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: fixture, POSTGRES_DB: fixture}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: {PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: fixture, PGDATABASE: fixture}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-ingestion-runtime
          ref: f869d8b86b892a0c03c147dac9bb40cd5f873ff2
          path: ingestion
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-udp-object-resolution
          ref: b49c0d6f50c574c11684361ce4e8040e9cbddee2
          path: udp
          persist-credentials: false
      - run: python3 -I -B -m unittest discover -s tests/acquisition_read_sql -v
