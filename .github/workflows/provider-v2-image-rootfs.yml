name: Provider offline image rootfs
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_image_rootfs/**'
      - 'tools/semantic_cohort_admission/cohort-draft/**'
      - '.github/workflows/provider-v2-image-rootfs.yml'
permissions:
  contents: read
jobs:
  offline-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: deploy
      - uses: actions/checkout@v4
        with:
          repository: opencontainers/umoci
          ref: 1c44d6f2f9e4b50f5d2a99463f540acf9915dd47
          persist-credentials: false
          path: umoci-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Bound archive and layer substitution tests
        run: python3 -B -m unittest discover -v -s deploy/tools/semantic_image_rootfs -p test_prepare_provider_image_rootfs.py
      - name: Build pinned OCI reference unpacker
        working-directory: umoci-source
        env:
          CGO_ENABLED: '0'
        run: |
          test "$(git rev-parse HEAD)" = 1c44d6f2f9e4b50f5d2a99463f540acf9915dd47
          go mod verify
          go build -trimpath -o ../umoci ./cmd/umoci
          sha256sum ../umoci
      - name: Independently compare unpacked rootfs including layer deletions and metadata
        run: |
          sudo install -d -m 700 /root/ouf-image-rootfs /root/ouf-image-rootfs/cohort-draft /root/ouf-image-rootfs/cohort-draft/tools /root/ouf-image-rootfs/cohort-draft/scripts
          sudo install -m 600 deploy/tools/semantic_image_rootfs/*.py /root/ouf-image-rootfs/
          sudo install -m 600 deploy/tools/semantic_cohort_admission/cohort-draft/tools/*.py /root/ouf-image-rootfs/cohort-draft/tools/
          sudo install -m 600 deploy/tools/semantic_cohort_admission/cohort-draft/scripts/*.py /root/ouf-image-rootfs/cohort-draft/scripts/
          sudo install -m 600 deploy/tools/semantic_cohort_admission/cohort-draft/sources.json /root/ouf-image-rootfs/cohort-draft/sources.json
          sudo install -m 700 umoci /root/ouf-image-rootfs/umoci
          sudo /usr/bin/python3 -I -B /root/ouf-image-rootfs/test_provider_image_rootfs_native.py
      - name: Package verified unpacker for exact target staging
        run: |
          mkdir artifact
          cp umoci artifact/umoci
          sha256sum artifact/umoci > artifact/umoci.sha256
          printf '%s\n' 1c44d6f2f9e4b50f5d2a99463f540acf9915dd47 > artifact/umoci-source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ouf-pinned-umoci
          path: artifact/*
          if-no-files-found: error
          retention-days: 7
