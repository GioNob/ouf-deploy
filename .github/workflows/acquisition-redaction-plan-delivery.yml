name: Two READ private image plan delivery custody
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths: ['releases/prepare-acquisition-redaction-image-plan-20261026.sh','tests/qualify_acquisition_redaction_plan_delivery.py','.github/workflows/acquisition-redaction-plan-delivery.yml']
  pull_request:
    paths: ['releases/prepare-acquisition-redaction-image-plan-20261026.sh','tests/qualify_acquisition_redaction_plan_delivery.py','.github/workflows/acquisition-redaction-plan-delivery.yml']
permissions: {contents: read, actions: read}
jobs:
  root-code-and-prepared-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Download exact push ZIPs only for disposable hosted qualification
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -Eeuo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          python3 -I -S -B scripts/transport-acquisition-redaction-artifacts-20261026.py releases/acquisition-redaction-artifact-case-20261026.json "$parent" > delivery-artifacts.json
      - name: Prove actual wrapper root copier and sealed offline entrypoint
        run: |
          set -Eeuo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          sudo python3 -I -S -B tests/qualify_acquisition_redaction_plan_delivery.py "$parent/ouf-acquisition-redaction-transport-5ab4bafadb29cdd5"
          bash -n releases/prepare-acquisition-redaction-image-plan-20261026.sh

