name: Provider v2 network collision read
on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_provider_v2_network_collisions.py'
      - '.github/workflows/provider-v2-network-collisions.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: [self-hosted, ouf-vps-test]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: /usr/bin/python3 -B scripts/diagnose_provider_v2_network_collisions.py
