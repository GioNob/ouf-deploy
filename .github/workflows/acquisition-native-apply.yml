name: Acquisition native signed execution
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths: ['scripts/recover-acquisition-detached-mcp-20261025.py','tests/test_acquisition_detached_recovery.py','tests/qualify_acquisition_detached_recovery_engine.py','scripts/apply-acquisition-read-native-20261025.py','scripts/continue-acquisition-unapproved-review-20261025.py','tools/acquisition_read_native/**','tests/test_acquisition_apply_protocol.py','tests/qualify_acquisition_apply_engine.py','tests/qualify_acquisition_continuation_engine.py','.github/workflows/acquisition-native-apply.yml']
  pull_request:
    paths: ['scripts/recover-acquisition-detached-mcp-20261025.py','tests/test_acquisition_detached_recovery.py','tests/qualify_acquisition_detached_recovery_engine.py','scripts/apply-acquisition-read-native-20261025.py','scripts/continue-acquisition-unapproved-review-20261025.py','tools/acquisition_read_native/**','tests/test_acquisition_apply_protocol.py','tests/qualify_acquisition_apply_engine.py','tests/qualify_acquisition_continuation_engine.py','.github/workflows/acquisition-native-apply.yml']
permissions: {contents: read}
jobs:
  dual-signature-finite-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Real scoped Ed25519 signatures, durable claims and live-policy revocation
        run: sudo env OUF_APPLY_ROOT_FIXTURE=1 python3 -I -S -B -m unittest discover -s "$PWD/tests" -p test_acquisition_apply_protocol.py -v
      - name: Residual recovery signed cumulative adoption and closed restart ports
        run: sudo env OUF_APPLY_ROOT_FIXTURE=1 python3 -I -S -B -m unittest discover -s "$PWD/tests" -p test_acquisition_detached_recovery.py -v
  real-engine-and-apisix:
    strategy:
      fail-fast: false
      matrix:
        store: [classic, containerd]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Reuse exact historical Docker29.8.1 in isolated hosted data root
        env: {SELECTED_STORE: '${{ matrix.store }}'}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz -o /tmp/ouf-docker-29.8.1.tgz
          printf '%s  %s\n' d8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70 /tmp/ouf-docker-29.8.1.tgz | sha256sum --check -
          sudo install -d -m 755 /opt/ouf-docker-29
          sudo tar -xzf /tmp/ouf-docker-29.8.1.tgz --strip-components=1 -C /opt/ouf-docker-29
          sudo chown -R root:root /opt/ouf-docker-29
          sudo systemctl stop docker.service docker.socket
          sudo systemctl start containerd.service
          sudo install -d -m 700 /var/lib/ouf-docker-29
          python3 - <<'PY_CONFIG'
          import json,os
          from pathlib import Path
          Path('/tmp/ouf-docker-29.json').write_text(json.dumps({'features':{'containerd-snapshotter':os.environ['SELECTED_STORE']=='containerd'},'exec-opts':['native.cgroupdriver=systemd']}))
          PY_CONFIG
          sudo systemd-run --unit=ouf-docker-mac-daemon --property=Restart=no \
            --setenv=PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            /opt/ouf-docker-29/dockerd --config-file=/tmp/ouf-docker-29.json \
            --host=unix:///var/run/docker.sock --data-root=/var/lib/ouf-docker-29 \
            --exec-root=/run/docker --pidfile=/run/ouf-docker-29.pid \
            --containerd=/run/containerd/containerd.sock
          for OUF_MAC_ENGINE_POLL in $(seq 1 60); do
            if sudo docker info > /tmp/ouf-docker-29-info.txt 2>/dev/null; then break; fi
            sleep 1
          done
          test "$(sudo docker version --format '{{.Server.Version}}')" = 29.8.1
      - name: Real3image imports,3container transitions,82retained APISIX routes and2additions
        run: sudo env OUF_APPLY_ROOT_FIXTURE=1 python3 -I -S -B tests/qualify_acquisition_apply_engine.py
      - name: Reconciled continuation real Context deferred credential read cumulative counts and negative watchdog
        run: sudo env OUF_APPLY_ROOT_FIXTURE=1 python3 -I -S -B tests/qualify_acquisition_continuation_engine.py
      - name: Residual recovery after real stopped legacy MCP and quarantined reads
        run: sudo env OUF_APPLY_ROOT_FIXTURE=1 python3 -I -S -B tests/qualify_acquisition_detached_recovery_engine.py
