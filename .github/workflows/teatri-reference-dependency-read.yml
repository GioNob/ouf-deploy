name: Teatri reference dependency read-only qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['scripts/read-teatri-reference-dependencies-20261017.py', 'tests/reference_dependency_read/**', '.github/workflows/teatri-reference-dependency-read.yml']
permissions: {contents: read}
jobs:
  readonly-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact contract read, bounded HTTP responses and no redirect or retry
        run: OUF_NATIVE_SQL=1 python3 -I -B -m unittest discover -s tests/reference_dependency_read -v
