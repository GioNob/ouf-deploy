name: Installation owner STOP pure read reconciliation
on:
  push:
    paths:
      - 'scripts/read-installation-owner-update-stop.py'
      - 'tests/test_installation_owner_update_stop_read.py'
      - '.github/workflows/installation-owner-stop-read.yml'
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -I -B -S -m unittest discover -s tests -p test_installation_owner_update_stop_read.py -v
