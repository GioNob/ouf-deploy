# Qualificazione storica (2026-10-17): solo manuale, D-055
name: UDP Resolution pinned delivery verification
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pinned-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact 46 file bindings, checksum rejection and archive forwarding
        run: python3 -I -B -m unittest discover -s tests -p 'test_udp_resolution_delivery.py' -v
