name: Managed profile capability gate bounded read
on:
  push:
    paths: ['scripts/read-managed-profile-capabilities-20261028.py','tests/test_managed_profile_capability_read.py','tests/qualify_managed_profile_capability_delivery.py','releases/read-managed-profile-capabilities-20261028.sh','.github/workflows/managed-profile-capability-read.yml']
  pull_request:
    paths: ['scripts/read-managed-profile-capabilities-20261028.py','tests/test_managed_profile_capability_read.py','tests/qualify_managed_profile_capability_delivery.py','releases/read-managed-profile-capabilities-20261028.sh','.github/workflows/managed-profile-capability-read.yml']
permissions: {contents: read}
jobs:
  exact-policy-and-descriptor-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -B -m unittest discover -s tests -p test_managed_profile_capability_read.py -v
      - run: python3 -m py_compile scripts/read-managed-profile-capabilities-20261028.py
  actual-protected-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          bash -n releases/read-managed-profile-capabilities-20261028.sh
          sudo /usr/bin/python3 -I -S -B tests/qualify_managed_profile_capability_delivery.py
