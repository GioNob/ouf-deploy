name: Teatri semantic reference access read-only qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['scripts/read-teatri-semantic-reference-access-20261017.py', 'tests/semantic_reference_access_read/**', '.github/workflows/teatri-semantic-reference-access-read.yml']
permissions: {contents: read}
jobs:
  readonly-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact owner policy and route metadata, bounded GETs, no mutations
        run: OUF_NATIVE_SQL=1 python3 -I -B -m unittest discover -s tests/semantic_reference_access_read -v
