name: Exact two READ diagnostic images and native plan
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths: ['scripts/prepare-acquisition-redaction-image-plan-20261026.py','tests/test_acquisition_redaction_image_plan.py','tests/qualify_acquisition_redaction_image_plan.py','.github/workflows/acquisition-redaction-image-plan.yml']
  pull_request:
    paths: ['scripts/prepare-acquisition-redaction-image-plan-20261026.py','tests/test_acquisition_redaction_image_plan.py','tests/qualify_acquisition_redaction_image_plan.py','.github/workflows/acquisition-redaction-image-plan.yml']
permissions: {contents: read, actions: read}
jobs:
  two-read-native-image-plan:
    strategy:
      fail-fast: false
      matrix:
        store: [classic, containerd]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify and download both exact qualified CI ZIPs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_acquisition_redaction_image_plan.py -v
          parent="$(dirname "$GITHUB_WORKSPACE")"
          python3 -I -S -B scripts/transport-acquisition-redaction-artifacts-20261026.py releases/acquisition-redaction-artifact-case-20261026.json "$parent" > redaction-artifact-receipt.json
      - name: Reuse exact historical Docker29.8.1 in isolated hosted data root
        env: {SELECTED_STORE: '${{ matrix.store }}'}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz -o /tmp/ouf-docker-29.8.1.tgz
          printf '%s  %s\n' d8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70 /tmp/ouf-docker-29.8.1.tgz | sha256sum --check -
          sudo install -d -m 755 /opt/ouf-docker-29
          sudo tar -xzf /tmp/ouf-docker-29.8.1.tgz --strip-components=1 -C /opt/ouf-docker-29
          sudo chown -R root:root /opt/ouf-docker-29
          sudo systemctl stop docker.service docker.socket
          sudo systemctl start containerd.service
          sudo install -d -m 700 /var/lib/ouf-docker-29
          python3 - <<'PY_CONFIG'
          import json,os
          from pathlib import Path
          Path('/tmp/ouf-docker-29.json').write_text(json.dumps({'features':{'containerd-snapshotter':os.environ['SELECTED_STORE']=='containerd'},'exec-opts':['native.cgroupdriver=systemd']}))
          PY_CONFIG
          sudo systemd-run --unit=ouf-docker-mac-daemon --property=Restart=no \
            --setenv=PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            /opt/ouf-docker-29/dockerd --config-file=/tmp/ouf-docker-29.json \
            --host=unix:///var/run/docker.sock --data-root=/var/lib/ouf-docker-29 \
            --exec-root=/run/docker --pidfile=/run/ouf-docker-29.pid \
            --containerd=/run/containerd/containerd.sock
          for OUF_MAC_ENGINE_POLL in $(seq 1 60); do
            if sudo docker info > /tmp/ouf-docker-29-info.txt 2>/dev/null; then break; fi
            sleep 1
          done
          test "$(sudo docker version --format '{{.Server.Version}}')" = 29.8.1
      - name: Exact two images and root private plan on the selected actual Engine store
        env: {SELECTED_STORE: '${{ matrix.store }}'}
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          sudo python3 -I -S -B tests/qualify_acquisition_redaction_image_plan.py "$parent/ouf-acquisition-redaction-transport-db8577ab3082fbc2" "$SELECTED_STORE" | tee redaction-native-proof.json
      - uses: actions/upload-artifact@v4
        with: {name: 'redaction-native-proof-${{ matrix.store }}-${{ github.run_id }}', path: redaction-native-proof.json, retention-days: 30}

