name: Existing HUMAN administrative delivery qualification
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/launch-ingestion-existing-session-action-20261019.sh', 'tests/test_ingestion_existing_session_delivery.py', '.github/workflows/ingestion-existing-session-delivery.yml']
permissions: {contents: read}
jobs:
  pinned-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Portable gh and immutable payload before sudo
        run: |
          bash -n scripts/launch-ingestion-existing-session-action-20261019.sh
          python3 -I -B -S -m unittest discover -s tests -p 'test_ingestion_existing_session_delivery.py' -v
