name: Ingestion read-only DB preflight immutable delivery
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/launch-ingestion-db-read-preflight-20261020.sh', 'tests/test_ingestion_db_preflight_delivery.py', '.github/workflows/ingestion-db-read-preflight-delivery.yml']
permissions: {contents: read}
jobs:
  immutable-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -I -B -S -m unittest discover -s tests -p test_ingestion_db_preflight_delivery.py -v
