name: Ingestion Gateway custody stop read
on:
  push:
    paths:
      - 'scripts/read-ingestion-read-gateway-custody-stop.py'
      - 'tests/test_ingestion_read_gateway_custody_stop.py'
      - '.github/workflows/ingestion-read-gateway-custody-stop.yml'
permissions:
  contents: read
jobs:
  read-only-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Actual root-owned 0440 metadata and private 0600 fixtures
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-gateway-custody-read-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture/repository/scripts" "$fixture/repository/tests"
          sudo install -m 0600 scripts/read-ingestion-read-gateway-custody-stop.py "$fixture/repository/scripts/"
          sudo install -m 0600 tests/test_ingestion_read_gateway_custody_stop.py "$fixture/repository/tests/"
          sudo env OUF_TEST_ROOT="$fixture" python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_ingestion_read_gateway_custody_stop.py -v
