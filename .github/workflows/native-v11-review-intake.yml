name: Atomic native V11 review publication
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-v11-review-intake.yml
      - tools/semantic_application_cutover/atomic_review_intake.py
      - scripts/publish-native-v11-review-intake.py
      - releases/native-v11-review-intake-20261011.sh
      - tests/test_atomic_review*.py
      - tests/test_native_intake*.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_atomic_review*.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_native_intake*.py' -v
