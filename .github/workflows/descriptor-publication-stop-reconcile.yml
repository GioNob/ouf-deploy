name: Descriptor publication stopped receipt reconciliation
on:
  push:
    paths:
      - scripts/read-descriptor-publication-stop-20261025.py
      - scripts/publish-acquisition-read-descriptors-20261025.py
      - tests/test_descriptor_publication_retained_stop.py
      - tests/test_acquisition_descriptor_publication.py
      - tests/qualify_descriptor_*.py
      - tests/fixtures/onboarding-V16-authorization-admin-lifecycle.sql
      - tests/fixtures/acquisition-descriptor-publisher-3f0b407.py.txt
      - .github/workflows/descriptor-publication-stop-reconcile.yml
  pull_request:
    paths:
      - scripts/read-descriptor-publication-stop-20261025.py
      - scripts/publish-acquisition-read-descriptors-20261025.py
      - tests/test_descriptor_publication_retained_stop.py
      - tests/test_acquisition_descriptor_publication.py
      - tests/qualify_descriptor_*.py
      - tests/fixtures/onboarding-V16-authorization-admin-lifecycle.sql
      - tests/fixtures/acquisition-descriptor-publisher-3f0b407.py.txt
      - .github/workflows/descriptor-publication-stop-reconcile.yml
permissions: {contents: read}
jobs:
  retained-files-and-native-zero:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo /usr/bin/python3 -I -S -B -m unittest discover -s tests -p test_descriptor_publication_retained_stop.py -v
      - run: python3 -m unittest discover -s tests -p test_acquisition_descriptor_publication.py -v
  actual-operator-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo install -o root -g root -m 0444 tests/fixtures/acquisition-descriptor-publisher-3f0b407.py.txt "$RUNNER_TEMP/stopped-controller.py"
      - run: python3 tests/qualify_descriptor_retained_read_audit.py "$RUNNER_TEMP/stopped-controller.py"
  real-owner-migration-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tests/qualify_descriptor_draft_revision_postgres.py
