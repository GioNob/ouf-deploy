name: MCP Gateway82 immutable delivery
on:
  push:
    paths:
      - 'scripts/launch-mcp-read-transport-gateway82-20261019.sh'
      - 'tests/test_mcp_read_transport_gateway82_delivery.py'
      - '.github/workflows/mcp-read-transport-gateway82-delivery.yml'
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: bash -n scripts/launch-mcp-read-transport-gateway82-20261019.sh
      - run: python3 -m unittest discover -s tests -p test_mcp_read_transport_gateway82_delivery.py -v
