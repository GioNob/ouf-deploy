name: OUF policy-token online IAM and installed owner qualification
on:
  push:
    paths: [tools/semantic_policy_token_owner/**, tests/test_iam_token_admission.py, tests/test_installed_token_owner.py, tests/test_policy_token_worker_entry.py, tests/test_policy_token_legacy_units.py, tests/test_policy_token_sealed_runtime.py, tests/test_policy_token_iam_target_probe.py, tests/test_policy_token_iam_binding_candidate.py, tests/test_policy_token_iam_mapper_enrichment.py, tests/test_policy_token_mapper_semantics_review.py, tests/qualify_policy_token_keycloak.py, .github/workflows/policy-token-iam-owner.yml]
  pull_request:
    paths: [tools/semantic_policy_token_owner/**, tests/test_iam_token_admission.py, tests/test_installed_token_owner.py, tests/test_policy_token_worker_entry.py, tests/test_policy_token_legacy_units.py, tests/test_policy_token_sealed_runtime.py, tests/test_policy_token_iam_target_probe.py, tests/test_policy_token_iam_binding_candidate.py, tests/test_policy_token_iam_mapper_enrichment.py, tests/test_policy_token_mapper_semantics_review.py, tests/qualify_policy_token_keycloak.py, .github/workflows/policy-token-iam-owner.yml]
permissions: {contents: read}
jobs:
  native-root-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Prepare disposable root fixture
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-online-iam-owner-${GITHUB_RUN_ID}"
          sudo mkdir -m 700 "$OUF_FIXTURE_ROOT"
          sudo cp -R . "$OUF_FIXTURE_ROOT/repository"
          sudo chown -R root:root "$OUF_FIXTURE_ROOT"
      - name: Actual TLS/peer, root custody, role signatures and persistent admission fencing
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-online-iam-owner-${GITHUB_RUN_ID}"
          sudo env OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_iam_token_admission.py -v
          sudo env OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_installed_token_owner.py -v
          sudo env OUF_NATIVE_UIDS=1 GITHUB_ACTIONS=true python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_policy_token_worker_entry.py -v
          sudo env OUF_NATIVE_UIDS=1 GITHUB_ACTIONS=true python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_policy_token_legacy_units.py -v
      - name: Exact operator handoff and read-only probe
        run: |
          set -euo pipefail
          python3 -I -B -m unittest discover -s tests -p test_policy_token_operator_delivery.py -v
          python3 -I -B -m unittest discover -s tests -p test_policy_token_scope_probe.py -v
          OUF_FIXTURE_ROOT="/var/lib/ouf-online-iam-owner-${GITHUB_RUN_ID}"
          sudo python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_policy_token_iam_target_probe.py -v
          sudo python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_policy_token_iam_binding_candidate.py -v
          sudo python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_policy_token_iam_mapper_enrichment.py -v
          sudo python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_policy_token_mapper_semantics_review.py -v
      - name: Full worker and authority closure imported from verified memory
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-online-iam-owner-${GITHUB_RUN_ID}"
          sudo env OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_policy_token_sealed_runtime.py -v
      - name: Existing source-stage and finite worker regressions
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-online-iam-owner-${GITHUB_RUN_ID}"
          sudo python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_token_source_stage.py -v
          sudo env OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_policy_token_owner.py -v
      - name: Actual disposable Keycloak issuer protocol (no target connection)
        env: {OUF_DISPOSABLE_KEYCLOAK: '1'}
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-online-iam-owner-${GITHUB_RUN_ID}"
          sudo env OUF_DISPOSABLE_KEYCLOAK=1 GITHUB_ACTIONS=true python3 -I -B "$OUF_FIXTURE_ROOT/repository/tests/qualify_policy_token_keycloak.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: policy-token-real-keycloak-evidence, path: policy-token-real-keycloak-evidence.json, if-no-files-found: warn}
