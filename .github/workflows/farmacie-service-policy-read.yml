name: Farmacie service policy read qualification
on:
  push:
    paths: ['scripts/read-farmacie-service-policy-20261027.py','tests/test_farmacie_service_policy_read.py','tests/qualify_farmacie_service_policy_delivery.py','releases/read-farmacie-service-policy-20261027.sh','.github/workflows/farmacie-service-policy-read.yml']
  pull_request:
    paths: ['scripts/read-farmacie-service-policy-20261027.py','tests/test_farmacie_service_policy_read.py','tests/qualify_farmacie_service_policy_delivery.py','releases/read-farmacie-service-policy-20261027.sh','.github/workflows/farmacie-service-policy-read.yml']
permissions: {contents: read}
jobs:
  bounded-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: sudo python3 -I -S -B tests/test_farmacie_service_policy_read.py
      - run: python3 -m py_compile scripts/read-farmacie-service-policy-20261027.py
