name: Onboarding V35 retained create reconciliation
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths:
      - scripts/read-onboarding-v35-created-config-20261024.py
      - scripts/apply-onboarding-v35-native-20261024.py
      - tests/test_onboarding_v35_main_failure.py
      - tests/test_onboarding_v35_retained_reconciliation.py
      - .github/workflows/onboarding-v35-retained-reconciliation.yml
  pull_request:
    paths:
      - scripts/read-onboarding-v35-created-config-20261024.py
      - scripts/apply-onboarding-v35-native-20261024.py
      - tests/test_onboarding_v35_main_failure.py
      - tests/test_onboarding_v35_retained_reconciliation.py
      - .github/workflows/onboarding-v35-retained-reconciliation.yml
permissions:
  contents: read
jobs:
  retained-reader-and-main-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Protected disposable filesystem
        run: |
          sudo install -d -m 0700 /root/ouf-v35-retained-tests
          sudo cp -a . /root/ouf-v35-retained-tests/repository
          sudo chown -R root:root /root/ouf-v35-retained-tests
      - name: Actual isolated entry and main exception path
        run: |
          sudo /usr/bin/python3 -I -B -S -m unittest discover -s /root/ouf-v35-retained-tests/repository/tests -p 'test_onboarding_v35_*failure.py' -v
          sudo /usr/bin/python3 -I -B -S -m unittest discover -s /root/ouf-v35-retained-tests/repository/tests -p 'test_onboarding_v35_retained_reconciliation.py' -v
