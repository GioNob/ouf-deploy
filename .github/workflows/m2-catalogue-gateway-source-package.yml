name: M2 catalogue-compatible Gateway source package
on:
  push:
    paths: ['.github/workflows/m2-catalogue-gateway-source-package.yml']
permissions: {contents: read}
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-api-gateway
          ref: c666c0f0080b8802fc71daa27c32a0af2ed98544
          path: source
          persist-credentials: false
      - name: Verify immutable source and portable catalogue contract
        run: |
          python3 -B - <<'PY'
          import importlib.util,json,subprocess
          from pathlib import Path
          source=Path('source')
          assert subprocess.check_output(['git','-C','source','rev-parse','HEAD'],text=True).strip()=='c666c0f0080b8802fc71daa27c32a0af2ed98544'
          assert not subprocess.check_output(['git','-C','source','status','--porcelain','--untracked-files=all']).strip()
          spec=importlib.util.spec_from_file_location('qualified_union_projection',source/'tools/mcp_union_projection.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          fixture=json.loads((source/'tests/fixtures/permission-inputs-mcp-09d1f52.json').read_text())
          assert fixture['sourceCommit']=='09d1f521703f2e896398c751b41008f22c6dca0d'
          for item in json.loads((source/'schemas/mcp-gateway-permissions-dispatch-v1.json').read_text())['oneOf']:
              cap=item['properties']['CapabilityID']['const']
              assert item['properties']['Arguments']==module.project(fixture['schemas'][cap])
          PY
      - name: Prepare exact dependency scan input
        run: |
          mkdir -p package/gateway-scan
          cp source/requirements-dev.txt package/gateway-scan/requirements.txt
          cmp source/requirements-dev.txt package/gateway-scan/requirements.txt
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: package/gateway-scan
          format: json
          output: package/trivy-image.json
          list-all-pkgs: true
          scanners: vuln
          severity: HIGH,CRITICAL,UNKNOWN
          ignore-unfixed: false
          exit-code: 1
      - name: Enforce coverage and export complete source and materializer pins
        env: {PRODUCER: '${{ github.sha }}'}
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,runpy,subprocess,tarfile
          from pathlib import Path
          source=Path('source');output=Path('package')
          helpers=runpy.run_path('scripts/package-semantic-proposal-candidate.py',run_name='qualified_scan_primitives')
          scan=json.loads((output/'trivy-image.json').read_text());helpers['scan_gate'](scan,'gateway',None)
          assert Path(scan['ArtifactName']).resolve()==(output/'gateway-scan').resolve()
          assert (output/'gateway-scan/requirements.txt').read_bytes()==(source/'requirements-dev.txt').read_bytes()
          assert any(r.get('Type')=='pip' and r.get('Target')=='requirements.txt' and r.get('Packages') for r in scan['Results'])
          commit='c666c0f0080b8802fc71daa27c32a0af2ed98544'
          subprocess.run(['git','-C',str(source),'-c','tar.umask=0022','archive','--format=tar','-o',str((output/'source.tar').resolve()),commit],check=True)
          paths=['tools/materialize_semantic_discovery.py','tools/delegation_functions.py','tools/lua/execute_semantic_discovery.lua',
              'tools/materialize_permission_proposals.py','tools/mcp_union_projection.py','tools/lua/execute_permissions.lua',
              'schemas/mcp-gateway-permissions-dispatch-v1.json']
          paths+=['schemas/mcp-gateway-semantic-discovery-'+op+'-dispatch-v1.json' for op in ('request','status','candidates')]
          inventory={p:hashlib.sha256((source/p).read_bytes()).hexdigest() for p in paths}
          tracked=subprocess.check_output(['git','-C',str(source),'ls-files','-z']).split(b'\0')
          all_paths=[p.decode() for p in tracked if p]
          assert len(all_paths)==len(set(all_paths)) and all(not(source/p).is_symlink() for p in all_paths)
          all_files={p:hashlib.sha256((source/p).read_bytes()).hexdigest() for p in all_paths}
          def put(name,value):(output/name).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          put('materializer-inventory.json',inventory);put('source-inventory.json',all_files)
          put('package-record.json',{'schema':'ouf.m2-discovery-gateway-source-package.v1','module':'gateway','sourceCommit':commit,
              'artifactKind':'SOURCE_AND_MATERIALIZERS_NOT_TARGET_ROUTES','routePackageTargetBound':False,
              'dependencyScanGate':'PASS_HIGH_CRITICAL_UNKNOWN_INCLUDING_UNFIXED','transitiveRuntimeAdmissionProven':False,
              'runtimeAuthorityIssued':False,'targetApplyAuthorized':False,'releaseAcceptance':False})
          put('producer.json',{'schema':'ouf.m2-discovery-offline-package-provenance.v1','module':'gateway',
              'producerCommit':os.environ['PRODUCER'],'applicationSourceCommit':commit,'runtimeAuthorityIssued':False,
              'targetApplyAuthorized':False,'stableCapabilitiesOperationalProven':False,'applicationE2EProven':False,'releaseAcceptance':False})
          with tarfile.open(output/'source.tar',mode='r:') as archive:
              entries=archive.getmembers()
              assert all(e.isfile() or e.isdir() for e in entries)
              members={e.name:e for e in entries if e.isfile()}
              assert set(members)==set(all_files)
              for name,entry in members.items():
                  assert entry.mode== (0o755 if (source/name).stat().st_mode&0o111 else 0o644)
                  assert archive.extractfile(entry).read()==(source/name).read_bytes()
              assert all(e.mode==0o755 for e in entries if e.isdir())
          files=sorted(p for p in output.rglob('*') if p.is_file() and p.name!='SHA256SUMS')
          assert all(not p.is_symlink() for p in files)
          (output/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(output).as_posix()+'\n' for p in files))
          PY
          cd package
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-catalogue-gateway-${{ github.run_id }}
          path: package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
