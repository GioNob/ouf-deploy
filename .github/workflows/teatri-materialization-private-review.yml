name: Teatri materialization private preparation qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['tools/teatri_materialization_update/**', 'scripts/prepare-teatri-materialization-review-20261017.py', 'releases/teatri-materialization-private-review-selection-20261017.json', 'tests/test_teatri_materialization*.py', 'tests/teatri_materialization/**', '.github/workflows/teatri-materialization-private-review.yml']
permissions: {contents: read}
jobs:
  isolated-source-and-postgresql17:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Complete isolated source graph and exact retained current generation
        run: python3 -B -m unittest discover -s tests -p 'test_teatri_materialization*.py' -v
      - name: Real PostgreSQL17 source jobs and owner capability metadata without mutation
        run: OUF_NATIVE_SQL=1 python3 -B -m unittest discover -s tests/teatri_materialization -v
