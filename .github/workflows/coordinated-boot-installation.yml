name: OUF coordinated boot installation proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/install-coordinated-boot-guard.py
      - scripts/privileged-discovery-preflight-v3.py
      - scripts/bootstrap-coordinated-boot-installation.sh
      - tests/test_coordinated_boot_installation*.py
      - .github/workflows/coordinated-boot-installation.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-api-gateway
          ref: df103735c1fe75a31e6d4c752360e9368e6aa52d
          path: gateway-source
          persist-credentials: false
      - name: Install isolated nft dependencies
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - name: Owned file publication, rollback and bounded readback
        run: sudo python3 -B tests/test_coordinated_boot_installation.py
      - name: Actual root files, isolated real nft and simulated service adapters
        run: sudo unshare --net --fork env OUF_COORDINATED_INSTALL_NATIVE_TEST=1 python3 -B tests/test_coordinated_boot_installation_native.py
      - name: Bootstrap syntax when present
        run: |
          if test -f scripts/bootstrap-coordinated-boot-installation.sh; then
            bash -n scripts/bootstrap-coordinated-boot-installation.sh
          fi
