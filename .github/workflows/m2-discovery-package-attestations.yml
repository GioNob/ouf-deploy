name: M2 attest exact retained runtime package bytes
on:
  push:
    paths: ['.github/workflows/m2-discovery-package-attestations.yml']
permissions: {contents: read, actions: read, attestations: write, id-token: write}
jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {module: [mcp, gateway]}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m2-discovery-${{ matrix.module }}-40841859485
          run-id: 40841859485
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify exact retained artifact identity and every payload before attesting
        env: {GH_TOKEN: '${{ github.token }}', MODULE: '${{ matrix.module }}'}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          module=os.environ['MODULE']
          expected={'mcp':(12882394596,'e779fcb822dd8aa074f20ef6a08b13e48363ec15aa27f2d6c09319ed384e22bf','09d1f521703f2e896398c751b41008f22c6dca0d'),'gateway':(12882339953,'09df2dbd4de6d51a45ee4094aed177e555e877d56f1b3dcf2456618360da26b4','60788cf965334441be0a33c345f5c0bcd66cbdde')}[module]
          aid,digest,source=expected
          meta=json.loads(subprocess.check_output(['gh','api',f'repos/GioNob/ouf-deploy/actions/artifacts/{aid}']))
          assert meta['digest']=='sha256:'+digest and not meta['expired']
          assert meta['workflow_run']['id']==40841859485 and meta['workflow_run']['head_sha']=='4829f9f84b12ae982e629faf730ca76238f66962'
          root=pathlib.Path('candidate');paths=sorted(p for p in root.rglob('*') if p.is_file())
          assert all(not p.is_symlink() for p in paths)
          sums={}
          for line in (root/'SHA256SUMS').read_text().splitlines():
              h,name=line.split('  ',1)
              assert name not in sums and not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts
              sums[name]=h
          assert set(sums)=={p.relative_to(root).as_posix() for p in paths if p.name!='SHA256SUMS'}
          def filehash(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1048576),b''):h.update(chunk)
              return h.hexdigest()
          assert all(filehash(root/name)==h for name,h in sums.items())
          record=json.loads((root/'package-record.json').read_text());producer=json.loads((root/'producer.json').read_text())
          assert record['sourceCommit']==producer['applicationSourceCommit']==source
          assert producer['producerCommit']=='4829f9f84b12ae982e629faf730ca76238f66962'
          assert record['targetApplyAuthorized'] is False and producer['targetApplyAuthorized'] is False
          out=pathlib.Path('evidence');out.mkdir()
          input={'schema':'ouf.m2-discovery-retained-package-attestation-input.v1','module':module,'applicationSourceCommit':source,'originalArtifactId':aid,'originalArtifactZipSha256':digest,'originalProducerCommit':producer['producerCommit'],'originalRunId':40841859485,'payloadSha256':{p.relative_to(root).as_posix():filehash(p) for p in paths},'nativePublisherTrustAccepted':False,'runtimeAuthorityIssued':False,'targetApplyAuthorized':False,'releaseAcceptance':False}
          (out/'attestation-input.json').write_text(json.dumps(input,indent=2,sort_keys=True)+'\n')
          (out/'subject-checksums.sha256').write_text(''.join(filehash(p)+'  '+str(p)+'\n' for p in paths)+filehash(out/'attestation-input.json')+'  evidence/attestation-input.json\n')
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: provenance
        with:
          subject-checksums: evidence/subject-checksums.sha256
          create-storage-record: false
      - name: Verify exact hosted publisher and freeze sidecar receipts
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" evidence/provenance.json
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('evidence');source=json.loads((root/'attestation-input.json').read_text())
          receipts={}
          for index,path in enumerate([*map(pathlib.Path,('candidate/'+p for p in source['payloadSha256'])) ,root/'attestation-input.json']):
              raw=subprocess.check_output(['gh','attestation','verify',str(path),'--repo','GioNob/ouf-deploy','--signer-workflow','GioNob/ouf-deploy/.github/workflows/m2-discovery-package-attestations.yml','--source-digest',os.environ['GITHUB_SHA'],'--source-ref',os.environ['GITHUB_REF'],'--deny-self-hosted-runners','--bundle',os.environ['PROVENANCE_BUNDLE'],'--format','json'])
              json.loads(raw)
              name=f'verification-{index:02}.json';(root/name).write_bytes(raw);receipts[path.as_posix()]=name
          (root/'verification-index.json').write_text(json.dumps({'schema':'ouf.m2-discovery-retained-package-publisher-ci.v1','module':os.environ['MODULE'],'attestationProducerCommit':os.environ['GITHUB_SHA'],'verifiedSubjects':receipts,'cryptographicPublisherVerifiedInHostedCi':True,'nativePublisherTrustAccepted':False,'runtimeAuthorityIssued':False,'targetApplyAuthorized':False,'releaseAcceptance':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-discovery-package-attestation-${{ matrix.module }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: m2-discovery-package-attestation-denial-${{ matrix.module }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
