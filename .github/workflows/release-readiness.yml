name: OUF release readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-readiness.yml
      - scripts/read-release-readiness.py
      - requests/release-readiness.json
permissions:
  contents: read
concurrency:
  group: ouf-release-readiness
  cancel-in-progress: false
jobs:
  read-only:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read installation readiness without raw configuration
        run: python3 scripts/read-release-readiness.py
