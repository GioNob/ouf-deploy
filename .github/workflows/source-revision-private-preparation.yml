name: Source revision private preparation
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/prepare-source-revision-inputs.py', 'releases/source-revision-private-preparation-20261018.json', 'tests/test_source_revision_private_preparation.py', '.github/workflows/source-revision-private-preparation.yml']
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17-alpine
        ports: ['5432:5432']
        env: {POSTGRES_USER: postgres, POSTGRES_HOST_AUTH_METHOD: trust}
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Actual root custody, image bytes and three PostgreSQL read queries
        run: |
          sudo install -d -m 0700 /root/ouf-revision-preparation-tests
          sudo cp -a . /root/ouf-revision-preparation-tests/repository
          sudo chown -R root:root /root/ouf-revision-preparation-tests
          sudo chmod -R go-w /root/ouf-revision-preparation-tests
          sudo env OUF_PREPARATION_POSTGRES=1 python3 -I -B -S -m unittest discover -s /root/ouf-revision-preparation-tests/repository/tests -p test_source_revision_private_preparation.py -v
  protected-preparation:
    needs: qualify
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: One private preparation under the existing sudo policy, no runtime authority or login
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 -I -B -S - "$GITHUB_WORKSPACE" <<'PY'
          import hashlib,json,os,stat,sys,tempfile
          from pathlib import Path
          assert os.geteuid()==os.getegid()==0 and sys.flags.isolated and sys.flags.no_site
          os.umask(0o077)
          root=Path(sys.argv[1]); files={}
          pins={'scripts/prepare-source-revision-inputs.py':'e6c3f1f08cb5cc4a5a51ffc501530c8315a0ecde1cd80c63736dd935acd393f9','releases/source-revision-private-preparation-20261018.json':'d7cb3b6c92c250ddc655f1eeb5d9a2dba1d2c0317ca39363ce5e1306a12f3036'}
          for name,wanted in pins.items():
              path=root/name
              assert path.resolve()==path
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              try:
                  before=os.fstat(fd)
                  assert stat.S_ISREG(before.st_mode) and before.st_nlink==1 and 0<before.st_size<=131072
                  raw=os.read(fd,131073)
                  seal=lambda s:tuple(getattr(s,k)for k in('st_dev','st_ino','st_mode','st_uid','st_gid','st_nlink','st_size','st_mtime_ns','st_ctime_ns'))
                  assert len(raw)==before.st_size and seal(before)==seal(os.fstat(fd))==seal(path.lstat()) and hashlib.sha256(raw).hexdigest()==wanted
                  files['prepare.py' if name.endswith('.py') else 'selection.json']=raw
              finally:os.close(fd)
          parent=Path('/etc/ouf/deploy-snapshots')
          for path in(parent,*parent.parents):
              info=path.lstat()
              assert stat.S_ISDIR(info.st_mode) and info.st_uid==0 and not info.st_mode&0o022
          code=Path(tempfile.mkdtemp(prefix='source-revision-preparation-code-',dir=parent));code.chmod(0o700)
          for name,raw in files.items():
              fd=os.open(code/name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(fd,'wb')as output:output.write(raw);output.flush();os.fsync(output.fileno())
          fd=os.open(code,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
          try:os.fsync(fd)
          finally:os.close(fd)
          print(json.dumps({'check':'VERIFIED_PREPARATION_CODE','codeDirectory':str(code),'sourceSha256':'e6c3f1f08cb5cc4a5a51ffc501530c8315a0ecde1cd80c63736dd935acd393f9','selectionSha256':'d7cb3b6c92c250ddc655f1eeb5d9a2dba1d2c0317ca39363ce5e1306a12f3036','runtimeMutations':0,'runtimeAuthorityIssued':False}),flush=True)
          os.execv('/usr/bin/python3',['/usr/bin/python3','-I','-B','-S',str(code/'prepare.py'),str(code/'selection.json'),'d7cb3b6c92c250ddc655f1eeb5d9a2dba1d2c0317ca39363ce5e1306a12f3036'])
          PY
