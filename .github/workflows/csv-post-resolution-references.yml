name: CSV resolved row reference diagnosis qualification
on:
  push:
    branches: [fix/csv-functional-stage3-ledger-20261017]
    paths: ['scripts/read-csv-post-resolution-references-20261018.py', 'tests/csv_post_resolution_references/**', '.github/workflows/csv-post-resolution-references.yml']
permissions: {contents: read}
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Qualify bounded reference metadata and existing read adapters
        run: OUF_NATIVE_SQL=1 python3 -I -B -m unittest discover -s tests/csv_post_resolution_references -v
