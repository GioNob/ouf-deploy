name: Semantic provider R3 installation and restore
on:
  pull_request:
    paths:
      - ops/vps/r3-*.sh
      - ops/vps/r3-settings.json
      - tests/test_r3_runbooks.py
      - tools/semantic_provider_r3/**
      - tools/semantic_provider_operation/**
      - tools/semantic_provider_admission_v2/**
      - tools/semantic_runtime_v52/**
      - tools/semantic_runtime_v51/**
      - tools/semantic_runtime_v51_install/**
      - tools/semantic_authority_mandates/**
      - tools/semantic_transaction_profiles/**
      - tools/semantic_cohort_admission/cohort-draft/**
      - tools/semantic_lease_recovery/**
      - tools/semantic_frame_compiler/**
      - tools/semantic_acceptance_v51/**
      - tools/semantic_b1_acceptance/**
      - tools/semantic_b1b2_authority/**
      - tools/semantic_successor_recipes/**
      - scripts/install-semantic-provider-r3.py
      - scripts/restore-semantic-provider-r3.py
      - scripts/operate-semantic-provider-r3.py
      - scripts/upgrade-semantic-provider-r3.py
      - scripts/install-semantic-runtime-v51.py
      - scripts/restore-semantic-runtime-v51-wrapper.py
      - scripts/issue-semantic-provider-operation-authorization.py
      - scripts/semantic-provider-*-v2.py
      - tests/test_semantic_provider_r3*.py
      - tests/test_frame_observer_v2.py
      - tests/fixtures/r3-v1-document-hashes.json
      - tests/test_semantic_provider_operation*.py
      - tests/test_semantic_provider_admission_v2*.py
      - tests/test_semantic_provider_broker_denials.py
      - tests/test_semantic_provider_l2_binding.py
      - tools/semantic_provider_admission_v2/**
      - tests/fixtures/r3-v2-document-hashes.json
      - tests/test_semantic_provider_lease_supervisor.py
      - tests/test_semantic_runtime_v51_install.py
      - tests/test_runtime_v52_epochs.py
      - docs/OUF_SEMANTIC_PROVIDER_R3_INSTALL.md
      - docs/OUF_SEMANTIC_PROVIDER_R3_OPERATE.md
      - docs/OUF_SEMANTIC_PROVIDER_R3_UPGRADE.md
      - .github/workflows/semantic-provider-r3-install.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: R3 runbooks, single delivery of LF blobs and exact closure
        run: /usr/bin/python3 -I -B -m unittest discover -s tests -p test_r3_runbooks.py -v
      - name: Diagnose native fixture execution mounts and identity
        run: |
          id
          sudo -n id
          findmnt -no TARGET,OPTIONS /run /tmp || true
          findmnt -T /run -no TARGET,OPTIONS
          findmnt -T /tmp -no TARGET,OPTIONS
          findmnt -T /var/lib -no TARGET,OPTIONS
          # Tests also print findmnt -T for their actual temporary directory.
      - name: R3 native CLI, real composition/issuance and wrapper broker create
        run: >-
          sudo -n env OUF_R3_INSTALL_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_provider_r3_install.py -v
      - name: Non-regression task-29b
        run: >-
          sudo -n env OUF_RUNTIME_V51_INSTALL_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_runtime_v51_install.py -v
      - name: R3 operate, real wrapper start/restart/stop and portable contracts
        run: >-
          sudo -n env OUF_R3_OPERATE_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_provider_r3_operate.py -v
      - name: R3 stopped-provider upgrade N+1 and retained registry lifecycle
        run: >-
          sudo -n env OUF_R3_UPGRADE_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_provider_r3_upgrade.py -v
      - name: Broker denial receipts and portable cohort diagnostics
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_provider_broker_denials.py -v
      - name: L2 binding (observed successor names and MACs)
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_provider_l2_binding.py -v
      - name: R3 real Docker cohort on two bridges without configured MACs
        if: ${{ !cancelled() }}
        run: >-
          sudo -n env OUF_R3_COHORT_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_provider_r3_cohort.py -v
      - name: Unchanged guarded switch
        run: >-
          sudo -n env OUF_TRANSACTION_TEST_ROOT=/run /usr/bin/python3 -I -B
          -m unittest discover -s tools/semantic_transaction_profiles -p test_guarded_runtime_switch.py -v
      - name: Non-regression task-41a integration
        run: >-
          sudo -n env OUF_R3_INTEGRATION_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_provider_r3_integration.py -v
      - name: Non-regression runtime v5.2
        run: >-
          sudo -n env OUF_RUNTIME_V52_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_runtime_v52_epochs.py -v
      - name: Native common lock contention and admission v2 budgets
        if: ${{ !cancelled() }}
        run: >-
          sudo -n env OUF_ADMISSION_V2_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p 'test_semantic_provider_admission_v2*.py' -v
      - name: Non-regression composition and supervisor
        run: |
          /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_provider_r3_compose.py -v
          /usr/bin/python3 -I -B -m unittest discover -s tests -p test_frame_observer_v2.py -v
          sudo -n env OUF_PROVIDER_LEASE_SUPERVISOR_NATIVE=1 /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_provider_lease_supervisor.py -v
      - name: Compile task-41b
        run: >-
          /usr/bin/python3 -I -m py_compile tools/semantic_provider_r3/install_common.py
          scripts/install-semantic-provider-r3.py scripts/restore-semantic-provider-r3.py
          tests/test_semantic_provider_r3_install.py
          tools/semantic_provider_r3/operate.py scripts/operate-semantic-provider-r3.py
          tests/test_semantic_provider_r3_operate.py
          tools/semantic_provider_r3/upgrade.py scripts/upgrade-semantic-provider-r3.py
          tests/test_semantic_provider_r3_upgrade.py
          tests/test_semantic_provider_r3_cohort.py tests/test_semantic_provider_broker_denials.py
          tests/test_frame_observer_v2.py tools/semantic_frame_compiler/frame-observer-v2.py
          tools/semantic_frame_compiler/build_frame_observer_v2.py
  cohort-docker-29:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Same official archive already pinned by the retained MAC qualification.
      DOCKER_29_SHA256: d8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Download and verify official Docker 29.8.1 static binaries
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/docker-29.8.1.tgz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz --output "$archive"
          sha256sum "$archive"
          printf '%s  %s\n' "$DOCKER_29_SHA256" "$archive" | sha256sum --check --strict -
          # Root-owned binaries are executed by the private fixture daemon only.
          sudo -n mkdir -p /usr/local/lib/ouf-r3-docker-29
          sudo -n tar -xzf "$archive" --strip-components=1 --no-same-owner -C /usr/local/lib/ouf-r3-docker-29
          # The runtime trusts only root-owned, non-writable ancestors and binaries.
          sudo -n chown -R root:root /usr/local/lib/ouf-r3-docker-29
          sudo -n chmod 0755 /usr/local/lib/ouf-r3-docker-29
          sudo -n chmod -R go-w /usr/local/lib/ouf-r3-docker-29
          ls -ld /usr/local/lib /usr/local/lib/ouf-r3-docker-29 && ls -l /usr/local/lib/ouf-r3-docker-29
          /usr/local/lib/ouf-r3-docker-29/docker --version
          /usr/local/lib/ouf-r3-docker-29/dockerd --version
      - name: Native cohort with Docker 29.8.1 and its containerd and shims
        run: >-
          sudo -n env PATH=/usr/local/lib/ouf-r3-docker-29:/usr/sbin:/usr/bin:/sbin:/bin
          OUF_R3_COHORT_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_provider_r3_cohort.py -v
