name: Provider transaction profile assembly
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_transaction_profiles/**'
      - '.github/workflows/provider-v2-transaction-profiles.yml'
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Profile scope and seal substitution rejection
        run: python3 -B -m unittest discover -v -s tools/semantic_transaction_profiles -p test_assemble_provider_profiles.py
