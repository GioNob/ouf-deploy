name: Mounted configuration custody metadata read
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/read-mounted-configuration-custody.py','tests/test_mounted_configuration_custody.py','.github/workflows/mounted-configuration-custody-read.yml']
permissions: {contents: read}
jobs:
  redaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -I -B -S -m unittest discover -s tests -p test_mounted_configuration_custody.py -v
  target-read:
    needs: redaction
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: timeout -s KILL 50 python3 -I -B -S scripts/read-mounted-configuration-custody.py releases/host-network-reconciliation-20261018.json
