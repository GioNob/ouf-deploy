name: OUF discovery release plan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/discovery-release-plan.yml
      - scripts/plan-discovery-release.py
permissions:
  contents: read
concurrency:
  group: ouf-discovery-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-semantic-registry
          ref: 3422a058bbfc45096f14ac7ea3243054ed437652
          path: semantic-source
          persist-credentials: false
      - name: Compare migration bytes without changing the installation
        run: python3 scripts/plan-discovery-release.py
