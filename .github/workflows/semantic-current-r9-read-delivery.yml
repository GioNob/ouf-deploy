name: OUF current R9 read delivery qualification
on:
  push:
    branches: [main]
    paths:
      - releases/current-r9-transition-read-20261010.sh
      - tools/semantic_target_review/test_current_r9_delivery.py
      - .github/workflows/semantic-current-r9-read-delivery.yml
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/semantic_target_review/test_current_r9_delivery.py
