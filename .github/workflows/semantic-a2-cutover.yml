name: Semantic A2 cutover
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Transazione Semantic"
        type: choice
        options: [a2, next]
        default: a2
      worker_proof:
        description: "Attendere la prova chatbot dopo il cutover forward"
        type: boolean
        default: false
      direction:
        type: choice
        options: [forward, return]
        required: true
      queue:
        description: "Coda da verificare nel plan e autorizzare all'apply"
        type: choice
        options: [empty, inventory]
        required: true

permissions: {}
concurrency:
  group: ouf-vps-privileged-operations
  cancel-in-progress: false

env:
  RELEASE: ${{ inputs.release }}
  DIRECTION: ${{ inputs.direction }}
  QUEUE: ${{ inputs.queue }}
  WORKER_PROOF: ${{ inputs.worker_proof }}

jobs:
  intent:
    if: ${{ github.ref_protected && github.run_attempt == '1' }}
    runs-on: &vps [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.intent.outputs.digest }}
    steps:
      - id: intent
        shell: bash
        run: |
          /usr/bin/python3 -I - <<'PY'
          import hashlib, json, os
          e = os.environ
          scope = dict(run=e["GITHUB_RUN_ID"], attempt=e["GITHUB_RUN_ATTEMPT"], commit=e["GITHUB_SHA"],
                       direction=e["DIRECTION"], queue=e["QUEUE"])
          if e["RELEASE"] == "next":
              scope["release"] = "next"
          if scope["direction"] not in ("forward", "return") or scope["queue"] not in ("empty", "inventory"):
              raise SystemExit("Mandato sconosciuto")
          digest = hashlib.sha256(json.dumps(scope, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          with open(e["GITHUB_STEP_SUMMARY"], "a") as f:
              print(f"Job `plan {digest}`", file=f)
          with open(e["GITHUB_OUTPUT"], "a") as f:
              print("digest=" + digest, file=f)
          PY

  plan:
    name: plan ${{ needs.intent.outputs.digest }}
    needs: intent
    runs-on: *vps
    permissions: {contents: read, actions: read, deployments: read}
    timeout-minutes: 40
    env:
      PHASE: plan
      DIGEST: ${{ needs.intent.outputs.digest }}
    outputs:
      context: ${{ steps.call.outputs.context }}
      digest: ${{ steps.call.outputs.digest }}
    steps:
      - &client
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - &invoke
        id: call
        env:
          REVIEW_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          /usr/bin/python3 -I - <<'PY'
          import json, os, re, runpy, subprocess
          e = os.environ
          req = dict(run=e["GITHUB_RUN_ID"], attempt=e["GITHUB_RUN_ATTEMPT"], commit=e["GITHUB_SHA"],
                     direction=e["DIRECTION"], queue=e["QUEUE"], phase=e["PHASE"], digest=e["DIGEST"])
          if e["RELEASE"] == "next":
              req["release"] = "next"
          wire = json.dumps({"request": req, "token": e.pop("REVIEW_TOKEN")}).encode()
          out = subprocess.run(["/usr/bin/sudo", "-n", "--", "/usr/local/sbin/ouf-a2"],
                               input=wire, stdout=subprocess.PIPE, check=True)
          result = json.loads(out.stdout)
          stamp = result["digest"]
          if not re.fullmatch("[0-9a-f]{64}", stamp):
              raise SystemExit("Risposta esecutore non valida")
          migration = "migrationCount" in result
          next_phase = {"plan": "apply", "apply": "migrate" if migration else "sign", "migrate": "sign"}.get(req["phase"])
          if req["phase"] == "sign" and req["direction"] == "forward" and e["WORKER_PROOF"] == "true":
              next_phase = "proof"
          review = runpy.run_path(".github/scripts/semantic_review.py")
          context = json.loads(e.get("PLAN_REVIEW") or "{}")
          with open(e["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              context = review["cutover"](f, req, result, next_phase, context)
          with open(e["GITHUB_OUTPUT"], "a") as f:
              print("digest=" + stamp, file=f)
              print("context=" + json.dumps(context), file=f)
              print("migration=" + str(migration).lower(), file=f)
          PY

  apply:
    name: apply ${{ needs.plan.outputs.digest }}
    needs: plan
    runs-on: *vps
    environment: ouf-vps-privileged
    permissions: {contents: read, actions: read, deployments: read}
    timeout-minutes: 40
    env:
      PLAN_REVIEW: ${{ needs.plan.outputs.context }}
      PHASE: apply
      DIGEST: ${{ needs.plan.outputs.digest }}
    outputs:
      context: ${{ steps.call.outputs.context }}
      digest: ${{ steps.call.outputs.digest }}
      migration: ${{ steps.call.outputs.migration }}
    steps:
      - *client
      - *invoke

  migrate:
    name: migrate ${{ needs.apply.outputs.digest }}
    needs: apply
    if: needs.apply.outputs.migration == 'true'
    runs-on: *vps
    environment: ouf-vps-privileged
    permissions: {contents: read, actions: read, deployments: read}
    timeout-minutes: 10
    env:
      PLAN_REVIEW: ${{ needs.apply.outputs.context }}
      PHASE: migrate
      DIGEST: ${{ needs.apply.outputs.digest }}
    outputs:
      digest: ${{ steps.call.outputs.digest }}
    steps:
      - *client
      - *invoke

  sign:
    name: sign ${{ needs.migrate.outputs.digest || needs.apply.outputs.digest }}
    needs: [apply, migrate]
    if: >-
      ${{ !cancelled() && needs.apply.result == 'success' &&
      ((needs.apply.outputs.migration == 'false' && needs.migrate.result == 'skipped') ||
       (needs.apply.outputs.migration == 'true' && needs.migrate.result == 'success')) }}
    runs-on: *vps
    environment: ouf-vps-privileged
    permissions: {contents: read, actions: read, deployments: read}
    timeout-minutes: 75
    env:
      PLAN_REVIEW: ${{ needs.apply.outputs.context }}
      PHASE: sign
      DIGEST: ${{ needs.migrate.outputs.digest || needs.apply.outputs.digest }}
    outputs:
      digest: ${{ steps.call.outputs.digest }}
    steps:
      - *client
      - *invoke

  proof:
    if: ${{ !cancelled() && needs.sign.result == 'success' && inputs.worker_proof && inputs.direction == 'forward' }}
    name: proof ${{ needs.sign.outputs.digest }}
    needs: sign
    runs-on: *vps
    environment: ouf-vps-privileged
    permissions: {contents: read, actions: read, deployments: read}
    timeout-minutes: 75
    env:
      PHASE: proof
      DIGEST: ${{ needs.sign.outputs.digest }}
    steps:
      - *client
      - *invoke
