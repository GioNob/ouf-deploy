name: DNS recovery explicit source binding and diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_lease_activation/dns_recovery_*.py'
      - 'tools/semantic_lease_activation/test_dns_recovery_core.py'
      - '.github/workflows/dns-recovery-core.yml'
  pull_request:
    paths:
      - 'tools/semantic_lease_activation/dns_recovery_*.py'
      - 'tools/semantic_lease_activation/test_dns_recovery_core.py'
      - '.github/workflows/dns-recovery-core.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify original closure preservation, explicit new DNS hash and private numeric diagnostics
        run: python3 -B tools/semantic_lease_activation/test_dns_recovery_core.py
