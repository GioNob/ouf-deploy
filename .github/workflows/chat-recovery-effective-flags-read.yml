name: Read effective UDP execution switches
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['.github/workflows/chat-recovery-effective-flags-read.yml']
permissions: {contents: read}
jobs:
  read:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Selected non-secret configuration metadata only
        run: python3 -I -B -S scripts/read-chat-recovery-effective-flags.py releases/chat-recovery-effective-read-20261018.json
