name: Conditional installation Onboarding-only candidate
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/package-installation-owner-candidate.py', 'releases/installation-owner-candidate-20261019.json', '.github/workflows/installation-owner-candidate.yml']
permissions: {contents: read}
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: deploy, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-source-onboarding
          ref: b0f5e3dacbe59ebf87e22dd6af2575e41249f51d
          path: source
          persist-credentials: false
      - name: Build exact Onboarding candidate without target access
        run: python3 deploy/scripts/package-installation-owner-candidate.py build --source source --module onboarding --output package
      - name: Scan exact Onboarding image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ouf-cohort-onboarding:b0f5e3dacbe59ebf87e22dd6af2575e41249f51d
          format: json
          output: package/trivy-image.json
          list-all-pkgs: true
          scanners: vuln
          severity: HIGH,CRITICAL,UNKNOWN
          ignore-unfixed: false
          exit-code: 1
      - name: Export and verify scanned source-locked package
        run: |
          python3 deploy/scripts/package-installation-owner-candidate.py export --source source --module onboarding --output package
          cd package
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installation-owner-candidate-${{ github.run_id }}
          path: package/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
  stage:
    needs: package
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: installation-owner-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/ouf-ingestion-read-package-${{ github.run_id }}
      - name: Stage verified package only; no target service or private input access
        env:
          OUF_DOWNLOADED_PACKAGE: ${{ runner.temp }}/ouf-ingestion-read-package-${{ github.run_id }}
          OUF_CANDIDATE_STAGE: ${{ runner.workspace }}/ouf-installation-owner-${{ github.run_id }}
        run: |
          python3 -I -B -S - <<'PY'
          import hashlib,json,os,re,shutil
          from pathlib import Path
          source=Path(os.environ['OUF_DOWNLOADED_PACKAGE']);target=Path(os.environ['OUF_CANDIDATE_STAGE'])
          def hashed(path):
              h=hashlib.sha256()
              with path.open('rb')as f:
                  for block in iter(lambda:f.read(1048576),b''):h.update(block)
              return h.hexdigest()
          rows={}
          for line in (source/'SHA256SUMS').read_text().splitlines():
              wanted,name=line.split('  ',1);member=Path(name)
              assert re.fullmatch('[0-9a-f]{64}',wanted)and not member.is_absolute()and '..'not in member.parts and name not in rows
              path=source/member
              assert path.is_file()and not path.is_symlink()and hashed(path)==wanted
              rows[name]=wanted
          assert 0<len(rows)<=128
          candidate=json.loads((source/'candidate-manifest.json').read_bytes())
          assert candidate['sourceCommit']=='b0f5e3dacbe59ebf87e22dd6af2575e41249f51d'and candidate['module']=='onboarding'
          assert candidate['targetApplyAuthorized']is False and candidate['scanGate']=='PASS_HIGH_CRITICAL_UNKNOWN_INCLUDING_UNFIXED'
          assert {p.relative_to(source).as_posix()for p in source.rglob('*')if p.is_file()}==set(rows)|{'SHA256SUMS'}
          target.mkdir(mode=0o700)
          for name in [*rows,'SHA256SUMS']:
              output=target/name;output.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(source/name,output);output.chmod(0o400)
              assert hashed(output)==hashed(source/name)
          manifest={'schema':'ouf.installation-owner-staged-package.v1','sourceCommit':candidate['sourceCommit'],
              'files':{**rows,'SHA256SUMS':hashed(target/'SHA256SUMS')},'candidateManifest':candidate,
              'targetApplyAuthorized':False,'runtimeAuthorityIssued':False,'vpsServiceEffects':0}
          raw=json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()
          (target/'qualified-package.json').write_bytes(raw);(target/'qualified-package.json').chmod(0o400)
          print('OUF_INGESTION_TRANSPORT_STAGED='+json.dumps({'path':str(target),'manifestSha256':hashlib.sha256(raw).hexdigest(),
              'sourceCommit':candidate['sourceCommit'],'imageId':candidate['imageId'],'vpsServiceEffects':0,'runtimeAuthorityIssued':False}))
          PY
