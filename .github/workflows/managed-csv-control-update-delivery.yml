# Qualificazione storica (2026-10-27): solo manuale, D-055
name: Retained two-owner CSV control actual protected delivery
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  actual-protected-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          bash -n releases/apply-managed-csv-control-update-20261027.sh
          sudo /usr/bin/python3 -I -S -B tests/qualify_managed_csv_control_update_delivery.py
