name: MCP image swap (R-033) guards and native qualification
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'R-033 candidate JSON from inputs.json (imageId for containerd)'
        required: true
        type: string
      classic_image_id:
        description: 'sha256:<OCI configuration digest> for the classic store'
        required: true
        type: string
      govulncheck_version:
        description: 'Pinned golang.org/x/vuln module version used for the binary check'
        required: true
        type: string
  pull_request:
    paths:
      - scripts/swap-mcp-image.py
      - ops/vps/mcp-image-swap.sh
      - tests/test_mcp_image_swap.py
      - tests/qualify_mcp_image_swap_native.py
      - .github/workflows/mcp-image-swap.yml
permissions: {contents: read, actions: read}
jobs:
  r033-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s tests -p test_mcp_image_swap.py -v
      - run: bash -n ops/vps/mcp-image-swap.sh
  native:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        store: [classic, containerd]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-mcp-server
          ref: ${{ github.event_name == 'workflow_dispatch' && 'fccdd375fac37991737a4f60aea4ca21ce0a9b23' || '907ace32100d44a0fcf1fcbda5d713ee7bd8fd94' }}
          path: mcp-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ github.event_name == 'workflow_dispatch' && '1.27.4' || '1.27.3' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.event_name == 'pull_request'
        with:
          repository: GioNob/ouf-mcp-server
          name: acquisition-mcp-image-42420569963
          run-id: 42420569963
          github-token: ${{ github.token }}
          path: mcp-candidate
      - name: Verify historical archived payload
        if: github.event_name == 'pull_request'
        run: |
          (cd mcp-candidate && sha256sum -c SHA256SUMS)
          echo '5ea15eeff97021e90eedfc74ea0b3fc53bb29dbf5a14f4f21ada564d40e88d02  mcp-candidate/image.tar.gz' | sha256sum -c -
          test "$(cat mcp-candidate/source-commit.txt)" = e2a474ea09bf9c3cb130103ca142f1a128942a80
      - name: Bind R-033 ZIP to the successful publisher run and source tree
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE: ${{ inputs.candidate }}
          CLASSIC_ID: ${{ inputs.classic_image_id }}
          STORE: ${{ matrix.store }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          c = json.loads(os.environ['CANDIDATE'])
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/GioNob/ouf-mcp-server/'+path]))
          assert all(type(c[k]) is int and c[k] > 0 for k in ('artifactId','runId'))
          artifact = api('actions/artifacts/' + str(c['artifactId']))
          run = api('actions/runs/' + str(c['runId']))
          assert run['conclusion'] == 'success' and run['path'] == '.github/workflows/ci.yml'
          assert artifact['workflow_run']['id'] == run['id'] == c['runId'] and not artifact['expired']
          assert artifact['name'] == 'acquisition-mcp-image-' + str(run['id'])
          assert c['sourceCommit'] == 'fccdd375fac37991737a4f60aea4ca21ce0a9b23'
          assert run['head_sha'] in (c['sourceCommit'], c['publisherCommit'])
          for commit, tree in [('sourceCommit','sourceTree'), ('publisherCommit','publisherTree')]:
              assert re.fullmatch('[0-9a-f]{40}', c[commit])
              assert api('git/commits/' + c[commit])['tree']['sha'] == c[tree]
          assert c['sourceTree'] == c['publisherTree']
          if os.environ['STORE'] == 'classic':
              c['imageId'] = os.environ['CLASSIC_ID']
          Path('r033-candidate.json').write_text(json.dumps(c))
          with open('r033.zip','xb') as out:
              subprocess.run(['gh','api','repos/GioNob/ouf-mcp-server/actions/artifacts/'+str(c['artifactId'])+'/zip'],
                             stdout=out,check=True)
          PY
      - name: Prepare disposable signed fixture
        run: |
          mkdir mcp-fixture
          cp tools/mcp_analysis_20261108/fixture_export_test.go mcp-source/internal/reprocessing/rollout_fixture_test.go
          cd mcp-source
          OUF_ROLLOUT_FIXTURE="$GITHUB_WORKSPACE/mcp-fixture" go test ./internal/reprocessing -run '^TestExportExpiredRolloutFixture$' -count=1 -v
      - name: Exact request, schema/history guards and log redaction
        run: python3 -m unittest discover -s tests -p test_mcp_analysis_upgrade.py -v
      - name: Existing strict MAC negative matrix
        run: python3 -m unittest discover -s tests -p test_retained_mac_transition.py -v
      - name: Reuse exact historical Docker29.8.1 in isolated hosted data root
        env: {SELECTED_STORE: '${{ matrix.store }}'}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz -o /tmp/ouf-docker-29.8.1.tgz
          printf '%s  %s\n' d8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70 /tmp/ouf-docker-29.8.1.tgz | sha256sum --check -
          sudo install -d -m 755 /opt/ouf-docker-29
          sudo tar -xzf /tmp/ouf-docker-29.8.1.tgz --strip-components=1 -C /opt/ouf-docker-29
          sudo chown -R root:root /opt/ouf-docker-29
          sudo systemctl stop docker.service docker.socket
          sudo systemctl start containerd.service
          sudo install -d -m 700 /var/lib/ouf-docker-29
          python3 - <<'PY_CONFIG'
          import json,os
          from pathlib import Path
          Path('/tmp/ouf-docker-29.json').write_text(json.dumps({'features':{'containerd-snapshotter':os.environ['SELECTED_STORE']=='containerd'},'exec-opts':['native.cgroupdriver=systemd']}))
          PY_CONFIG
          sudo systemd-run --unit=ouf-docker-mac-daemon --property=Restart=no \
            --setenv=PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            /opt/ouf-docker-29/dockerd --config-file=/tmp/ouf-docker-29.json \
            --host=unix:///var/run/docker.sock --data-root=/var/lib/ouf-docker-29 \
            --exec-root=/run/docker --pidfile=/run/ouf-docker-29.pid \
            --containerd=/run/containerd/containerd.sock
          for OUF_MAC_ENGINE_POLL in $(seq 1 60); do
            if sudo docker info > /tmp/ouf-docker-29-info.txt 2>/dev/null; then break; fi
            sleep 1
          done
          test "$(sudo docker version --format '{{.Server.Version}}')" = 29.8.1
      - name: Archived binary, ordinary migration14, signed expired permit and native replacement
        if: github.event_name == 'pull_request'
        run: sudo python3 -I -B tests/test_mcp_analysis_upgrade_native.py
      - name: R-033 selected image, unchanged schema 14 and immediate predecessor rollback
        if: github.event_name == 'workflow_dispatch'
        env: {SELECTED_STORE: '${{ matrix.store }}'}
        run: sudo env PATH="$PATH" EXPECTED_STORE="$SELECTED_STORE" DOCKER_API_VERSION=1.44 python3 -I -B tests/qualify_mcp_image_swap_native.py
      - name: Inspect and scan the exact executable copied from the running image
        if: github.event_name == 'workflow_dispatch'
        env:
          SCANNER_VERSION: ${{ inputs.govulncheck_version }}
        run: |
          [[ $SCANNER_VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          go version -m r033-ouf-mcp
          go install "golang.org/x/vuln/cmd/govulncheck@$SCANNER_VERSION"
          "$(go env GOPATH)/bin/govulncheck" -mode=binary ./r033-ouf-mcp
