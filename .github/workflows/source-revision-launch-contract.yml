name: Source revision finite launch contract
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/launch-source-revision-update-20261018.sh', '.github/workflows/source-revision-launch-contract.yml']
permissions: {contents: read}
jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Syntax and exact delivered package reproduction, without target execution
        run: |
          bash -n scripts/launch-source-revision-update-20261018.sh
          python3 -I -B -S - <<'PY'
          import hashlib,json,runpy,tempfile
          from pathlib import Path
          root=Path('.').resolve()
          text=(root/'scripts/launch-source-revision-update-20261018.sh').read_text()
          source=text.split("<<'ROOTPY'",1)[1].split('\n',1)[1].rsplit('\nROOTPY',1)[0]
          compile(source,'<qualified-source-revision-root-wrapper>','exec')
          commit='242c9656ce6a0daefc25482484db5450c8ee615b'
          expected='6d96003f48df54d2c9e13b64a496c87b04e8ec7b13e8a2de10be5a3fc6cdfeb0'
          assert commit in source and expected in source
          assert 'os.O_NOFOLLOW' in source and "ns['OVERLAYS']" in source
          stage=runpy.run_path(str(root/'scripts/stage-source-revision-executor.py'))['stage']
          with tempfile.TemporaryDirectory() as temp:
              target=Path(temp)/'code';stage(root,target,commit)
              assert hashlib.sha256((target/'package.json').read_bytes()).hexdigest()==expected
          print('Exact delivered code package reproduced; no authority or target execution.')
          PY
