name: OUF private Semantic target backup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/semantic-target-backup.yml
      - scripts/backup-semantic-target.py
      - tests/test_semantic_target_backup.py
permissions:
  contents: read
concurrency:
  group: ouf-semantic-private-backup
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-semantic-registry
          ref: 67cb426995d7b0723e34bfe54e52ea89ae02b81d
          path: semantic-source
          persist-credentials: false
      - name: Endpoint, credential and live mount boundaries
        run: python3 tests/test_semantic_target_backup.py
      - name: Actual isolated PostgreSQL dump and restore regression
        run: python3 tests/test_discovery_migration_recovery.py
  backup:
    needs: validate
    runs-on: [self-hosted, ouf-vps-test]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Create private dump and parse complete archive on target
        run: python3 scripts/backup-semantic-target.py
