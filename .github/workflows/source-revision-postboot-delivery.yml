name: Source revision postboot delivery qualification
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/launch-source-revision-postboot-20261018.sh', 'tests/test_source_revision_postboot_delivery.py', '.github/workflows/source-revision-postboot-delivery.yml']
permissions: {contents: read}
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Validate pinned delivery without target access
        run: |
          set -euo pipefail
          bash -n scripts/launch-source-revision-postboot-20261018.sh
          fixture="/root/ouf-postboot-delivery-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo env OUF_TEST_ROOT="$fixture" python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p 'test_source_revision_postboot_delivery.py' -v
