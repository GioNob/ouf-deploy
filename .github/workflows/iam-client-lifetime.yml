name: Governed client lifetime policy qualification
on:
  pull_request:
    paths:
      - 'tools/ingestion_rollout_preparation/iam_lifetime_policy.py'
      - 'tools/ingestion_rollout_preparation/iam_lifetime_delivery.py'
      - 'tests/test_iam_lifetime_policy.py'
      - 'releases/iam-client-lifetime-case-20261021.json'
      - 'scripts/iam-client-lifetime-20261021.py'
      - 'scripts/launch-iam-client-lifetime-20261021.sh'
      - '.github/workflows/iam-client-lifetime.yml'
permissions: {contents: read}
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Preserve ledgers and actual provider fields, prove new fixture-token lifetime
        run: |
          set -euo pipefail
          docker info > /dev/null
          fixture="/var/lib/ouf-iam-lifetime-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env GITHUB_ACTIONS=true OUF_TEST_ROOT="$fixture" "$pythonLocation/bin/python3" -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_iam_lifetime_policy.py -v
