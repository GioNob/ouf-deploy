name: Existing Semantic peer port
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_transaction_network/read_gateway_peer_port.py'
      - '.github/workflows/provider-v2-semantic-peer-port.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: [self-hosted, linux, x64, ouf-vps-test]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture the existing Semantic bridge peer
        run: python3 -B tools/semantic_transaction_network/read_gateway_peer_port.py
