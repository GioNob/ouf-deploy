name: Explicit test budget and private readiness preparation
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['tools/semantic_policy_token_owner/installed_owner.py', 'tools/chatbot_file_cohort/continued_owner.py', 'scripts/prepare-ingestion-readiness-update-review-20261017.py', 'releases/policy-token-test-session-profile-20261017.json', 'releases/ingestion-readiness-private-selection-20261017.json', 'tests/test_policy_token_explicit_test_budget*.py', 'tests/test_ingestion_readiness_private_preparation.py', '.github/workflows/readiness-private-preparation.yml']
permissions: {contents: read}
jobs:
  private-preparation-and-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Pure finite budget contracts and inert private preparation
        run: |
          python3 -I -B -m unittest discover -s tests -p test_governed_semantic_session_contract.py -v
          python3 -I -B -m unittest discover -s tests -p test_policy_token_explicit_test_budget.py -v
          python3 -I -B -m unittest discover -s tests -p test_ingestion_readiness_private_preparation.py -v
      - name: Real root custody, signatures, TLS grant, inherited history and persistent fencing
        run: |
          OUF_TEST_BUDGET_ROOT="/var/lib/ouf-test-budget-${{ github.run_id }}"
          sudo mkdir -m700 "$OUF_TEST_BUDGET_ROOT"
          sudo cp -R . "$OUF_TEST_BUDGET_ROOT/repository"
          sudo chown -R root:root "$OUF_TEST_BUDGET_ROOT"
          sudo env OUF_NATIVE_UIDS=1 OUF_TEST_ROOT=/root python3 -I -B -m unittest discover -s "$OUF_TEST_BUDGET_ROOT/repository/tests" -p test_governed_owner_composed.py -v
          sudo env OUF_NATIVE_UIDS=1 OUF_TEST_ROOT=/root python3 -I -B -m unittest discover -s "$OUF_TEST_BUDGET_ROOT/repository/tests" -p test_policy_token_explicit_test_budget_native.py -v

