name: Creation issuer source installation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install-creation-issuer.py'
      - 'scripts/test-install-creation-issuer.py'
      - 'scripts/bootstrap-creation-issuer-installation.sh'
      - 'releases/creation-issuer-sources.json'
      - '.github/workflows/creation-issuer-installation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo env OUF_SHARED_COORDINATION_TEST_PARENT=/root "$(command -v python3)" -B scripts/test-install-creation-issuer.py
      - name: Check bootstrap syntax when published
        run: if test -f scripts/bootstrap-creation-issuer-installation.sh; then bash -n scripts/bootstrap-creation-issuer-installation.sh; fi
