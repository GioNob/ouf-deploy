name: Governed HUMAN supplementary ledger qualification
on:
  pull_request:
    paths:
      - 'tools/governed_human_successor/**'
      - 'tests/test_human_supplementary.py'
      - 'releases/human-supplementary-case-20261021.json'
      - 'scripts/human-supplementary-20261021.py'
      - 'scripts/launch-human-supplementary-20261021.sh'
      - '.github/workflows/human-supplementary.yml'
permissions: {contents: read}
jobs:
  supplementary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Full immutable chain and isolated root; four explicit provider steps; original auth regressions
        run: |
          set -euo pipefail
          docker info > /dev/null
          fixture="/var/lib/ouf-human-supplementary-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          for suite in test_human_supplementary.py test_governed_human_successor.py test_governed_human_operator.py; do
            sudo env GITHUB_ACTIONS=true OUF_TEST_ROOT="$fixture" "$pythonLocation/bin/python3" -I -B -S -m unittest discover -s "$fixture/repository/tests" -p "$suite" -v
          done
