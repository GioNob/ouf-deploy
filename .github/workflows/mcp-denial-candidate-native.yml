name: Exact MCP denial candidate native custody
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths: ['releases/prepare-mcp-denial-image-plan-20261026.sh','scripts/prepare-mcp-denial-image-plan-20261026.py','tests/test_mcp_denial_image_plan.py','tests/qualify_mcp_denial_image_plan_custody.py','tests/qualify_mcp_denial_candidate_native.py','.github/workflows/mcp-denial-candidate-native.yml','tools/acquisition_read_native/image_custody.py','tools/acquisition_read_native/retained_mac.py','tests/qualify_retained_legacy_mac_lifecycle.py','tests/test_retained_mac_transition.py']
  pull_request:
    paths: ['releases/prepare-mcp-denial-image-plan-20261026.sh','scripts/prepare-mcp-denial-image-plan-20261026.py','tests/test_mcp_denial_image_plan.py','tests/qualify_mcp_denial_image_plan_custody.py','tests/qualify_mcp_denial_candidate_native.py','.github/workflows/mcp-denial-candidate-native.yml','tools/acquisition_read_native/image_custody.py','tools/acquisition_read_native/retained_mac.py','tests/qualify_retained_legacy_mac_lifecycle.py','tests/test_retained_mac_transition.py']
permissions: {contents: read, actions: read}
jobs:
  candidate-native-and-legacy-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        store: [classic, containerd]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Authenticate the exact existing successful candidate artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p target/mcp-native-download
          gh api repos/GioNob/ouf-mcp-server/actions/runs/40284011851 > target/mcp-native-download/run.json
          gh api repos/GioNob/ouf-mcp-server/actions/artifacts/12633545900 > target/mcp-native-download/artifact.json
          python3 - <<'PY_META'
          import json
          from pathlib import Path
          p=Path('target/mcp-native-download')
          r=json.loads((p/'run.json').read_text());a=json.loads((p/'artifact.json').read_text())
          assert r['id']==40284011851 and r['head_sha']=='9a374dd07745f059de3ad39757c68f02db6d29c3'
          assert r['event']=='push' and r['conclusion']=='success' and r['repository']['full_name']=='GioNob/ouf-mcp-server'
          assert a['id']==12633545900 and a['name']=='acquisition-mcp-image-40284011851' and a['expired'] is False
          assert a['size_in_bytes']==9617218 and a['digest']=='sha256:6c31a1b5698942ddbb47b96ec1b49860c690c44aac8106beb1ca4b1ed7bba56a'
          assert a['workflow_run']['id']==r['id'] and a['workflow_run']['head_sha']==r['head_sha']
          print('Exact successful source, artifact identity, size and publisher digest verified; no production authority.')
          PY_META
          timeout --signal=TERM --kill-after=5s 120s gh api repos/GioNob/ouf-mcp-server/actions/artifacts/12633545900/zip > target/mcp-native-download/candidate.zip
          printf '%s  %s\n' 6c31a1b5698942ddbb47b96ec1b49860c690c44aac8106beb1ca4b1ed7bba56a target/mcp-native-download/candidate.zip | sha256sum -c -
      - name: Reuse exact historical Docker29.8.1 in isolated hosted data root
        env: {SELECTED_STORE: '${{ matrix.store }}'}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz -o /tmp/ouf-docker-29.8.1.tgz
          printf '%s  %s\n' d8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70 /tmp/ouf-docker-29.8.1.tgz | sha256sum --check -
          sudo install -d -m 755 /opt/ouf-docker-29
          sudo tar -xzf /tmp/ouf-docker-29.8.1.tgz --strip-components=1 -C /opt/ouf-docker-29
          sudo chown -R root:root /opt/ouf-docker-29
          sudo systemctl stop docker.service docker.socket
          sudo systemctl start containerd.service
          sudo install -d -m 700 /var/lib/ouf-docker-29
          python3 - <<'PY_CONFIG'
          import json,os
          from pathlib import Path
          Path('/tmp/ouf-docker-29.json').write_text(json.dumps({'features':{'containerd-snapshotter':os.environ['SELECTED_STORE']=='containerd'},'exec-opts':['native.cgroupdriver=systemd']}))
          PY_CONFIG
          sudo systemd-run --unit=ouf-docker-mac-daemon --property=Restart=no \
            --setenv=PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            /opt/ouf-docker-29/dockerd --config-file=/tmp/ouf-docker-29.json \
            --host=unix:///var/run/docker.sock --data-root=/var/lib/ouf-docker-29 \
            --exec-root=/run/docker --pidfile=/run/ouf-docker-29.pid \
            --containerd=/run/containerd/containerd.sock
          for OUF_MAC_ENGINE_POLL in $(seq 1 60); do
            if sudo docker info > /tmp/ouf-docker-29-info.txt 2>/dev/null; then break; fi
            sleep 1
          done
          test "$(sudo docker version --format '{{.Server.Version}}')" = 29.8.1
      - name: Exact candidate bytes native identity and unstarted container configuration
        env: {SELECTED_STORE: '${{ matrix.store }}'}
        run: sudo python3 -I -S -B tests/qualify_mcp_denial_candidate_native.py "$PWD/target/mcp-native-download/candidate.zip" /var/lib/ouf-mcp-candidate-native-ci "$SELECTED_STORE"
      - name: Mandatory negative MAC matrix and full actual legacy lifecycle on same backend
        run: |
          python3 -B -m unittest discover -s tests -p test_retained_mac_transition.py -v
          sudo env EXPECTED_ENGINE_VERSION=29.8.1 python3 -I -S -B tests/qualify_retained_legacy_mac_lifecycle.py
      - name: Private image plan negative matrix
        run: python3 -B -m unittest discover -s tests -p test_mcp_denial_image_plan.py -v
      - name: Exact retained artifact private root staging and no authority
        env: {SELECTED_STORE: '${{ matrix.store }}'}
        run: sudo python3 -I -S -B tests/qualify_mcp_denial_image_plan_custody.py "$PWD/target/mcp-native-download/candidate.zip" "$SELECTED_STORE"
