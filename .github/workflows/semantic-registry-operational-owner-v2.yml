name: Registry operational token owner v2 (durable receipt)
on:
  pull_request:
    paths:
      - tools/semantic_registry_operational_owner_v2/**
      - tools/semantic_authority_mandates/mandates.py
      - scripts/build-registry-operational-owner-v2-capsule.py
      - docs/OUF_REGISTRY_OPERATIONAL_OWNER_V2_20261114.md
      - docs/OUF_REGISTRY_OPERATIONAL_OWNER_V2_UPGRADE_20261114.md
      - ops/vps/registry-owner-upgrade.sh
      - .github/workflows/semantic-registry-operational-owner-v2.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-operational-owner-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  owner-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Root-custodied disposable component source
        run: |
          sudo install -d -m 0700 /root/ouf-operational-owner-v2-tests
          sudo cp -a . /root/ouf-operational-owner-v2-tests/repository
          sudo chown -R root:root /root/ouf-operational-owner-v2-tests
      - name: Components, contract and v2 capsule
        run: |
          sudo /usr/bin/python3 -I -B -S -m unittest discover \
            -s /root/ouf-operational-owner-v2-tests/repository/tools/semantic_registry_operational_owner_v2/tests \
            -p 'test_*.py' -v
      - name: Actual TLS IAM, durable dated Ed25519 receipt, installation and sandbox
        run: |
          sudo env OUF_NATIVE_OPERATIONAL_OWNER=1 /usr/bin/python3 -I -B -S -m unittest discover \
            -s /root/ouf-operational-owner-v2-tests/repository/tools/semantic_registry_operational_owner_v2/tests \
            -p 'test_native*.py' -v
      - name: Non-regression, v1 owner and M2 discovery closure pins
        run: |
          sudo /usr/bin/python3 -I -B -S -m unittest discover \
            -s /root/ouf-operational-owner-v2-tests/repository/tools/semantic_registry_operational_owner/tests \
            -p 'test_capsule.py' -v
      - name: Every pin of the v1 owner in the M2 discovery closures still matches HEAD bytes
        run: |
          python3 - <<'PIN'
          import glob, hashlib, json
          checked = 0
          for name in glob.glob('tools/m2_discovery_installation_profile/*_sources.json'):
              for entry in json.load(open(name)).values():
                  if isinstance(entry, dict) and str(entry.get('path', '')).startswith('tools/semantic_registry_operational_owner/'):
                      raw = open(entry['path'], 'rb').read()
                      assert hashlib.sha256(raw).hexdigest() == entry['sha256'], (name, entry['path'])
                      checked += 1
          assert checked > 0
          print('V1_OWNER_PINS_UNCHANGED', checked)
          PIN
      - name: Upgrade runbook syntax and ShellCheck
        run: |
          bash -n ops/vps/registry-owner-upgrade.sh
          shellcheck -S warning ops/vps/registry-owner-upgrade.sh
