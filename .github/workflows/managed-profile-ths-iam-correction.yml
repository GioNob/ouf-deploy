name: Reviewed additive THS IAM correction and same-effect reconciliation
on:
  push:
    paths: ['scripts/correct-managed-profile-ths-iam-bindings-20261028.py','tools/build_managed_profile_ths_iam_correction.py','tools/managed_profile_ths_scopes/iam_correction*','tests/*managed_profile_ths_iam_correction*','releases/correct-managed-profile-ths-iam-bindings-20261028.sh','.github/workflows/managed-profile-ths-iam-correction.yml']
  pull_request:
    paths: ['scripts/correct-managed-profile-ths-iam-bindings-20261028.py','tools/build_managed_profile_ths_iam_correction.py','tools/managed_profile_ths_scopes/iam_correction*','tests/*managed_profile_ths_iam_correction*','releases/correct-managed-profile-ths-iam-bindings-20261028.sh','.github/workflows/managed-profile-ths-iam-correction.yml']
permissions: {contents: read}
jobs:
  reviewed-protocol-and-real-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        keycloak: ['26.0.8','26.2.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Reproduce exact sealed source from tracked code and retained evidence
        run: |
          sha256sum scripts/correct-managed-profile-ths-iam-bindings-20261028.py > /tmp/ths-correction-before.sha256
          python3 -I -S -B tools/build_managed_profile_ths_iam_correction.py
          sha256sum --check /tmp/ths-correction-before.sha256
      - run: python3 -I -S -B -m unittest discover -s tests -p 'test_managed_profile_ths*.py' -v
      - run: sudo env GITHUB_ACTIONS=true OUF_TEST_KEYCLOAK_VERSION=${{ matrix.keycloak }} /usr/bin/python3 -I -S -B tests/qualify_managed_profile_ths_iam_correction_physical.py
  actual-protected-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: bash -n releases/correct-managed-profile-ths-iam-bindings-20261028.sh
      - run: sudo /usr/bin/python3 -I -S -B tests/qualify_managed_profile_ths_iam_correction_delivery.py
