name: Stage exact signed durable V11 package on existing VPS without import or apply
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/durable-v11-target-stage.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: durable-v11-target-package-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 37ff0eebcc5e100877f357ba791fe662b2deb508
          persist-credentials: false
      - name: Stage immutable package in a new private directory; verify eight original publisher subjects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          OUF_GH="$HOME/ouf-gh-2.102.0.PNoFbF/gh_2.102.0_linux_amd64/bin/gh"
          if [ ! -x "$OUF_GH" ]; then OUF_GH="$(command -v gh)"; fi
          test -x "$OUF_GH"
          OUF_STAGE="$(mktemp -d "$HOME/ouf-durable-v11-stage.XXXXXXXX")"
          export OUF_STAGE
          "$OUF_GH" api repos/GioNob/ouf-semantic-registry/actions/artifacts/11710556577/zip > "$OUF_STAGE/semantic.zip"
          python3 scripts/verify-durable-v11-package.py --module semantic --zip "$OUF_STAGE/semantic.zip" --output "$OUF_STAGE/package-byte-verification.json"
          python3 - <<'PY'
          import os,pathlib,shutil,zipfile
          root=pathlib.Path(os.environ['OUF_STAGE']);package=root/'package';package.mkdir(mode=0o700)
          with zipfile.ZipFile(root/'semantic.zip') as z:
              for name,limit in [('image.docker.tar',2147483648),('source.tar',536870912),('application.jar',536870912),
                                 ('source-inventory.json',16777216),('package-record.json',1048576),
                                 ('migration-continuity.json',1048576),('trivy-image.json',67108864),
                                 ('Dockerfile.resolved',1048576),('provenance.json',16777216)]:
                  rows=[i for i in z.infolist() if pathlib.PurePosixPath(i.filename).name==name]
                  assert len(rows)==1 and 0<rows[0].file_size<=limit
                  with z.open(rows[0]) as src,(package/name).open('xb') as dst:shutil.copyfileobj(src,dst,1048576)
          PY
          for file in image.docker.tar source.tar source-inventory.json application.jar package-record.json migration-continuity.json trivy-image.json Dockerfile.resolved; do
            "$OUF_GH" attestation verify "$OUF_STAGE/package/$file" --repo GioNob/ouf-semantic-registry \
              --signer-workflow GioNob/ouf-semantic-registry/.github/workflows/discovery-durable-candidate.yml \
              --source-digest 3ec99277b8383e496913b9fd3bb05c877825abf5 \
              --source-ref refs/heads/codex/discovery-durable-resilience-20261011 \
              --deny-self-hosted-runners --bundle "$OUF_STAGE/package/provenance.json" --format json \
              > "$OUF_STAGE/package/$file.target-verification.json"
          done
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['OUF_STAGE'])
          receipt={'schema':'ouf.durable-v11-target-offline-stage.v1',
                   'status':'ORIGINAL_PACKAGE_AND_PUBLISHER_VERIFIED_NO_IMPORT_OR_APPLY',
                   'stageDirectory':str(root),'sourceCommit':'8a2e84b32d4ce2bdc3bc529b56afb5663ab133e3',
                   'publisherCommit':'3ec99277b8383e496913b9fd3bb05c877825abf5',
                   'artifactId':11710556577,
                   'zipSha256':'b6ae1051cee4ec9fb1b28f532622ecd39e038ec2e6a384d50565cbf92f2a0def',
                   'imageId':'sha256:83635be46d1fe61dea08597ea4488980b4349e5f6e0ed8bbd3ab6f5e2686370e',
                   'signedSubjectsVerified':8,'migrationCount':11,'imageImports':0,
                   'containerLifecycleOperations':0,'protectedFileWrites':0,'databaseQueries':0,'databaseWrites':0,
                   'firewallWrites':0,'r12Touched':False,'newClaimCreated':False,'budgetReset':False,
                   'productionApplyReady':False,'newCandidateImageCustodyProven':False,'newTransportClosureProven':False,
                   'targetInstallationAuthorityGranted':False,'notReleaseAcceptance':True}
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          pathlib.Path('durable-v11-target-stage-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('OUF_DURABLE_V11_TARGET_STAGE='+json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: durable-v11-target-stage-${{ github.run_id }}
          path: durable-v11-target-stage-receipt.json
          if-no-files-found: error
          retention-days: 30
