name: Chat recovery launch syntax and pinned package contract
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/launch-chat-recovery-update-20261018.sh', '.github/workflows/chat-recovery-launch-contract.yml']
permissions: {contents: read}
jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Validate shell and isolated root wrapper without execution
        run: |
          bash -n scripts/launch-chat-recovery-update-20261018.sh
          python3 -I -B -S - <<'PY'
          from pathlib import Path
          text=Path('scripts/launch-chat-recovery-update-20261018.sh').read_text()
          source=text.split("<<'ROOTPY'",1)[1].split('\n',1)[1].rsplit('\nROOTPY',1)[0]
          compile(source,'<qualified-root-copy-wrapper>','exec')
          assert '8f79567998aa7231c7255805596a8fd4c9709664' in source
          assert '6cd9f2fbeaeb899809030d3d29400ca64e4782d30bd5cbd3c108f13573ff2be4' in source
          assert 'os.O_NOFOLLOW' in source and "ns['OVERLAYS']" in source
          print('Launch syntax and immutable code package binding verified; no target access.')
          PY
