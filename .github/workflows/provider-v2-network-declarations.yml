name: Provider v2 stopped network declarations
on:
  push:
    branches: [main]
    paths:
      - 'scripts/pin_provider_v2_networks.py'
      - 'tests/test_pin_provider_v2_networks.py'
      - '.github/workflows/provider-v2-network-declarations.yml'
permissions:
  contents: read
concurrency:
  group: ouf-provider-v2-network-declarations
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject collisions, drift, running candidates and partial replay
        run: PYTHONPATH=scripts python3 -B -m unittest discover -v -s tests -p test_pin_provider_v2_networks.py
  declare:
    needs: verify
    runs-on: [self-hosted, ouf-vps-test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Declare only five endpoints of exact never-started candidates
        run: /usr/bin/python3 -I -B scripts/pin_provider_v2_networks.py
