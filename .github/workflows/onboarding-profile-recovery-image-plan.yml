name: Profile recovery exact image and conditional plan
on:
  push:
    paths: ['scripts/prepare-onboarding-profile-recovery-image-plan-20261027.py', 'tests/test_onboarding_profile_recovery_image_plan.py', 'tests/qualify_onboarding_profile_recovery_image_plan.py', 'tests/qualify_profile_recovery_image_plan_delivery.py', 'releases/prepare-onboarding-profile-recovery-image-plan-20261027.sh', 'releases/onboarding-profile-recovery-image-custody-20261027.json', '.github/workflows/onboarding-profile-recovery-image-plan.yml']
  pull_request:
    paths: ['scripts/prepare-onboarding-profile-recovery-image-plan-20261027.py', 'tests/test_onboarding_profile_recovery_image_plan.py', 'tests/qualify_onboarding_profile_recovery_image_plan.py', 'tests/qualify_profile_recovery_image_plan_delivery.py', 'releases/prepare-onboarding-profile-recovery-image-plan-20261027.sh', 'releases/onboarding-profile-recovery-image-custody-20261027.json', '.github/workflows/onboarding-profile-recovery-image-plan.yml']
permissions: {contents: read}
jobs:
  exact-archive-no-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s tests -p test_onboarding_profile_recovery_image_plan.py -v
      - name: Exact immutable image data, curl only and finite transfer
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,time
          from pathlib import Path
          case=json.loads(Path('releases/onboarding-profile-recovery-image-custody-20261027.json').read_text());started=time.monotonic();digest=hashlib.sha256();size=0
          with open('candidate.zip','xb')as out:
              for part in case['parts']:
                  assert time.monotonic()-started<600
                  url='https://raw.githubusercontent.com/GioNob/ouf-source-onboarding/'+case['deliveryCommit']+'/image/'+part['name']
                  subprocess.run(['curl','--fail','--silent','--show-error','--location','--proto','=https','--proto-redir','=https','--max-redirs','3','--connect-timeout','15','--max-time','120','--max-filesize',str(part['bytes']),url,'-o',part['name']],check=True,timeout=125)
                  raw=Path(part['name']).read_bytes();assert len(raw)==part['bytes'] and hashlib.sha256(raw).hexdigest()==part['sha256'];out.write(raw);digest.update(raw);size+=len(raw)
          assert size==case['artifactZipBytes']and digest.hexdigest()==case['artifactZipSha256']
          PY
      - name: Seal disposable root fixture, never target paths
        run: |
          sudo install -d -m 0700 /root/ouf-profile-image-plan-repo
          sudo cp -a . /root/ouf-profile-image-plan-repo/repo
          sudo chown -R root:root /root/ouf-profile-image-plan-repo
          sudo chmod -R go-w /root/ouf-profile-image-plan-repo
          sudo chmod 0400 /root/ouf-profile-image-plan-repo/repo/candidate.zip
      - name: Exact archive and native plan with zero runtime I/O
        run: sudo /usr/bin/python3 -I -S -B /root/ouf-profile-image-plan-repo/repo/tests/qualify_onboarding_profile_recovery_image_plan.py

  actual-curl-sudo-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Seal CI fixture code, no live service or target access
        run: |
          sudo install -d -m 0700 /root/ouf-profile-plan-delivery-fixture
          sudo cp -a . /root/ouf-profile-plan-delivery-fixture/repo
          sudo chown -R root:root /root/ouf-profile-plan-delivery-fixture
          sudo chmod -R go-w /root/ouf-profile-plan-delivery-fixture
      - name: Actual HTTPS chunks, nonroot curl, sudo root0400, negative production main, retained logs
        run: sudo /usr/bin/python3 -I -S -B /root/ouf-profile-plan-delivery-fixture/repo/tests/qualify_profile_recovery_image_plan_delivery.py
