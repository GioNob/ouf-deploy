name: Source revision Spring channel diagnostic
# Fresh bounded read after confirmed native boot recovery; never publish or retry jobs.
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/read-source-revision-spring-channels.py', 'tests/test_source_revision_spring_channel_read.py', '.github/workflows/source-revision-spring-channel-read.yml']
permissions: {contents: read}
jobs:
  redaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -I -B -S -m unittest discover -s tests -p 'test_source_revision_spring_channel_read.py' -v
  target-read:
    needs: redaction
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Existing Docker read access only, no sudo or credential values
        run: timeout -s KILL 50 python3 -I -B -S scripts/read-source-revision-spring-channels.py releases/source-revision-private-preparation-20261018.json
