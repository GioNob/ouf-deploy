name: OUF Go checksum pin
on:
  push:
    branches: [main]
    paths: [.github/workflows/go-checksum-pin.yml]
  workflow_dispatch:
permissions: {}
jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache: false
      - name: Obtain module sums using authenticated Go checksum database
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOPRIVATE: ""
          GONOSUMDB: ""
          GONOPROXY: ""
          GOTOOLCHAIN: local
        run: |
          mkdir checksum-work
          cd checksum-work
          go mod init ouf-checksum-pin
          go mod download -json golang.org/x/text@v0.41.0 > module.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path("module.json").read_bytes())
          assert value["Path"]=="golang.org/x/text" and value["Version"]=="v0.41.0"
          assert not value.get("Error")
          print("OUF_GO_MODULE_PIN="+json.dumps({k:value[k] for k in ("Path","Version","Sum","GoModSum")},sort_keys=True))
          PY
