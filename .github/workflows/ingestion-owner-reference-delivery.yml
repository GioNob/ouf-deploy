# Qualificazione storica (2026-10-19): solo manuale, D-055
name: Ingestion owner reference authenticated delivery
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  immutable-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact qualified sources, immutable Git blob, two SHA checks and root-wrapper syntax
        run: python3 -I -B -S -m unittest discover -s tests -p test_ingestion_owner_reference_delivery.py -v
