name: Registry creation read-only reader qualification
on:
  push:
    paths:
      - scripts/read-chatbot-registry-creation-20261015.py
      - scripts/test_registry_creation_readback.py
      - .github/workflows/chatbot-registry-readback.yml
permissions: {contents: read}
jobs:
  private-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Qualify private bound reads and actual GET-only Unix HTTP
        run: |
          set -euo pipefail
          OUF_READER_FIXTURE="/var/lib/ouf-registry-reader-${GITHUB_RUN_ID}"
          sudo install -d -m 700 "$OUF_READER_FIXTURE"
          sudo install -m 600 scripts/read-chatbot-registry-creation-20261015.py scripts/test_registry_creation_readback.py "$OUF_READER_FIXTURE/"
          sudo python3 -I -B -m unittest discover -s "$OUF_READER_FIXTURE" -p test_registry_creation_readback.py -v
