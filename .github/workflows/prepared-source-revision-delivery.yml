# Qualificazione storica (2026-10-19): solo manuale, D-055
name: Prepared source revision execution delivery
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Root custody, complete bindings and refusal before fixture gate
        run: |
          set -euo pipefail
          bash -n scripts/launch-prepared-source-revision-20261019.sh
          fixture="/root/ouf-prepared-delivery-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo env OUF_TEST_ROOT="$fixture" python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p 'test_prepared_source_revision_delivery.py' -v
