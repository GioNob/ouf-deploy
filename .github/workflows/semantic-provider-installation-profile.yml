name: Semantic provider installation profile P
on:
  pull_request:
    paths:
      - scripts/prepare-semantic-provider-installation.py
      - scripts/deliver-semantic-provider-installation.sh
      - tests/test_semantic_provider_installation.py
      - .github/workflows/semantic-provider-installation-profile.yml
permissions: {contents: read}
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify projection, sealed guard and root-owned publication
        run: sudo -n /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_provider_installation.py -v
