name: Linked property private preparation checks
on:
  push:
    branches: [feat/linked-property-rollout-20261017]
    paths: ['tools/linked_property_rollout/**', 'tests/test_linked_property_preparation.py', 'scripts/launch-linked-property-private-review-20261017.sh', '.github/workflows/linked-property-preparation.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s tests -p test_linked_property_preparation.py -v
      - name: Check launcher syntax when delivery is present
        run: |
          if [ -f scripts/launch-linked-property-private-review-20261017.sh ]; then
            bash -n scripts/launch-linked-property-private-review-20261017.sh
          fi
