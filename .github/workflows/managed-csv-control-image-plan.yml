name: Retained CSV control exact images and conditional plan
on:
  push:
    paths: ['tools/managed_csv_recovery/image_plan.py', 'scripts/prepare-managed-csv-control-image-plan.py', 'scripts/download-managed-csv-control-images.py', 'tests/test_managed_csv_control_image_plan.py', 'tests/qualify_managed_csv_control_image_plan.py', 'releases/managed-csv-control-image-plan-case-20261027.json', '.github/workflows/managed-csv-control-image-plan.yml']
  pull_request:
    paths: ['tools/managed_csv_recovery/image_plan.py', 'scripts/prepare-managed-csv-control-image-plan.py', 'scripts/download-managed-csv-control-images.py', 'tests/test_managed_csv_control_image_plan.py', 'tests/qualify_managed_csv_control_image_plan.py', 'releases/managed-csv-control-image-plan-case-20261027.json', '.github/workflows/managed-csv-control-image-plan.yml']
permissions: {contents: read}
jobs:
  exact-archives-and-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s tests -p test_managed_csv_control_image_plan.py -v
      - name: Download original qualified immutable CI ZIPs without rebuild
        run: |
          mkdir -m 0700 "$RUNNER_TEMP/control-zips"
          cp releases/managed-profile-control-onboarding-image-custody-20261027.json "$RUNNER_TEMP/control-zips/onboarding-custody.json"
          cp releases/managed-profile-control-mcp-image-custody-20261027.json "$RUNNER_TEMP/control-zips/mcp-custody.json"
          python3 scripts/download-managed-csv-control-images.py "$RUNNER_TEMP/control-zips"
      - name: Actual archives, protected metadata and denied runtime ports/processes
        run: sudo env OUF_EXACT_ZIP_DIRECTORY="$RUNNER_TEMP/control-zips" /usr/bin/python3 -I -S -B tests/qualify_managed_csv_control_image_plan.py
