name: Onboarding V35 current configuration and native plan
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths:
      - scripts/freeze-onboarding-v35-native-plan-20261024.py
      - tools/ingestion_readiness_patch_execution/tests/test_onboarding_v35_native_plan.py
      - .github/workflows/onboarding-v35-native-plan.yml
  pull_request:
    paths:
      - scripts/freeze-onboarding-v35-native-plan-20261024.py
      - tools/ingestion_readiness_patch_execution/tests/test_onboarding_v35_native_plan.py
      - .github/workflows/onboarding-v35-native-plan.yml
permissions:
  contents: read
concurrency:
  group: onboarding-v35-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  protected-current-configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Root-custodied disposable configuration fixtures
        run: |
          sudo install -d -m 0700 /root/ouf-v35-plan-tests
          sudo cp -a . /root/ouf-v35-plan-tests/repository
          sudo chown -R root:root /root/ouf-v35-plan-tests
      - name: Actual named UID custody Engine generations and private plan
        run: |
          sudo env OUF_NATIVE_V35_PLAN=1 /usr/bin/python3 -I -B -S -m unittest discover \
            -s /root/ouf-v35-plan-tests/repository/tools/ingestion_readiness_patch_execution/tests \
            -p 'test_onboarding_v35_native_plan.py' -v
