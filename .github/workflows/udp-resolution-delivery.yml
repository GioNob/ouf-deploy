name: UDP Resolution pinned delivery verification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['scripts/launch-udp-resolution-update-20261017.sh', 'tests/test_udp_resolution_delivery.py', '.github/workflows/udp-resolution-delivery.yml']
permissions: {contents: read}
jobs:
  pinned-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact 46 file bindings, checksum rejection and archive forwarding
        run: python3 -I -B -m unittest discover -s tests -p 'test_udp_resolution_delivery.py' -v
