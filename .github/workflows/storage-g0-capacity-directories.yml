name: Storage G0 private capacity directories
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - scripts/prepare-storage-g0-capacity-directories-20261106.py
      - tests/test_storage_g0_capacity_directories.py
      - .github/workflows/storage-g0-capacity-directories.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-g0-capacity-directories-${{ github.ref }}
  cancel-in-progress: false
jobs:
  directories:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify non-adoption, partial-state preservation and original local check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capacity-directories"
          sudo -n env GITHUB_ACTIONS=true python3 -B -m unittest discover -s tests -p test_storage_g0_capacity_directories.py -v 2>&1 | tee "$RUNNER_TEMP/capacity-directories/tests.log"
          sha256sum scripts/prepare-storage-g0-capacity-directories-20261106.py tests/test_storage_g0_capacity_directories.py tools/storage_planning/g0_package.py tools/storage_planning/g0_host.py > "$RUNNER_TEMP/capacity-directories/sources.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-g0-capacity-directories-${{ github.run_id }}
          path: ${{ runner.temp }}/capacity-directories/
          retention-days: 90
          if-no-files-found: error
