name: Stopped rollout snapshot without authority or service calls
on:
  pull_request:
    paths:
      - 'scripts/read-ingestion-rollout-stopped-20261021.py'
      - 'scripts/launch-ingestion-rollout-stopped-20261021.sh'
      - 'tests/test_ingestion_stopped_snapshot.py'
      - 'releases/ingestion-rollout-stopped-reader-case-20261021.json'
      - '.github/workflows/ingestion-stopped-snapshot.yml'
permissions: {contents: read}
jobs:
  private-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Private expired snapshot, prefix drift, no replay, physical root custody
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-stopped-snapshot-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env OUF_TEST_ROOT="$fixture" "$pythonLocation/bin/python3" -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_ingestion_stopped_snapshot.py -v
