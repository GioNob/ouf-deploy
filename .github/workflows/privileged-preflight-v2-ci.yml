name: OUF read-only native preflight upgrade CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/privileged-preflight-v2-ci.yml
      - scripts/privileged-discovery-preflight-v2.py
      - scripts/upgrade-discovery-preflight-v2.sh
      - tests/test_privileged_preflight_v2.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-api-gateway
          ref: 1d75e404b5a84f361ed2160c611f91aaa68d3fd8
          path: gateway-source
          persist-credentials: false
      - name: Shell syntax and bounded native inventory upgrade tests
        run: |
          bash -n scripts/upgrade-discovery-preflight-v2.sh
          sudo python3 -I -B tests/test_privileged_preflight_v2.py
