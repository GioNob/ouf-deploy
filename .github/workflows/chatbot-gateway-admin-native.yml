name: Gateway route package real APISIX diagnostic
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths:
      - scripts/diagnose-gateway-route-package-native.py
      - .github/workflows/chatbot-gateway-admin-native.yml
permissions: {contents: read}
jobs:
  disposable-admin-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-api-gateway
          ref: d20de6b886bc910cf408685a27eb78c76a910151
          path: .pairwise/gateway
          persist-credentials: false
      - run: |
          python3 -m venv .admin-venv
          .admin-venv/bin/pip install -r .pairwise/gateway/requirements-dev.txt
          (cd .pairwise/gateway && ../../.admin-venv/bin/python -m pytest -q tests/test_apisix_numeric_runtime.py tests/test_onboarding_review.py tests/test_file_loop_coherence.py)
          .admin-venv/bin/python scripts/diagnose-gateway-route-package-native.py --gateway-source .pairwise/gateway --report gateway-admin-reproduction.json
