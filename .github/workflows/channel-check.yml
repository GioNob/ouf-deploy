name: OUF VPS channel check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/channel-check.yml
      - requests/channel-check.json

permissions: {}

concurrency:
  group: ouf-vps-channel-check
  cancel-in-progress: false

jobs:
  connection:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 5
    steps:
      - name: Check agent connection without touching OUF
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          echo "OUF_RUNNER_CHANNEL=PASS"
          echo "CONFIGURATION_WRITES=0"
          echo "CONTAINER_OPERATIONS=0"
