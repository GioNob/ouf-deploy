name: OUF retained V11 metadata drift read-only qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/read-retained-v11-metadata-drift.py
      - releases/retained-v11-metadata-diagnostic-20261012.sh
      - tests/test_retained_v11_metadata_diagnostic.py
      - tests/test_retained_v11_metadata_diagnostic_delivery.py
      - .github/workflows/retained-v11-metadata-diagnostic.yml
permissions:
  contents: read
jobs:
  read-only-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Sealed diagnostic downloads and three-source root recheck
        run: python3 -m unittest discover -s tests -p test_retained_v11_metadata_diagnostic_delivery.py -v
      - name: Native root metadata drift diagnosis without source content reads or baseline writes
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-retained-metadata-${GITHUB_RUN_ID}"
          sudo mkdir -m 700 "$OUF_FIXTURE_ROOT"
          sudo cp -R . "$OUF_FIXTURE_ROOT/repository"
          sudo chown -R root:root "$OUF_FIXTURE_ROOT"
          sudo env OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_retained_v11_metadata_diagnostic.py -v
