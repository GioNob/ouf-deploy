name: MCP phase 2 native packaged migration and cleanup
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths:
      - tools/chatbot_file_cohort/migration_native.py
      - tools/chatbot_file_cohort/migration_recovery.py
      - scripts/qualify-chatbot-mcp-migration-continuation.py
      - scripts/qualify-chatbot-mcp-migration-readback.py
      - tests/test_mcp_migration_readback.py
      - .github/workflows/chatbot-mcp-migration-continuation.yml
permissions: {contents: read, actions: read}
jobs:
  frozen-mcp-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GioNob/ouf-mcp-server
          ref: f249b3dcc58c2a96742092d90fa09fd90b705bd0
          path: .pairwise/mcp
          persist-credentials: false
      - name: Private reader tests
        run: |
          sudo install -d -m 700 /var/lib/ouf-mcp-readback
          sudo cp -R . /var/lib/ouf-mcp-readback/repository
          sudo chown -R root:root /var/lib/ouf-mcp-readback
          sudo python3 -I -B -m unittest discover -s /var/lib/ouf-mcp-readback/repository/tests -p test_mcp_migration_readback.py -v
      - name: Fetch exact retained MCP artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api repos/GioNob/ouf-deploy/actions/artifacts/11906464158/zip > /tmp/ouf-original-mcp.zip
          echo '554d04fc354cf48b56b32914ed0e63def8cca100606e24a8a5f62f7ee8c69208  /tmp/ouf-original-mcp.zip' | sha256sum --check -
      - name: Prepare exact disposable Docker 29.8.1 image store
        env: {OUF_CI_PROFILE: containerd}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz -o /tmp/ouf-docker-29.8.1.tgz
          sha256sum /tmp/ouf-docker-29.8.1.tgz
          sudo install -d -m 755 /opt/ouf-docker-29
          sudo tar -xzf /tmp/ouf-docker-29.8.1.tgz --strip-components=1 -C /opt/ouf-docker-29
          sudo chown -R root:root /opt/ouf-docker-29
          sudo systemctl stop docker.service docker.socket
          sudo systemctl start containerd.service
          python3 - <<'PY'
          import json,os
          profile=os.environ['OUF_CI_PROFILE']
          config={'features':{'containerd-snapshotter':profile=='containerd'},'exec-opts':['native.cgroupdriver=systemd']}
          if profile=='classic':config['storage-driver']='overlay2'
          with open('/tmp/ouf-rootfs-daemon.json','w')as stream:json.dump(config,stream)
          PY
          sudo systemd-run --unit=ouf-rootfs-ci-daemon --property=Restart=no \
            --setenv=PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            /opt/ouf-docker-29/dockerd --config-file=/tmp/ouf-rootfs-daemon.json \
            --host=unix:///var/run/docker.sock --data-root=/var/lib/ouf-rootfs-ci \
            --exec-root=/run/docker --pidfile=/run/ouf-rootfs-ci.pid --containerd=/run/containerd/containerd.sock
          for OUF_CI_POLL in $(seq 1 60); do
            if sudo /opt/ouf-docker-29/docker info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(sudo /opt/ouf-docker-29/docker version --format '{{.Server.Version}}')" = 29.8.1
      - name: Frozen MCP create-only identity and real PostgreSQL SELECT
        run: |
          sudo env GITHUB_ACTIONS=true PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            python3 -I -B /var/lib/ouf-mcp-readback/repository/scripts/qualify-chatbot-mcp-migration-continuation.py \
            /tmp/ouf-original-mcp.zip /var/lib/ouf-mcp-readback/result
          sudo cp -R /var/lib/ouf-mcp-readback/result result
          sudo chown -R "$(id -u):$(id -g)" result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-migration-continuation-${{ github.run_id }}
          path: result/
          if-no-files-found: error
          retention-days: 30
