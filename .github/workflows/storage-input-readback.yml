name: Storage input continuation independent evidence and publication readback
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - '.github/workflows/storage-input-readback.yml'
      - 'scripts/readback-input-continuation-20261102.py'
      - 'scripts/verify-input-continuation-evidence-20261102.py'
      - 'releases/seaweedfs-inventory-inputs-20261102/run-inputs.py'
permissions: {contents: read, attestations: read}
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Check exact artifact and all closed sources then reread public delivery and bound launcher
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 -I -B -S scripts/readback-input-continuation-20261102.py
      - name: Independently verify corrective producer workflow source and hosted runner signature
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz -o gh297.tar.gz
          printf '%s  %s\n' a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112 gh297.tar.gz | sha256sum --check --strict
          mkdir gh297
          tar -xzf gh297.tar.gz --strip-components=1 -C gh297
          gh297/bin/gh attestation verify input-readback/SHA256SUMS --repo GioNob/ouf-deploy --signer-workflow GioNob/ouf-deploy/.github/workflows/storage-inputs-qualification.yml --source-digest 91dc1f079bf7f6760d6dcf1f613b6c8a418f03d2 --source-ref refs/heads/feat/m2-discovery-complete-profile-20261029 --deny-self-hosted-runners --bundle input-readback/provenance.json --format json > input-readback/publisher-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-input-independent-readback-${{ github.run_id }}
          path: |
            input-readback/*.json
            input-readback/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
