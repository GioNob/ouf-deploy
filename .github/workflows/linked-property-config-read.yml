name: Linked property Flyway configuration shape
on:
  push:
    branches: [feat/linked-property-migration-rollout-20261017]
    paths: ['.github/workflows/linked-property-config-read.yml', 'scripts/read-linked-property-config-shape.py']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: linked-property-configuration-read
  cancel-in-progress: false
jobs:
  read-only:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Read configuration shape without printing values or reading files
        run: python3 -I -B scripts/read-linked-property-config-shape.py
