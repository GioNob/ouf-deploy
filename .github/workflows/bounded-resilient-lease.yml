name: Bounded resilient pause and finite lease recovery
on:
  push:
    branches: [main]
    paths:
      - tools/semantic_lease_recovery/bounded_recovery.py
      - tools/semantic_lease_recovery/recovery_journal.py
      - tools/semantic_lease_recovery/resilient_lease_adapter.py
      - tools/semantic_lease_recovery/resilient_lease_native.py
      - tools/semantic_lease_recovery/test_bounded_recovery.py
      - .github/workflows/bounded-resilient-lease.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-api-gateway
          ref: a10df126d229dfefd9e0a4d716a07f1f535b6cd6
          path: lease-owner-source
          persist-credentials: false
      - name: Durable bounded recovery and four-hour outage semantics
        run: python3 -B -m unittest discover -v -s tools/semantic_lease_recovery -p test_bounded_recovery.py
      - name: Install isolated native dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2
      - name: Real DNS nft locks and durable journals with four virtual outage hours
        run: sudo unshare --net /usr/bin/python3 -B tools/semantic_lease_recovery/resilient_lease_native.py lease-owner-source
