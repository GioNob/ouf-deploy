name: Storage G0 database and body reconciliation
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - tools/storage_planning/g0_database.py
      - tools/storage_planning/g0_reconciliation.py
      - tests/test_storage_g0_database.py
      - tests/fixtures/storage-g0-db/**
      - scripts/run-storage-g0-db-qualification.py
      - .github/workflows/storage-g0-db-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: storage-g0-db-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-database-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-source-onboarding
          ref: d5155899b09dda298494b68cefa7e1f281167652
          path: onboarding-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-udp-object-resolution
          ref: 0d40da05408a14db31d4d41af2372d6a71480291
          path: udp-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-ingestion-runtime
          ref: 4165b9e149be467d5d7c6bed35e4e1af4e249db1
          path: ingestion-source
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Stage exact schemas and new integration fixture
        run: python3 -I -B -S scripts/run-storage-g0-db-qualification.py stage "$RUNNER_TEMP/storage-g0-db"
      - name: Prepare empty suppression file
        run: touch empty.trivyignore-g0-db
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: rootfs
          scan-ref: ${{ runner.temp }}/storage-g0-db/scan
          format: json
          output: ${{ runner.temp }}/storage-g0-db/evidence/trivy.json
          list-all-pkgs: true
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: empty.trivyignore-g0-db
          exit-code: 0
      - name: Qualify real read-only SQL and body joins in isolated fixtures
        run: python3 -I -B -S scripts/run-storage-g0-db-qualification.py run "$RUNNER_TEMP/storage-g0-db"
      - name: Seal successes and failures
        if: always()
        run: python3 -I -B -S scripts/run-storage-g0-db-qualification.py seal "$RUNNER_TEMP/storage-g0-db"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        if: success()
        with:
          subject-path: ${{ runner.temp }}/storage-g0-db/evidence/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-g0-db-${{ github.run_id }}
          path: ${{ runner.temp }}/storage-g0-db/evidence/
          retention-days: 90
          if-no-files-found: error
