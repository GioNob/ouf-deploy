name: OUF quiesce exact retained Semantic R4a smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/quiesce-retained-semantic-smoke.py
      - .github/workflows/semantic-smoke-quiescence.yml
permissions:
  contents: read
concurrency:
  group: ouf-semantic-retained-smoke-quiescence
  cancel-in-progress: false
jobs:
  quiesce:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stop only pinned stale smoke; preserve container and primary generation
        run: python3 scripts/quiesce-retained-semantic-smoke.py
