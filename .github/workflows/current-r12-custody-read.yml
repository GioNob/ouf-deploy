name: Current R12 custody read without repeated preparation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/current-r12-custody-read.yml
      - scripts/read-current-r12-cutover-custody.py
      - tests/test_current_r12_custody_read.py
permissions:
  contents: read
concurrency:
  group: ouf-current-r12-custody-read-only
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -B -m unittest discover -s tests -p test_current_r12_custody_read.py -v
  read-or-report-access:
    needs: qualify
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Reverify existing R12 and four retained inputs under existing sudo permission
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          OUF_READ="$GITHUB_WORKSPACE/scripts/read-current-r12-cutover-custody.py"
          OUF_PLANNER="$GITHUB_WORKSPACE/scripts/compile-semantic-creation-plan-after-r12.py"
          OUF_PREPARE="$GITHUB_WORKSPACE/scripts/prepare-semantic-inputs-after-r12.py"
          OUF_CUSTODY="$GITHUB_WORKSPACE/tools/semantic_target_review/prepare_application_runtime_inputs.py"
          OUF_CREATION="$GITHUB_WORKSPACE/tools/semantic_application_cutover/creation_plan.py"
          if sudo -n /usr/bin/python3 -I -B -c '
          import hashlib,pathlib,sys
          expected=["4d4da44d8ef27f77e00982d978ad8400eb7a0b79997bd468535fc49654b2ac3f","38bb934fedfcdd38d11fc29ff4d60e75170854686273b7592edcae92fa0d1d28","693ec0196a60d3a9f6adee96571947306df4a0cffb449905c3dcf8c09a34da1b","cb9ff64684243d563da79d327eb7d7e325dbea6a3922c91a0b7791a3ceec9baf","e018567bbd67504ec00d5cbd830c65adbb2670dd7a627b63b9ae20ffa420d665"]
          if len(sys.argv)!=6:raise SystemExit("OUF_CURRENT_READ_EXACT_SOURCE_SET_REQUIRED")
          sources=[]
          for path,digest in zip(sys.argv[1:],expected):
              with pathlib.Path(path).open("rb") as stream:raw=stream.read(131073)
              if len(raw)>131072 or hashlib.sha256(raw).hexdigest()!=digest:raise SystemExit("OUF_CURRENT_READ_SOURCE_HASH_MISMATCH")
              sources.append(raw)
          path=sys.argv[1];sys.argv=[path]
          exec(compile(sources[0],path,"exec"),{"__name__":"__main__","__file__":path,"__read_only_sources__":dict(zip(("planner","prepare","custody","creation"),sources[1:]))})
          ' "$OUF_READ" "$OUF_PLANNER" "$OUF_PREPARE" "$OUF_CUSTODY" "$OUF_CREATION" > "$RUNNER_TEMP/current-r12-custody-result.txt" 2> "$RUNNER_TEMP/current-r12-custody-error.txt"; then
            cat "$RUNNER_TEMP/current-r12-custody-result.txt"
            echo OUF_CURRENT_R12_CUSTODY_EXIT=0
          else
            OUF_EXIT=$?
            if rg -q '^OUF_CURRENT_R12_CUSTODY=' "$RUNNER_TEMP/current-r12-custody-result.txt"; then
              cat "$RUNNER_TEMP/current-r12-custody-result.txt"
              echo "OUF_CURRENT_R12_CUSTODY_EXIT=$OUF_EXIT"
              exit "$OUF_EXIT"
            fi
            echo OUF_CURRENT_R12_CUSTODY=NOT_EXECUTED_EXISTING_ROOT_PERMISSION_UNPROVEN_OPERATOR_REQUIRED
            echo "OUF_ROOT_ATTEMPT_EXIT=$OUF_EXIT"
            sha256sum "$RUNNER_TEMP/current-r12-custody-error.txt"
          fi
