version: '0.8'
scope: Semantic Registry cross-module contracts and consumer pinning only
contracts:
- SemanticReference
- ArtifactDetail
- ArtifactRevision
- SemanticPublicationMember
- SemanticPublicationSet
- SearchResult
- DiscoveryRequest
- DiscoveryCandidate
- ExternalOrigin
- SemanticChangeNotice
- ImpactReport
- SemanticMigrationProposal
invariants:
- id: SEM-X01
  rule: semanticId is semantic identity; artifactId/revisionId are technical/reproducibility
    identifiers.
- id: SEM-X02
  rule: SemanticReference resolves exact revision/publication context; no implicit
    latest/ACTIVE fallback.
- id: SEM-X03
  rule: PublicationSet membership contains semanticId/artifactId/artifactType/revisionId/contentHash
    and manifestHash is deterministic.
- id: SEM-X04
  rule: PUBLISHED/ACTIVE PublicationSet membership is immutable; a change creates
    a new set.
- id: SEM-X05
  rule: ACTIVE pointer swap is atomic; consumer never sees partial membership.
- id: SEM-X06
  rule: Ingestion pins one publicationSetId/version/manifestHash for the whole run/attempt,
    including pause/resume/retry.
- id: SEM-X07
  rule: Historical replay resolves the original contract chain; unresolved historical
    ref fails explicitly.
- id: SEM-X08
  rule: Onboarding may search/discover/adopt governably but stores exact ACTIVE/published
    semantic refs in mappings/bundles.
- id: SEM-X09
  rule: Ingestion is read-only consumer; no semantic discovery, adoption, draft edit
    or publish at runtime.
- id: SEM-X10
  rule: UDP preserves exact semantic refs in type/relation/provenance; it does not
    author TBox.
- id: SEM-X11
  rule: Registry owns relation IRI/domain/range; Onboarding owns resolution strategy;
    UDP owns instantiated ABox edge.
- id: SEM-X12
  rule: DiscoveryCandidate is temporary and cannot be used as official semanticId
    before adoption/publication.
- id: SEM-X13
  rule: Upstream WITHDRAWN/UNREACHABLE does not make adopted local snapshot or historical
    semantic refs unavailable.
- id: SEM-X14
  rule: BREAKING change emits ImpactReport/SemanticChangeNotice and may gate future
    activation but never rewrites historical data/lineage.
- id: SEM-X15
  rule: SemanticChangeNotice/MigrationProposal never auto-remaps Onboarding, hot-swaps
    active run semantics, or auto-migrates UDP.
- id: SEM-X16
  rule: AuthorityPolicy, DataAccessLabel, ChangeRepresentationProfile and SourceObjectIdentityPolicy
    are external to authoritative semantic revision/publication content.
- id: SEM-X17
  rule: MCP semantic hints reference Registry; they do not duplicate TBox semantics
    or create fallback semantics.
- id: SEM-X18
  rule: Consumer compatibility is checked against exact publication version; breaking
    change handling is owner-specific and explicit.
explicitlyExcluded:
- ApprovalChallenge/ApprovalDecision and Trusted Human Surface
- Authorization policy contracts
- Onboarding source-specific SemanticMapping/RelationshipMapping authoring
- UDP UrbanObject/edge DTOs
- Query planning/governor/budget
- MCP Server implementation
- provider credentials or physical provider URLs as semantic identity
- SHACL as mandatory discovery/publication gate
- graph database/triple store/vector database/broker
