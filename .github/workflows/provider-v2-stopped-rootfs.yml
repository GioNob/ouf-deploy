name: Stopped rootfs comparison feasibility
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_stopped_rootfs/**'
      - '.github/workflows/provider-v2-stopped-rootfs.yml'
permissions:
  contents: read
jobs:
  isolated-export-mount:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load exact target-version engine in disposable CI
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz --output engine.tgz
          printf '%s\n' 'd8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70  engine.tgz' | sha256sum -c -
          mkdir engine-bin
          tar -xzf engine.tgz --strip-components=1 -C engine-bin
      - name: Compare complete metadata while stopped export holds mount
        run: |
          sudo install -d -m 700 /root/ouf-stopped-rootfs /root/ouf-stopped-rootfs/cohort-draft /root/ouf-stopped-rootfs/cohort-draft/tools /root/ouf-stopped-rootfs/cohort-draft/scripts
          sudo install -m 600 tools/semantic_stopped_rootfs/*.py tools/semantic_image_rootfs/prepare_provider_image_rootfs.py /root/ouf-stopped-rootfs/
          sudo install -m 600 tools/semantic_cohort_admission/cohort-draft/tools/*.py /root/ouf-stopped-rootfs/cohort-draft/tools/
          sudo install -m 600 tools/semantic_cohort_admission/cohort-draft/scripts/*.py /root/ouf-stopped-rootfs/cohort-draft/scripts/
          sudo install -m 600 tools/semantic_cohort_admission/cohort-draft/sources.json /root/ouf-stopped-rootfs/cohort-draft/sources.json
          sudo env PATH="${{ github.workspace }}/engine-bin:/usr/sbin:/usr/bin:/sbin:/bin" /usr/bin/python3 -I -B /root/ouf-stopped-rootfs/test_stopped_export_mount_native.py
