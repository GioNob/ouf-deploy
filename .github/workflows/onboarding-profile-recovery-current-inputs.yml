name: Onboarding profile recovery current input capture
on:
  push:
    paths: ['scripts/capture-onboarding-profile-recovery-inputs-20261027.py', 'tests/test_onboarding_profile_recovery_current_inputs.py', 'tests/qualify_onboarding_profile_recovery_capture.py', '.github/workflows/onboarding-profile-recovery-current-inputs.yml']
  pull_request:
    paths: ['scripts/capture-onboarding-profile-recovery-inputs-20261027.py', 'tests/test_onboarding_profile_recovery_current_inputs.py', 'tests/qualify_onboarding_profile_recovery_capture.py', '.github/workflows/onboarding-profile-recovery-current-inputs.yml']
permissions: {contents: read}
jobs:
  bounded-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s tests -p test_onboarding_profile_recovery_current_inputs.py -v
      - name: Native Engine and sealed root metadata capture
        run: |
          docker run -d --name ouf-ci-profile-recovery-capture --network none alpine:3.22 sleep 180
          sudo /usr/bin/python3 -I -S -B tests/qualify_onboarding_profile_recovery_capture.py
      - if: always()
        run: docker rm -f ouf-ci-profile-recovery-capture || true
