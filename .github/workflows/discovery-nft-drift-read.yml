name: Current discovery nft drift read
on:
  push:
    branches: [docs/storage-functional-reset-20261107]
    paths:
      - scripts/read-discovery-nft-drift-20261109.py
      - tests/test_discovery_nft_drift.py
      - tests/native_discovery_nft_drift.py
      - .github/workflows/discovery-nft-drift-read.yml
  pull_request:
    paths:
      - scripts/read-discovery-nft-drift-20261109.py
      - tests/test_discovery_nft_drift.py
      - tests/native_discovery_nft_drift.py
      - .github/workflows/discovery-nft-drift-read.yml
permissions: {contents: read}
jobs:
  nft-read-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Stage pinned repository core
        run: |
          mkdir -p scripts/core
          for name in materialize_southbound_kernel semantic_provider_dns materialize_southbound_lease_refresh semantic_provider_lease_nft semantic_provider_lease_owner semantic_provider_lease_coordination; do
            cp "tools/semantic_cohort_admission/cohort-draft/tools/$name.py" "scripts/core/$name.py"
          done
      - name: Comparison and source binding regressions
        run: sudo python3 -I -B -m unittest discover -s tests -p test_discovery_nft_drift.py -v
      - name: Install nft for disposable namespace
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
      - name: Actual nft reads and recreated native handles
        run: sudo unshare --mount --net --propagation private python3 -I -B tests/native_discovery_nft_drift.py
