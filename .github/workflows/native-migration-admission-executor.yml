name: OUF composed explicit migration admission
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/semantic_application_cutover/migration_admission_adapter.py
      - tools/semantic_application_cutover/database_channel_scope.py
      - tools/semantic_application_cutover/fenced_backup_adapter.py
      - tests/test_migration_admission_adapter.py
      - tests/native_migration_admission_executor.py
      - tests/executor_composition_fixture.py
      - .github/workflows/native-migration-admission-executor.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_migration_admission_adapter.py -v
      - run: python3 tests/native_migration_admission_executor.py
