nameOverride: ""
fullnameOverride: ""
replicaCount: 2
image:
  repository: CHANGE-ME
  tag: CHANGE-ME
  pullPolicy: IfNotPresent
service:
  port: 8080
resources:
  requests: {}
  limits: {}
probes:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness
  startupPath: /actuator/health
environmentBindings:
  identityProfileRef: env://identity/profile
  otlpEndpointRef: env://telemetry/otlp
  secretProviderRef: env://secrets/provider
networkPolicy:
  enabled: true
  allowedIngress:
    - namespaceSelector: {matchLabels: {ouf.trieste.it/gateway: "true"}}
      ports: [8080]
  allowedEgress:
    - namespaceSelector: {matchLabels: {ouf.trieste.it/platform: "true"}}
      ports: [443, 4317, 5432]
podDisruptionBudget:
  enabled: true
  minAvailable: 1
