name: M2 exact Registry discovery rootfs
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths: ['tests/qualify_m2_discovery_frame_native.py','tests/qualify_m2_discovery_registry_rootfs.py','.github/workflows/m2-discovery-registry-rootfs.yml']
permissions: {contents: read, actions: read, attestations: write, id-token: write}
jobs:
  exact-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: GioNob/ouf-semantic-registry
          name: m2-composed-discovery-offline-candidate-40826468452
          run-id: 40826468452
          github-token: ${{ github.token }}
          path: registry-candidate
      - name: Verify original artifact and cryptographic publisher before importing in CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          meta=json.loads(subprocess.check_output(['gh','api','repos/GioNob/ouf-semantic-registry/actions/artifacts/12876846746']))
          assert meta['digest']=='sha256:c464eb6cb165c305d376c000579089dfed3e5f6cb3f22c953a74f193747659f8' and not meta['expired']
          assert meta['workflow_run']['id']==40826468452 and meta['workflow_run']['head_sha']=='1086f7ea5a3281dc7731ea28d258f8fead403d07'
          PY
          (cd registry-candidate && sha256sum -c SHA256SUMS)
          mkdir publisher-sidecar
          for file in image.docker.tar package-record.json; do
            gh attestation verify "registry-candidate/$file" --repo GioNob/ouf-semantic-registry \
              --signer-workflow GioNob/ouf-semantic-registry/.github/workflows/m2-discovery-composed-candidate.yml \
              --source-digest 1086f7ea5a3281dc7731ea28d258f8fead403d07 \
              --source-ref refs/heads/feat/m2-durable-discovery-composition-20261029 \
              --deny-self-hosted-runners --bundle registry-candidate/provenance.json --format json \
              > "publisher-sidecar/registry-$file.verification.json"
          done
      - name: Use official Docker 29.8.1 in an isolated disposable data root
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz -o /tmp/ouf-docker-29.8.1.tgz
          sha256sum /tmp/ouf-docker-29.8.1.tgz
          sudo install -d -m 755 /opt/ouf-docker-29
          sudo tar -xzf /tmp/ouf-docker-29.8.1.tgz --strip-components=1 -C /opt/ouf-docker-29
          sudo chown -R root:root /opt/ouf-docker-29
          /opt/ouf-docker-29/dockerd --version
          sudo systemctl stop docker.service docker.socket
          sudo systemctl start containerd.service
          sudo install -d -m 700 /var/lib/ouf-docker-29
          printf '%s\n' '{"features":{"containerd-snapshotter":true},"exec-opts":["native.cgroupdriver=systemd"]}' > /tmp/ouf-docker-29.json
          sudo systemd-run --unit=ouf-docker-contract-daemon --property=Restart=no \
            --setenv=PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            /opt/ouf-docker-29/dockerd --config-file=/tmp/ouf-docker-29.json \
            --host=unix:///var/run/docker.sock --data-root=/var/lib/ouf-docker-29 \
            --exec-root=/run/docker --pidfile=/run/ouf-docker-29.pid \
            --containerd=/run/containerd/containerd.sock
          for OUF_DOCKER_POLL in $(seq 1 60); do
            if sudo docker info > /tmp/ouf-docker-29-info.txt 2>/dev/null; then break; fi
            sleep 1
          done
          test "$(sudo docker version --format '{{.Server.Version}}')" = 29.8.1
          test "$(sudo docker info --format '{{.Driver}}')" = overlayfs
          test "$(sudo docker info --format '{{.CgroupDriver}}')" = systemd
      - name: Exact Registry image, full independent OCI, seven mount placeholders and rootfs seal
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-discovery-registry-${GITHUB_RUN_ID}"
          sudo install -d -m 700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo env GITHUB_ACTIONS=true PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            python3 -I -B -S "$fixture/repository/tests/qualify_m2_discovery_registry_rootfs.py" \
              "$fixture/repository/registry-candidate" "$fixture/result.json"
          sudo cp "$fixture/result.json" publisher-sidecar/registry-full-discovery-rootfs.json
          sudo chown "$(id -u):$(id -g)" publisher-sidecar/registry-full-discovery-rootfs.json
          sha256sum publisher-sidecar/registry-full-discovery-rootfs.json
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: publisher-sidecar/registry-full-discovery-rootfs.json
          create-storage-record: false
      - name: Retain signed independent CI result
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$PROVENANCE_BUNDLE" publisher-sidecar/rootfs-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-discovery-registry-full-rootfs-${{ github.run_id }}
          path: publisher-sidecar/
          if-no-files-found: error
          retention-days: 30
      - name: Retain CI failure comparison
        if: failure()
        run: |
          sudo journalctl --unit=ouf-docker-contract-daemon --no-pager --lines=40
          sudo find /var/lib -maxdepth 2 -type f -path '/var/lib/discovery-native-*/*-oci.json' -exec cp {} /tmp/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: m2-discovery-registry-rootfs-denial-${{ github.run_id }}
          path: |
            publisher-sidecar/
            /tmp/*-oci.json
          if-no-files-found: warn
          retention-days: 7
