name: Chat recovery readiness contracts
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths:
      - tools/chat_recovery_update/**
      - tests/test_chat_recovery_readiness.py
      - .github/workflows/chat-recovery-readiness-contracts.yml
  pull_request:
    paths:
      - tools/chat_recovery_update/**
      - tests/test_chat_recovery_readiness.py
      - .github/workflows/chat-recovery-readiness-contracts.yml
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify pure readiness classification
        run: python3 -m unittest discover -s tests -p test_chat_recovery_readiness.py -v
