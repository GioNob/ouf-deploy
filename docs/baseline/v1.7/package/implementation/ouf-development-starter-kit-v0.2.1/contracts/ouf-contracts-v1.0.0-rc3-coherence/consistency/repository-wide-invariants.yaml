version: '0.12'
scope: Repository-wide cross-module consistency across Ingestion, Onboarding, Authorization,
  Semantic Registry, Urban API Gateway and MCP contractization
invariants:
- id: REPO-X01
  rule: Every cataloged contract path exists and every catalog name/path is unique.
- id: REPO-X02
  rule: All JSON/YAML artifacts parse and all JSON Schema 2020-12 artifacts are schema-valid.
- id: REPO-X03
  rule: Every local/remote repository $ref resolves to a repository artifact; no schema
    reference escapes repository.
- id: REPO-X04
  rule: Canonical capabilityId is stable across module owner, Authorization, Gateway
    and MCP projections.
- id: REPO-X05
  rule: 'tool eligibility is monotonic restrictive: any governing false => effective
    MCP exposure false; true never implies authorization.'
- id: REPO-X06
  rule: HUMAN_REQUIRED cannot be satisfied by AI_AGENT, MCP_SERVER or SERVICE_IDENTITY
    and protected human operations are outside MCP.
- id: REPO-X07
  rule: Gateway is network/coarse-policy boundary; backend owner remains fine-grained
    authorization authority.
- id: REPO-X08
  rule: Gateway rate limiting/timeout/payload controls remain distinct from UDP Query
    Complexity Governor.
- id: REPO-X09
  rule: Gateway/MCP 202/acceptance never becomes Ingestion Durable ACK; committed
    watermark semantics remain downstream.
- id: REPO-X10
  rule: Onboarding PublishedConfigurationBundle is immutable execution input; runtime
    consumers do not reconstruct it from control-plane tables.
- id: REPO-X11
  rule: Source runtime/extraction/route projections consumed by Gateway remain technical
    and exclude semantic classification/ontology rationale.
- id: REPO-X12
  rule: Source object identity is provenance identity and is never UrbanObjectId;
    final canonical resolution remains UDP-owned.
- id: REPO-X13
  rule: SemanticReference/PublicationSet are exact pinned references; no silent current/latest
    fallback during runtime, replay or MCP explanation.
- id: REPO-X14
  rule: Semantic Registry owns TBox/vocabulary/relation semantics; Onboarding owns
    source-specific mapping/resolution strategy; UDP owns ABox materialization.
- id: REPO-X15
  rule: AuthorizationPolicyBundle and SemanticPublicationSet are immutable snapshots
    activated atomically; one request/run uses one captured version.
- id: REPO-X16
  rule: ProblemDetails uses canonical OUF application code + correlationId and is
    propagated without semantic reinterpretation.
- id: REPO-X17
  rule: correlationId is propagated Gateway -> Connector/Ingestion -> lineage and
    Gateway -> MCP/backend context.
- id: REPO-X18
  rule: Secrets/credentials are references only; bearer tokens are not application
    data or audit payload.
- id: REPO-X19
  rule: Breaking contract changes require a new major; additive optional fields are
    compatible where contract policy allows.
- id: REPO-X20
  rule: Historical refs required for replay/audit remain resolvable and are not silently
    substituted by ACTIVE/current artifacts.
- id: REPO-X21
  rule: No new mandatory graph DB, vector DB, broker, analytics engine, central authorization
    microservice or agent runtime is introduced by the contracts repository.
