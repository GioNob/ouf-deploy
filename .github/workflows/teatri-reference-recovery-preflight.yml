name: Teatri reference recovery preflight qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['scripts/read-teatri-reference-recovery-preflight-20261017.py', 'tests/reference_recovery_preflight/**', '.github/workflows/teatri-reference-recovery-preflight.yml']
permissions: {contents: read}
jobs:
  readonly-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Current fence budgets and actual SQL metadata with no HTTP
        run: OUF_NATIVE_SQL=1 python3 -I -B -m unittest discover -s tests/reference_recovery_preflight -v
