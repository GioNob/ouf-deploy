name: Semantic provider R3 native integration
on:
  pull_request:
    paths:
      - tools/semantic_runtime_v52/**
      - tools/semantic_provider_admission_v2/**
      - tools/semantic_provider_r3/**
      - tools/semantic_provider_operation/**
      - tools/semantic_authority_mandates/**
      - tools/semantic_cohort_admission/cohort-draft/**
      - tools/semantic_lease_recovery/**
      - tools/semantic_frame_compiler/**
      - tools/semantic_successor_recipes/**
      - tools/semantic_b1_acceptance/**
      - scripts/semantic-provider-*-v2.py
      - scripts/issue-semantic-provider-operation-authorization.py
      - tests/test_semantic_provider_r3*.py
      - tests/test_semantic_provider_operation*.py
      - tests/test_semantic_provider_admission_v2*.py
      - tests/test_semantic_provider_lease_supervisor.py
      - tests/test_runtime_v52_epochs.py
      - .github/workflows/semantic-provider-r3-integration.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  r3-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Integrated real runtime, broker, preparer and hook with composed authority
        run: >-
          sudo -n env OUF_R3_INTEGRATION_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_provider_r3_integration.py -v
      - name: Non-regression composition and real validators
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 -I -B -m unittest discover -s tests -p test_semantic_provider_r3_compose.py -v
      - name: Non-regression native issuance
        if: ${{ !cancelled() }}
        run: >-
          sudo -n env OUF_OPERATION_ISSUANCE_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_provider_operation_issuance.py -v
      - name: Non-regression admission v2 and preparer v7
        if: ${{ !cancelled() }}
        run: >-
          sudo -n env OUF_ADMISSION_V2_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p 'test_semantic_provider_admission_v2*.py' -v
      - name: Non-regression native runtime v5.2
        if: ${{ !cancelled() }}
        run: >-
          sudo -n env OUF_RUNTIME_V52_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_runtime_v52_epochs.py -v
      - name: Non-regression native operation and epochs
        if: ${{ !cancelled() }}
        run: >-
          sudo -n env OUF_PROVIDER_OPERATION_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_provider_operation.py -v
      - name: Non-regression native lease supervisor
        if: ${{ !cancelled() }}
        run: >-
          sudo -n env OUF_PROVIDER_LEASE_SUPERVISOR_NATIVE=1 /usr/bin/python3 -I -B
          -m unittest discover -s tests -p test_semantic_provider_lease_supervisor.py -v
      - name: Compile integration test
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 -I -m py_compile tests/test_semantic_provider_r3_integration.py
