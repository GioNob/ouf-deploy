name: Provider existing SBOM fresh evidence
on:
  push:
    paths:
      - 'tools/semantic_target_review/refresh_existing_provider_sbom.py'
      - '.github/workflows/provider-v2-fresh-existing-sbom.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write
jobs:
  signed-existing-sbom-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-semantic-registry
          ref: 84e91e199892bfda1d116a49f53a9990f61724c7
          path: .fresh/semantic
      - name: Reverify existing signatures and scan unchanged SBOMs with frozen new DB
        env:
          GH_TOKEN: ${{ github.token }}
        run: sudo --preserve-env=GH_TOKEN /usr/bin/python3 -I -B tools/semantic_target_review/refresh_existing_provider_sbom.py .fresh/semantic
      - name: Make public evidence readable for attestation and artifact retention
        if: always()
        run: if [ -d generated ]; then sudo chmod -R a+rX generated; fi
      - name: Sign actual fresh evidence bytes
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: generated/provider-v2-fresh-existing-sbom/checksums.sha256
          create-storage-record: false
      - name: Retain fresh attestation bundle
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: sudo cp "$PROVENANCE_BUNDLE" generated/provider-v2-fresh-existing-sbom/provenance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-v2-fresh-existing-sbom-${{ github.run_id }}
          path: generated/provider-v2-fresh-existing-sbom/
          if-no-files-found: warn
          retention-days: 30
