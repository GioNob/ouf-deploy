name: Discovery unsigned generation inputs
on:
  push:
    branches: [docs/storage-functional-reset-20261107]
    paths:
      - scripts/prepare-discovery-generation-inputs-20261109.py
      - tests/test_discovery_generation_inputs.py
      - evidence/discovery-successor-boot-bound-operator-20261109.json
      - .github/workflows/discovery-generation-inputs.yml
permissions: {contents: read}
jobs:
  generation-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Stage pinned core
        run: |
          mkdir -p scripts/core
          for name in materialize_southbound_kernel semantic_provider_dns materialize_southbound_lease_refresh semantic_provider_lease_nft semantic_provider_lease_owner semantic_provider_lease_coordination; do
            cp "tools/semantic_cohort_admission/cohort-draft/tools/$name.py" "scripts/core/$name.py"
          done
      - name: Receipt, unsigned selection and create-only publication
        run: python3 -I -B -m unittest discover -s tests -p test_discovery_generation_inputs.py -v
