name: Qualify recovery root image custody
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/prepare-chat-recovery-root-custody.py', 'tests/test_chat_recovery_root_custody.py', '.github/workflows/chat-recovery-root-custody.yml']
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: sudo /usr/bin/python3 -I -S -B tests/test_chat_recovery_root_custody.py
