name: Resolution THS bounded configuration and route snapshot reader
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['scripts/read-resolution-ths-bindings-20261017.py', 'tests/resolution_binding_read/**', '.github/workflows/resolution-ths-binding-read.yml']
permissions: {contents: read}
jobs:
  root-config-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          task_root="/var/lib/ouf-resolution-read-${{ github.run_id }}"
          sudo mkdir -m700 "$task_root"
          sudo cp -R . "$task_root/repository"
          sudo chown -R root:root "$task_root"
          sudo env OUF_TEST_ROOT=/root python3 -I -B -m unittest discover -s "$task_root/repository/tests/resolution_binding_read" -v
