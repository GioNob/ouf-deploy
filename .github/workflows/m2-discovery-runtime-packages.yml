name: M2 exact MCP and Gateway offline packages
on:
  push:
    paths: ['.github/workflows/m2-discovery-runtime-packages.yml']
permissions: {contents: read}
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {module: [mcp, gateway]}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: matrix.module == 'mcp'
        with:
          repository: GioNob/ouf-mcp-server
          ref: 09d1f521703f2e896398c751b41008f22c6dca0d
          path: source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: matrix.module == 'gateway'
        with:
          repository: GioNob/ouf-api-gateway
          ref: 60788cf965334441be0a33c345f5c0bcd66cbdde
          path: source
          persist-credentials: false
      - name: Check immutable clean application source
        env: {MODULE: '${{ matrix.module }}'}
        run: |
          python3 - <<'PY'
          import os,subprocess
          expected={'mcp':'09d1f521703f2e896398c751b41008f22c6dca0d','gateway':'60788cf965334441be0a33c345f5c0bcd66cbdde'}[os.environ['MODULE']]
          assert subprocess.check_output(['git','-C','source','rev-parse','HEAD'],text=True).strip()==expected
          assert not subprocess.check_output(['git','-C','source','status','--porcelain','--untracked-files=all']).strip()
          PY
      - uses: actions/setup-go@v6
        if: matrix.module == 'mcp'
        with: {go-version: '1.26.10', cache-dependency-path: source/go.sum}
      - name: Freeze bases and build exact nonroot MCP candidate
        if: matrix.module == 'mcp'
        run: |
          python3 scripts/package-file-loop-candidate.py build --source source --commit 09d1f521703f2e896398c751b41008f22c6dca0d --module mcp --output package
          test "$(docker image inspect ouf-cohort-mcp:09d1f521703f2e896398c751b41008f22c6dca0d --format '{{.Config.User}}')" = 10005:10005
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -e MCP_DATABASE_URL=unused-for-help ouf-cohort-mcp:09d1f521703f2e896398c751b41008f22c6dca0d server -h
      - name: Stage exact Gateway dependency scan input
        if: matrix.module == 'gateway'
        run: |
          mkdir -p package/gateway-scan
          cp source/requirements-dev.txt package/gateway-scan/requirements.txt
          cmp source/requirements-dev.txt package/gateway-scan/requirements.txt
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        if: matrix.module == 'mcp'
        with:
          image-ref: ouf-cohort-mcp:09d1f521703f2e896398c751b41008f22c6dca0d
          format: json
          output: package/trivy-image.json
          list-all-pkgs: true
          scanners: vuln
          severity: HIGH,CRITICAL,UNKNOWN
          ignore-unfixed: false
          exit-code: 1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        if: matrix.module == 'gateway'
        with:
          scan-type: fs
          scan-ref: package/gateway-scan
          format: json
          output: package/trivy-image.json
          list-all-pkgs: true
          scanners: vuln
          severity: HIGH,CRITICAL,UNKNOWN
          ignore-unfixed: false
          exit-code: 1
      - name: Enforce source and scan coverage before export
        env: {MODULE: '${{ matrix.module }}'}
        run: |
          python3 - <<'PY'
          import json,os,runpy
          from pathlib import Path
          module=os.environ['MODULE']; output=Path('package')
          helpers=runpy.run_path('scripts/package-semantic-proposal-candidate.py',run_name='qualified_scan_primitives')
          scan=json.loads((output/'trivy-image.json').read_text())
          record=json.loads((output/'package-record.json').read_text()) if module=='mcp' else None
          helpers['scan_gate'](scan,module,record['imageId'] if record else None)
          if module=='gateway':
              assert Path(scan['ArtifactName']).resolve()==(output/'gateway-scan').resolve()
              assert (output/'gateway-scan/requirements.txt').read_bytes()==Path('source/requirements-dev.txt').read_bytes()
              assert any(r.get('Type')=='pip' and r.get('Target')=='requirements.txt' and r.get('Packages') for r in scan['Results'])
          PY
      - name: Export MCP archive and static executable
        if: matrix.module == 'mcp'
        run: |
          python3 scripts/package-file-loop-candidate.py export --source source --commit 09d1f521703f2e896398c751b41008f22c6dca0d --module mcp --output package
          go version -m package/ouf-mcp > package/go-build-info.txt
          python3 - <<'PY'
          from pathlib import Path
          info=Path('package/go-build-info.txt').read_text()
          assert all(x in info for x in ('go1.26.10','GOOS=linux','GOARCH=amd64','CGO_ENABLED=0'))
          PY
      - name: Export source-bound Gateway materializers without target defaults
        if: matrix.module == 'gateway'
        run: |
          git -C source archive --format=tar -o "$PWD/package/source.tar" 60788cf965334441be0a33c345f5c0bcd66cbdde
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          source=Path('source'); output=Path('package')
          paths=['tools/materialize_semantic_discovery.py','tools/delegation_functions.py','tools/lua/execute_semantic_discovery.lua']
          paths += ['schemas/mcp-gateway-semantic-discovery-'+op+'-dispatch-v1.json' for op in ('request','status','candidates')]
          inventory={p:hashlib.sha256((source/p).read_bytes()).hexdigest() for p in paths}
          (output/'materializer-inventory.json').write_text(json.dumps(inventory,sort_keys=True,indent=2)+'\n')
          (output/'package-record.json').write_text(json.dumps({'schema':'ouf.m2-discovery-gateway-source-package.v1','module':'gateway','sourceCommit':'60788cf965334441be0a33c345f5c0bcd66cbdde','artifactKind':'SOURCE_AND_MATERIALIZERS_NOT_TARGET_ROUTES','routePackageTargetBound':False,'dependencyScanGate':'PASS_HIGH_CRITICAL_UNKNOWN_INCLUDING_UNFIXED','transitiveRuntimeAdmissionProven':False,'runtimeAuthorityIssued':False,'targetApplyAuthorized':False,'releaseAcceptance':False},sort_keys=True,indent=2)+'\n')
          PY
      - name: Seal every payload hash and provenance boundary
        env: {MODULE: '${{ matrix.module }}', PRODUCER: '${{ github.sha }}'}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path('package')
          record={'schema':'ouf.m2-discovery-offline-package-provenance.v1','module':os.environ['MODULE'],'producerCommit':os.environ['PRODUCER'],'applicationSourceCommit':subprocess.check_output(['git','-C','source','rev-parse','HEAD'],text=True).strip(),'runtimeAuthorityIssued':False,'targetApplyAuthorized':False,'stableCapabilitiesOperationalProven':False,'applicationE2EProven':False,'releaseAcceptance':False}
          (out/'producer.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n')
          paths=sorted(p for p in out.rglob('*') if p.is_file() and p.name!='SHA256SUMS')
          assert all(not p.is_symlink() for p in paths)
          with (out/'SHA256SUMS').open('w') as f:
              for p in paths:
                  h=hashlib.sha256()
                  with p.open('rb') as src:
                      for chunk in iter(lambda:src.read(1048576),b''):h.update(chunk)
                  f.write(h.hexdigest()+'  '+p.relative_to(out).as_posix()+'\n')
          PY
          cd package
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-discovery-${{ matrix.module }}-${{ github.run_id }}
          path: package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: m2-discovery-package-denial-${{ matrix.module }}-${{ github.run_id }}
          path: |
            package/package-record.json
            package/trivy-image.json
            package/Dockerfile.resolved
          retention-days: 30
