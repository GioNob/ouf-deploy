name: Semantic database migration
on: workflow_dispatch
permissions: {}
concurrency:
  group: ouf-vps-privileged-operations
  cancel-in-progress: false

env:
  OPERATION: semantic-database-migration
jobs:
  intent:
    if: ${{ github.ref_protected && github.run_attempt == '1' }}
    runs-on: &vps [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.intent.outputs.digest }}
    steps:
      - id: intent
        shell: bash
        run: |
          /usr/bin/python3 -I - <<'PY'
          import hashlib, json, os
          e = os.environ
          scope = dict(run=e["GITHUB_RUN_ID"], attempt=e["GITHUB_RUN_ATTEMPT"], commit=e["GITHUB_SHA"], operation=e["OPERATION"])
          stamp = hashlib.sha256(json.dumps(scope, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          with open(e["GITHUB_OUTPUT"], "a") as f:
              print("digest=" + stamp, file=f)
          PY

  plan:
    name: plan ${{ needs.intent.outputs.digest }}
    needs: intent
    runs-on: *vps
    permissions: {contents: read, actions: read, deployments: read}
    timeout-minutes: 30
    env:
      PHASE: plan
      DIGEST: ${{ needs.intent.outputs.digest }}
    outputs:
      digest: ${{ steps.call.outputs.digest }}
    steps:
      - &invoke
        id: call
        env:
          REVIEW_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          /usr/bin/python3 -I - <<'PY'
          import json, os, re, subprocess
          e = os.environ
          req = dict(run=e["GITHUB_RUN_ID"], attempt=e["GITHUB_RUN_ATTEMPT"], commit=e["GITHUB_SHA"],
                     operation=e["OPERATION"], phase=e["PHASE"], digest=e["DIGEST"])
          wire = json.dumps({"request": req, "token": e.pop("REVIEW_TOKEN")}).encode()
          out = subprocess.run(["/usr/bin/sudo", "-n", "--", "/usr/local/sbin/ouf-a2"],
                               input=wire, stdout=subprocess.PIPE, check=True)
          result = json.loads(out.stdout)
          stamp = result["digest"]
          if not re.fullmatch("[0-9a-f]{64}", stamp):
              raise SystemExit("Digest esecutore non valido")
          with open(e["GITHUB_STEP_SUMMARY"], "a") as f:
              if req["phase"] == "plan":
                  print(f"Piano `{stamp}` · testa R3 {result['head']} · {len(result['pending'])} pendenti", file=f)
                  for row in result["pending"]:
                      print(f"- `{row['script']}` · CRC32 Flyway `{row['checksum']}`", file=f)
              else:
                  print(f"Storia verificata fino a V{result['lastVersion']} · readiness {result['readiness']} · testa R3 {result['head']}", file=f)
          with open(e["GITHUB_OUTPUT"], "a") as f:
              print("digest=" + stamp, file=f)
          PY

  apply:
    name: apply ${{ needs.plan.outputs.digest }}
    needs: plan
    runs-on: *vps
    environment: ouf-vps-privileged
    permissions: {contents: read, actions: read, deployments: read}
    timeout-minutes: 40
    env:
      PHASE: apply
      DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - *invoke
