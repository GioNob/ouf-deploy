name: Capture and configuration register
on: [pull_request, push]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build age and age-keygen
        shell: bash
        run: |
          go install filippo.io/age/cmd/age@v1.2.1 filippo.io/age/cmd/age-keygen@v1.2.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: python -I -B -m unittest discover -s tests -p "test_configuration_register.py" -v
      - run: python -I -B -m unittest discover -s tests -p "test_capture*.py" -v
        env:
          OUF_REQUIRE_TEST_AGE: '1'
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build age and age-keygen
        shell: bash
        run: |
          go install filippo.io/age/cmd/age@v1.2.1 filippo.io/age/cmd/age-keygen@v1.2.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: python -I -B -m unittest discover -s tests -p "test_configuration_register.py" -v
      - run: python -I -B -m unittest discover -s tests -p "test_capture*.py" -v
        env:
          OUF_REQUIRE_TEST_AGE: '1'
