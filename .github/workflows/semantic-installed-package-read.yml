name: Semantic installed package read
on:
  pull_request:
    paths:
      - scripts/read-semantic-installed-package-20261108.py
      - tests/test_semantic_installed_package_read.py
      - .github/workflows/semantic-installed-package-read.yml
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -I -B tests/test_semantic_installed_package_read.py
