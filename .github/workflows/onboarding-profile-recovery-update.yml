name: Onboarding V36 reviewed migration and same-job preservation
on:
  push:
    paths: ['tools/onboarding_profile_recovery_update/**','scripts/apply-onboarding-profile-recovery-update-20261027.py','tests/*profile_recovery_update*','tests/fixtures/profile-recovery-v36.sql','tests/fixtures/profile_recovery_update_terminal_probe.py','.github/workflows/onboarding-profile-recovery-update.yml','releases/onboarding-profile-recovery-migration-fence-20261027.json']
  pull_request:
    paths: ['tools/onboarding_profile_recovery_update/**','scripts/apply-onboarding-profile-recovery-update-20261027.py','tests/*profile_recovery_update*','tests/fixtures/profile-recovery-v36.sql','tests/fixtures/profile_recovery_update_terminal_probe.py','.github/workflows/onboarding-profile-recovery-update.yml','releases/onboarding-profile-recovery-migration-fence-20261027.json']
permissions: {contents: read}
jobs:
  root-crypto-and-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          sudo install -d -m 700 /var/lib/ouf-onboarding-update-protocol-ci
          sudo env OUF_ONBOARDING_UPDATE_TEST_ROOT=/var/lib/ouf-onboarding-update-protocol-ci python3 -B -m unittest discover -s tests -p test_onboarding_profile_recovery_update_protocol.py -v
          python3 -B -m unittest discover -s tests -p test_retained_mac_transition.py -v
          python3 -B -m unittest discover -s tests -p test_profile_recovery_update_state_fence.py -v
  new-executor-native-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        store: [containerd]
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Reuse exact historical Docker29.8.1 in isolated hosted data root
        env: {SELECTED_STORE: '${{ matrix.store }}'}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz -o /tmp/ouf-docker-29.8.1.tgz
          printf '%s  %s\n' d8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70 /tmp/ouf-docker-29.8.1.tgz | sha256sum --check -
          sudo install -d -m 755 /opt/ouf-docker-29
          sudo tar -xzf /tmp/ouf-docker-29.8.1.tgz --strip-components=1 -C /opt/ouf-docker-29
          sudo chown -R root:root /opt/ouf-docker-29
          sudo systemctl stop docker.service docker.socket
          sudo systemctl start containerd.service
          sudo install -d -m 700 /var/lib/ouf-docker-29
          python3 - <<'PY_CONFIG'
          import json,os
          from pathlib import Path
          Path('/tmp/ouf-docker-29.json').write_text(json.dumps({'features':{'containerd-snapshotter':os.environ['SELECTED_STORE']=='containerd'},'exec-opts':['native.cgroupdriver=systemd']}))
          PY_CONFIG
          sudo systemd-run --unit=ouf-docker-mac-daemon --property=Restart=no \
            --setenv=PATH=/opt/ouf-docker-29:/usr/sbin:/usr/bin:/sbin:/bin \
            /opt/ouf-docker-29/dockerd --config-file=/tmp/ouf-docker-29.json \
            --host=unix:///var/run/docker.sock --data-root=/var/lib/ouf-docker-29 \
            --exec-root=/run/docker --pidfile=/run/ouf-docker-29.pid \
            --containerd=/run/containerd/containerd.sock
          for OUF_MAC_ENGINE_POLL in $(seq 1 60); do
            if sudo docker info > /tmp/ouf-docker-29-info.txt 2>/dev/null; then break; fi
            sleep 1
          done
          test "$(sudo docker version --format '{{.Server.Version}}')" = 29.8.1
      - name: Actual kernel PID1 peer in disposable Unix socket fixture
        run: |
          sudo docker run --rm --network none --user 0:0 \
            --mount type=bind,source="$PWD",target=/src,readonly \
            --entrypoint python python:3.12-alpine \
            -I -S -B /src/tests/qualify_onboarding_pid1_peer.py
      - name: Exact new signed controller and actual watchdog loss on synthetic ONBOARDING workloads
        env: {EXPECTED_STORE: '${{ matrix.store }}'}
        run: |
          sudo install -d -m 700 /var/lib/ouf-onboarding-update-native-ci
          sudo env OUF_ONBOARDING_UPDATE_TEST_ROOT=/var/lib/ouf-onboarding-update-native-ci EXPECTED_STORE="$EXPECTED_STORE" python3 -I -S -B tests/qualify_onboarding_profile_recovery_update_engine.py
  actual-new-review-sudo-terminal:
    strategy:
      fail-fast: false
      matrix:
        sudo_pty: [use_pty, '!use_pty']
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: {CI_SUDO_PTY: '${{ matrix.sudo_pty }}'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Configure isolated CI sudo transport variant
        env:
          CI_SUDO_PTY: ${{ matrix.sudo_pty }}
        run: |
          sudo /usr/bin/python3 -I -S -B - "$(id -un)" "$CI_SUDO_PTY" <<'PY'
          import os,re,sys
          user,mode=sys.argv[1:]
          assert re.fullmatch('[a-z_][a-z0-9_-]*',user) and mode in ('use_pty','!use_pty')
          fd=os.open('/etc/sudoers.d/ouf-ci-terminal-test',os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o440)
          os.fchmod(fd,0o440)
          with os.fdopen(fd,'w') as out:
              out.write('Defaults:'+user+' '+mode+'\n');out.flush();os.fsync(out.fileno())
          PY
      - name: Exact new ONBOARDING prompt/logger with synthetic review and real canonical line editing
        run: python3 -I -S -B tests/qualify_profile_recovery_update_terminal_pipeline.py

  exact-v36-application-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact immutable image data, curl only and finite transfer
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,time
          from pathlib import Path
          case=json.loads(Path('releases/onboarding-profile-recovery-image-custody-20261027.json').read_text());started=time.monotonic();digest=hashlib.sha256();size=0
          with open('candidate.zip','xb')as out:
              for part in case['parts']:
                  assert time.monotonic()-started<600
                  url='https://raw.githubusercontent.com/GioNob/ouf-source-onboarding/'+case['deliveryCommit']+'/image/'+part['name']
                  subprocess.run(['curl','--fail','--silent','--show-error','--location','--proto','=https','--proto-redir','=https','--max-redirs','3','--connect-timeout','15','--max-time','120','--max-filesize',str(part['bytes']),url,'-o',part['name']],check=True,timeout=125)
                  raw=Path(part['name']).read_bytes();assert len(raw)==part['bytes'] and hashlib.sha256(raw).hexdigest()==part['sha256'];out.write(raw);digest.update(raw);size+=len(raw)
          assert size==case['artifactZipBytes']and digest.hexdigest()==case['artifactZipSha256']
          PY
      - name: Seal disposable root fixture, never target paths
        run: |
          sudo install -d -m 0700 /root/ouf-profile-image-plan-repo
          sudo cp -a . /root/ouf-profile-image-plan-repo/repo
          sudo chown -R root:root /root/ouf-profile-image-plan-repo
          sudo chmod -R go-w /root/ouf-profile-image-plan-repo
          sudo chmod 0400 /root/ouf-profile-image-plan-repo/repo/candidate.zip
      - name: Exact archive and native plan with zero runtime I/O
        run: sudo /usr/bin/python3 -I -S -B /root/ouf-profile-image-plan-repo/repo/tests/qualify_profile_recovery_update_real_image.py

