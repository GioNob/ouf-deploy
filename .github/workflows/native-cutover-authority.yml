name: Native cutover HUMAN scope and existing Ed25519 verifier
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-cutover-authority.yml
      - tools/semantic_application_cutover/**
      - tools/semantic_frame_compiler/compile_file_only_frame_policy.py
      - tests/test_file_only_*.py
      - tests/test_file_only_cutover.py
      - tests/test_cutover_executor.py
      - tests/test_semantic_transition_journal.py
      - tests/test_core_adapter_factory.py
      - tests/test_cutover_authority_native.py
      - scripts/read-native-v11-transition-preflight.py
      - releases/native-v11-transition-preflight-20261011.sh
      - tests/test_transition_preflight*.py
  pull_request:
    paths:
      - .github/workflows/native-cutover-authority.yml
      - tools/semantic_application_cutover/**
      - tools/semantic_frame_compiler/compile_file_only_frame_policy.py
      - tests/test_file_only_*.py
      - tests/test_file_only_cutover.py
      - tests/test_cutover_authority_native.py
      - tests/test_cutover_executor.py
      - tests/test_semantic_transition_journal.py
      - tests/test_core_adapter_factory.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Root-owned disposable fixture; no target keys or authority
        run: |
          set -euo pipefail
          OUF_AUTH_ROOT="/var/lib/ouf-cutover-auth-fixture-${GITHUB_RUN_ID}"
          sudo install -d -m 700 "$OUF_AUTH_ROOT"
          sudo cp -a "$GITHUB_WORKSPACE/." "$OUF_AUTH_ROOT/"
          sudo chown -R 0:0 "$OUF_AUTH_ROOT"
          cd "$OUF_AUTH_ROOT"
          sudo python3 -I -B -m unittest discover -s tests -p test_cutover_authority_native.py -v
          sudo python3 -I -B -m unittest discover -s tests -p test_file_only_cutover.py -v
          sudo python3 -I -B -m unittest discover -s tests -p test_file_only_application_owners.py -v
          sudo python3 -I -B -m unittest discover -s tests -p test_file_only_frame_compiler.py -v
          sudo python3 -I -B -m unittest discover -s tests -p test_migration_admission_adapter.py -v
          sudo python3 -I -B -m unittest discover -s tests -p test_cutover_executor.py -v
          sudo python3 -I -B -m unittest discover -s tests -p test_semantic_transition_journal.py -v
          sudo python3 -I -B -m unittest discover -s tests -p test_core_adapter_factory.py -v
          sudo python3 -m unittest discover -s tests -p 'test_transition_preflight*.py' -v

