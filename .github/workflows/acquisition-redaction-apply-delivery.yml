name: Two READ redaction actual sealed APPLY delivery
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths: ['releases/apply-acquisition-redaction-update-20261026.sh','tests/qualify_acquisition_redaction_update_delivery.py','.github/workflows/acquisition-redaction-apply-delivery.yml']
  pull_request:
    paths: ['releases/apply-acquisition-redaction-update-20261026.sh','tests/qualify_acquisition_redaction_update_delivery.py','.github/workflows/acquisition-redaction-apply-delivery.yml']
permissions: {contents: read}
jobs:
  actual-sealed-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Actual HTTPS wrapper root copier and protected foreground main, no approval or Engine
        run: |
          set -Eeuo pipefail
          bash -n releases/apply-acquisition-redaction-update-20261026.sh
          sudo python3 -I -S -B tests/qualify_acquisition_redaction_update_delivery.py
