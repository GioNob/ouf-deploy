name: Registry post-network original GET
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths:
      - scripts/probe-registry-post-network-get-20261024.py
      - tools/semantic_registry_recovery_execution/tests/test_post_network_get.py
      - .github/workflows/registry-post-network-get.yml
  pull_request:
    paths:
      - scripts/probe-registry-post-network-get-20261024.py
      - tools/semantic_registry_recovery_execution/tests/test_post_network_get.py
      - .github/workflows/registry-post-network-get.yml
permissions:
  contents: read
concurrency:
  group: registry-post-network-get-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  signed-receipt-and-native-get:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Root-custodied disposable fixture
        run: |
          sudo install -d -m 0700 /root/ouf-post-network-get-tests
          sudo cp -a . /root/ouf-post-network-get-tests/repository
          sudo chown -R root:root /root/ouf-post-network-get-tests
      - name: Actual signatures, fresh claims and namespace TLS GET
        run: |
          sudo env OUF_NATIVE_POST_NETWORK_GET=1 /usr/bin/python3 -I -B -S -m unittest discover \
            -s /root/ouf-post-network-get-tests/repository/tools/semantic_registry_recovery_execution/tests \
            -p 'test_post_network_get.py' -v
