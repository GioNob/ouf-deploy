name: Teatri eight-attempt policy restoration qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['tools/teatri_policy_restore/**', 'scripts/execute-teatri-policy-restore-20261017.py', 'tests/test_teatri_policy_restore*.py', '.github/workflows/teatri-policy-restoration.yml']
permissions: {contents: read}
jobs:
  real-signatures-fence-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Native root group and isolated complete graph
        run: |
          if ! getent group 10001 >/dev/null; then sudo groupadd --gid 10001 ouf-policy-fixture; fi
          sudo cp -a "$GITHUB_WORKSPACE" /root/ouf-policy-restore-fixture
          sudo chown -R root:root /root/ouf-policy-restore-fixture
          sudo bash -c "cd /root/ouf-policy-restore-fixture && OUF_NATIVE_UIDS=1 python3 -B -m unittest discover -s tests -p 'test_teatri_policy_restore*.py' -v"
