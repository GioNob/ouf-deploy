name: Storage host reviewed continuation
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - scripts/continue-storage-host-containment-20261106.py
      - tests/qualify_storage_host_continuation_native.py
      - tests/fixtures/storage_host_containment_legacy.py
      - .github/workflows/storage-host-continuation.yml
permissions:
  contents: read
concurrency:
  group: storage-host-continuation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reproduce exact hold and qualify bounded linked continuation
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -I -B -S tests/qualify_storage_host_continuation_native.py
