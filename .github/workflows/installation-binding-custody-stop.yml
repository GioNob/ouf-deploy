name: Binding custody STOP pure reconciliation
on:
  push:
    paths:
      - 'scripts/read-installation-binding-custody-stop.py'
      - 'scripts/read-installation-binding-continuation-readiness.py'
      - 'tools/installation_binding_apply/native.py'
      - 'tests/test_installation_binding_custody_fix.py'
      - 'tests/test_installation_binding_custody_stop.py'
      - 'tests/fixtures/installation-binding-custody-gateway.py'
      - '.github/workflows/installation-binding-custody-stop.yml'
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Actual approved non-root ancestor custody and pure durable STOP read
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-binding-custody-read-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          failed=0
          for suite in test_installation_binding_custody_stop.py test_installation_binding_custody_fix.py; do
            if ! sudo env OUF_NATIVE_UIDS=1 python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p "$suite" -v; then failed=1; fi
          done
          exit "$failed"
