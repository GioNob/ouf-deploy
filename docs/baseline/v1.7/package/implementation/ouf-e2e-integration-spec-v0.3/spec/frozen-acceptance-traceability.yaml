  suite: E2E-X01..X16
  coverage: OUF-E2E-001..016
- source: MCP Server v1.1
  suite: MCP-A including A53..A55
  coverage: OUF-E2E-008..016, 021..025 + module MCP acceptance
- source: Onboarding/THS v1.4+
  suite: THS-A including A12
