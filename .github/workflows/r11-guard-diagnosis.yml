name: Read-only R11 guard diagnosis qualification
on:
  push:
    branches: [main]
    paths: ['scripts/*r11-guard*', 'tests/test_r11_guard_diagnosis.py', '.github/workflows/r11-guard-diagnosis.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -v -s tests -p test_r11_guard_diagnosis.py
      - run: sudo /usr/bin/python3 -I -B scripts/test-r11-guard-capability-native.py
