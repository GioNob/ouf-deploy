name: M2 running Registry admission protocol
on:
  push:
    paths: ['tools/m2_discovery_installation_profile/running_admission.py','tools/m2_discovery_installation_profile/current_cohort.py','tools/m2_discovery_installation_profile/current_worker.py','tools/m2_discovery_installation_profile/current_databases.py','tests/test_m2_discovery_running_admission.py','tests/test_m2_discovery_current_cohort.py','tests/test_m2_discovery_current_worker.py','tests/test_m2_discovery_current_databases.py','tests/qualify_m2_discovery_current_databases_native.py','.github/workflows/m2-discovery-running-admission.yml']
  pull_request:
    paths: ['tools/m2_discovery_installation_profile/running_admission.py','tools/m2_discovery_installation_profile/current_cohort.py','tools/m2_discovery_installation_profile/current_worker.py','tools/m2_discovery_installation_profile/current_databases.py','tests/test_m2_discovery_running_admission.py','tests/test_m2_discovery_current_cohort.py','tests/test_m2_discovery_current_worker.py','tests/test_m2_discovery_current_databases.py','tests/qualify_m2_discovery_current_databases_native.py','.github/workflows/m2-discovery-running-admission.yml']
permissions: {contents: read}
jobs:
  running-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Actual root custody, signatures and Unix peer with explicit process and mount fixtures
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-running-admission-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          for suite in test_m2_discovery_running_admission.py test_m2_discovery_current_cohort.py test_m2_discovery_current_worker.py test_m2_discovery_current_databases.py test_m2_discovery_frame_observation.py test_m2_discovery_node_owner.py; do
            sudo env PATH=/usr/sbin:/usr/bin:/sbin:/bin python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p "$suite" -v
          done
  native-databases:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Native disposable PostgreSQL identities and read-only migration histories
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-current-db-native-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env PATH=/usr/sbin:/usr/bin:/sbin:/bin python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p qualify_m2_discovery_current_databases_native.py -v
