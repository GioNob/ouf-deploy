name: Native finite lease integer readback margin investigation
on:
  push:
    branches: [main]
    paths:
      - tools/semantic_lease_recovery/readback_margin_compiler.py
      - tools/semantic_lease_recovery/test_readback_margin_compiler.py
      - tools/semantic_lease_recovery/readback_margin_native.py
      - .github/workflows/finite-lease-readback-margin.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-api-gateway
          ref: a10df126d229dfefd9e0a4d716a07f1f535b6cd6
          path: lease-owner-source
          persist-credentials: false
      - name: Candidate arithmetic and denial scope
        run: python3 -B -m unittest discover -v -s tools/semantic_lease_recovery -p test_readback_margin_compiler.py
      - name: Install disposable native dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2
      - name: Native zero reproduction strict backend and candidate admission margin
        run: sudo unshare --net /usr/bin/python3 -B tools/semantic_lease_recovery/readback_margin_native.py lease-owner-source
