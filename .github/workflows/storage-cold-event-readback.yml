name: Storage cold event retained readback
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - scripts/read-storage-cold-event-held-20261107.py
      - tests/test_storage_cold_event_readback.py
      - .github/workflows/storage-cold-event-readback.yml
permissions:
  contents: read
concurrency:
  group: storage-cold-event-readback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retained-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare root-owned synthetic fixture sources
        run: |
          sudo install -d -m 700 /var/lib/ouf-event-readback-ci/repo/scripts /var/lib/ouf-event-readback-ci/repo/tests /var/lib/ouf-event-readback-ci/repo/tools/storage_planning
          for source in scripts/read-storage-cold-event-held-20261107.py scripts/storage-test-cold-stop.py scripts/storage-host-bound-cold-backup-20261107.py scripts/storage-cold-backup.py tests/test_storage_cold_event_readback.py tests/test_storage_test_cold_stop.py tests/test_storage_cold_stop_proposal.py tools/storage_planning/cold_stop_proposal.py; do
            sudo install -m 600 "$source" "/var/lib/ouf-event-readback-ci/repo/$source"
          done
      - name: Retained journal binding, redaction and preservation
        run: sudo -n python3 -I -B -S -m unittest discover -s /var/lib/ouf-event-readback-ci/repo/tests -p test_storage_cold_event_readback.py -v
