name: Teatri post Resolution materialization read-only qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['scripts/read-teatri-post-resolution-materialization-20261017.py', 'tests/teatri_post_resolution_read/**', '.github/workflows/teatri-post-resolution-materialization-read.yml']
permissions: {contents: read}
jobs:
  readonly-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Actual PostgreSQL17 confirmed and materialized counterexamples
        run: OUF_NATIVE_SQL=1 python3 -I -B -m unittest discover -s tests/teatri_post_resolution_read -v
