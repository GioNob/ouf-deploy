name: Unsigned MCP semantic reprocessing package
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths:
      - .github/workflows/semantic-reprocessing-package.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  one-component-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: deploy, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-mcp-server
          ref: f00e7e3bfcaee9272b9b6d204a7fa3ea79a563a4
          path: source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-mcp-server
          ref: f249b3dcc58c2a96742092d90fa09fd90b705bd0
          path: baseline
          persist-credentials: false
      - name: Preserve all twelve installed migration sources
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json
          before=Path('baseline/internal/adapter/postgres/migrations')
          after=Path('source/internal/adapter/postgres/migrations')
          old=sorted(before.glob('*.sql'));new=sorted(after.glob('*.sql'))
          assert len(old)==12 and len(new)==13
          rows=[]
          for oldfile,newfile in zip(old,new):
              assert oldfile.name==newfile.name and oldfile.read_bytes()==newfile.read_bytes()
              rows.append({'version':int(oldfile.name[:3]),'checksum':hashlib.sha256(oldfile.read_bytes()).hexdigest()})
          assert new[-1].name=='013_semantic_reprocessing_session.sql'
          rows.append({'version':13,'checksum':hashlib.sha256(new[-1].read_bytes()).hexdigest()})
          Path('migration-continuity.json').write_text(json.dumps({'schema':'ouf.mcp-reprocessing-migration-continuity.v1','before':rows[:12],'candidate':rows,'historicalSourcesUnchanged':True,'targetApplyAuthorized':False},sort_keys=True,indent=2)+'\n')
          PYCODE
      - name: Freeze external bases and build one unsigned MCP candidate
        run: >-
          python3 deploy/scripts/package-file-loop-candidate.py build
          --source source --commit f00e7e3bfcaee9272b9b6d204a7fa3ea79a563a4
          --module mcp --output package
      - name: Scan exact candidate including unfixed vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ouf-cohort-mcp:f00e7e3bfcaee9272b9b6d204a7fa3ea79a563a4
          format: json
          output: package/trivy-image.json
          severity: HIGH,CRITICAL,UNKNOWN
          ignore-unfixed: false
          exit-code: 1
      - name: Export candidate and independently verify archive checksums
        run: |
          python3 deploy/scripts/package-file-loop-candidate.py export --source source --commit f00e7e3bfcaee9272b9b6d204a7fa3ea79a563a4 --module mcp --output package
          cd package
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-reprocessing-unsigned-mcp-${{ github.run_id }}
          path: |
            package/
            migration-continuity.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain bounded build or scan denial evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-reprocessing-package-denial-${{ github.run_id }}
          path: |
            package/package-record.json
            package/Dockerfile.resolved
            package/trivy-image.json
            migration-continuity.json
          if-no-files-found: warn
          retention-days: 30
