name: M2 sealed infrastructure review fragment
on:
  push:
    paths: ['tools/m2_discovery_installation_profile/**','scripts/export-m2-discovery-infrastructure-review.py','tests/test_m2_discovery_infrastructure_review.py','.github/workflows/m2-discovery-infrastructure-review.yml']
  pull_request:
    paths: ['tools/m2_discovery_installation_profile/**','scripts/export-m2-discovery-infrastructure-review.py','tests/test_m2_discovery_infrastructure_review.py','.github/workflows/m2-discovery-infrastructure-review.yml']
permissions: {contents: read}
jobs:
  infrastructure-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact parent components and create-only isolated private preparation
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-infrastructure-review-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env OUF_NATIVE_UIDS=1 OUF_NATIVE_SOCKETS=1 PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            python3 -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_m2_discovery_infrastructure_review.py -v
          sudo python3 -I -B -S "$fixture/repository/scripts/export-m2-discovery-infrastructure-review.py" \
            --root "$fixture/repository" --source-revision "$GITHUB_SHA" \
            --output "$GITHUB_WORKSPACE/infrastructure-review-compiler.py" > infrastructure-review-compiler.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infrastructure-review-compiler
          path: |
            infrastructure-review-compiler.py
            infrastructure-review-compiler.json
          if-no-files-found: error
