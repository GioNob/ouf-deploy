name: Direct GitHub redaction diagnostic artifact transport
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths: ['scripts/transport-acquisition-redaction-artifacts-20261026.py','tests/test_acquisition_redaction_artifact_transport.py','.github/workflows/acquisition-redaction-artifact-transport.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: ouf-acquisition-redaction-artifact-transport-5ab4bafadb29cdd5
  cancel-in-progress: false
jobs:
  qualify-direct-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Prove closed redirect, credential isolation, integrity and no replay
        run: python3 -B -m unittest discover -s tests -p test_acquisition_redaction_artifact_transport.py -v
      - name: Qualify actual direct GitHub transfer of both exact new ZIPs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          python3 -I -S -B scripts/transport-acquisition-redaction-artifacts-20261026.py releases/acquisition-redaction-artifact-case-20261026.json "$parent" | tee acquisition-transport-qualified.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'acquisition-redaction-transport-ci-${{ github.run_id }}', path: acquisition-transport-qualified.json, retention-days: 30}
  existing-runner-download-only:
    needs: qualify-direct-transport
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Download and checksum only, no sudo or OUF runtime access
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          python3 -I -S -B scripts/transport-acquisition-redaction-artifacts-20261026.py releases/acquisition-redaction-artifact-case-20261026.json "$parent" | tee acquisition-transport-existing-runner.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'acquisition-redaction-transport-existing-runner-${{ github.run_id }}', path: acquisition-transport-existing-runner.json, retention-days: 30}

