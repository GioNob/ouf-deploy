name: OUF policy-token online IAM and installed owner qualification
on:
  push:
    paths: [tools/semantic_policy_token_owner/**, tests/test_iam_token_admission.py, tests/test_installed_token_owner.py, .github/workflows/policy-token-iam-owner.yml]
  pull_request:
    paths: [tools/semantic_policy_token_owner/**, tests/test_iam_token_admission.py, tests/test_installed_token_owner.py, .github/workflows/policy-token-iam-owner.yml]
permissions: {contents: read}
jobs:
  native-root-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Prepare disposable root fixture
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-online-iam-owner-${GITHUB_RUN_ID}"
          sudo mkdir -m 700 "$OUF_FIXTURE_ROOT"
          sudo cp -R . "$OUF_FIXTURE_ROOT/repository"
          sudo chown -R root:root "$OUF_FIXTURE_ROOT"
      - name: Actual TLS/peer, root custody, role signatures and persistent admission fencing
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-online-iam-owner-${GITHUB_RUN_ID}"
          sudo env OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_iam_token_admission.py -v
          sudo env OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_installed_token_owner.py -v
      - name: Existing source-stage and finite worker regressions
        run: |
          set -euo pipefail
          OUF_FIXTURE_ROOT="/var/lib/ouf-online-iam-owner-${GITHUB_RUN_ID}"
          sudo python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_token_source_stage.py -v
          sudo env OUF_NATIVE_UIDS=1 python3 -I -B -m unittest discover -s "$OUF_FIXTURE_ROOT/repository/tests" -p test_policy_token_owner.py -v
