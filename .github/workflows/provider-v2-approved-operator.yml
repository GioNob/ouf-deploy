name: Approved provider operator bridge
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_target_review/execute_approved_provider_transaction.py'
      - 'tools/semantic_target_review/test_execute_approved_provider_transaction.py'
      - '.github/workflows/provider-v2-approved-operator.yml'
permissions:
  contents: read
jobs:
  approved-operator-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact human scope, freshness boundary and actual issuer preflight
        run: |
          sudo install -d -m 0700 /root/ouf-transaction-ci
          sudo env OUF_TRANSACTION_TEST_ROOT=/root/ouf-transaction-ci /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_target_review -p test_execute_approved_provider_transaction.py
