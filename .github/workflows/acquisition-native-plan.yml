name: Acquisition read native plan preparation
on:
  push:
    branches: [fix/registry-bound-owner-lineage-20261023]
    paths: ['scripts/prepare-acquisition-read-native-plan-20261025.py','tests/test_acquisition_native_plan.py','.github/workflows/acquisition-native-plan.yml']
  pull_request:
    paths: ['scripts/prepare-acquisition-read-native-plan-20261025.py','tests/test_acquisition_native_plan.py','.github/workflows/acquisition-native-plan.yml']
permissions: {contents: read}
jobs:
  isolated-root-plan-and-namespace-get:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-api-gateway
          ref: efe71dd9bef9d5ee70c0ef2acb11ea4169649baa
          path: .pairwise/gateway
          persist-credentials: false
      - name: Root custody, exact proposal preservation and one real namespace GET
        run: |
          sudo install -d -m 700 /var/lib/ouf-acquisition-plan-ci
          sudo env OUF_CAPTURE_TEST_PARENT=/var/lib/ouf-acquisition-plan-ci OUF_NATIVE_NAMESPACE_FIXTURE=1 OUF_GATEWAY_QUALIFIED_SOURCE="$PWD/.pairwise/gateway" python3 -I -S -B -m unittest discover -s "$PWD/tests" -p test_acquisition_native_plan.py -v
