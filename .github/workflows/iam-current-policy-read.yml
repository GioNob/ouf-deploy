name: Existing IAM session read-only API qualification
on:
  pull_request:
    paths:
      - 'tools/ingestion_rollout_preparation/iam_policy_read.py'
      - 'tools/ingestion_rollout_preparation/iam_policy_delivery.py'
      - 'tests/test_iam_policy_read.py'
      - 'releases/iam-current-policy-read-case-20261020.json'
      - 'scripts/iam-current-policy-read-20261020.py'
      - 'scripts/launch-iam-current-policy-read-20261020.sh'
      - '.github/workflows/iam-current-policy-read.yml'
permissions: {contents: read}
jobs:
  existing-admin-api-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Real Docker archives and isolated network namespace API reads
        run: |
          set -euo pipefail
          docker info > /dev/null
          fixture="/var/lib/ouf-iam-api-read-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env GITHUB_ACTIONS=true OUF_TEST_ROOT="$fixture" "$pythonLocation/bin/python3" -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_iam_policy_read.py -v
