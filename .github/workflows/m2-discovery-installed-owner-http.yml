name: M2 installed Ingestion to Onboarding HTTP contract
on:
  push:
    paths: ['.github/workflows/m2-discovery-installed-owner-http.yml','tests/fixtures/installed-ingestion-owner/**']
  pull_request:
    paths: ['.github/workflows/m2-discovery-installed-owner-http.yml','tests/fixtures/installed-ingestion-owner/**']
permissions: {contents: read}
jobs:
  joined-installed-owner-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: ouf_onboarding, POSTGRES_USER: ouf_onboarding, POSTGRES_PASSWORD: ci-only-password}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ouf_onboarding -d ouf_onboarding"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OUF_ONB_DB_URL: jdbc:postgresql://127.0.0.1:5432/ouf_onboarding
      OUF_ONB_DB_USER: ouf_onboarding
      OUF_ONB_DB_PASSWORD: ci-only-password
      MAVEN_OPTS: -Dmaven.wagon.http.connectionTimeout=10000 -Dmaven.wagon.http.readTimeout=30000 -Djava.net.preferIPv4Stack=true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-source-onboarding
          ref: 9d19fad3dd750dd5b9e77253d3e7e82029c1aca7
          path: .installed-owner
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GioNob/ouf-ingestion-runtime
          ref: 4165b9e149be467d5d7c6bed35e4e1af4e249db1
          path: .installed-ingestion
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Require exact installed source pins and retained image lineage
        run: |
          set -euo pipefail
          test "$(git -C .installed-owner rev-parse HEAD)" = 9d19fad3dd750dd5b9e77253d3e7e82029c1aca7
          test "$(git -C .installed-ingestion rev-parse HEAD)" = 4165b9e149be467d5d7c6bed35e4e1af4e249db1
          python3 -I -B -S - <<'PY'
          import ast,json,pathlib
          owner=json.loads(pathlib.Path('evidence/managed-file-owner-v38-update-target-20261028.json').read_text())['result']
          assert owner['sourceCommit']=='9d19fad3dd750dd5b9e77253d3e7e82029c1aca7'
          assert owner['nativeImageId']=='sha256:7b9d3e918beea500929cb9e3e88165b6c574cedac6067e56206fb2ffa1d65b51'
          tree=ast.parse(pathlib.Path('scripts/prepare-ingestion-native-archive-20261022.py').read_text())
          case=ast.literal_eval(next(n.value for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='CASE' for t in n.targets)))
          retained=json.loads(pathlib.Path('evidence/ingestion-native-archive-completed-target-20261022.json').read_text())['result']
          assert case['sourceCommit']=='4165b9e149be467d5d7c6bed35e4e1af4e249db1'
          assert case['nativeImageId']==retained['nativeImageId']=='sha256:d173aa8beeb9a1ac29c35a163e254a902e95fedad2871e328886a41831c10697'
          assert case['configurationImageId']==retained['configurationImageId']=='sha256:76c38ddfc886b9e004064fd19bcfe561ce5b8459de241c625765afab5a7260bc'
          print('EXACT_INSTALLED_CLIENT_AND_SERVER_SOURCE_LINEAGE_MATCH')
          PY
      - name: Compile unmodified installed Ingestion production classes
        working-directory: .installed-ingestion
        run: |
          set -euo pipefail
          bash scripts/install-authorization-sdk.sh
          timeout --signal=TERM --kill-after=30s 10m mvn -B -ntp -DskipTests compile
          jar --create --file target/installed-client-classes.jar -C target/classes it/comune/trieste/ouf/ingestion
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile=target/installed-client-classes.jar -DgroupId=it.comune.trieste.ouf.ci \
            -DartifactId=installed-ingestion-contract-client -Dversion=4165b9e149be467d5d7c6bed35e4e1af4e249db1 -Dpackaging=jar -DgeneratePom=true
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Add an isolated test dependency and joined HTTP fixture only
        run: |
          set -euo pipefail
          python3 -I -B -S - <<'PY'
          import pathlib,shutil,xml.etree.ElementTree as xml
          root=pathlib.Path('.installed-owner');p=root/'pom.xml';tree=xml.parse(p);ns='http://maven.apache.org/POM/4.0.0'
          xml.register_namespace('',ns);dependencies=tree.getroot().find('{'+ns+'}dependencies');assert dependencies is not None
          d=xml.SubElement(dependencies,'{'+ns+'}dependency')
          for k,v in {'groupId':'it.comune.trieste.ouf.ci','artifactId':'installed-ingestion-contract-client',
              'version':'4165b9e149be467d5d7c6bed35e4e1af4e249db1','scope':'test'}.items():xml.SubElement(d,'{'+ns+'}'+k).text=v
          tree.write(p,encoding='utf-8',xml_declaration=True)
          target=root/'src/test/java/it/comune/trieste/ouf/onboarding/InstalledIngestionOwnerHttpTest.java'
          assert not target.exists();shutil.copyfile('tests/fixtures/installed-ingestion-owner/InstalledIngestionOwnerHttpTest.java',target)
          PY
          test -z "$(git -C .installed-owner diff --name-only -- src/main authorization-sdk)"
      - name: Actual TCP client, security bridge, constrained owner policy and PostgreSQL
        working-directory: .installed-owner
        run: |
          set -euo pipefail
          sh scripts/verify-contract-freeze.sh
          bash scripts/install-authorization-sdk.sh
          timeout --signal=TERM --kill-after=30s 12m mvn -B -ntp -Dtest=InstalledIngestionOwnerHttpTest test
      - name: Require three real joined cases with no failures or skips
        run: |
          python3 -I -B -S - <<'PY'
          import json,pathlib,xml.etree.ElementTree as xml
          reports=list(pathlib.Path('.installed-owner/target/surefire-reports').glob('TEST-*.xml'));assert len(reports)==1
          r=xml.parse(reports[0]).getroot();assert r.attrib['name'].endswith('.InstalledIngestionOwnerHttpTest')
          counts={k:int(r.attrib.get(k,0)) for k in ('tests','failures','errors','skipped')}
          assert counts=={'tests':3,'failures':0,'errors':0,'skipped':0}
          print(json.dumps({'schema':'ouf.installed-ingestion-owner-http-ci.v1','onboardingSource':'9d19fad3dd750dd5b9e77253d3e7e82029c1aca7',
              'ingestionSource':'4165b9e149be467d5d7c6bed35e4e1af4e249db1','counts':counts,'actualClientAndOwnerTcpJoined':True,
              'actualOwnerPolicyAuditAndPostgres':True,'jwtDecoderCryptographyModeled':True,'gatewayAndRealIamProven':False,
              'sourceActivationDispatched':False,'currentTargetAdmissionProven':False,'applicationE2EProven':False},sort_keys=True))
          PY
