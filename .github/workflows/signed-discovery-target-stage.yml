name: OUF signed discovery target stage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/signed-discovery-target-stage.yml, scripts/stage-signed-discovery.py]
permissions:
  contents: read
concurrency:
  group: ouf-discovery-release
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-semantic-registry
          ref: 84e91e199892bfda1d116a49f53a9990f61724c7
          path: verification-source
          persist-credentials: false
      - name: Verify signed exact source archives without importing images
        run: python3 scripts/stage-signed-discovery.py
