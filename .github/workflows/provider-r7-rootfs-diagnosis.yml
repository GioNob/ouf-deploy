name: R7 read-only rootfs diagnosis
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_target_review/read_r7_rootfs_differences.py'
      - 'tools/semantic_target_review/test_r7_rootfs*.py'
      - 'releases/PROVIDER_R7_ROOTFS_DIAGNOSIS_20261009.md'
      - '.github/workflows/provider-r7-rootfs-diagnosis.yml'
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private source loading, rootfs differences and bounded read-only delivery
        run: |
          sudo install -d -m 0700 /root/ouf-r7-read-ci
          sudo env OUF_TRANSACTION_TEST_ROOT=/root/ouf-r7-read-ci /usr/bin/python3 -B -m unittest discover -v -s tools/semantic_target_review -p 'test_r7_rootfs*.py'
