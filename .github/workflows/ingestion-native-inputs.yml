name: Bounded native runtime input capture qualification
on:
  pull_request:
    paths:
      - 'tools/ingestion_rollout_preparation/native_inputs.py'
      - 'tools/ingestion_rollout_preparation/input_delivery.py'
      - 'tests/test_ingestion_native_inputs.py'
      - 'scripts/capture-ingestion-native-inputs-20261020.py'
      - 'scripts/launch-ingestion-native-inputs-20261020.sh'
      - '.github/workflows/ingestion-native-inputs.yml'
permissions: {contents: read}
jobs:
  exact-read-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - name: Exact Unix socket and proc namespace, sealed isolated process, private journal
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-native-inputs-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env GITHUB_ACTIONS=true OUF_TEST_ROOT="$fixture" "$pythonLocation/bin/python3" -I -B -S -c 'from pathlib import Path; assert Path("/proc/self/ns/net").exists()'
          sudo env GITHUB_ACTIONS=true OUF_TEST_ROOT="$fixture" "$pythonLocation/bin/python3" -I -B -S -m unittest discover -s "$fixture/repository/tests" -p test_ingestion_native_inputs.py -v
