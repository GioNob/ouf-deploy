name: Source revision bounded Engine availability read
# Read boot guard filesystem/lifecycle constraints after the reconciled failed start; no Engine/start.
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['.github/workflows/source-revision-engine-availability.yml']
permissions: {contents: read}
jobs:
  public-service-state:
    runs-on: [self-hosted, Linux, X64, ouf-vps-test]
    timeout-minutes: 2
    steps:
      - name: Read public systemd state only, without sudo, logs or configuration values
        run: |
          python3 -I -B -S - <<'PY'
          import json,os,socket,stat,subprocess,time
          result={'schema':'ouf.source-revision-engine-availability.v1','runtimeMutations':0,
                  'credentialFilesRead':0,'credentialValuesPrinted':False,'automaticRetry':False,
                  'completedTechnicalPhases':8,'functionalMilestonesProven':4,'installationSpecific':True}
          units={}
          allowed={'ActiveState','SubState','Result','NRestarts','MainPID','LoadState',
                   'ConditionResult','AssertResult','After','Requires','NeedDaemonReload','RuntimeDirectory','RuntimeDirectoryMode','RuntimeDirectoryPreserve','StateDirectory','RootDirectory','ReadWritePaths','ReadOnlyPaths','InaccessiblePaths','TemporaryFileSystem','ProtectSystem','ProtectHome','PrivateMounts','PrivateTmp','CapabilityBoundingSet','AmbientCapabilities','NoNewPrivileges','PrivateNetwork','NetworkNamespacePath','RestrictAddressFamilies','User','Group','Type','RemainAfterExit','CanStart','RefuseManualStart','UnitFileState',
                   'InactiveEnterTimestamp','ActiveEnterTimestamp','StateChangeTimestamp',
                   'ExecMainCode','ExecMainStatus','FragmentPath','DropInPaths','TriggeredBy','Job'}
          for unit in ('docker.service','docker.socket','containerd.service','ouf-semantic-boot-guard.service'):
              reply=subprocess.run(['/usr/bin/systemctl','show','--no-pager',
                  '--property='+','.join(sorted(allowed)),unit],capture_output=True,timeout=10,
                  env={'PATH':'/usr/bin:/bin','LC_ALL':'C'})
              row={'returnCode':reply.returncode}
              if reply.returncode==0 and len(reply.stdout)<=8192:
                  for line in reply.stdout.decode().splitlines():
                      key,separator,value=line.partition('=')
                      assert separator and key in allowed and len(value)<=1024
                      row[key]=value
              units[unit]=row
          result['units']=units
          try:
              info=os.stat('/var/run/docker.sock')
              result['socket']={'present':True,'isSocket':stat.S_ISSOCK(info.st_mode),
                  'uid':info.st_uid,'gid':info.st_gid,'mode':oct(stat.S_IMODE(info.st_mode))}
          except FileNotFoundError:result['socket']={'present':False}
          except PermissionError:result['socket']={'accessDenied':True}
          reply=subprocess.run(['/usr/bin/journalctl','--no-pager','-n','80','-u','docker.service','-o','json'],
              capture_output=True,timeout=10,env={'PATH':'/usr/bin:/bin','LC_ALL':'C'})
          events=[]
          if reply.returncode==0 and len(reply.stdout)<=262144:
              fields={'MESSAGE_ID','UNIT','JOB_TYPE','JOB_RESULT','SERVICE_RESULT','RESULT','__REALTIME_TIMESTAMP'}
              for line in reply.stdout.splitlines():
                  event=json.loads(line)
                  if event.get('_PID')!='1':continue
                  row={}
                  for key in fields:
                      value=event.get(key)
                      if isinstance(value,str) and len(value)<=128:
                          row[key]=value
                  if row:events.append(row)
          result['managerEvents']={'returnCode':reply.returncode,'rows':events,'rawMessagePrinted':False,
              'truncatedOrUnavailable':reply.returncode!=0 or len(reply.stdout)>262144}
          import hashlib,re
          from pathlib import Path
          guards={}
          for filename in ('/etc/systemd/system/docker.service.d/90-ouf-semantic-boot-guard.conf',
                           '/etc/systemd/system/ouf-semantic-boot-guard.service'):
              path=Path(filename);row={}
              try:
                  raw=path.read_bytes();assert len(raw)<=65536
                  row['sha256']=hashlib.sha256(raw).hexdigest();conditions=[];directives=[]
                  for line in raw.decode().splitlines():
                      line=line.strip()
                      if not line or line.startswith(('#',';','[')):continue
                      key,separator,value=line.partition('=')
                      if not separator:continue
                      directives.append(key)
                      if key.startswith(('ConditionPath','AssertPath')):
                          assert re.fullmatch(r'[!|]*/[A-Za-z0-9_./-]+',value)
                          selected=value.lstrip('!|');assert '..'not in Path(selected).parts
                          conditions.append({'directive':key,'reference':value,'pathExists':Path(selected).exists()})
                      if key in ('ExecStart','ExecStartPre'):
                          row['coordinatedGuardCommand']='run_semantic_coordinated_boot_guard.py'in value
                          row['sealedGuardCommand']='sealed_semantic_boot_guard'in value
                          row['sourceContexts']=sorted(set(re.findall(r'/etc/ouf/deploy-snapshots/[A-Za-z0-9_-]+',value)))
                  row['conditions']=conditions;row['directives']=directives
              except (PermissionError,FileNotFoundError)as error:row['readErrorClass']=type(error).__name__
              guards[filename]=row
          result['guardReferences']=guards
          result['boot']={'uptimeSeconds':int(time.clock_gettime(time.CLOCK_BOOTTIME)),
                          'observedAtUtc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          result['managerEvents']['accessHintSuppressed']=b'not seeing'in reply.stderr.lower()
          print(json.dumps(result,sort_keys=True))
          PY
