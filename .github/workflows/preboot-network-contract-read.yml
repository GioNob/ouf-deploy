name: Preboot network contract read qualification
on:
  push:
    branches: [feat/chat-only-recovery-package-20261018]
    paths: ['scripts/launch-preboot-network-contract-read-20261018.sh','scripts/read-preboot-network-contract.py','tests/test_preboot_network_contract_read.py','releases/preboot-network-contract-read-selection-20261018.json','.github/workflows/preboot-network-contract-read.yml']
permissions: {contents: read}
jobs:
  private-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          root="/root/ouf-preboot-network-read-${GITHUB_RUN_ID}"
          sudo install -d -m 0700 "$root"
          sudo cp -a scripts tests releases "$root/"
          sudo chown -R root:root "$root"
          sudo chmod -R go-w "$root"
          sudo python3 -I -B -S -m unittest discover -s "$root/tests" -p test_preboot_network_contract_read.py -v

      - run: bash -n scripts/launch-preboot-network-contract-read-20261018.sh
