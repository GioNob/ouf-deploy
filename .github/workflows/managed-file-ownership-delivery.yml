name: Managed-file ownership immutable delivery
on:
  push:
    paths: ['releases/read-managed-file-ownership-20261028.sh','tests/qualify_managed_file_ownership_delivery.py','.github/workflows/managed-file-ownership-delivery.yml']
  pull_request:
    paths: ['releases/read-managed-file-ownership-20261028.sh','tests/qualify_managed_file_ownership_delivery.py','.github/workflows/managed-file-ownership-delivery.yml']
permissions: {contents: read}
jobs:
  actual-https-nonroot-sudo-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: sudo /usr/bin/python3 -I -S -B tests/qualify_managed_file_ownership_delivery.py
