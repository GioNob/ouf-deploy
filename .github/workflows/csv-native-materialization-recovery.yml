name: Generic CSV native materialization recovery qualification
on:
  push:
    branches: [fix/cohort-mcp-backup-recovery-20261016]
    paths: ['tools/csv_materialization_recovery/journal.py', 'tools/csv_materialization_recovery/authority.py', 'tools/csv_materialization_recovery/run.py', 'tools/csv_materialization_recovery/retry.py', 'tools/csv_materialization_recovery/run_runtime.py', 'scripts/execute-csv-materialization-recovery-20261017.py', 'releases/csv-materialization-recovery-selection-20261017.json', 'tests/test_csv_native_recovery*.py', '.github/workflows/csv-native-materialization-recovery.yml']
permissions: {contents: read}
jobs:
  native-crypto-http-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Real Ed25519 and TLS IAM worker continuation, native HTTP claims and PostgreSQL17 proof
        run: |
          if ! getent group 10001 >/dev/null; then sudo groupadd --gid 10001 ouf-csv-fixture; fi
          sudo cp -a "$GITHUB_WORKSPACE" /root/ouf-csv-native-fixture
          sudo chown -R root:root /root/ouf-csv-native-fixture
          sudo bash -c "cd /root/ouf-csv-native-fixture && OUF_NATIVE_UIDS=1 OUF_NATIVE_SQL=1 OUF_TEST_ROOT=/root python3 -B -m unittest discover -s tests -p 'test_csv_native_recovery*.py' -v"
