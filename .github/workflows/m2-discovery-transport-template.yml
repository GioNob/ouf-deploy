name: M2 isolated transport template
on:
  push:
    paths: ['tools/m2_discovery_installation_profile/transport_template.py','tests/qualify_m2_discovery_transport_template_native.py','.github/workflows/m2-discovery-transport-template.yml']
  pull_request:
    paths: ['tools/m2_discovery_installation_profile/transport_template.py','tests/qualify_m2_discovery_transport_template_native.py','.github/workflows/m2-discovery-transport-template.yml']
permissions: {contents: read}
jobs:
  isolated-template:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Native dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2
      - name: Disposable parent namespace and nested expected-template namespace
        run: |
          set -euo pipefail
          fixture="/var/lib/ouf-isolated-transport-template-${GITHUB_RUN_ID}"
          sudo install -d -m 700 "$fixture"
          sudo cp -a . "$fixture/repository"
          sudo chown -R root:root "$fixture"
          sudo chmod -R go-w "$fixture"
          sudo env GITHUB_ACTIONS=true unshare --net /usr/bin/python3 -I -B -S "$fixture/repository/tests/qualify_m2_discovery_transport_template_native.py"
