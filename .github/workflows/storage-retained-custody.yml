name: Storage retained capture custody
on:
  push:
    branches: [feat/m2-discovery-complete-profile-20261029]
    paths:
      - scripts/seal-retained-storage-capture-20261107.py
      - tests/qualify_retained_storage_custody.py
      - .github/workflows/storage-retained-custody.yml
permissions:
  contents: read
jobs:
  custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: sudo -n env GITHUB_ACTIONS=true python3 -I -B -S tests/qualify_retained_storage_custody.py
