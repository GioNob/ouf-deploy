name: Provider running containerd metadata read
on:
  push:
    branches: [main]
    paths:
      - 'tools/semantic_target_review/read_running_containerd_plugin.py'
      - 'tools/semantic_target_review/test_containerd_plugin_native.py'
      - '.github/workflows/provider-containerd-plugin-read.yml'
permissions:
  contents: read
jobs:
  native-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load reviewed disposable Engine tools
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz --output engine.tgz
          printf '%s\n' 'd8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70  engine.tgz' | sha256sum -c -
          mkdir engine-bin
          tar -xzf engine.tgz --strip-components=1 -C engine-bin
      - name: Actual plugin info contract and server state exports
        run: sudo env OUF_PLUGIN_ENGINE_DIRECTORY="${{ github.workspace }}/engine-bin" /usr/bin/python3 -B tools/semantic_target_review/test_containerd_plugin_native.py
