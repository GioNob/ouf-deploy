name: OUF policy-token bounded admin GET diagnosis
on:
  push:
    paths: [tools/semantic_policy_token_owner/iam_admin_get_diagnostic.py, tests/test_policy_token_admin_get_diagnostic.py, scripts/observe-policy-token-consumers.py, tests/test_policy_token_consumers.py, .github/workflows/policy-token-admin-diagnostic.yml]
  pull_request:
    paths: [tools/semantic_policy_token_owner/iam_admin_get_diagnostic.py, tests/test_policy_token_admin_get_diagnostic.py, scripts/observe-policy-token-consumers.py, tests/test_policy_token_consumers.py, .github/workflows/policy-token-admin-diagnostic.yml]
permissions: {contents: read}
jobs:
  native-root-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Isolated root custody, exact GET scope, redaction and bounded child output
        run: |
          set -euo pipefail
          OUF_DIAGNOSTIC_FIXTURE="/var/lib/ouf-admin-diagnostic-${GITHUB_RUN_ID}"
          sudo mkdir -m 700 "$OUF_DIAGNOSTIC_FIXTURE"
          sudo cp -R . "$OUF_DIAGNOSTIC_FIXTURE/repository"
          sudo chown -R root:root "$OUF_DIAGNOSTIC_FIXTURE"
          sudo python3 -I -B -m unittest discover -s "$OUF_DIAGNOSTIC_FIXTURE/repository/tests" -p test_policy_token_admin_get_diagnostic.py -v
          sudo python3 -I -B -S -m unittest discover -s "$OUF_DIAGNOSTIC_FIXTURE/repository/tests" -p test_policy_token_consumers.py -v
